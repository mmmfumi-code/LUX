<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:2000px;height:900px;background:#ecebe8;font-family:"Helvetica Neue",Arial,sans-serif;color:#2b2a27}
.grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:18px;padding:28px 32px;height:900px}
.cell{background:#ecebe8;border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.im{flex:1;min-height:0;background-repeat:no-repeat;background-size:124% auto;background-position:28% 64%}
.cap{background:#f4f3f0;display:flex;justify-content:space-between;align-items:baseline;padding:8px 14px 10px;font-size:17px;letter-spacing:.08em}
.cap b{font-weight:600}
.cap span{font-size:14px;color:#6d6a63;letter-spacing:.12em}
</style></head><body><div class="grid">
<div class="cell"><div class="im" style="background-image:url(C3-01-robot.png)"></div><div class="cap"><b>C3-01</b><span>UKI</span></div></div>
<div class="cell"><div class="im" style="background-image:url(C3-02-robot.png)"></div><div class="cap"><b>C3-02</b><span>KAGE</span></div></div>
<div class="cell"><div class="im" style="background-image:url(C3-03-robot.png)"></div><div class="cap"><b>C3-03</b><span>RIN</span></div></div>
<div class="cell"><div class="im" style="background-image:url(C3-04-robot.png)"></div><div class="cap"><b>C3-04</b><span>KUMO</span></div></div>
<div class="cell"><div class="im" style="background-image:url(C3-05-robot.png)"></div><div class="cap"><b>C3-05</b><span>NOBI</span></div></div>
<div class="cell"><div class="im" style="background-image:url(C3-06-robot.png)"></div><div class="cap"><b>C3-06</b><span>SUMI</span></div></div>
<div class="cell"><div class="im" style="background-image:url(C3-07-robot.png)"></div><div class="cap"><b>C3-07</b><span>TATERU</span></div></div>
<div class="cell"><div class="im" style="background-image:url(C3-08-robot.png)"></div><div class="cap"><b>C3-08</b><span>HARI</span></div></div>
<div class="cell"><div class="im" style="background-image:url(C3-09-robot.png)"></div><div class="cap"><b>C3-09</b><span>TERASU</span></div></div>
<div class="cell"><div class="im" style="background-image:url(C3-10-robot.png)"></div><div class="cap"><b>C3-10</b><span>KUU</span></div></div>
</div></body></html>
