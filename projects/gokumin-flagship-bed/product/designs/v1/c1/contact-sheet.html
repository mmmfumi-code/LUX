<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:2000px;height:900px;background:#ecebe8;font-family:"Helvetica Neue",Arial,sans-serif;color:#2b2a27}
.grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:18px;padding:28px 32px;height:900px}
.cell{background:#ecebe8;border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.cell img{width:100%;flex:1;object-fit:contain;min-height:0}
.cap{background:#f4f3f0;display:flex;justify-content:space-between;align-items:baseline;padding:8px 14px 10px;font-size:17px;letter-spacing:.08em}
.cap b{font-weight:600}
.cap span{font-size:14px;color:#6d6a63;letter-spacing:.12em}
</style></head><body><div class="grid">
<div class="cell"><img src="C1-01-frame.png"><div class="cap"><b>C1-01</b><span>HIRAKU</span></div></div>
<div class="cell"><img src="C1-02-frame.png"><div class="cap"><b>C1-02</b><span>ITTAN</span></div></div>
<div class="cell"><img src="C1-03-frame.png"><div class="cap"><b>C1-03</b><span>KASANE</span></div></div>
<div class="cell"><img src="C1-04-frame.png"><div class="cap"><b>C1-04</b><span>MOCHI</span></div></div>
<div class="cell"><img src="C1-05-frame.png"><div class="cap"><b>C1-05</b><span>SHIN</span></div></div>
<div class="cell"><img src="C1-06-frame.png"><div class="cap"><b>C1-06</b><span>MARUTAKE</span></div></div>
<div class="cell"><img src="C1-07-frame.png"><div class="cap"><b>C1-07</b><span>SUTTO</span></div></div>
<div class="cell"><img src="C1-08-frame.png"><div class="cap"><b>C1-08</b><span>KUMI</span></div></div>
<div class="cell"><img src="C1-09-frame.png"><div class="cap"><b>C1-09</b><span>HAKO</span></div></div>
<div class="cell"><img src="C1-10-frame.png"><div class="cap"><b>C1-10</b><span>KARA</span></div></div>
</div></body></html>
