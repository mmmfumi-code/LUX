<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:2000px;height:900px;background:#ecebe8;font-family:"Helvetica Neue",Arial,sans-serif;color:#2b2a27}
.grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:18px;padding:28px 32px;height:900px}
.cell{background:#ecebe8;border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.cell img{width:100%;flex:1;object-fit:contain;min-height:0}
.cap{background:#f4f3f0;display:flex;justify-content:space-between;align-items:baseline;padding:8px 14px 10px;font-size:17px;letter-spacing:.08em}
.cap b{font-weight:600}
.cap span{font-size:14px;color:#6d6a63;letter-spacing:.12em}
</style></head><body><div class="grid">
<div class="cell"><img src="C2-01-three-quarter.png"><div class="cap"><b>C2-01</b><span>SODATSU</span></div></div>
<div class="cell"><img src="C2-02-three-quarter.png"><div class="cap"><b>C2-02</b><span>SEN</span></div></div>
<div class="cell"><img src="C2-03-three-quarter.png"><div class="cap"><b>C2-03</b><span>YADO</span></div></div>
<div class="cell"><img src="C2-04-three-quarter.png"><div class="cap"><b>C2-04</b><span>TSUKI</span></div></div>
<div class="cell"><img src="C2-05-three-quarter.png"><div class="cap"><b>C2-05</b><span>MOTO</span></div></div>
<div class="cell"><img src="C2-06-three-quarter.png"><div class="cap"><b>C2-06</b><span>AJIRO</span></div></div>
<div class="cell"><img src="C2-07-three-quarter.png"><div class="cap"><b>C2-07</b><span>MEMORI</span></div></div>
<div class="cell"><img src="C2-08-three-quarter.png"><div class="cap"><b>C2-08</b><span>WA</span></div></div>
<div class="cell"><img src="C2-09-three-quarter.png"><div class="cap"><b>C2-09</b><span>TSUNAGU</span></div></div>
<div class="cell"><img src="C2-10-three-quarter.png"><div class="cap"><b>C2-10</b><span>HEYA</span></div></div>
</div></body></html>
