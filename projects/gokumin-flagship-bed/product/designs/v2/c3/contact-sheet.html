<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C3 Contact Sheet v2</title>
<style>
  :root { --bg: #efede9; --card: #e6e3de; --ink: #2b2926; --sub: #7a756e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 2000px; height: 1000px; background: var(--bg); color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .wrap { padding: 44px 48px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 26px; }
  .head h1 { font-size: 26px; font-weight: 500; letter-spacing: .18em; }
  .head span { font-size: 15px; letter-spacing: .2em; color: var(--sub); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 22px; }
  .card { background: var(--card); border-radius: 6px; overflow: hidden; }
  .card img { display: block; width: 100%; height: 330px; object-fit: contain; object-position: 50% 50%; }
  .cap { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px 14px; }
  .no { font-size: 15px; letter-spacing: .12em; color: var(--sub); }
  .nm { font-size: 19px; font-weight: 600; letter-spacing: .16em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>CONCEPT 03 &mdash; HEAD STAND FLOAT</h1><span>GOKUMIN FLAGSHIP BED / v2</span></div>
  <div class="grid">
    <div class="card"><img src="C3-01-frame.png"><div class="cap"><span class="no">C3-01</span><span class="nm">TAYUTA</span></div></div>
    <div class="card"><img src="C3-02-frame.png"><div class="cap"><span class="no">C3-02</span><span class="nm">SORI</span></div></div>
    <div class="card"><img src="C3-03-frame.png"><div class="cap"><span class="no">C3-03</span><span class="nm">TAWARA</span></div></div>
    <div class="card"><img src="C3-04-frame.png"><div class="cap"><span class="no">C3-04</span><span class="nm">MAYU</span></div></div>
    <div class="card"><img src="C3-05-frame.png"><div class="cap"><span class="no">C3-05</span><span class="nm">KIYORA</span></div></div>
    <div class="card"><img src="C3-06-frame.png"><div class="cap"><span class="no">C3-06</span><span class="nm">TATAMI</span></div></div>
    <div class="card"><img src="C3-07-frame.png"><div class="cap"><span class="no">C3-07</span><span class="nm">SUTTO</span></div></div>
    <div class="card"><img src="C3-08-frame.png"><div class="cap"><span class="no">C3-08</span><span class="nm">MITSU</span></div></div>
    <div class="card"><img src="C3-09-frame.png"><div class="cap"><span class="no">C3-09</span><span class="nm">OBI</span></div></div>
    <div class="card"><img src="C3-10-frame.png"><div class="cap"><span class="no">C3-10</span><span class="nm">HISASHI</span></div></div>
  </div>
</div>
</body>
</html>
