<main id="main">

    <div class="cover">

      <p>文字や図形が動くモーショングラフィック、映画のようなオープニング、ホームページ、チラシや名刺、プレゼン資料や建築・製品のボード、マーケティングの分析と戦略、切り抜きやテロップの動画編集、写真からのイラスト変換。発信と仕事に必要な道具を、360のプロンプトにしました。</p>

<script>
/* ===== 共通エンジン ===== */
const CAT={};
const E={out:'cubic-bezier(.16,1,.3,1)',back:'cubic-bezier(.34,1.56,.64,1)',in:'cubic-bezier(.7,0,.84,0)',io:'cubic-bezier(.87,0,.13,1)',lin:'linear',soft:'cubic-bezier(.4,0,.2,1)'};
const F={heavy:"'Dela Gothic One','Noto Sans JP',sans-serif",sans:"'Noto Sans JP',sans-serif",min:"'Shippori Mincho B1','Noto Serif JP',serif",dot:"'DotGothic16',monospace",brush:"'Yuji Syuku',serif",pop:"'Mochiy Pop One','Noto Sans JP',sans-serif",mono:"'JetBrains Mono',monospace",serif:"'Cormorant Garamond','Shippori Mincho B1',serif",smono:"'Space Mono','JetBrains Mono',monospace",zen:"'Zen Kaku Gothic New','Noto Sans JP',sans-serif"};
const ITEMS={m:[],t:[],o:[],a:[],h:[],g:[],p:[],b:[],d:[],k:[],v:[],i:[]};
let CUR_SEC='m';
function def(o){o.sec=o.sec||CUR_SEC;o.id=o.sec+o.no;ITEMS[o.sec].push(o)}
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const POOL='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン0123456789';
function mkH(S){
  const timers=[],rafs=[];
  const H={S,
    el(tag,css,parent,text){const e=document.createElement(tag||'div');if(css)Object.assign(e.style,css);(parent||S).appendChild(e);if(text!=null)e.textContent=text;return e},
    box(css,parent){return H.el('div',Object.assign({position:'absolute',inset:'0',display:'flex',alignItems:'center',justifyContent:'center'},css||{}),parent)},
    abs(css,parent,text){return H.el('div',Object.assign({position:'absolute'},css||{}),parent,text)},
    chars(str,parent,css){return [...str].map(ch=>H.el('span',Object.assign({display:'inline-block',whiteSpace:'pre'},css||{}),parent,ch))},
    a(el,kf,o){o=o||{};return el.animate(kf,{duration:o.d??600,delay:o.dl??0,easing:o.e??E.out,fill:o.f??'both',iterations:o.i??1,direction:o.dir??'normal'})},
    wait(ms,fn){if(H.static){fn();return}timers.push(setTimeout(fn,ms))},
    raf(fn){const r={id:0};const t0=performance.now();const tick=now=>{fn((now-t0)/1000);r.id=requestAnimationFrame(tick)};r.id=requestAnimationFrame(tick);rafs.push(r)},
    svg(w,h,parent,css){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox',`0 0 ${w} ${h}`);s.setAttribute('width',w);s.setAttribute('height',h);Object.assign(s.style,{position:'absolute',left:'0',top:'0'},css||{});(parent||S).appendChild(s);return s},
    sv(tag,attrs,parent){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e},
    canvas(parent){const c=H.el('canvas',{position:'absolute',left:'0',top:'0',width:'1600px',height:'900px'},parent);c.width=1600;c.height=900;return c},
    shake(el,dl,amp,d){amp=amp||14;const k=[];for(let i=0;i<8;i++)k.push({transform:`translate(${rnd(-amp,amp)}px,${rnd(-amp,amp)}px)`});k.push({transform:'translate(0,0)'});return H.a(el||S.firstChild,k,{d:d||320,dl:dl||0,e:E.lin,f:'none'})},
    clear(){timers.forEach(clearTimeout);timers.length=0;rafs.forEach(r=>cancelAnimationFrame(r.id));rafs.length=0;S.getAnimations({subtree:true}).forEach(a=>a.cancel());S.innerHTML=''}
  };
  return H;
}
const words=t=>t.split(/[\s　／\/]+/).filter(Boolean);
class Player{
  constructor(stage,screen){this.S=stage;this.screen=screen;this.H=mkH(stage);this.t0=0;this.L=1000;
    const fit=()=>{const w=screen.clientWidth;stage.style.transform=`scale(${w/1600})`};
    new ResizeObserver(fit).observe(screen);fit();}
  play(m,txt,once){this.stop();this.m=m;this.L=m.loopFn?m.loopFn(words(txt)):m.loop;const H=this.H,S=this.S;
    const cyc=()=>{H.clear();S.style.background=m.bg||'#0b0b0d';S.style.color='#fff';this.t0=performance.now();
      H.static=SEC[m.sec].ui==='graphic';try{m.run(H,txt,words(txt))}catch(e){console.error(m.id,e)}
      if(H.static){S.getAnimations({subtree:true}).forEach(a=>{const it=a.effect&&a.effect.getTiming().iterations;if(it===Infinity)a.cancel();else a.finish()});return}
      if(!once)this.loopT=setTimeout(cyc,this.L)};
    (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(cyc);}
  stop(){clearTimeout(this.loopT);this.H.clear()}
  time(){return this.m?((performance.now()-this.t0)%this.L)/1000:0}
}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const tcode=s=>{const f=Math.floor((s%1)*30);const sec=Math.floor(s);return `00:00:${String(sec).padStart(2,'0')}:${String(f).padStart(2,'0')}`};
</script>

<script>
/* ===== アプリ ===== */
const $=s=>document.querySelector(s);
let ar='16:9';try{ar=localStorage.getItem('pz-ar')||'16:9'}catch(e){}
const custom={};
const SEC=SECTIONS();
const ORDER=['m','t','o','a','h','g','p','b','d','k','v','i'];
const GROUPS=[{n:'モーショングラフィック',sn:'モーション',s:['m','t','o']},{n:'アニメーション',s:['a']},{n:'ホームページ',sn:'HP',s:['h']},{n:'グラフィック',s:['g']},{n:'プレゼン',s:['p','b','d']},{n:'マーケティング',sn:'マーケ',s:['k']},{n:'動画編集',sn:'編集',s:['v']},{n:'イラスト変換',sn:'イラスト',s:['i']}];
const grpOf=s=>GROUPS.find(g=>g.s.includes(s));
const TOTAL=ORDER.reduce((a,s)=>a+ITEMS[s].length,0);
const pages=['cover'];ORDER.forEach(s=>{pages.push(s+'-top');ITEMS[s].forEach(it=>pages.push(it.id))});
let curPage='cover';
const player=new Player($('#coverStage'),$('#coverScreen'));
let mplayer=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const findItem=id=>ITEMS[id[0]]&&ITEMS[id[0]].find(x=>x.id===id);
const fill=(p,t)=>p.replaceAll('{T}',t);

function buildChrome(){
  $('#tabs').innerHTML=GROUPS.map(g=>`<button class="tab" type="button" data-tab="${g.s[0]}" data-grp="${g.s.join('')}" style="--k:var(${SEC[g.s[0]].k})"><span class="tl">${g.n}</span><span class="ts">${g.sn||g.n}</span><small>${g.s.reduce((a,s)=>a+ITEMS[s].length,0)}</small></button>`).join('');
  $('#brand').innerHTML='AIプロンプト図鑑<b>'+TOTAL+'</b>';document.title='AIプロンプト図鑑'+TOTAL;
  $('#shelf').innerHTML=ORDER.map(s=>`<button type="button" data-go="${s}-top" style="--k:var(${SEC[s].k})"><small>${grpOf(s).s.length>1?grpOf(s).n+'｜':''}${SEC[s].en}</small><b>${SEC[s].name}<em> ${ITEMS[s].length}</em></b><span>${SEC[s].lead}</span></button>`).join('');
  document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
    const tb=e.target.closest('[data-tab]');if(tb){go(tb.dataset.tab+'-top');return}
    const c=e.target.closest('[data-cat]');if(c){const it=ITEMS[c.dataset.sec].find(m=>m.cat===c.dataset.cat);if(it)go(it.id)}});
  $('#brand').onclick=()=>go('cover');
  $('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
  document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
}
function step(d){const i=pages.indexOf(curPage);go(pages[Math.min(pages.length-1,Math.max(0,i+d))])}
function setChrome(sec,cat){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',!!sec&&b.dataset.grp.includes(sec)));
  const g=sec&&grpOf(sec);const subs=g&&g.s.length>1?'<span class="subseg">'+g.s.map(s=>`<button type="button" class="sub" data-go="${s}-top" aria-current="${s===sec}">${SEC[s].name}<small>${ITEMS[s].length}</small></button>`).join('')+'</span>':'';
  $('#chap').innerHTML=subs+(sec?Object.keys(SEC[sec].cats).map(c=>`<button type="button" data-sec="${sec}" data-cat="${c}" aria-current="${c===cat}" style="--k:var(${CAT[c].k})"><i></i>${c}｜${CAT[c].ja}</button>`).join(''):'');
}

function renderSec(s){
  const S=SEC[s];const P=$('#p-sec');P.style.setProperty('--k',`var(${S.k})`);
  P.innerHTML=`<div class="doc"><div class="eyebrow">${S.en} — ${ITEMS[s].length}</div><h2>${S.name}<em> ${ITEMS[s].length}選</em></h2><p>${S.desc}</p>
    <h3>使い方</h3><ol class="steps">${S.steps.map(x=>`<li><div>${x}</div></li>`).join('')}</ol>
    <details class="base"><summary>共通仕様（コピーすると自動で先頭に入ります）</summary><pre>${esc(S.base(S.arDefault||ar))}</pre></details>
    ${S.fix?`<h3>思いどおりにならないときの「追い指示」</h3><div class="tbl"><table><thead><tr><th>症状</th><th>AIにそのまま送る一言</th></tr></thead><tbody>${S.fix.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div>`:''}
    ${S.extra||''}</div>
    <h3 class="idxhead">目次</h3>
    ${Object.keys(S.cats).map(c=>{const list=ITEMS[s].filter(m=>m.cat===c);if(!list.length)return'';const n0=list[0].no,n1=list[list.length-1].no;return `<div class="idxcat" style="--k:var(${CAT[c].k})"><h3>${n0}–${n1} ${c}<small>${CAT[c].ja}｜${CAT[c].d}</small></h3><div class="idxgrid">${list.map(m=>`<button class="idx" type="button" data-go="${m.id}"><b>${m.no}</b><div><span>${m.name}</span><small>${m.lead}</small></div></button>`).join('')}</div></div>`}).join('')}
    <div class="cta"><button class="nb pri" type="button" data-go="${ITEMS[s][0].id}">No.${ITEMS[s][0].no} から見る</button></div>`;
}

function promptBlock(m,S){
  const arSel=S.ars?`<label for="arSel">${S.arLabel||'画面比率'}</label><select id="arSel">${S.ars.map(a=>`<option>${a}</option>`).join('')}</select>`:'';
  return `<div><div class="label">プロンプト</div>
    <div class="prompt"><div class="ptools">${arSel}<button class="copy" id="copyBtn" type="button">プロンプトをコピー</button></div>
    <pre class="ptext" id="ptext"></pre>${m.enp?`<div class="ptools"><label>英語版（Midjourneyなど向け）</label><button class="copy sub" id="copyEn" type="button">英語版をコピー</button></div><pre class="ptext en" id="ptextEn">${esc(m.enp)}</pre>`:''}</div>
    <div class="hint">コピーされるのは「共通仕様」＋この「${S.unit}指示」の完成版です。表示は${S.unit}指示のみ。</div></div>`;
}

function renderItem(m){
  const S=SEC[m.sec];const k=`var(${CAT[m.cat].k})`;const i=ITEMS[m.sec].indexOf(m);const pv=ITEMS[m.sec][i-1],nx=ITEMS[m.sec][i+1];
  const P=$('#p-item');P.style.setProperty('--k',k);
  const txt=custom[m.id]??m.text;
  const left=S.ui==='illust'?illustCard(m):S.ui==='graphic'?graphicCard(m,txt,S):`
      <div class="label">${S.showLabel}</div>
      <div class="monitor"><div class="screen" id="mScreen"><div class="stage" id="mStage"></div></div>
        <div class="mbar"><span class="rec"></span><span class="tc" id="mTc">00:00:00:00</span><span class="sp"></span><span class="tc">${S.monLabel}</span><button class="mini" id="replay" type="button">最初から再生</button></div></div>
      <div class="txtrow"><label for="mText">${S.inputLabel}</label><input id="mText" value="${esc(txt)}" maxlength="40"><button class="mini" id="resetText" type="button">元に戻す</button></div>
      <div class="hint">${m.multi?'スペースか「／」で区切ると、言葉ごとに使い分けられます。':'入力するとプレビューと右のプロンプトが同時に変わります。'}</div>`;
  P.innerHTML=`
  <div class="mhead"><div class="mno">No.${m.no}</div><div class="mtitle">
    <div class="meta"><span class="chip">${m.cat}｜${CAT[m.cat].ja}</span><span>${m.en||''}</span>${m.loop&&S.ui!=='illust'&&S.ui!=='graphic'?`<span>LOOP ${(m.loopFn?m.loopFn(words(m.text)):m.loop)/1000}s</span>`:''}</div>
    <h2>${m.name}</h2><p>${m.lead}</p></div></div>
  <div class="mgrid">
    <div>${left}<div style="margin-top:22px" class="usebox"><div class="label">使いどころ</div>${m.use}</div></div>
    <div class="side">${promptBlock(m,S)}
      <div><div class="label">アレンジのコツ</div><ul class="tips">${m.tips.map(t=>`<li><span>${t}</span></li>`).join('')}</ul></div>
    </div>
  </div>
  <nav class="pager">
    <button type="button" data-go="${pv?pv.id:m.sec+'-top'}"><small>← ${pv?'PREV '+pv.no:'目次'}</small><span>${pv?pv.name:'目次へ'}</span></button>
    <button type="button" data-go="${nx?nx.id:m.sec+'-top'}"><small>${nx?'NEXT '+nx.no:'目次'} →</small><span>${nx?nx.name:'目次へ戻る'}</span></button>
  </nav>`;
  const getT=()=>{const e=$('#mText');return e?(e.value.trim()||m.text):(m.text||'')};
  const sel=$('#arSel');if(sel){sel.value=S.ars.includes(S.curAr)?S.curAr:S.ars[0];sel.onchange=()=>{S.curAr=sel.value;if(m.sec==='m'||m.sec==='t'){ar=sel.value;try{localStorage.setItem('pz-ar',ar)}catch(e){}}}}
  const showP=()=>{const t=getT();let h=esc(fill(m.p,t));if(t)h=h.replaceAll(esc(t),`<span class="ph">${esc(t)}</span>`);$('#ptext').innerHTML=h};
  showP();
  if(mplayer)mplayer.stop();mplayer=null;
  if(S.ui!=='illust'){const st=$('#mStage');if(st)mplayer=new Player(st,$('#mScreen'));const start=()=>{if(mplayer)mplayer.play(m,getT(),reduce)};start();
    let deb;$('#mText').addEventListener('input',()=>{custom[m.id]=$('#mText').value;showP();clearTimeout(deb);deb=setTimeout(start,350)});
    $('#resetText').onclick=()=>{delete custom[m.id];$('#mText').value=m.text;showP();start()};const rp=$('#replay');if(rp)rp.onclick=start;}
  const copyTo=(btn,text,label)=>{const ok=()=>{btn.textContent='コピーしました';btn.classList.add('done');setTimeout(()=>{btn.textContent=label;btn.classList.remove('done')},1600)};
    try{navigator.clipboard.writeText(text).then(ok,()=>{fallback(text);ok()})}catch(e){fallback(text);ok()}};
  $('#copyBtn').onclick=()=>{const a=sel?sel.value:S.ars?S.ars[0]:'';copyTo($('#copyBtn'),S.base(a)+`\n\n【${S.unit}指示】\n`+fill(m.p,getT()),'プロンプトをコピー')};
  const ce=$('#copyEn');if(ce)ce.onclick=()=>copyTo(ce,m.enp,'英語版をコピー');
}
function fallback(full){const p=$('#ptext');p.textContent=full;const r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r)}

function graphicCard(m,txt,S){
  const shot=m.img?`<div class="gshot"><img src="${m.img}" alt="${esc(m.name)}の作例" loading="lazy"></div><div class="exnote">作例：このプロンプトを ChatGPT（画像生成）に送って作った参考イメージです。文字や写真の細部は、AIや生成のたびに変わります。</div>`
    :`<div class="monitor"><div class="screen" id="mScreen"><div class="stage" id="mStage"></div></div></div><div class="exnote">${S.mockNote||'※AIでの作例画像は準備中です。仕上がりのイメージを再現した見本を表示しています。'}</div>`;
  return `<div class="label">${S.showLabel}</div>${shot}
      <div class="txtrow"><label for="mText">${S.inputLabel}</label><input id="mText" value="${esc(txt)}" maxlength="40"><button class="mini" id="resetText" type="button">元に戻す</button></div>
      <div class="hint">入力すると、右のプロンプトの中の${S.inputLabel}が置き換わります。</div>`;
}
function illustCard(m){
  const pal=m.pal||['#222','#555','#888','#bbb','#eee'];
  const ex=m.img?`<div class="exrow"><figure><img src="img/base.jpg" alt="作例の元写真：公園に立つ架空の男の子" loading="lazy"><figcaption>BEFORE｜元の写真</figcaption></figure><i>→</i><figure><img src="${m.img}" alt="${esc(m.name)}の作例" loading="lazy"><figcaption>AFTER｜${esc(m.name)}</figcaption></figure></div><div class="exnote">作例：AIで生成した架空の男の子の写真をもとに作成した参考イメージです。${m.exnote?esc(m.exnote)+' ':''}仕上がりはAIや写真によって変わります。</div>`:'';
  return `<div class="label">このプロンプトで、こうなる</div>
  <div class="scard">${ex}<div class="sart" ${m.img?'hidden':''}><div class="sw">${pal.map(c=>`<i style="background:${c}"></i>`).join('')}</div>
    <div style="position:absolute;inset:0;background:${m.art||'linear-gradient(transparent,rgba(0,0,0,.55))'}"></div>
    <div class="ttl"><span>STYLE ${m.no} / ${m.en}</span><b>${m.name}</b></div></div>
    <div class="flow"><div><b>BEFORE｜元の写真</b>${m.before}</div><i>→</i><div><b>AFTER｜仕上がり</b>${m.after}</div></div>
    <div class="kw">${m.kw.map(k=>`<span>${k}</span>`).join('')}</div>
    <div class="pal">配色の目安 ${pal.map(c=>`<i style="background:${c}" title="${c}"></i>`).join('')}</div>
    ${m.img?'':'<div class="note">※この変換の作例画像は準備中です。仕上がりの特徴・配色・キーワードで表しています。</div>'}</div>
  <div style="margin-top:18px"><div class="label">向いているAI</div><div class="tools">${m.tools.map(t=>`<span>${t}</span>`).join('')}</div></div>`;
}

let coverI=0,coverT;
function coverLoop(){const picks=['a01','m01','o03','t01','a16','a11','m35','o31','t18','a21','h02','a26'].map(findItem).filter(Boolean);
  const m=picks[coverI%picks.length];coverI++;player.play(m,m.text,true);$('#coverName').textContent=`${SEC[m.sec].name} No.${m.no} ${m.name}`;coverT=setTimeout(coverLoop,Math.min(m.loop,6000))}

function go(id){
  if(!pages.includes(id))id='cover';curPage=id;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  clearTimeout(coverT);player.stop();if(mplayer){mplayer.stop();mplayer=null}
  if(id==='cover'){$('#p-cover').classList.add('on');$('#count').textContent='表紙';setChrome(null);if(!reduce)coverLoop()}
  else if(id.endsWith('-top')){const s=id[0];renderSec(s);$('#p-sec').classList.add('on');$('#count').textContent='目次';setChrome(s)}
  else{const m=findItem(id);renderItem(m);$('#p-item').classList.add('on');$('#count').textContent=`${m.no} / ${ITEMS[m.sec].length}`;setChrome(m.sec,m.cat)}
  try{history.replaceState(null,'','#'+id)}catch(e){}
  window.scrollTo(0,0);
}
function tickTc(){const el=$('#mTc');if(el&&mplayer)el.textContent=tcode(mplayer.time());const ct=$('#coverTc');if(ct&&curPage==='cover')ct.textContent=tcode(player.time());requestAnimationFrame(tickTc)}
buildChrome();
const h0=(location.hash||'').slice(1);go(h0==='m-index'?'m-top':h0);
tickTc();
</script>
