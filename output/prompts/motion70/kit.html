・1枚目を出したら、似せ具合を「もっと似せる／もっとイラストらしく」で調整できるように一言添える`,
    fix:[['本人に似ていない','「顔のパーツの位置と形は写真のまま、塗りと線だけをイラストにして」'],['画風が弱い','「スタイルの特徴をもっと強く。線の太さと色数を指定どおりにはっきり出して」'],['背景が変わってしまう','「背景は元の写真の場所のまま、同じ画風で描いて」'],['手や指がおかしい','「手の指を5本に正しく描き直して。ほかの部分は変えないで」'],['肖像権が気になる','他人が写った写真は、本人の許可を取ってから使いましょう。販売物に使う場合は特に注意が必要です。']],
    extra:`<h3>作例に使った元の写真</h3><div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap"><img src="img/base.jpg" alt="公園に立つ架空の男の子の写真" style="width:200px;max-width:100%;border-radius:8px"><p style="flex:1;min-width:220px;margin:0">各ページの作例は、AIで生成した<b>架空の男の子</b>（実在しない人物）の写真をもとにしています。黒髪・黄色のパーカー・紺の短パン・赤い靴・青い帽子という特徴が、スタイルごとにどう描き変わるかを見比べてください。作例は Figma AI（画像生成）で、元写真と同じ特徴を指定して作った参考イメージです。実際の仕上がりは、使うAIや写真によって変わります。</p></div><h3>使う前に知っておきたいこと</h3><p>他人が写っている写真は、本人の許可を取ってから使ってください。また、特定のアニメ会社・作家・キャラクターの名前を出して「〇〇風」と指示するのは避け、この本のように<b>画風の特徴（線・塗り・色・質感）で指示する</b>のが安全で、しかも仕上がりのブレも少なくなります。</p>`}
  };
}

const GPT='<b>◎</b> ChatGPT（画像生成）',GEM='<b>◎</b> Gemini',GPTo='ChatGPT（画像生成）',GEMo='Gemini',MJ='Midjourney（英語版）',FF='Adobe Firefly',CV='Canva AI';

/* BASIC */
defI({no:'01',cat:'BASIC',name:'画風チェンジの基本形',en:'Style Transfer Template',lead:'どんな画風にも使える「型」。まずはこれで変換のコツをつかむ。',
before:'人物が写ったスナップ写真',after:'構図と顔立ちはそのまま、指定した画風のイラスト',kw:['構図キープ','顔立ちキープ','線と塗りを指定','色数を指定'],pal:['#2b2d42','#8d99ae','#edf2f4','#ef233c','#ffd166'],tools:[GPT,GEM,FF],
use:'<b>すべての変換の土台</b>です。【スタイル】の1行を書き換えるだけで、水彩にもアニメにもなります。迷ったらここから始めてください。',
tips:['「線」「塗り」「色」「光」「背景」の5項目を指定すると、仕上がりのブレが一気に減ります','似なかったら「顔のパーツの位置と大きさは写真のまま」と追加で送る','最初は【スタイル】を短く、慣れたら細かく足していく'],
p:`【スタイル】やわらかいタッチのイラスト（ここを好きな画風に書き換える）
【描き方】
・線：輪郭に細めの線を入れる（太さは均一、色は濃い茶色）
・塗り：影は1段階だけのシンプルな塗り
・色：写真の色を少し明るく、彩度を少し上げる
・光：写真の光の向きを保つ
・背景：写真と同じ場所を、同じ画風で簡略化して描く
【必ず残すもの】顔の形とパーツの位置、髪型、服の形と色、ポーズ、写真の構図
【避けるもの】写真のような質感、顔の形が変わること、余計な人物や物の追加`,
enp:'Redraw the attached photo as a soft illustration. Keep the exact composition, pose, face shape, hairstyle and outfit. Thin uniform brown outlines, simple one-step cel shading, slightly brighter and more saturated colors, same lighting direction, simplified background in the same style. No photorealism, no extra people.'});

defI({no:'02',cat:'BASIC',name:'背景だけイラストにする',en:'Illustrated Background Only',lead:'人物は写真のまま、背景だけを絵本のような世界に描き変える。',
before:'街中・部屋など、ごちゃついた背景の写真',after:'人物は実写のまま、背景だけ手描きイラストの世界',kw:['人物はそのまま','背景だけ変換','合成感をなくす','光を合わせる'],pal:['#f4a261','#e9c46a','#2a9d8f','#264653','#fefae0'],tools:[GPT,GEM,FF],
use:'<b>プロフィール写真・SNS投稿・サムネイル</b>に。人物はリアルなまま、背景を変えるだけで「おしゃれな写真」に変わります。',
tips:['「人物の輪郭のまわりに不自然な縁を出さない」と入れると合成感が消えます','背景の色を、服の色の補色にすると人物が際立ちます','背景のテーマ（森・宇宙・海など）を一言で指定すると狙いどおりに'],
p:`【スタイル】写っている人物は写真のまま一切変えず、背景だけを手描きの絵本のようなイラストに描き変える
【描き方】
・人物：顔・髪・服・肌の質感をすべて写真のまま残す（イラスト化しない）
・背景：元の背景と同じ奥行きと配置を保ちつつ、水彩とクレヨンを混ぜたようなやさしいイラストに
・色：背景はあたたかいパステル調（オレンジ・黄・緑）
・光：人物にあたっている光の向きと色に、背景の光を合わせる
・境目：人物の輪郭のまわりに白い縁やぼやけを出さず、自然になじませる
【避けるもの】人物の顔や体の変化、合成したような不自然な境目`,
enp:'Keep the person in the attached photo completely photorealistic and unchanged. Replace only the background with a warm hand-drawn storybook illustration (watercolor and crayon texture, pastel orange, yellow and green), keeping the same depth and layout. Match the lighting on the person. Seamless edges, no halo.'});

defI({no:'03',cat:'BASIC',name:'人物だけイラストにする',en:'Illustrated Person Only',lead:'背景は写真のまま、人物だけをアニメ調のキャラクターに。',
before:'旅行先・カフェなどで撮った人物写真',after:'実写の風景の中に、アニメ調のキャラになった本人',kw:['背景は実写','人物だけ変換','影を落とす','サイズ感キープ'],pal:['#ffb4a2','#e5989b','#b5838d','#6d6875','#ffcdb2'],tools:[GPT,GEM],
use:'<b>旅行の記念写真・SNSのネタ投稿</b>に。「実写の世界にアニメのキャラがいる」違和感が面白く、バズりやすい表現です。',
tips:['「人物の足元に、実写の影を落とす」と入れると、その場にいる感じが出ます','人物の大きさと位置が変わらないよう「写真と同じサイズ・位置で」と明記','キャラの画風は11〜20のアニメ系から選んで組み合わせても◎'],
p:`【スタイル】背景は写真のまま一切変えず、写っている人物だけを日本のアニメ調のキャラクターに描き変える
【描き方】
・人物：顔立ち・髪型・服装・ポーズの特徴を残したまま、くっきりした線とアニメ塗り（影2段階）のキャラクターにする
・大きさと位置：写真の人物とまったく同じ大きさ・同じ位置に描く
・なじませ方：人物の足元や体の下に、写真の光に合った実写らしい影を落とす
・背景：写真のまま（色・ピント・ボケ感を変えない）
【避けるもの】背景のイラスト化、人物の大きさや向きの変化`,
enp:'Keep the background of the attached photo photorealistic and unchanged. Turn only the person into a Japanese anime-style character with clean lineart and two-tone cel shading, keeping face features, hairstyle, outfit and pose. Same size and position as in the photo. Add a realistic cast shadow matching the scene lighting.'});

defI({no:'04',cat:'BASIC',name:'塗り絵（線画）にする',en:'Coloring Page Lineart',lead:'写真をくっきりした黒い線だけの塗り絵に。子どもと遊べる。',
before:'家族・ペット・お気に入りの景色の写真',after:'白い紙に黒い線だけの、塗りやすい塗り絵',kw:['白黒の線画','塗りやすい太さ','影なし','A4印刷向け'],pal:['#ffffff','#e5e5e5','#999999','#333333','#000000'],tools:[GPT,GEM,CV],
use:'<b>子ども向けの塗り絵・お絵かきの下絵・ワークショップ</b>に。家族やペットの写真が、世界にひとつの塗り絵になります。',
tips:['線の太さを「3〜4px相当」と指定すると、子どもでも塗りやすい','細かすぎる背景は「簡略化して」と入れると塗り絵として使いやすくなります','A4で印刷するなら比率を「縦長（3:4）」に'],
p:`【スタイル】子どもが塗りやすい、白い紙に黒い線だけの「塗り絵（線画）」
【描き方】
・線：黒一色、太さは均一でやや太め（3〜4px相当）。線は途切れずに閉じた形にして、色を塗る範囲がはっきり分かるようにする
・塗り：一切塗らない。影・グレー・ハッチング（斜線）も入れない
・細部：髪の毛や服のしわは、主要な線だけに簡略化する
・背景：主要な形だけを残して簡略化。細かい模様は省く
・紙：真っ白な背景
【避けるもの】色、グレーの影、細かすぎる線、ぼやけた線`,
enp:'Convert the attached photo into a clean black and white coloring page. Bold uniform black outlines (3-4px), closed shapes, no shading, no gray, no hatching. Simplify hair, clothing folds and background details. Pure white background, printable.'});

defI({no:'05',cat:'BASIC',name:'季節を変える',en:'Season Swap',lead:'同じ場所・同じ構図のまま、夏を冬に、春を秋に描き変える。',
before:'夏に撮った公園・街・家の前の写真',after:'同じ構図のまま、雪が積もった冬のイラスト',kw:['構図キープ','季節の要素を追加','光の色を変える','服装も季節に'],pal:['#e0fbfc','#c2dfe3','#9db4c0','#5c6b73','#253237'],tools:[GPT,GEM,FF],
use:'<b>季節のあいさつ・年賀状・お店の季節告知</b>に。同じ写真を4季節ぶん作ると、SNSのシリーズ投稿にもなります。',
tips:['「光の色」まで変えるのがコツ（冬は青白く、秋は夕方のオレンジ）','人物がいる場合は「服装も季節に合わせて」と追加','4季節を1枚にまとめる（4分割）のも人気です'],
p:`【スタイル】写真と同じ場所・同じ構図・同じアングルのまま、季節を「冬」に変えたイラスト（季節は書き換え可：春・夏・秋・冬）
【描き方】
・季節の要素：屋根や地面、木の枝に雪を積もらせ、空からやさしく雪を降らせる。吐く息を白く
・光：冬の午後らしい、青白くやわらかい光
・色：全体を寒色寄りに。窓や街灯だけ暖かいオレンジで灯す
・人物：顔と体はそのまま、服装をコート・マフラーなど冬の装いに変える
・画風：やわらかい水彩タッチのイラスト
【避けるもの】建物や道の形・位置の変化、構図の変化`,
enp:'Redraw the attached photo as the same place, same composition and camera angle, but in winter: snow on roofs, ground and branches, gentle snowfall, visible breath, pale blue soft afternoon light, cool palette with warm orange windows and street lamps. People keep their faces and poses but wear coats and scarves. Soft watercolor illustration.'});

defI({no:'06',cat:'BASIC',name:'昼を夜のネオン街に',en:'Day to Neon Night',lead:'昼間の街の写真を、ネオンが光るエモい夜景イラストに。',
before:'昼間の商店街・駅前・ビルの写真',after:'看板がネオンに光る、雨上がりの夜の街',kw:['夜景化','ネオン','濡れた路面の反射','シネマティック'],pal:['#0b0f2b','#3a0ca3','#f72585','#4cc9f0','#ffd166'],tools:[GPT,GEM,MJ],
use:'<b>音楽・MVのサムネ、エモいSNS投稿、ゲームの背景素材</b>に。ありふれた街の写真が、映画のワンシーンに変わります。',
tips:['「雨上がりで路面が濡れている」と入れると、ネオンの反射が映えて一気にエモくなります','ネオンの色はピンク×水色が定番、紫×オレンジでレトロに','看板の文字は崩れやすいので、文字は入れない指示が安全'],
p:`【スタイル】写真の街並みを、ネオンが光る雨上がりの夜の街に描き変えたシネマティックなイラスト
【描き方】
・時間：深夜。空は深い紺〜紫のグラデーション
・光：看板・窓・街灯をネオン（ピンク #F72585、水色 #4CC9F0、黄色）で光らせ、まわりに光のにじみ（グロー）を出す
・路面：雨上がりで濡れていて、ネオンの光が反射して縦に伸びる
・空気：うっすら霧がかかり、光の筋が見える
・構図：建物の形・配置・遠近は写真のまま
・看板の文字：読める文字は入れず、光る模様だけにする
【避けるもの】昼間の光、建物の形の変化、読める文字`,
enp:'Transform the attached daytime street photo into a cinematic rainy night scene. Deep navy-purple sky, neon signs and windows glowing pink (#F72585), cyan (#4CC9F0) and yellow with soft bloom, wet asphalt with long neon reflections, light fog and light rays. Keep buildings, layout and perspective identical. No readable text on signs.'});

defI({no:'07',cat:'BASIC',name:'服装・髪型だけ変える',en:'Outfit Change',lead:'顔とポーズはそのまま、服や髪型だけを着せ替える。',
before:'正面に近い人物の全身〜上半身の写真',after:'同じ顔・同じポーズで、別の衣装を着たイラスト',kw:['顔キープ','ポーズキープ','着せ替え','コスプレ風'],pal:['#22223b','#4a4e69','#9a8c98','#c9ada7','#f2e9e4'],tools:[GPT,GEM],
use:'<b>コスプレの試着・制服や衣装のイメージ確認・キャラ作り</b>に。「この服を着たらどう見える？」をすぐに試せます。',
tips:['衣装は「色・素材・形」の3点で指定すると思いどおりになりやすい','髪型も変えるなら「髪の長さと色」を具体的に','実写のまま着せ替えたいときは、【スタイル】を「写真のまま」に変える'],
p:`【スタイル】顔・表情・体型・ポーズは写真のまま、服装と髪型だけを変えたイラスト
【変更内容】（書き換えて使う）
・服装：深い紺色のブレザーに、白いシャツと赤いネクタイの制服（素材はウール）
・髪型：肩までの長さ、こげ茶色、ゆるいウェーブ
【描き方】
・顔：目・鼻・口の形と位置、肌の色を写真のまま残す
・ポーズ：手足の位置・体の向きを写真のまま
・画風：きれいな線と、やわらかい影のアニメ風イラスト
・背景：写真の背景をそのまま同じ画風で
【避けるもの】顔立ちの変化、体型の変化、ポーズの変化`,
enp:'Keep the face, expression, body shape and pose of the person in the attached photo. Change only the outfit to a navy wool blazer school uniform with white shirt and red tie, and the hair to shoulder-length dark brown loose waves. Clean anime-style illustration with soft shading, same background redrawn in the same style.'});

defI({no:'08',cat:'BASIC',name:'古い写真をカラーで蘇らせる',en:'Restore & Colorize',lead:'色あせたモノクロ写真を、鮮やかなカラーのイラストに描き起こす。',
before:'昔のモノクロ写真・色あせた家族写真',after:'傷やシミが消え、当時の色を想像して塗られたイラスト',kw:['修復','カラー化','傷・シミ除去','当時の色'],pal:['#d4a373','#faedcd','#fefae0','#ccd5ae','#606c38'],tools:[GPT,GEM],
use:'<b>家族の思い出・ご先祖の写真・地域の昔の写真</b>に。贈り物や、法事・記念日のスライドショーにも喜ばれます。',
tips:['写真に写っている時代（昭和30年代など）を書くと、服や物の色が自然になります','「本人の顔は変えずに」を強めに入れるのが大切','イラストではなく写真のまま修復したいなら【スタイル】を「写真として修復」に'],
p:`【スタイル】古いモノクロ写真を修復し、当時の色を想像してカラーで描き起こしたイラスト
【描き方】
・修復：写真の傷・折り目・シミ・ノイズをすべて消す
・色：写っている時代（例：昭和30年代）にふさわしい、落ち着いた自然な色で塗る。肌は健康的な自然な色
・画風：写真の質感を少し残した、やわらかい手描きの絵画調
・光：写真の光の向きを保つ
・顔：写っている人の顔立ちと表情を一切変えない
【避けるもの】顔の変化、派手すぎる色、現代の物の追加`,
enp:'Restore the attached old black-and-white photo: remove scratches, folds, stains and noise, then colorize it with natural, period-appropriate muted colors (1950s Japan) as a soft hand-painted illustration that keeps a hint of photographic texture. Preserve every face and expression exactly. No modern objects.'});

defI({no:'09',cat:'BASIC',name:'ラフから完成イラストへ',en:'Sketch to Finished Art',lead:'手描きのラフや落書きを、プロが仕上げたような完成イラストに。',
before:'紙に描いたラフ・落書き・棒人間の構図メモ',after:'ラフの構図どおりに清書・着色された完成イラスト',kw:['清書','着色','構図キープ','アイデアを形に'],pal:['#003049','#d62828','#f77f00','#fcbf49','#eae2b7'],tools:[GPT,GEM],
use:'<b>絵が苦手な人のアイデアスケッチ・漫画のネーム・資料の挿絵</b>に。頭の中のイメージを、ラフ1枚から完成させられます。',
tips:['ラフに「ここは空」「これは犬」など文字でメモを書いておくと、AIが正しく読み取ります','画風を指定しないと平均的な絵になるので、必ず【スタイル】を具体的に','気に入らない部分は「左の人物だけ描き直して」と部分指定で直せます'],
p:`【スタイル】添付した手描きのラフ（落書き）を、プロが仕上げたような完成イラストにする
【描き方】
・構図：ラフの人物や物の位置・大きさ・向きをそのまま守る
・読み取り：ラフに書かれたメモ（文字）は、描く内容の指示として読み取り、絵の中には描かない
・線：きれいに清書した、強弱のある線
・塗り：明るい色で、影と光をしっかり入れた丁寧な塗り
・背景：ラフに描かれた場所を、奥行きのある背景として描き込む
【避けるもの】ラフにない大きな要素の追加、構図の変更、メモ文字の描き込み`,
enp:'Turn the attached rough hand-drawn sketch into a polished, professionally finished illustration. Keep the exact positions, sizes and directions of all figures and objects. Treat handwritten notes as instructions and do not draw them. Clean lineart with line weight variation, bright colors with full lighting and shading, detailed background with depth.'});

defI({no:'10',cat:'BASIC',name:'写真からロゴ・アイコン素材',en:'Photo to Simple Icon',lead:'写真の被写体を、ロゴやアイコンに使えるシンプルな図形にする。',
before:'お店の外観・商品・ペット・料理の写真',after:'少ない色と単純な形でできた、ロゴに使える図案',kw:['シンプル化','3色以内','単色背景','ベクター風'],pal:['#1d3557','#457b9d','#a8dadc','#f1faee','#e63946'],tools:[GPT,GEM,CV],
use:'<b>お店のロゴ案・SNSアイコン・ショップカード・ステッカー</b>に。写真の特徴を残したまま、デザイン素材として使える形にします。',
tips:['色数を「3色以内」と決めると、ロゴとして使いやすい図案になります','背景は単色にして、あとで切り抜きやすく','正式なロゴにする場合は、デザイナーにベクター化して整えてもらうと安心'],
p:`【スタイル】写真の主役（人物・動物・建物・商品など）を、ロゴやアイコンに使えるシンプルな図案にする
【描き方】

【避けるもの】写真のような質感、細かい模様、4色以上の色、文字`,

enp:'Create a vertical 4-panel comic strip starring the person or pet from the attached photo. Panel 1: relaxing in the same scene as the photo. Panel 2: notices something curious. Panel 3: an unexpected small mishap. Panel 4: a heartwarming punchline. Simple soft-line manga style with gentle muted colors, consistent character design in all panels, short speech bubbles (or leave bubbles empty).'});

p:`【スタイル】水彩紙に描いた、やさしい透明水彩画
【描き方】
・線：輪郭線はほとんど描かず、色の境目で形を表す（必要な所だけ鉛筆の細い線をうっすら）
・塗り：水を多く含んだ絵の具のにじみとぼかし。色が重なった所は少し濃くなる
・余白：明るい部分は塗らずに、紙の白をそのまま残す
・色：淡く透明感のある色を3〜4色で
・質感：水彩紙のざらざらした凹凸と、絵の具がたまってできる縁の濃いライン
・顔：顔立ちの特徴を残す
【避けるもの】くっきりした黒い線、ベタ塗り、デジタルっぽいなめらかさ`,
enp:'Repaint the attached photo as a delicate transparent watercolor on textured cold-press paper: almost no outlines (only faint pencil lines where needed), wet-in-wet blooms and soft gradients, darker edges where pigment pools, white paper left unpainted for highlights, light translucent palette of 3-4 colors. Keep faces recognizable.'});

artI({no:'32',cat:'ART',name:'印象派の油絵',en:'Impressionist Oil',lead:'光のつぶを重ねたような筆のタッチ。美術館に飾られた油絵のように。',
before:'公園・水辺・花畑・夕日の写真',after:'太い筆のタッチで光を描いた、印象派の油絵',kw:['油絵','筆のタッチ','光の表現','厚塗り'],pal:['#f4d35e','#ee964b','#f95738','#0d3b66','#a3c4bc'],tools:[GPT,MJ,GEM],
use:'<b>風景写真・記念写真をアート作品に</b>。額に入れて飾ったり、贈り物にしたりするのに向いています。',
tips:['光の当たる水辺や花畑の写真ほど、印象派らしさが引き立ちます','「キャンバスの布目」まで指定すると、本物の油絵らしくなります','画家の名前ではなく「短い筆のタッチ」「光のつぶ」など特徴で指示'],
p:`【スタイル】19世紀の印象派の画家が描いたような、光あふれる油絵
【描き方】
・筆づかい：短く太い筆のタッチを、たくさん重ねて描く。筆の跡がはっきり残る
・光：光の当たる部分に、黄色・オレンジ・白の明るい絵の具をのせ、きらめきを表現する
・影：影は黒ではなく、青や紫で描く
・輪郭：くっきりした輪郭線は描かず、色のかたまりで形を表す
・質感：キャンバスの布目と、厚く盛り上がった絵の具
・構図：写真の構図を保つ
【避けるもの】なめらかなデジタル塗り、黒い輪郭線、特定の画家の名前`,
enp:'Repaint the attached photo as a 19th-century impressionist oil painting: short thick visible brushstrokes layered densely, sparkling sunlight in yellow, orange and white dabs, shadows painted in blues and violets instead of black, no outlines, forms built from patches of color, canvas weave and impasto texture. Keep the original composition.'});

artI({no:'33',cat:'ART',name:'浮世絵',en:'Ukiyo-e Woodblock',lead:'太い輪郭線、平らな色、木版のかすれ。江戸の浮世絵のように。',
before:'人物・富士山などの景色・海や波の写真',after:'木版で刷ったような、江戸時代の浮世絵',kw:['木版画','藍色','平塗り','和紙'],pal:['#1d3557','#457b9d','#e9d8a6','#ee9b00','#9b2226'],tools:[GPT,MJ,GEM],
use:'<b>外国人向けのおみやげ・和風のポスター・ユニークなプロフィール画像</b>に。海外の人にも喜ばれる日本らしい画風です。',
tips:['藍色（ベロ藍）を多めに使うと、浮世絵らしさが一気に出ます','空は上が濃く下が薄い「ぼかし」にするのがポイント','人物は細い目・切れ長の眉に少し寄せると、時代の雰囲気が出ます'],
p:`【スタイル】江戸時代の木版画・浮世絵
【描き方】
・線：墨の黒で、太さが一定のくっきりした輪郭線
・色：平らなベタ塗り。藍色・朱色・黄土色・生成りを中心に、色数は少なく
・空：上が濃い藍色、下に向かって薄くなる「ぼかし」のグラデーション
・質感：木版で刷ったような、色のかすれとわずかなずれ。和紙の繊維の質感
・人物：顔立ちの特徴を残しつつ、浮世絵らしい細い目と切れ長の眉に寄せる
・波や雲：写真にあれば、浮世絵らしい様式化した形で描く
【避けるもの】立体的な陰影、グラデーションの多用、現代的なものをそのまま描くこと`,
enp:'Redraw the attached photo as an Edo-period Japanese ukiyo-e woodblock print: uniform bold sumi ink outlines, flat areas of limited color (Prussian indigo, vermilion, ochre, cream), bokashi sky gradient from deep indigo to pale, woodblock texture with slight misregistration and washi fibers, stylized waves and clouds, figures with narrow eyes and long brows. No 3D shading.'});

artI({no:'34',cat:'ART',name:'水墨画',en:'Sumi-e Ink Wash',lead:'墨の濃淡とにじみ、たっぷりの余白。静かで凛とした墨絵に。',
before:'山・木・花・動物・人物の横顔の写真',after:'墨の濃淡と余白で描いた、静かな水墨画',kw:['墨','濃淡','余白','にじみ'],pal:['#111111','#444444','#888888','#d9d4c7','#c1121f'],tools:[GPT,MJ,GEM],
use:'<b>和風の作品・座右の銘と組み合わせた書画・お茶やお香のお店</b>に。モノトーンなので、どんなデザインにもなじみます。',
tips:['「画面の半分以上を余白に」と入れると、水墨画らしい静けさが出ます','赤い落款（ハンコ）を1つだけ入れると作品として締まります','動物や植物の写真と特に相性が良い画風です'],
p:`【スタイル】和紙に描いた水墨画（墨絵）
【描き方】
・墨：濃い墨・中くらいの墨・薄い墨の3段階の濃淡だけで描く
・筆：太い筆で一気に描いたような、勢いのある線。かすれとにじみを残す
・省略：主役だけを描き、背景はほとんど描かずに余白として残す（画面の半分以上を余白に）
・紙：生成りの和紙。墨が和紙ににじむ質感
・アクセント：右下に小さな朱色の落款（四角いハンコ）を1つ
・色：墨の黒〜グレーと、落款の朱色だけ
【避けるもの】カラー、細かい描き込み、背景を埋め尽くすこと`,
enp:'Repaint the attached photo as a Japanese sumi-e ink wash painting on cream washi paper: only three ink tones (dark, mid, pale), bold confident brush strokes with dry-brush and bleeding edges, subject only with more than half of the canvas left as empty space, one small red square seal stamp in the lower right. Monochrome ink plus red seal only.'});

artI({no:'35',cat:'ART',name:'色鉛筆画',en:'Colored Pencil',lead:'紙の目が見える、やさしい色鉛筆の手描きイラスト。',
before:'子ども・ペット・食べ物・身近な風景の写真',after:'色鉛筆で丁寧に描いた、あたたかい手描きの絵',kw:['色鉛筆','紙の目','やさしい線','手描き'],pal:['#ffcdb2','#ffb4a2','#e5989b','#b5838d','#6d6875'],tools:[GPT,GEM,MJ],
use:'<b>子どもやペットの記念・絵日記風の投稿・手紙やカード</b>に。手描きのぬくもりで、見る人をほっとさせます。',
tips:['「紙の白が少し残る程度の塗り」にすると、色鉛筆らしさが出ます','線の方向をそろえた細かいストロークで塗ると、本物らしくなります','背景を描かず白のままにすると、絵本の挿絵のように'],
p:`【スタイル】画用紙に色鉛筆で描いた、やさしい手描きのイラスト
【描き方】
・線：色鉛筆の細い線。輪郭は茶色やこげ茶の色鉛筆で、少しだけ揺らぎを残す
・塗り：細かいストロークを同じ方向に重ねて塗る。強く塗る所と軽く塗る所の差を出す
・質感：画用紙の凹凸（紙の目）が見え、紙の白が少し残る
・色：あたたかく、やさしい中間色
・背景：主役のまわりだけ軽く塗り、外側は紙の白のまま
・顔：顔立ちの特徴を残す
【避けるもの】ベタ塗り、デジタルの質感、黒い太い線`,
enp:'Redraw the attached photo as a gentle colored pencil drawing on textured drawing paper: thin slightly wobbly brown outlines, fine directional pencil strokes layered with varying pressure, visible paper tooth with specks of white showing through, warm soft mid-tone palette, background lightly shaded only around the subject and fading to white paper. Keep faces recognizable.'});

artI({no:'36',cat:'ART',name:'パステル画',en:'Soft Pastel',lead:'指でぼかしたような、ふんわりやわらかいパステル画。',
before:'夕焼け・花・赤ちゃん・恋人の写真',after:'粉っぽい質感でふんわりぼかした、夢のようなパステル画',kw:['パステル','ぼかし','粉の質感','夢のよう'],pal:['#ffd6ff','#e7c6ff','#c8b6ff','#b8c0ff','#bbd0ff'],tools:[GPT,GEM,MJ],
use:'<b>赤ちゃん・マタニティ・ウェディング・夕焼けの写真</b>に。やわらかく夢のような印象で、記念の一枚にぴったり。',
tips:['「色紙（いろがみ）の上に描いた」とすると、紙の色が透けて味わいが出ます','空や光は指でぼかしたように、輪郭はチョークの線を残すとメリハリが出ます','淡いピンク〜紫の色紙が、パステルと相性抜群'],
p:`【スタイル】淡い色紙（いろがみ）の上に、ソフトパステルで描いたやわらかい絵
【描き方】
・塗り：パステルを指でこすってぼかしたような、ふんわりしたグラデーション
・線：ところどころにチョークのような粉っぽい線を残し、形を表す
・質感：粉っぽいマットな質感と、色紙のざらざらした凹凸
・色：やわらかいピンク・ラベンダー・水色を中心に
・光：光のあたる部分は白いパステルでやさしく明るく
・顔：顔立ちの特徴を残す
【避けるもの】くっきりした線、つやのある質感、濃すぎる色`,
enp:'Redraw the attached photo as a soft pastel drawing on light tinted paper: finger-blended dreamy gradients, a few chalky powdery strokes defining forms, matte dusty texture with visible paper grain, soft pink, lavender and sky blue palette, gentle white pastel highlights. Keep faces recognizable. No hard lines, no gloss.'});

artI({no:'37',cat:'ART',name:'ポップアート',en:'Pop Art Halftone',lead:'あざやかな原色と網点のドット、太い黒線。アメコミのようなポップアート。',
before:'人物の顔アップ・表情のある写真',after:'原色と網点で描かれた、60年代風のポップアート',kw:['網点','原色','太い黒線','アメコミ'],pal:['#ffd60a','#ff006e','#3a86ff','#000000','#ffffff'],tools:[GPT,MJ,GEM],
use:'<b>インパクトのあるアイコン・ポスター・Tシャツのデザイン</b>に。4色違いを並べる「4分割」も人気です。',
tips:['「4分割で、それぞれ背景色を変えて」と入れると、おなじみのポップアートの構成に','網点のドットを大きめにすると、印刷物らしさが強調されます','表情は少し大げさにすると、ポップアートらしくなります'],
p:`【スタイル】1960年代のポップアートのような、原色と網点のイラスト
【描き方】
・線：太く黒い、くっきりした輪郭線
・塗り：黄・ピンク・青・赤などの原色のベタ塗り。肌や影は大きめの網点（ドット）で表現
・背景：原色1色のベタ、または大きなドット模様
・構成：（任意）画面を4分割し、同じ顔をそれぞれ違う配色で並べる
・顔：顔立ちの特徴を残し、表情を少しだけ大げさに
【避けるもの】中間色、グラデーション、写真の質感、文字`,
enp:'Redraw the attached portrait as 1960s pop art: bold black outlines, flat primary colors (yellow, magenta, blue, red), skin and shading rendered with large halftone dots, solid or big-dot background, optional 2x2 grid with the same face in four different color schemes, slightly exaggerated expression. No gradients, no text.'});

artI({no:'38',cat:'ART',name:'ステンドグラス',en:'Stained Glass',lead:'鉛の黒い線で区切られた色ガラス。光が透ける教会の窓のように。',
before:'人物・動物・花・風景の写真',after:'色ガラスの破片を鉛の線でつないだ、光が透けるステンドグラス',kw:['ステンドグラス','鉛の線','色ガラス','透過光'],pal:['#003049','#d62828','#f77f00','#fcbf49','#2a9d8f'],tools:[GPT,MJ,GEM],
use:'<b>結婚式・記念日・アート作品・お店の装飾デザイン</b>に。光が透ける表現で、神聖で特別な一枚になります。',
tips:['ガラスの1枚1枚を大きめにすると、本物のステンドグラスらしくなります','後ろから光が透けている設定にすると、色が宝石のように輝きます','アーチ型の窓の枠に収めると、教会の窓のような雰囲気に'],
p:`【スタイル】教会の窓のようなステンドグラス
【描き方】
・形：写真の内容を、大きめの色ガラスの破片に分割して表現する
・線：ガラスとガラスの間を、太さが一定の黒い鉛の線でつなぐ
・色：深い青・赤・オレンジ・黄・緑など、宝石のように澄んだ色。ガラス1枚の中に少しだけ濃淡
・光：後ろから太陽の光が透けて、色が輝いている。ガラスの気泡やゆがみも少し
・枠：上が半円のアーチ型の窓枠に収める
・顔：顔立ちの特徴が分かる程度に残す
【避けるもの】細かすぎる分割、写真の質感、くすんだ色`,
enp:'Recreate the attached photo as a stained glass window: the scene divided into fairly large pieces of colored glass joined by uniform black lead came lines, jewel-toned deep blue, red, orange, yellow and green with subtle variation inside each piece, backlit by sunlight so colors glow, slight bubbles and distortion in the glass, arched window frame. Keep faces recognizable.'});

artI({no:'39',cat:'ART',name:'切り絵',en:'Layered Paper Cut',lead:'色紙を何層にも重ねて切り抜いた、立体的な切り絵アートに。',
before:'風景・動物・人物のシルエットが分かる写真',after:'色紙を重ねて影ができた、奥行きのある切り絵',kw:['切り絵','紙の層','影','立体感'],pal:['#03045e','#0077b6','#00b4d8','#90e0ef','#caf0f8'],tools:[GPT,MJ,GEM],
use:'<b>絵本の表紙・ポスター・季節のディスプレイ</b>に。紙の重なりと影で、手作りの温かさと立体感が出ます。',
tips:['「6〜8層の紙」と層の数を指定すると、奥行きがコントロールできます','色は同じ系統（青なら青だけ）の濃淡でまとめると美しい','層と層の間に影を落とすのが、立体感の一番のポイント'],
p:`【スタイル】色紙を何層にも重ねて切り抜いた、立体的なレイヤード切り絵（ペーパーカット）アート
【描き方】
・層：手前から奥へ、6〜8枚の紙の層で構成する。手前ほど濃い色、奥ほど淡い色
・形：写真の主役や風景を、なめらかな曲線のシルエットに単純化して切り抜く
・影：層と層の間にやわらかい影を落とし、紙が浮いているような奥行きを出す
・質感：紙の繊維と、切り口のわずかな白い断面
・色：同じ系統の色（例：深い青〜水色）の濃淡でまとめる
【避けるもの】細かすぎる切り抜き、写真の質感、平面的な仕上がり`,
enp:'Recreate the attached photo as a layered paper-cut artwork: 6-8 stacked layers of cut colored paper, darker in front and lighter toward the back, subjects simplified into smooth curved silhouettes, soft drop shadows between layers for depth, visible paper fiber and thin white cut edges, monochromatic palette from deep navy to pale cyan.'});

artI({no:'40',cat:'ART',name:'鉛筆デッサン',en:'Graphite Sketch',lead:'鉛筆の濃淡だけで描いた、美術室のようなリアルなデッサン。',
before:'人物の顔・手・静物の写真',after:'鉛筆の線と陰影で描いた、モノクロの写実的なデッサン',kw:['鉛筆','陰影','ハッチング','モノクロ'],pal:['#f8f9fa','#dee2e6','#adb5bd','#495057','#212529'],tools:[GPT,GEM,MJ],
use:'<b>似顔絵のプレゼント・アートなプロフィール・思い出の記録</b>に。シンプルなモノクロで、時代を問わない品のある一枚に。',
tips:['「仕上げきらず、端は線のまま残す」と入れると、作品らしい余韻が出ます','クロスハッチング（交差する線）で影をつけると、手描き感が増します','紙を少し黄ばんだクリーム色にすると、古いスケッチブックのように'],
p:`【スタイル】スケッチブックに鉛筆で描いた、写実的なデッサン
【描き方】
・線：HB〜6Bの鉛筆の線。輪郭は軽く、影の部分はしっかり描き込む
・陰影：線を重ねるハッチング・クロスハッチングと、指でこすったぼかしで立体感を出す
・仕上げ：主役の顔（または中心）はしっかり描き、外側に向かってだんだん線だけのラフな状態になる
・紙：少しクリーム色がかったスケッチブックの紙。消しゴムでつけたハイライトも少し
・顔：顔立ち・表情を正確に残す
・色：鉛筆のグレーだけ（モノクロ）
【避けるもの】カラー、写真のような完全な仕上がり、デジタルっぽい線`,
enp:'Redraw the attached photo as a realistic graphite pencil sketch in a sketchbook: HB to 6B pencil, light construction lines, hatching and cross-hatching with finger-blended smudges for volume, fully rendered center fading to loose unfinished lines at the edges, slightly cream paper with eraser highlights. Accurate facial features and expression. Monochrome graphite only.'});

/* GRAPHIC */
artI({no:'41',cat:'GRAPHIC',name:'フラットイラスト',en:'Flat Illustration',lead:'線なし・影少なめ・シンプルな形。Webや資料で使いやすい定番。',
before:'仕事中・カフェ・街角などの人物写真',after:'シンプルな形と少ない色でできた、今っぽいフラットイラスト',kw:['フラット','線なし','少ない色','Web素材'],pal:['#264653','#2a9d8f','#e9c46a','#f4a261','#e76f51'],tools:[GPT,GEM,CV],
use:'<b>Webサイト・プレゼン資料・ブログのアイキャッチ・SNSの図解</b>に。どんなデザインにもなじむ、いちばん実用的なスタイル。',
tips:['「5色以内」と色を限定すると、資料に使ったときに統一感が出ます','顔は目と口だけ、または顔のパーツなしにすると、より今っぽくなります','ブランドカラーを指定すれば、自社専用の素材が作れます'],
p:`【スタイル】Webサイトや資料で使える、シンプルなフラットイラスト
【描き方】
・形：人物も物も、丸・四角などの単純な形の組み合わせに簡略化する
・線：輪郭線は使わない
・塗り：ベタ塗り。影は同じ色の少し濃い色で1段階だけ
・色：5色以内（例：深緑・青緑・黄・オレンジ・赤オレンジ）。背景は淡い単色
・顔：目と口だけのシンプルな表情（または顔のパーツなし）。髪型と服の色で本人らしさを出す
・小物：写真にある物（PC・コーヒーなど）も単純な形で描く
【避けるもの】写真の質感、細かい描き込み、グラデーション`,
enp:'Redraw the attached photo as a modern flat vector-style illustration: people and objects simplified into basic geometric shapes, no outlines, flat fills with one darker shade for shadows, max 5 colors (deep teal, teal, yellow, orange, coral) on a pale solid background, minimal faces (dots for eyes or no features), identity shown through hairstyle and clothing colors.'});

artI({no:'42',cat:'GRAPHIC',name:'一筆書きライン',en:'Continuous Line Art',lead:'一本の線だけで描いたような、おしゃれなミニマル線画。',

artI({no:'44',cat:'GRAPHIC',name:'シティポップ',en:'80s City Pop',lead:'夏の夕暮れ、プール、ヤシの木。80年代のレコードジャケット風。',

・構図：正方形のジャケットのような、すっきりした構図
・人物：顔立ちの特徴を残し、サングラスやリゾート風の服装などは任意
【避けるもの】暗い色、細かい描き込み、写真の質感、文字`,
enp:'Redraw the attached photo as a 1980s Japanese city pop album cover illustration: clean simplified shapes with crisp outlines, flat blue or purple cast shadows, sunset sky gradient orange to pink to aqua, bright pastel palette, add palm trees, pool, sea, cars or lit windows as fits the scene, warm low sun with long shadows, square composition. No text.'});

artI({no:'49',cat:'GRAPHIC',name:'アイソメトリック',en:'Isometric Room',lead:'斜め上から見下ろした、箱庭のような立体イラスト。部屋や街に。',

enp:'Recreate the room or building in the attached photo as an isometric 3D illustration: true isometric view with parallel depth lines, a cutaway box showing the floor and two walls, the same furniture and objects in the same layout slightly stylized, soft pastel colors with three-tone face shading, gentle window light and small shadows, floating on a plain solid background. No perspective distortion.'});

artI({no:'51',cat:'TREND',name:'自分のLINEスタンプ8種',en:'Sticker Set x8',lead:'写真1枚から、表情違いのスタンプ8種類を1枚にまとめて作る。',

  c.innerHTML=`<div class="row"><span class="no">No.${m.no}</span><span class="nm">${esc(m.name)}<br><span class="cat">${CAT[m.cat]?CAT[m.cat].ja:''}・${esc(m.en)}</span></span><button class="copy" type="button">コピー</button><label class="chk"><input type="checkbox" id="c${m.no}">済み</label></div>${sp?`<div class="note">${sp.note}</div>`:''}<details><summary>プロンプトを見る</summary><pre>${esc(text(m))}</pre></details>`;
  const b=c.querySelector('.copy');b.onclick=()=>{const t=text(m);const ok=()=>{b.textContent='コピーしました';b.classList.add('ok');setTimeout(()=>{b.textContent='コピー';b.classList.remove('ok')},1500)};
    try{navigator.clipboard.writeText(t).then(ok,()=>{c.querySelector('details').open=true;const r=document.createRange();r.selectNodeContents(c.querySelector('pre'));getSelection().removeAllRanges();getSelection().addRange(r)})}catch(e){c.querySelector('details').open=true}};
  const cb=c.querySelector('input');cb.checked=!!saved[m.no];c.classList.toggle('done',cb.checked);
  cb.onchange=()=>{saved[m.no]=cb.checked;c.classList.toggle('done',cb.checked);try{localStorage.setItem('kit-done',JSON.stringify(saved))}catch(e){}upd()};list.appendChild(c)});
function upd(){const n=todo.filter(m=>saved[m.no]).length;document.getElementById('cnt').textContent=`${n} / ${todo.length}`;document.getElementById('barI').style.width=(n/todo.length*100)+'%'}
upd();
</script>
