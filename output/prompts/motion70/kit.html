    cats:{ANALYZE:1,TREND:1,STRATEGY:1},
    desc:'「何から手をつければいいか分からない」「相談できる人がいない」。そんな個人事業主・ひとりマーケターのための、<b>分析と戦略立ての相談用プロンプト</b>です。AIが先に質問をしてくれるので、まとまっていなくても大丈夫。最後は必ず「今週やること」まで落とし込みます。会社員のマーケティング担当にもそのまま使えます。',
    steps:['<b>今の悩みに近いものを選ぶ</b><br>「現状を知る」→「流れを読む」→「作戦を立てる」の順に進めると、全体の計画ができあがります。','<b>【私の情報】を分かる範囲で書く</b><br>空欄でもOK。足りない情報は、AIが最初に質問してくれます。','<b>Claude または ChatGPT に送る</b><br>Web検索がオンになっているAIを使うと、最新の情報で分析してくれます。','<b>「今週やること」から始める</b><br>結果はメモに保存。1か月後に同じプロンプトで振り返ると、成長が見えます。'],
    base:()=>`あなたは、個人事業主や小さなお店を何百件も支援してきた、経験豊富なマーケティングの相談相手です。次の【相談内容】について、一緒に分析と戦略を考えてください。

【進め方のルール】
・最初に、分析に必要なのに【私の情報】に書かれていないことを、3〜5個だけ質問してください。私が答えてから本題に入ります（「このまま進めて」と言われたら、仮の前提を置いて進めてください）
・私は1人で事業をしています。予算も時間も限られているので、大企業向けではなく「1人で、少ないお金で、今日から動ける」提案にしてください
・Web検索ができる場合は、最新の情報を調べ、使った情報には出典（サイト名とURL）を付けてください。調べられないことや推測は【仮説】と書いて区別してください
・数字や事実を作らないでください。分からない数字は【要確認】と書いてください
・専門用語は使ってもよいですが、初めて出てきたときに一言で説明してください
・図や表で整理できるところは、表にしてください
・最後に必ず「今週やること」を3つ、かかる時間の目安と一緒に書いてください
・不安をあおる言い方はせず、できていることも認めながら、前向きに進められる言葉で伝えてください`,
    fix:[['話が大きすぎる','「1日30分・月1万円以内でできることだけに絞って、作り直して」'],['よく分からない','「中学生にも分かる言葉で、たとえ話を使って説明し直して」'],['根拠が知りたい','「それぞれの提案の根拠と、参考にした情報の出典を表にして」'],['優先順位が分からない','「効果の大きさと手間の少なさで2×2の表にして、最初にやる1つを決めて」'],['続けられるか不安','「この計画を、毎週月曜に見返すチェックリストにして」'],['1か月後に振り返りたい','「前回の分析はこれです：（貼る）。今月の結果はこれです：（貼る）。何がうまくいき、次に何を変えるべきか分析して」']]},
  v:{name:'動画編集',en:'VIDEO EDITING',k:'--c-impact',ui:'graphic',unit:'編集',lead:'切り抜き・テロップ・字幕・カット。文字起こしを貼るだけで、編集の「設計図」ができる。',
    showLabel:'このプロンプトで、こうなる（編集のイメージ）',inputLabel:'チャンネル名・番組名',mockNote:'※AIが作る編集の指示（切り抜き位置・テロップ・字幕など）と、仕上がりのイメージを再現した見本です。',
    cats:{CLIP:1,TELOP:1,EDIT:1},
    desc:'長い動画からの切り抜き、テロップ入れ、字幕づくり、無駄なところのカットを、<b>AIに「編集の設計図」として作ってもらう</b>プロンプトです。動画の文字起こしを貼るだけで、どこを切り抜くか、どんなテロップを入れるかが秒単位で出てきます。あとは無料の CapCut などで、その通りに作業するだけ。字幕は SRT ファイルで出るので、読み込むだけで一気に入ります。',
    steps:['<b>動画の文字起こしを用意する</b><br>CapCut の「自動字幕」、YouTube の「文字起こしを表示」などで、時間付きのテキストを書き出します。','<b>目的に合うプロンプトを選んでコピー</b><br>【私の情報】に文字起こしを貼り、動画の長さや使うSNSを書き足します。','<b>Claude または ChatGPT に送る</b><br>切り抜く時間・テロップの文言・字幕ファイル（SRT）などが返ってきます。','<b>CapCut などで、その通りに作業する</b><br>SRT は字幕の「読み込み」で一発で入ります。ChatGPT に短い動画を直接渡して、カットしてもらうこともできます。'],
    base:()=>`あなたは、YouTube・TikTok・Instagram の動画を何千本も手がけてきたプロの動画編集者です。次の【編集指示】どおりに、動画編集の設計図を作ってください。

【共通ルール】
・時間は「分:秒」（例 03:25）で書き、開始と終了をはっきりさせる。文字起こしにない内容は作らない
・編集ソフトは、無料の CapCut（スマホ・PC）で再現できる方法を前提にする。手順を書くときは、CapCut のメニュー名で説明する
・字幕を出すときは、そのまま保存して読み込める SRT 形式でコードブロックに入れる
・テロップは1行15文字以内、2行まで。話し言葉の「えー」「あのー」は消し、意味を変えずに読みやすく整える
・動画ファイルを直接受け取って処理できる場合は、カットや字幕の焼き込みまで実行してよい（できない場合は、作業の手順を書く）
・最後に「作業のチェックリスト」を付ける`,
    fix:[['もっと短く','「同じ内容で、30秒以内に収まるように切り直して」'],['テロップが多すぎる','「テロップは要点だけに減らして、1画面1つにして」'],['面白さが足りない','「ツッコミのテロップと効果音の指示を、3か所足して」'],['字幕がずれる','「SRTの時間を、文字起こしの時間に合わせて0.2秒ずつ後ろにずらして」'],['自動でやりたい','「この指示を ffmpeg のコマンドにして。Windows（またはMac）で動く形で」'],['別のSNS用にも','「同じ切り抜きを、YouTubeショート・TikTok・リール用に、タイトルと説明文を変えて3つ作って」']]},
  e:{name:'オープニングムービー',en:'WEDDING OPENING MOVIE',k:'--c-rose',ui:'motion',unit:'ムービー',lead:'披露宴の始まりを盛り上げる、約3分のオープニング。誰もが見たことのあるあの画面風に。',
    showLabel:'このプロンプトで、こうなる',monLabel:'OPENING MOVIE PREVIEW',video:1,inputLabel:'ふたりの名前',ars:['16:9','4:3'],curAr:'16:9',arLabel:'会場のスクリーン',
    cats:{WSTREAM:1,WGAME:1,WSTORY:1,WSIMPLE:1,WCUTE:1},
    desc:'結婚式・披露宴の入場前に流す、約3分のオープニングムービーのプロンプトです。動画配信サービスの作品ページ、SNSのストーリーズ、レトロRPG、ニュース速報など、ゲストの誰もが「あ、あれだ！」と分かる雰囲気を参考に、オリジナルのデザインで作れます。完成したムービーは<b>MP4で書き出して、Adobe Premiere Pro にそのまま読み込めます</b>。各ページには、雰囲気を確認できる<b>サンプル動画（MP4）</b>も付いています。',
    steps:['<b>雰囲気を選んで、プレビューで確認</b><br>入力欄にふたりの名前を入れると、プレビューとプロンプトが同時に変わります（例：Nobu & Yui）。','<b>【ふたりの情報】を書き足して、Claude に送る</b><br>日付・会場・エピソードを入れるほど、ふたりらしいムービーになります。','<b>できたコードを opening.html で保存して、ブラウザ（Chrome）で開く</b><br>「写真を読み込む」で写真を入れて、再生して確認します。','<b>「MP4で書き出す」→ Premiere Pro で BGM を入れて仕上げ</b><br>会場の決まり（形式・長さ・曲の手続き）は、事前に会場へ確認してください。'],
    base:a=>`あなたは結婚式の映像クリエイター兼フロントエンドエンジニアです。次の【ムービー指示】どおりの結婚式のオープニングムービー（約3分）を、HTML・JavaScript の1ファイルで作ってください。完成した動画は、Adobe Premiere Pro に読み込める動画ファイルとして書き出せるようにします。

【共通仕様】
・画面：${a.startsWith('4:3')?'4:3（1440×1080）':'16:9（1920×1080）'}。すべて1枚の <canvas> に描き、30fps で再生する。ブラウザでは比率を保ったまま中央に表示する
・時間の管理：経過時間（秒）からすべての見た目を計算する作りにして、処理が遅れても動きと時間がずれないようにする。各シーンの開始・終了の秒数は配列にまとめる
・設定：ふたりの名前・日付・会場・各シーンの文章・写真の割り当ては、コード冒頭の const CONFIG にまとめ、書き換えるだけで全体が変わるようにする
・写真：「写真を読み込む」ボタンで複数枚を選ぶと、ファイル名の順に写真の枠へ入る。写真がないときは、名前と番号入りの仮の枠を表示する。写真は枠に合わせて中央で切り抜き、ゆっくり寄る動き（ケン・バーンズ）を付ける
・書き出し：「MP4で書き出す」ボタンを押すと、最初から最後まで再生しながら canvas.captureStream(30) と MediaRecorder で録画し、ファイルを保存する。'video/mp4;codecs=avc1' に対応していれば MP4（H.264）、対応していなければ WebM で保存し、どちらで保存したかを画面に表示する。録画中は画面に「録画中 00:00 / 03:00」のように進み具合を出す
・操作：「再生」「最初から」ボタンとシークバー。スペースキーで再生・一時停止。シーン一覧から好きな場面に飛べる
・著作権：実在の会社・サービス・ゲームのロゴ、マーク、キャラクター、効果音、音楽は使わない。指定した雰囲気を参考にした、オリジナルのデザインにする
・音：BGM は入れない（結婚式で流す曲は著作権の手続きが必要なため、Premiere Pro で後から入れる）
・文字：Google Fonts から読み込み、document.fonts.ready を待ってから描く。会場の大きなスクリーンでも読めるよう、本文は最小でも 40px
・回答の最後に、次の3つを書く：①Premiere Pro への読み込み方（WebM になった場合に、無料の HandBrake で MP4 に変換する方法も）、②BGM を合わせるとよい場面と秒数、③CONFIG で書き換える場所の一覧`,
    fix:[['長さを変えたい','「全体を〇分〇秒にして。各シーンの長さを同じ割合で伸ばして（縮めて）」'],['写真の枚数が違う','「写真の枚数を〇枚にして、シーンの長さを自動で調整して」'],['文字が読みにくい','「会場の後ろの席からも読めるよう、文字を1.3倍にして、文字の後ろに半透明の帯を敷いて」'],['もっと感動させたい','「最後の1分の動きを全体に1.5倍ゆっくりにして、光のにじみとフィルムのざらつきを足して」'],['本物に似すぎて不安','「参考にした雰囲気は残しつつ、形・色・言葉づかいをオリジナルに変えて」'],['書き出せない','「MediaRecorder が使えないときのために、連番PNGで書き出すボタンも付けて（Premiere Pro では読み込み時に“画像シーケンス”にチェック）」']]},

    desc:'写真をアップロードして、このプロンプトを一緒に送るだけ。顔立ちや構図を保ったまま、別の画風に描き直してもらうためのプロンプト集です。まず「基礎の変換」で型を覚えてから、流行りのスタイルへ進むのがおすすめです。',

<script>
const SEC=SECTIONS();
const SPECIAL={};
const done=new Set(GIMG);
let saved={};try{saved=JSON.parse(localStorage.getItem('bdkit-done')||'{}')}catch(e){}
const list=document.getElementById('list');const todo=[...ITEMS.g,...ITEMS.b,...ITEMS.d].filter(m=>!m.img);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function text(m){const sp=SPECIAL[m.no];return SEC[m.sec].base()+'\n\n【'+SEC[m.sec].unit+'指示】\n'+m.p.replaceAll('{T}',m.text)}
todo.forEach(m=>{const c=document.createElement('div');c.className='card item';const sp=SPECIAL[m.no];
  c.innerHTML=`<div class="row"><span class="no">${m.sec==='g'?'G':m.sec==='b'?'建築':'製品'} ${m.no}</span><span class="nm">${esc(m.name)}<br><span class="cat">${CAT[m.cat]?CAT[m.cat].ja:''}・${esc(m.en)}</span></span><button class="copy" type="button">コピー</button><label class="chk"><input type="checkbox" id="c${m.id}">済み</label></div>${sp?`<div class="note">${sp.note}</div>`:''}<details><summary>プロンプトを見る</summary><pre>${esc(text(m))}</pre></details>`;
  const b=c.querySelector('.copy');b.onclick=()=>{const t=text(m);const ok=()=>{b.textContent='コピーしました';b.classList.add('ok');setTimeout(()=>{b.textContent='コピー';b.classList.remove('ok')},1500)};
    try{navigator.clipboard.writeText(t).then(ok,()=>{c.querySelector('details').open=true;const r=document.createRange();r.selectNodeContents(c.querySelector('pre'));getSelection().removeAllRanges();getSelection().addRange(r)})}catch(e){c.querySelector('details').open=true}};
  const cb=c.querySelector('input');cb.checked=!!saved[m.id];c.classList.toggle('done',cb.checked);
  cb.onchange=()=>{saved[m.id]=cb.checked;c.classList.toggle('done',cb.checked);try{localStorage.setItem('bdkit-done',JSON.stringify(saved))}catch(e){}upd()};list.appendChild(c)});
function upd(){const n=todo.filter(m=>saved[m.id]).length;document.getElementById('cnt').textContent=`${n} / ${todo.length}`;document.getElementById('barI').style.width=(n/todo.length*100)+'%'}
upd();
</script>
