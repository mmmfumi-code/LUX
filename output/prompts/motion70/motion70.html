  const top=H.box({clipPath:'inset(0 0 50% 0)'},B),bot=H.box({clipPath:'inset(50% 0 0 0)'},B);BIG(H,a,{fontSize:sz+'px'},top);BIG(H,a,{fontSize:sz+'px'},bot);
  [top,bot].forEach((h,i)=>{H.a(h,[{opacity:0},{opacity:1}],{d:400});H.a(h,[{transform:'translateY(0)',opacity:1},{transform:`translateY(${i?120:-120}px)`,opacity:.25}],{d:500,dl:1200,e:E.io})});
  H.a(back,[{transform:'scale(.85)',opacity:0},{transform:'scale(1)',opacity:1}],{d:500,dl:1300,e:E.back});
  const ln=H.abs({left:'0',top:'449px',width:'1600px',height:'3px',background:VIO,boxShadow:'0 0 16px '+VIO,opacity:0});H.a(ln,[{transform:'scaleX(0)',opacity:1},{transform:'scaleX(1)',opacity:0}],{d:300,dl:1200,f:'none'});
  H.a(B,[{opacity:1},{opacity:0}],{d:500,dl:3400,f:'forwards'});
}});

def({no:'37',cat:'SWITCH',name:'ワイプ置換',en:'Bar Wipe Swap',lead:'色の帯が横切った瞬間、言葉がすり替わっている。',
text:'検討中 決定',multi:true,loop:3600,bg:'#f1eef8',
use:'<b>見出しの更新・ステータス変更・結論</b>に。「検討中→決定」「赤字→黒字」など、状態の変化を見せたいときに。',
tips:['帯が文字を完全に隠した瞬間に入れ替えるのがコツ（ここがズレると安っぽくなる）','帯を2色重ねて少しずらすと、雑誌の見出しのようなリズムが出ます','帯の速さは0.5秒前後が「シュッ」と気持ちいい'],
p:`紫の帯が左から右へ文字を横切り、通り過ぎると言葉がすり替わっている「ワイプ置換」を作ってください。
・背景：#F1EEF8。文字：#1A1625、Noto Sans JP 900、画面幅の約55%
・1つ目の言葉：「{T}」の1語目。0.0〜0.4秒で translateY 40px → 0 でフェードイン
・1.0秒：文字の高さより少し大きい帯を2本、左から右へ通過させる。1本目 #A78BFA、0.08秒遅れて2本目 #1A1625。帯の動きは「左端から伸びて文字全体を覆う（scaleX 0→1、左基準、0.3秒）→ 右端へ縮んで消える（scaleX 1→0、右基準、0.3秒）」
・2本目の帯が文字を完全に覆った瞬間（1.38秒）に、文字を2語目に入れ替え、色を #7C3AED にする
・2語目の左上に小さなラベル「UPDATE」（JetBrains Mono、#A78BFA）をポンと出す
・3.0秒でフェードアウト、尺3.6秒でループ`,
run(H,t,w){const a=w[0]||t,b=w[1]||t;const B=H.box();const wrap=H.el('div',{position:'relative',padding:'10px 30px'},B);
  const el=H.el('div',{fontFamily:F.sans,fontWeight:'900',fontSize:fs(a.length>b.length?a:b,230,900)+'px',color:'#1a1625',lineHeight:'1.15',whiteSpace:'nowrap'},wrap,a);
  H.a(el,[{transform:'translateY(40px)',opacity:0},{transform:'translateY(0)',opacity:1}],{d:400});
  [[VIO,1000],['#1a1625',1080]].forEach(([c,dl])=>{const bar=H.abs({inset:'0',background:c,transform:'scaleX(0)'},wrap);
    H.a(bar,[{transform:'scaleX(0)',transformOrigin:'0 50%'},{transform:'scaleX(1)',transformOrigin:'0 50%'}],{d:300,dl,e:E.io,f:'none'});
    H.a(bar,[{transform:'scaleX(1)',transformOrigin:'100% 50%'},{transform:'scaleX(0)',transformOrigin:'100% 50%'}],{d:300,dl:dl+300,e:E.io,f:'none'})});
  H.wait(1380,()=>{el.textContent=b;el.style.color='#7c3aed'});
  const lab=H.abs({left:'30px',top:'-40px',fontFamily:F.mono,fontSize:'30px',color:VIO,letterSpacing:'.15em'},wrap,'UPDATE');H.a(lab,[{transform:'scale(0)'},{transform:'scale(1)'}],{d:300,dl:1700,e:E.back});
  H.a(B,[{opacity:1},{opacity:0}],{d:500,dl:3000,f:'forwards'});
}});

def({no:'38',cat:'SWITCH',name:'リキッドモーフ',en:'Liquid Morph',lead:'文字が溶けてくっつき、別の言葉へとろりと変わる。',
text:'夢 目標 現実',multi:true,loop:4500,loopFn:w=>Math.max(1,w.length)*1500,bg:'#000',
use:'<b>変化・成長・変身</b>の表現に。「夢→目標→現実」のように段階的に変わっていく話や、ブランドの世界観づくりに。',
tips:['ぼかし（blur）とコントラスト（contrast）の組み合わせが「溶ける」効果の正体','背景は必ず黒か白の単色に（グラデーションだと効果が崩れます）','溶ける時間を長くすると、より液体っぽく粘ります'],
p:`文字が液体のように溶けてくっつき合いながら、次の言葉へとろりと変化する「リキッドモーフ」を作ってください。
・背景：#000（単色であることが必須）
・仕組み：文字を入れた親要素に filter: contrast(28) をかけ、背景 #000 を指定する。中の各言葉に blur をかけると、輪郭がくっつき合う液体のように見える
・言葉：「{T}」をスペースで区切った語を順番に表示。Dela Gothic One、画面幅の約50%、色 #A78BFA
・1語の流れ（1.5秒）：
　登場 0.5秒：blur 40px・不透明度0 → blur 0・不透明度1
　静止 0.5秒
　退場 0.5秒：blur 0 → blur 40px・不透明度0（次の語の登場と同時に重ねる）
・語が切り替わるとき、前の語と次の語が同時にぼけて混ざり合うように、登場と退場を完全に重ねる
・尺：語数 × 1.5秒でループ`,
run(H,t,w){if(!w.length)w=[t];const B=H.box({filter:'contrast(28)',background:'#000'});
  w.forEach((s,i)=>{const el=BIG(H,s,{position:'absolute',color:VIO,fontSize:fs(s,280,850)+'px'},B);const st=i*1500;
    H.a(el,[{filter:'blur(40px)',opacity:0},{filter:'blur(0px)',opacity:1}],{d:500,dl:i?st-500:0,e:E.soft});
    H.a(el,[{filter:'blur(0px)',opacity:1},{filter:'blur(40px)',opacity:0}],{d:500,dl:st+1000,e:E.soft,f:'forwards'})});
}});

def({no:'39',cat:'SWITCH',name:'ブラインド',en:'Venetian Blind',lead:'ブラインドの羽根が一斉に回転して、言葉が入れ替わる。',
text:'OFF ON',multi:true,loop:4000,bg:'#1a1622',
use:'<b>オンオフ・昼夜・モード切替</b>に。「仕事モード→休日モード」や、場面の時間帯が変わる転換に。',
tips:['羽根の枚数は10〜14枚がきれい。多いほど細やかで上品に','上から順に0.04秒ずつ遅らせると、波打つように回ります','表と裏で背景色も変えると、場面ごと切り替わった印象に'],
p:`窓のブラインドの羽根が一斉に回転し、表の言葉から裏の言葉へ切り替わる演出を作ってください。
・背景：#1A1622。CSS 3D（perspective: 1400px）
・パネル：幅1300px×高さ520px を、横長の羽根12枚（各高さ約43px）に分割
・各羽根の表面：背景 #1A1622、文字は「{T}」の1語目（白、Dela Gothic One、パネル全体に1つの大きな文字）。羽根ごとに、その高さの部分だけを表示する（文字を羽根の位置ぶん上にずらし、overflow: hidden）
・各羽根の裏面：背景 #A78BFA、文字は2語目（#1A1622）。同じ方法で分割し、rotateX(180°)・backface-visibility: hidden
・1.0秒：上の羽根から0.04秒ずつ遅らせて、各羽根を rotateX 0 → 180° へ0.6秒で回転（イージング cubic-bezier(.65,0,.35,1)）
・2.6秒：同じ順番で 180° → 360° へ戻す
・尺：4秒でループ`,
run(H,t,w){const a=w[0]||t,b=w[1]||t;const P=H.box({perspective:'1400px'});const W=H.el('div',{position:'relative',width:'1300px',height:'520px'},P);
  const N=12,h=520/N;const sz=fs(a.length>b.length?a:b,360,1200);
  for(let i=0;i<N;i++){const s=H.abs({left:'0',top:i*h+'px',width:'1300px',height:h+'px',transformStyle:'preserve-3d'},W);
    const face=(txt,bg,fg,back)=>{const f=H.abs({inset:'0',overflow:'hidden',background:bg,backfaceVisibility:'hidden',transform:back?'rotateX(180deg)':'none'},s);
      H.abs({left:'0',top:-i*h+'px',width:'1300px',height:'520px',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:F.heavy,fontSize:sz+'px',color:fg,whiteSpace:'nowrap'},f,txt)};
    face(a,'#1a1622','#fff',0);face(b,VIO,'#1a1622',1);
    H.a(s,[{transform:'rotateX(0deg)'},{transform:'rotateX(180deg)'}],{d:600,dl:1000+i*40,e:'cubic-bezier(.65,0,.35,1)'});
    H.a(s,[{transform:'rotateX(180deg)'},{transform:'rotateX(360deg)'}],{d:600,dl:2600+i*40,e:'cubic-bezier(.65,0,.35,1)',f:'forwards'})}
}});

def({no:'40',cat:'SWITCH',name:'ルーレット選択',en:'Roulette Pick',lead:'候補の言葉が縦にぐるぐる流れ、減速して1つに決まる。',
text:'カレー ラーメン 寿司 焼肉 パスタ',multi:true,loop:5000,bg:'#0f0c15',
use:'<b>今日の〇〇・ランダム決定・くじ引き</b>に。「今日のランチは…」「次の挑戦は…」のような企画もの全般に。',
tips:['候補は5〜8個がちょうどいい。少ないと回っている感じが出ません','止まる直前に1つ手前で一瞬止めてから進める「じらし」を入れると盛り上がります','決定した瞬間、枠を光らせて紙吹雪を少し散らすと完成度が上がります'],
p:`候補の言葉が縦にぐるぐる流れ、だんだん減速して1つに止まる「ルーレット選択」の演出を作ってください。
・背景：#0F0C15
・候補：「{T}」をスペースで区切った語。最後の語を「当選」とする
・表示枠：画面中央に幅1000px×高さ180pxの枠（線 4px #A78BFA、角丸20px）。枠の上下に、前後の候補が小さく薄く見えるように並べる（上下は scale 0.7・不透明度0.3）
・候補の帯：候補を何周もくり返した縦長のリスト（1項目の高さ180px、Noto Sans JP 900、110px、白）
・回転：帯を translateY で上方向へ3.0秒動かし、最後の語が枠の中央でちょうど止まるようにする。イージング cubic-bezier(.12,.8,.2,1)（最初は高速、最後はじわじわ止まる）
・止まった瞬間：枠の中を #A78BFA で塗りつぶし、文字を #0F0C15 に。枠を scale 1 → 1.08 → 1 で弾ませ、枠の左右から紫の小さな四角（12px）を10個ずつ飛ばす
・尺：5秒でループ`,
run(H,t,w){if(w.length<2)w=[t,t];const B=H.box();const view=H.abs({left:'300px',top:'90px',width:'1000px',height:'720px',overflow:'hidden',WebkitMaskImage:'linear-gradient(transparent,#000 30%,#000 70%,transparent)',maskImage:'linear-gradient(transparent,#000 30%,#000 70%,transparent)'});
  const IH=180;const strip=H.abs({left:'0',top:'0',width:'100%'},view);const loops=6;const list=[];for(let l=0;l<loops;l++)w.forEach(s=>list.push(s));
  list.forEach(s=>H.el('div',{height:IH+'px',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:F.sans,fontWeight:'900',fontSize:fs(s,110,900)+'px',color:'#fff'},strip,s));
  const target=list.length-1;const y=-(target*IH)+270;
  H.a(strip,[{transform:`translateY(${270-w.length*IH}px)`},{transform:`translateY(${y}px)`}],{d:3000,e:'cubic-bezier(.12,.8,.2,1)'});
  const fr=H.abs({left:'300px',top:'360px',width:'1000px',height:'180px',border:'4px solid '+VIO,borderRadius:'20px',boxSizing:'border-box',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:F.sans,fontWeight:'900',fontSize:fs(w[w.length-1],110,900)+'px',color:'#0f0c15'});
  H.wait(3000,()=>{fr.style.background=VIO;fr.textContent=w[w.length-1];H.a(fr,[{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{d:400,e:E.back,f:'none'});
    for(let i=0;i<20;i++){const side=i<10?-1:1;const q=H.abs({left:(side<0?300:1300)+'px',top:'444px',width:'12px',height:'12px',background:VIO});H.a(q,[{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${side*rnd(60,260)}px,${rnd(-220,220)}px) rotate(${rnd(-200,200)}deg)`,opacity:0}],{d:800})}});
}});

/* ===== TEXTURE 41-50 ===== */
const PINK='#ff7ac6';
const sample=(t,font,size,step,W,Hh)=>{const c=document.createElement('canvas');c.width=W;c.height=Hh;const x=c.getContext('2d');x.fillStyle='#fff';x.font=`${size}px ${font}`;x.textAlign='center';x.textBaseline='middle';x.fillText(t,W/2,Hh/2);
  const d=x.getImageData(0,0,W,Hh).data;const pts=[];for(let y=0;y<Hh;y+=step)for(let xx=0;xx<W;xx+=step){if(d[(y*W+xx)*4+3]>128)pts.push([xx,y])}return pts};
const fitPx=(t,font,max,width)=>{const c=document.createElement('canvas').getContext('2d');let s=max;c.font=`${s}px ${font}`;const w=c.measureText(t).width;return w>width?Math.floor(s*width/w):s};

def({no:'41',cat:'TEXTURE',name:'グリッチ',en:'RGB Glitch',lead:'赤と青の色ズレ、横に裂けるノイズ。デジタルの故障感。',
text:'SYSTEM ERROR',loop:3000,bg:'#0a0a0c',
use:'<b>エラー・バグ・ゲーム・サイバー</b>系に。「炎上」「ヤバい」「異常事態」などのテロップや、場面転換のノイズにも。',
tips:['常に揺らさず「0.1〜0.3秒の発作」をランダムに起こすのが本物っぽさのコツ','色ズレは赤（#ff2a6d）と青緑（#05d9e8）の組み合わせが定番','走査線を重ねると、モニター越しの質感になります'],
p:`「{T}」の文字が、デジタル機器の故障のように不規則に乱れる「グリッチ」演出を作ってください。
・背景：#0A0A0C。文字：白、Dela Gothic One、画面幅の約75%
・文字を3枚重ねる：①赤 #FF2A6D ②青緑 #05D9E8 ③白（一番上）。①②は mix-blend-mode: screen
・グリッチの発作：0.1〜0.3秒の長さの発作を、0.15〜0.6秒のランダムな間隔で起こす。発作中は毎フレーム
　・赤の層を x方向 −25〜25px、青緑の層をその逆方向へずらす
　・白の層を clip-path: inset() で横の帯（高さ20〜120px）だけに切り抜き、x方向に −60〜60px ずらしたコピーを2〜3本重ねる
　・まれに（20%の確率で）文字全体を skewX 10〜20° にゆがめる
・発作がないときは、すべての層を元の位置にぴったり重ねる
・画面全体に走査線（高さ2pxの黒い線を4px間隔、不透明度0.25）を重ね、ゆっくり下へ流す
・尺：3秒でループ`,
run(H,t){const B=H.box();const sz=fs(t,220,1300);const mk=(c,bl)=>BIG(H,t,{position:'absolute',color:c,fontSize:sz+'px',mixBlendMode:bl||'normal'},B);
  const r=mk('#ff2a6d','screen'),c=mk('#05d9e8','screen'),w=mk('#fff');const sl=[0,1,2].map(()=>{const e=mk('#fff');e.style.opacity=0;return e});
  const scan=H.abs({inset:'-8px 0 0 0',background:'repeating-linear-gradient(rgba(0,0,0,.25) 0 2px,transparent 2px 4px)'});H.a(scan,[{transform:'translateY(0)'},{transform:'translateY(8px)'}],{d:400,e:E.lin,i:Infinity});
  let until=0,next=300;H.raf(s=>{const ms=s*1000;if(ms>next){until=ms+rnd(100,300);next=until+rnd(150,600)}
    if(ms<until){const d=rnd(-25,25);r.style.transform=`translateX(${d}px)`;c.style.transform=`translateX(${-d}px)`;const sk=Math.random()<.2?`skewX(${rnd(10,20)}deg)`:'';w.style.transform=sk;
      sl.forEach(e=>{if(Math.random()<.7){const top=rnd(0,90);e.style.clipPath=`inset(${top}% 0 ${Math.max(0,100-top-rnd(8,30))}% 0)`;e.style.transform=`translateX(${rnd(-60,60)}px)`;e.style.opacity=1}else e.style.opacity=0})}
    else{r.style.transform=c.style.transform=w.style.transform='none';sl.forEach(e=>e.style.opacity=0)}});
}});

def({no:'42',cat:'TEXTURE',name:'ネオン点灯',en:'Neon Sign',lead:'パチ、パチッ…と瞬いて灯るネオン管。1文字だけ調子が悪い。',
text:'OPEN 24H',loop:4400,bg:'#160d14',
use:'<b>夜・バー・ナイトライフ・レトロ</b>な場面に。深夜配信のタイトル、お店の紹介、エモい夜景Vlogに。',
tips:['光は text-shadow を4〜5層、半径を倍々に重ねると本物のネオンに','1文字だけ遅れて点く「接触不良」が、リアルさと愛嬌を両立させます','背景にレンガの目地を薄く描くと、看板っぽさが増します'],
p:`ネオン管の看板が「パチ、パチッ」と瞬いてから灯り、1文字だけ接触不良でチカチカする演出を作ってください。
・背景：#160D14 に、目地の線（rgba(255,255,255,.04)、横120px×縦60pxのレンガ模様）を薄く描く
・文字：「{T}」、Noto Sans JP の400（細め）を使い、文字色 #FFE6F4。画面幅の約60%
・点灯時の光：text-shadow を5層重ねる（0 0 6px #FFF, 0 0 14px #FF7AC6, 0 0 30px #FF7AC6, 0 0 60px #FF2A9D, 0 0 110px #FF2A9D）
・消灯時：文字色 #3A2333、光なし
・点灯の流れ：0.4秒で一瞬点く(0.06秒)→消える→0.7秒で点く(0.1秒)→消える→0.95秒から点きっぱなし
・接触不良：右から2番目の文字だけ、2.0秒から 0.05〜0.15秒の不規則な間隔で6回ほど消灯・点灯をくり返してから安定
・点いている間、全体の明るさを 0.96〜1.0 でごくわずかに揺らし続ける（電気のゆらぎ）
・尺：4.4秒でループ`,
run(H,t){H.abs({inset:'0',backgroundImage:'linear-gradient(rgba(255,255,255,.04) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.04) 2px,transparent 2px)',backgroundSize:'120px 60px'});
  const B=H.box();const w=H.el('div',{fontFamily:F.sans,fontWeight:'400',fontSize:fs(t,240,1100)+'px',whiteSpace:'nowrap'},B);const cs=H.chars(t,w);
  const ON={color:'#ffe6f4',textShadow:'0 0 6px #fff,0 0 14px #ff7ac6,0 0 30px #ff7ac6,0 0 60px #ff2a9d,0 0 110px #ff2a9d'},OFF={color:'#3a2333',textShadow:'none'};
  const set=(e,on)=>Object.assign(e.style,on?ON:OFF);cs.forEach(e=>set(e,0));
  [[400,1],[460,0],[700,1],[800,0],[950,1]].forEach(([ms,on])=>H.wait(ms,()=>cs.forEach(e=>set(e,on))));
  const bad=cs[Math.max(0,cs.length-2)];let tm=2000;for(let i=0;i<12;i++){tm+=rnd(50,150);const on=i%2===1||i===11;H.wait(tm,()=>set(bad,on))}
  H.raf(()=>{w.style.filter=`brightness(${rnd(.96,1).toFixed(3)})`});
}});

def({no:'43',cat:'TEXTURE',name:'筆書き',en:'Brush Ink',lead:'墨がにじみながら、縦書きの文字が一画ずつ書かれていく。',
text:'一期一会',loop:4800,bg:'#f4efe4',
use:'<b>和風・書道・季節の挨拶・座右の銘</b>に。年賀動画、日本文化の紹介、「今年の抱負」などに。',
tips:['上から下へのマスク＋ぼかしを組み合わせると、筆で書いた感じが出ます','最後に朱色の落款（ハンコ）を押すと作品として締まります','背景に薄い和紙の繊維ノイズを足すと、より本物らしく'],
p:`縦書きの「{T}」が、墨のにじみとともに上から一文字ずつ書かれていく演出を作ってください。
・背景：#F4EFE4（和紙）。SVGの feTurbulence で薄い繊維のノイズ（不透明度0.08）を重ねる
・文字：Yuji Syuku（毛筆風）、色 #1A1A1A、縦書き（writing-mode: vertical-rl）、画面の高さの約80%に収まる大きさ
・1文字の書き方（0.55秒）：clip-path: inset(0 0 100% 0) → inset(0 0 0 0)（上から下へ現れる）。同時に filter: blur(6px)→blur(0)、不透明度 0.4→1（墨がにじんで定着する）
・文字ごとに0.45秒ずつ遅らせる
・書き終わったら0.3秒後、文字の左下に朱色 #C8102E の四角い落款（90px角、角丸6px、中に白で「印」）を scale 1.6→1 でポンと押す
・4.2秒でフェードアウト、尺4.8秒でループ`,
run(H,t){const svg=H.svg(1600,900,null,{opacity:.08});const id='wn'+Math.floor(Math.random()*1e6);const f=H.sv('filter',{id},H.sv('defs',{},svg));H.sv('feTurbulence',{type:'fractalNoise',baseFrequency:'.8 .05',numOctaves:3},f);H.sv('rect',{width:1600,height:900,filter:`url(#${id})`},svg);
  const B=H.box();const n=[...t].length;const sz=Math.min(200,720/n);const col=H.el('div',{writingMode:'vertical-rl',fontFamily:F.brush,fontSize:sz+'px',color:'#1a1a1a',lineHeight:'1.1',position:'relative'},B);
  const cs=H.chars(t,col);cs.forEach((c,i)=>H.a(c,[{clipPath:'inset(0 0 100% 0)',filter:'blur(6px)',opacity:.4},{clipPath:'inset(0 0 0 0)',filter:'blur(0px)',opacity:1}],{d:550,dl:i*450,e:E.soft}));
  const st=H.abs({left:'-130px',bottom:'0',width:'90px',height:'90px',background:'#c8102e',borderRadius:'6px',color:'#fff',fontFamily:F.min,fontSize:'52px',display:'flex',alignItems:'center',justifyContent:'center',writingMode:'horizontal-tb'},col,'印');
  H.a(st,[{transform:'scale(1.6)',opacity:0},{transform:'scale(1)',opacity:1}],{d:200,dl:(n-1)*450+850,e:E.in});
  H.a(B,[{opacity:1},{opacity:0}],{d:500,dl:4200,f:'forwards'});
}});

def({no:'44',cat:'TEXTURE',name:'ヒート',en:'Heat & Embers',lead:'文字が熱を帯びて揺らめき、火の粉が舞い上がる。',
text:'激アツ',loop:4000,bg:'#120804',
use:'<b>熱い・情熱・激辛・ゲームの熱戦</b>に。「激アツ展開」「本気の勝負」など、テンションを上げたい場面に。',
tips:['光の層を毎フレーム少しずつ揺らすと、炎のゆらめきになります','火の粉は左右にふらつかせながら上昇させるとリアル','文字色を白に近い黄色にすると「高温」に見えます'],
p:`「{T}」の文字が炎の熱を帯びて揺らめき、まわりから火の粉が舞い上がる演出を作ってください。
・背景：#120804、画面下から上へ #3A1206 → 透明 のグラデーションで熱気を表現
・文字：Dela Gothic One、画面幅の約60%、色 #FFF2D0
・炎の光：text-shadow を4層（黄 #FFD34D、橙 #FF8A1F、赤 #FF3D00、暗赤 #8A1200）、上方向へ伸ばす。各層の y方向のずれ（−4〜−40px）とぼかし（10〜60px）を、毎フレーム ±20% の範囲でランダムに揺らす
・陽炎：文字に SVGフィルター（feTurbulence＋feDisplacementMap scale 8）をかけ、ノイズを毎フレーム上へずらして揺らめかせる
・火の粉：Canvasで60個。画面下から上へ毎秒 80〜200px で上昇、左右に sin 波でふらつき、上るほど小さく暗くなって消えたら下から再出現。色 #FFB347、直径2〜5px、光（shadowBlur 12）
・尺：4秒でループ（火の粉は途切れず続く）`,
run(H,t){H.abs({inset:'0',background:'linear-gradient(0deg,#3a1206,rgba(58,18,6,0) 70%)'});
  const c=H.canvas();const x=c.getContext('2d');const P=[...Array(60)].map(()=>({x:rnd(0,1600),y:rnd(0,900),v:rnd(80,200),r:rnd(2,5),p:rnd(0,6)}));let last=0;
  const svg=H.svg(1,1,null,{position:'absolute'});const id='ht'+Math.floor(Math.random()*1e6);const f=H.sv('filter',{id},H.sv('defs',{},svg));const tb=H.sv('feTurbulence',{type:'fractalNoise',baseFrequency:'0.02 0.06',numOctaves:2,seed:3},f);H.sv('feDisplacementMap',{in:'SourceGraphic',scale:8},f);
  const B=H.box();const el=BIG(H,t,{color:'#fff2d0',fontSize:fs(t,240,1000)+'px',filter:`url(#${id})`},B);
  H.raf(s=>{const dt=Math.min(.05,s-last);last=s;const j=()=>rnd(.8,1.2);el.style.textShadow=`0 ${-4*j()}px ${10*j()}px #ffd34d,0 ${-12*j()}px ${24*j()}px #ff8a1f,0 ${-24*j()}px ${40*j()}px #ff3d00,0 ${-40*j()}px ${60*j()}px #8a1200`;
    tb.setAttribute('seed',Math.floor(s*12)%50);
    x.clearRect(0,0,1600,900);P.forEach(p=>{p.y-=p.v*dt;if(p.y<-10){p.y=910;p.x=rnd(0,1600)}const k=p.y/900;x.globalAlpha=Math.max(0,k);x.fillStyle='#ffb347';x.shadowColor='#ff8a1f';x.shadowBlur=12;x.beginPath();x.arc(p.x+Math.sin(s*2+p.p)*20,p.y,p.r*(.4+k*.6),0,7);x.fill()})});
}});

def({no:'45',cat:'TEXTURE',name:'クロームシャイン',en:'Chrome Shine',lead:'鏡面仕上げの金属文字に、光がキラッと走る。',
text:'PREMIUM',loop:3600,bg:'#08080b',
use:'<b>高級感・プレミアム・限定</b>の表現に。商品のお披露目、会員限定のお知らせ、Y2K・平成レトロなデザインにも。',
tips:['金属のグラデーションは「明→暗→明→暗」と細かく反射を入れるのがコツ','光の帯を斜め（110°）にすると、キラッとした反射に見えます','金色にしたいときは、灰色の部分を #F7E7A1 → #B8860B に置き換え'],
p:`鏡面のクローム（金属）でできた「{T}」の文字に、光の反射がキラッと横切る演出を作ってください。
・背景：#08080B。床に反射させるため、文字の真下に上下反転したコピー（不透明度0.25、下へ行くほど透明になるマスク）を置く
・文字：Dela Gothic One、画面幅の約70%
・金属の質感：文字の塗りを linear-gradient(180deg, #FFFFFF 0%, #C9CED6 30%, #6B7280 48%, #F3F4F6 52%, #9CA3AF 75%, #E5E7EB 100%) にし、background-clip: text で文字だけに適用
・光の反射：文字の上に、透明 → rgba(255,255,255,.95) → 透明 の帯（幅18%、角度110°）を同じく background-clip: text で重ね、background-position を左外から右外へ0.9秒で動かす
・登場：0.0〜0.8秒、文字を perspective(900px) rotateX(70°)・不透明度0 → rotateX(0) に起こす（イージング cubic-bezier(.16,1,.3,1)）
・1.0秒と2.4秒に、光の反射を走らせる
・尺：3.6秒でループ`,
run(H,t){const B=H.box({flexDirection:'column'});const sz=fs(t,240,1200);const metal='linear-gradient(180deg,#fff 0%,#c9ced6 30%,#6b7280 48%,#f3f4f6 52%,#9ca3af 75%,#e5e7eb 100%)';
  const mk=(css)=>{const w=H.el('div',Object.assign({position:'relative'},css),B);const a=BIG(H,t,{fontSize:sz+'px',backgroundImage:metal,WebkitBackgroundClip:'text',backgroundClip:'text',color:'transparent'},w);
    const s=BIG(H,t,{position:'absolute',left:'0',top:'0',fontSize:sz+'px',backgroundImage:'linear-gradient(110deg,transparent 41%,rgba(255,255,255,.95) 50%,transparent 59%)',backgroundSize:'250% 100%',backgroundRepeat:'no-repeat',WebkitBackgroundClip:'text',backgroundClip:'text',color:'transparent'},w);return [w,s]};
  const [top,sh]=mk({});const [ref,sh2]=mk({transform:'scaleY(-1)',opacity:.25,WebkitMaskImage:'linear-gradient(transparent 40%,#000)',maskImage:'linear-gradient(transparent 40%,#000)',marginTop:'-10px'});
  H.a(top,[{transform:'perspective(900px) rotateX(70deg)',opacity:0},{transform:'perspective(900px) rotateX(0)',opacity:1}],{d:800});H.a(ref,[{opacity:0},{opacity:.25}],{d:800});
  [1000,2400].forEach(dl=>[sh,sh2].forEach(e=>H.a(e,[{backgroundPosition:'150% 0'},{backgroundPosition:'-50% 0'}],{d:900,dl,e:E.soft,f:'none'})));
  [sh,sh2].forEach(e=>e.style.backgroundPosition='150% 0');
}});

def({no:'46',cat:'TEXTURE',name:'ホログラム',en:'Hologram',lead:'虹色に揺らぐ半透明の文字。ちらつく走査線で未来感。',
text:'NEXT ERA',loop:4000,bg:'#05070f',
use:'<b>未来・テクノロジー・SF・メタバース</b>系に。新サービス発表、AI関連の動画、近未来的なブランドに。',
tips:['虹色はパステル寄り（彩度を下げる）にすると上品なホログラムに','時々0.05秒だけ消える「ちらつき」を入れると投影っぽさが増します','下に光の台座（楕円の光）を置くと「投影されている」感が出ます'],
p:`空中に投影されたホログラムのような、虹色に揺らぐ半透明の文字「{T}」を作ってください。
・背景：#05070F。文字の真下に、#7DF9FF の楕円の光（幅900px×高さ60px、ぼかし30px、不透明度0.5）の台座
・文字：Dela Gothic One、画面幅の約60%
・虹色：文字の塗りに linear-gradient(100deg, #FF9FF3, #A0E7FF, #B9FBC0, #FDFFB6, #FF9FF3) を background-size 300% で指定し、background-clip: text。background-position を4秒で端から端へ動かして虹色を流す
・半透明：文字全体の不透明度0.85、mix-blend-mode: screen。0 0 30px rgba(125,249,255,.6) の光
・走査線：文字にだけ横線（2px間隔）のマスクをかけ、マスクを毎秒60pxで下へ流す
・ちらつき：0.8〜2秒の不規則な間隔で、0.05秒だけ不透明度0.3・x方向に 6px ずらす
・全体をゆっくり上下に浮遊（translateY 0 → −12px → 0、4秒）
・尺：4秒でループ`,
run(H,t){H.abs({left:'350px',top:'640px',width:'900px',height:'60px',borderRadius:'50%',background:'#7df9ff',filter:'blur(30px)',opacity:.5});
  const B=H.box();const sz=fs(t,240,1000);const el=BIG(H,t,{fontSize:sz+'px',backgroundImage:'linear-gradient(100deg,#ff9ff3,#a0e7ff,#b9fbc0,#fdffb6,#ff9ff3)',backgroundSize:'300% 100%',WebkitBackgroundClip:'text',backgroundClip:'text',color:'transparent',opacity:.85,filter:'drop-shadow(0 0 30px rgba(125,249,255,.6))',
    WebkitMaskImage:'repeating-linear-gradient(#000 0 2px,rgba(0,0,0,.35) 2px 4px)',maskImage:'repeating-linear-gradient(#000 0 2px,rgba(0,0,0,.35) 2px 4px)',WebkitMaskSize:'100% 4px',maskSize:'100% 4px'},B);
  H.a(el,[{backgroundPosition:'0% 0'},{backgroundPosition:'100% 0'}],{d:4000,e:E.lin,i:Infinity});
  H.a(B,[{transform:'translateY(0)'},{transform:'translateY(-12px)'},{transform:'translateY(0)'}],{d:4000,e:'ease-in-out',i:Infinity});
  let next=800,off=0;H.raf(s=>{const ms=s*1000;el.style.webkitMaskPosition=el.style.maskPosition=`0 ${(s*60)%4}px`;if(ms>next){off=ms+50;next=ms+rnd(800,2000)}
    if(ms<off){el.style.opacity=.3;el.style.translate='6px 0'}else{el.style.opacity=.85;el.style.translate='0 0'}});
}});

def({no:'47',cat:'TEXTURE',name:'LEDサイネージ',en:'LED Dot Matrix',lead:'電光掲示板のドット1粒1粒が光り、文字が流れていく。',
text:'本日のおすすめ 唐揚げ定食 680円',loop:8000,bg:'#050505',
use:'<b>お店の告知・メニュー・案内表示</b>に。商店街・駅・工場などの「現場感」を出したいとき、レトロゲーム風の演出にも。',
tips:['ドットの間隔（15px）を広げるとレトロに、詰めるとくっきり見えます','消えているドットも薄く見せるのが「本物の掲示板」らしさのポイント','色をオレンジから緑（#39FF14）に変えると古い計器や駅の雰囲気に'],
p:`電光掲示板のように、丸いLEDのドットで描かれた「{T}」が右から左へ流れていく演出を作ってください。
・背景：#050505。掲示板の枠：幅1500px×高さ300px、#111、角丸18px、内側の影
・LEDの仕組み：Canvasを使う。まず見えないキャンバスに「{T}」を DotGothic16 の16pxで描き、その1ピクセルを1つのLEDとして扱う（縦16ドット）
・LEDの描画：ドットの間隔15px、直径11pxの円。点灯ドットは #FFB43A に光（shadowBlur 10、#FF8A00）、消灯ドットは #2A1E10
・流れ：文字列を1秒に24ドットずつ左へスクロールさせ、右端から入って左端へ抜けたら、また右端から流す
・枠の左上に小さく「INFORMATION」（JetBrains Mono、#FFB43A、不透明度0.6）
・尺：8秒でループ（スクロールは途切れず続く）`,
run(H,t){const fr=H.abs({left:'50px',top:'300px',width:'1500px',height:'300px',background:'#111',borderRadius:'18px',boxShadow:'inset 0 0 40px #000'});H.abs({left:'70px',top:'250px',fontFamily:F.mono,fontSize:'26px',color:'#ffb43a',opacity:.6,letterSpacing:'.2em'},null,'INFORMATION');
  const c=H.el('canvas',{position:'absolute',left:'50px',top:'300px',width:'1500px',height:'300px'});c.width=1500;c.height=300;const x=c.getContext('2d');
  const off=document.createElement('canvas');const ox=off.getContext('2d');ox.font="16px 'DotGothic16'";const tw=Math.ceil(ox.measureText(t).width)+4;off.width=tw;off.height=16;ox.font="16px 'DotGothic16'";ox.fillStyle='#fff';ox.textBaseline='top';ox.fillText(t,0,0);
  const d=ox.getImageData(0,0,tw,16).data;const cols=98,rows=16,P=15,x0=(1500-cols*P)/2+P/2,y0=(300-rows*P)/2+P/2;
  H.raf(s=>{const sc=Math.floor(s*24)%(tw+cols);x.clearRect(0,0,1500,300);for(let cc=0;cc<cols;cc++){const sx=cc-cols+sc;for(let r=0;r<rows;r++){const on=sx>=0&&sx<tw&&d[(r*tw+sx)*4+3]>110;
    x.fillStyle=on?'#ffb43a':'#2a1e10';x.shadowBlur=on?10:0;x.shadowColor='#ff8a00';x.beginPath();x.arc(x0+cc*P,y0+r*P,5.5,0,7);x.fill()}}});
}});

def({no:'48',cat:'TEXTURE',name:'パーティクル集合',en:'Particle Assemble',lead:'散らばった光の粒が集まって文字になり、また弾けて散る。',
text:'START',loop:4400,bg:'#08060c',
use:'<b>オープニング・ロゴ出し・魔法・誕生</b>の瞬間に。新チャンネルの第1回、新商品の誕生、「はじまり」を表現したいときに。',
tips:['粒の数は2000〜3000個がきれい。多すぎると重くなるので注意','集まるときに少し回転（渦）させると、魔法のような軌跡になります','マウスを近づけると粒が逃げるインタラクションを足すと、Webでも映えます'],
p:`画面中に散らばった光の粒が渦を巻きながら集まって「{T}」の形になり、しばらくして弾けて散る演出を作ってください。
・背景：#08060C。Canvasで描く
・粒の目標位置：見えないキャンバスに「{T}」を Dela Gothic One で画面幅の75%の大きさに描き、5pxおきに文字の上にあるピクセルを取り出して、それぞれを粒の目標位置にする
・粒：3.4px角、色は #FF7AC6 と白をランダムに混ぜ、lighter（加算）合成で光らせる
・0.0〜1.6秒：粒がランダムな位置から目標位置へ移動。イージング cubic-bezier(.16,1,.3,1)。移動中は中心まわりに最大90°の渦を描くように回転させる
・1.6〜2.8秒：文字の形で静止し、各粒が ±1px でかすかに震える
・2.8〜3.8秒：粒が中心から外側へ、ランダムな速さで弾け飛んで消える
・尺：4.4秒でループ`,
run(H,t){const c=H.canvas();const x=c.getContext('2d');const sz=fitPx(t,"'Dela Gothic One'",300,1200);const pts=sample(t,"'Dela Gothic One'",sz,5,1600,900);
  const P=pts.map(p=>({tx:p[0],ty:p[1],sx:rnd(0,1600),sy:rnd(0,900),c:Math.random()<.5?'#ff7ac6':'#fff',v:rnd(400,1400),a:Math.atan2(p[1]-450,p[0]-800)+rnd(-.4,.4)}));
  const ease=k=>1-Math.pow(1-k,4);
  H.raf(s=>{x.globalCompositeOperation='source-over';x.fillStyle='#08060c';x.fillRect(0,0,1600,900);x.globalCompositeOperation='lighter';
    P.forEach(p=>{let X,Y,al=1;if(s<1.6){const k=ease(s/1.6);const rot=(1-k)*Math.PI/2;const ix=p.sx+(p.tx-p.sx)*k-800,iy=p.sy+(p.ty-p.sy)*k-450;X=800+ix*Math.cos(rot)-iy*Math.sin(rot);Y=450+ix*Math.sin(rot)+iy*Math.cos(rot)}
      else if(s<2.8){X=p.tx+rnd(-1,1);Y=p.ty+rnd(-1,1)}else{const k=s-2.8;X=p.tx+Math.cos(p.a)*p.v*k;Y=p.ty+Math.sin(p.a)*p.v*k;al=Math.max(0,1-k)}
      x.globalAlpha=al;x.fillStyle=p.c;x.fillRect(X,Y,3.4,3.4)})});
}});

def({no:'49',cat:'TEXTURE',name:'風化',en:'Sand Dissolve',lead:'文字が右端から砂になって、さらさらと風に飛ばされる。',
text:'さよなら',loop:4600,bg:'#0b0a0d',
use:'<b>別れ・消失・儚さ・終わり</b>の表現に。エンディング、「〇〇は卒業します」、黒歴史を消す…などのネタにも。',
tips:['崩れ始めを文字の端からずらすのが「風化」らしさのポイント','粒を上方向にも少し流すと、灰が舞い上がるような質感に','崩れた後に同じ場所へ次の言葉を出すと、きれいな場面転換に'],
p:`中央の「{T}」が、右端から順に細かい砂粒になって、風に吹かれてさらさらと崩れ去る演出を作ってください。
・背景：#0B0A0D。Canvasで描く
・文字：Dela Gothic One、画面幅の約70%、色 #F2EDE4。見えないキャンバスに描き、3pxおきのピクセルを1粒（3px角の四角）として取り出す
・0.0〜0.4秒：全体をフェードイン
・1.2秒から崩壊：各粒の崩れ始める時刻を「1.2秒 ＋ (右端からの距離 ÷ 文字幅) × 1.4秒 ＋ 0〜0.25秒のランダム」にする（右から左へ崩れる）
・崩れた粒の動き：右上へ風に流される。x方向 毎秒 120〜360px、y方向 毎秒 −40〜−140px、さらに sin 波で小さく揺れる。1.2秒かけて不透明度0へ。色は #F2EDE4 → #C9A27A（砂色）に変化
・尺：4.6秒でループ`,
run(H,t){const c=H.canvas();const x=c.getContext('2d');const sz=fitPx(t,"'Dela Gothic One'",280,1150);const pts=sample(t,"'Dela Gothic One'",sz,3,1600,900);
  let minX=1600,maxX=0;pts.forEach(p=>{minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0])});const Wd=Math.max(1,maxX-minX);
  const P=pts.map(p=>({x:p[0],y:p[1],t0:1.2+(maxX-p[0])/Wd*1.4+rnd(0,.25),vx:rnd(120,360),vy:rnd(-140,-40),ph:rnd(0,6)}));
  H.raf(s=>{x.clearRect(0,0,1600,900);const fade=Math.min(1,s/.4);x.fillStyle='#f2ede4';x.globalAlpha=fade;
    P.forEach(p=>{if(s<p.t0){x.fillRect(p.x,p.y,3,3)}});
    x.fillStyle='#c9a27a';P.forEach(p=>{const k=s-p.t0;if(k>=0&&k<1.2){x.globalAlpha=1-k/1.2;x.fillRect(p.x+p.vx*k,p.y+p.vy*k+Math.sin(k*8+p.ph)*6,2.5,2.5)}})});
}});

def({no:'50',cat:'TEXTURE',name:'ブラウン管',en:'CRT Power',lead:'ブツッと点く古いテレビ。走査線と色にじみ、そしてプツン。',
text:'昭和レトロ',loop:4400,bg:'#000',
use:'<b>レトロ・懐かし・昭和/平成</b>の演出に。「あの頃」を振り返る動画、古いゲーム・アニメの話題、場面の開始と終了に。',
tips:['点灯は「横線→縦に開く」、消灯は「縦に潰れる→点になる」の順が本物らしい','赤と青の色にじみを1〜2pxずらすだけで、ブラウン管の質感になります','画面の四隅を暗くする（ビネット）と、テレビの丸みが出ます'],
p:`古いブラウン管テレビの電源が入って「{T}」が映り、最後にプツンと消える演出を作ってください。
・背景：#000。テレビ画面：幅1400px×高さ800px、角丸40px、背景 #11161A
・画面の中身：「{T}」（Dela Gothic One、白、画面幅の60%）。赤 #FF0040 と青 #00E5FF のコピーを左右に2pxずらして重ね（mix-blend-mode: screen）、色にじみを出す
・画面の質感：走査線（横線3px間隔・不透明度0.3）、四隅を暗くするビネット（radial-gradient）、0.1秒ごとにわずかに明るさが変わるちらつき（brightness 0.92〜1.05）
・点灯（0.0〜0.6秒）：画面を scaleX 0・scaleY 0.006 → scaleX 1（0.2秒、白い横線が広がる）→ scaleY 1（0.25秒、縦に開く）。開く瞬間に brightness 3 → 1 で白く光る
・映っている間：文字をごく小さく上下に揺らす（±2px）
・消灯（3.4〜3.9秒）：scaleY 1 → 0.006（0.2秒）→ scaleX 0（0.15秒、点になる）→ 中央の白い点が0.15秒で消える
・尺：4.4秒でループ`,
run(H,t){const tv=H.abs({left:'100px',top:'50px',width:'1400px',height:'800px',borderRadius:'40px',background:'#11161a',overflow:'hidden'});
  const B=H.box({},tv);const sz=fs(t,240,840);BIG(H,t,{position:'absolute',color:'#ff0040',fontSize:sz+'px',transform:'translateX(-2px)',mixBlendMode:'screen'},B);BIG(H,t,{position:'absolute',color:'#00e5ff',fontSize:sz+'px',transform:'translateX(2px)',mixBlendMode:'screen'},B);BIG(H,t,{position:'absolute',color:'#fff',fontSize:sz+'px',mixBlendMode:'screen',opacity:.85},B);
  H.a(B,[{transform:'translateY(-2px)'},{transform:'translateY(2px)'}],{d:120,e:E.lin,i:Infinity,dir:'alternate'});
  H.abs({inset:'0',background:'repeating-linear-gradient(rgba(0,0,0,.3) 0 1px,transparent 1px 3px)'},tv);H.abs({inset:'0',background:'radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75))'},tv);
  let k=0;H.raf(s=>{const q=Math.floor(s*10);if(q!==k){k=q;tv.style.filter=s>.6&&s<3.4?`brightness(${rnd(.92,1.05).toFixed(2)})`:''}});

def({no:'52',cat:'PLAY',name:'ドミノ倒し',en:'Domino Fall',lead:'文字のタイルが、パタパタパタと連鎖して倒れていく。',

run(H,t){const B=H.box();const sign=H.el('div',{position:'relative',background:'#fff',border:'8px solid #222',borderRadius:'24px',boxShadow:'0 14px 0 #222',padding:'30px 70px',fontFamily:F.pop,fontSize:fs(t,170,700)+'px',color:'#222',whiteSpace:'nowrap'},B,t);

  H.a(sign,[{transform:'translateY(-900px) scale(1)',offset:0},{transform:'translateY(40px) scale(1.12,.88)',offset:.28},{transform:'translateY(-60px) scale(1)',offset:.44},{transform:'translateY(26px) scale(1.06,.94)',offset:.58},{transform:'translateY(-16px)',offset:.7},{transform:'translateY(8px)',offset:.81},{transform:'translateY(-3px)',offset:.91},{transform:'translateY(0)',offset:1}],{d:1600,e:'ease-in-out'});
  H.a(B,[{transform:'rotate(0)'},{transform:'rotate(-2deg)'},{transform:'rotate(2deg)'},{transform:'rotate(0)'}],{d:1000,dl:1600,e:'ease-in-out',f:'none'});

def({no:'57',cat:'PLAY',name:'らくがき強調',en:'Doodle Marks',lead:'赤ペンでぐるっと囲んで、二重線、ビックリマーク。',
text:'ここテストに出る',loop:4200,bg:'#fbfaf6',
use:'<b>勉強・解説・要点のまとめ</b>に。教育系、ノート風の動画、「ここ大事！」を手書き感で伝えたいときに。',
tips:['丸の線はわざと始点と終点をずらして重ねると、手書きらしくなります','線を描く速さは0.5秒前後が「さっと書いた」感じ','方眼ノートの背景にすると、勉強系の雰囲気が一気に出ます'],
p:`ノートに書いた「{T}」を、赤ペンで手書き風にぐるっと囲み、下に二重線、横にビックリマークを書き足していく演出を作ってください。
・背景：#FBFAF6 に、薄い水色（#DCEBF5）の方眼（40px間隔）
・文字：#222、Zen Kaku Gothic New の太字、画面幅の約55%。0.0〜0.3秒でフェードイン
・赤ペン：色 #E5383B、線幅9px、線端は丸く。すべて SVG のパスを stroke-dasharray / stroke-dashoffset で「描く」
　① 0.5秒〜1.1秒：文字全体を囲む楕円。手書き風に、始点と終点が少し重なってはみ出す形（1周＋20°）。線を少しゆらがせる
　② 1.2秒〜1.5秒：文字の下に横線を1本、1.5〜1.8秒にもう1本（少し短く、少し傾ける）
　③ 1.9秒〜2.2秒：右上にビックリマーク「!!」を2本の線と点で描く
　④ 2.3秒：左上に小さな星 ☆ を描いて、scale 0→1.2→1 で弾ませる
・3.6秒でフェードアウト、尺4.2秒でループ`,
run(H,t){H.abs({inset:'0',backgroundImage:'linear-gradient(#dcebf5 1px,transparent 1px),linear-gradient(90deg,#dcebf5 1px,transparent 1px)',backgroundSize:'40px 40px'});
  const sz=fs(t,170,900);const B=H.box();const el=H.el('div',{fontFamily:"'Zen Kaku Gothic New',sans-serif",fontWeight:'700',fontSize:sz+'px',color:'#222',whiteSpace:'nowrap'},B,t);H.a(el,[{opacity:0},{opacity:1}],{d:300});
  const svg=H.svg(1600,900);const pen={fill:'none',stroke:'#e5383b','stroke-width':9,'stroke-linecap':'round','stroke-linejoin':'round'};
  const draw=(d,dl,dur)=>{const p=H.sv('path',Object.assign({d},pen),svg);const L=p.getTotalLength();p.setAttribute('stroke-dasharray',L);p.setAttribute('stroke-dashoffset',L);H.a(p,[{strokeDashoffset:L},{strokeDashoffset:0}],{d:dur,dl,e:E.soft});return p};
  H.wait(20,()=>{const r=rel(H,el);const cx=r.x+r.w/2,cy=r.y+r.h/2,rx=r.w/2+70,ry=r.h/2+50;let d='';for(let a=0;a<=Math.PI*2+.35;a+=.08){const j=Math.sin(a*5)*6;const x=cx+(rx+j)*Math.cos(a-Math.PI*.9),y=cy+(ry+j)*Math.sin(a-Math.PI*.9);d+=(d?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}
    draw(d,500,600);const y1=r.y+r.h+80;draw(`M ${r.x-10} ${y1} Q ${cx} ${y1+10} ${r.x+r.w+20} ${y1-6}`,1200,300);draw(`M ${r.x+40} ${y1+28} Q ${cx} ${y1+36} ${r.x+r.w-40} ${y1+18}`,1500,300);
    const ex=r.x+r.w+rx-r.w/2+20,ey=r.y-40;draw(`M ${ex} ${ey} L ${ex-8} ${ey+80}`,1900,150);draw(`M ${ex+34} ${ey-4} L ${ex+26} ${ey+76}`,2000,150);draw(`M ${ex-11} ${ey+104} l 1 1`,2100,60);draw(`M ${ex+23} ${ey+100} l 1 1`,2150,60);
    const sx=r.x-rx+r.w/2-10,sy=r.y-50;const st=H.sv('g',{},svg);st.style.transformOrigin=`${sx}px ${sy}px`;let sp='';for(let k=0;k<11;k++){const a=-Math.PI/2+k*Math.PI/5;const rr=k%2?14:34;sp+=(k?'L':'M')+(sx+rr*Math.cos(a)).toFixed(1)+' '+(sy+rr*Math.sin(a)).toFixed(1)}
    H.sv('path',Object.assign({d:sp},pen,{'stroke-width':6}),st);H.a(st,[{transform:'scale(0)'},{transform:'scale(1.2)',offset:.7},{transform:'scale(1)'}],{d:400,dl:2300,e:E.back})});
  H.wait(3600,()=>{[B,svg].forEach(e=>H.a(e,[{opacity:1},{opacity:0}],{d:500,f:'forwards'}))});
}});

def({no:'58',cat:'PLAY',name:'吹き出しポップ',en:'Speech Bubbles',lead:'漫画の吹き出しが、ポン、ポン、ポンと次々に湧き出す。',
text:'え？ マジで！？ 神すぎる',multi:true,loop:4200,bg:'#ffd6e8',
use:'<b>リアクション・口コミ・みんなの声</b>に。商品レビューの感想、コメント紹介、ツッコミ・ボケのテロップに。',
tips:['吹き出しの角度を±8°でバラすと、ワイワイしたにぎやかさが出ます','最後の吹き出しだけトゲトゲ（叫び）の形にすると、オチが強調されます','ポップ音（効果音）を1つずつ合わせると楽しさが倍増'],
p:`漫画の吹き出しが画面のあちこちから次々にポンと湧き出し、それぞれにセリフが入る演出を作ってください。
・背景：#FFD6E8 に、白い水玉（直径14px、60px間隔、不透明度0.5）
・セリフ：「{T}」をスペースで区切った語を、1つの吹き出しに1語ずつ
・吹き出し：白い楕円（黒フチ6px #222）＋ 話し手の方向を指す三角のしっぽ。文字は #222、Mochiy Pop One、80〜110px。最後の吹き出しだけ、黄色 #FFE14D のトゲトゲの「叫び」形（clip-path の星形ポリゴン）で、文字を大きく
・配置：左上・右中・中央下…と重なりすぎないようにずらし、角度は −8〜8° でランダム
・出方：0.45秒ごとに1つずつ。scale 0 → 1.15 → 1（0.35秒、cubic-bezier(.34,1.56,.64,1)）。出た瞬間に吹き出しを小さく揺らす
・全部出たら0.5秒後、全吹き出しが同時にぷるっと震える（scale 1→1.05→1）
・3.6秒でフェードアウト、尺4.2秒でループ`,
run(H,t,w){if(!w.length)w=[t];H.abs({inset:'0',backgroundImage:'radial-gradient(rgba(255,255,255,.5) 7px,transparent 8px)',backgroundSize:'60px 60px'});
  const pos=[[330,230,-7],[1180,330,6],[760,640,-3],[420,620,5],[1250,690,-6]];const n=w.length;const items=[];
  w.forEach((s,i)=>{const last=i===n-1&&n>1;const [x,y,r]=pos[i%5];const g=H.abs({left:x+'px',top:y+'px',transform:`translate(-50%,-50%) rotate(${r}deg)`});
    const fz=last?120:fs(s,100,560);let b;
    if(last){b=H.el('div',{background:'#222',clipPath:'polygon(50% 0,60% 18%,78% 6%,76% 28%,98% 24%,86% 44%,100% 60%,80% 66%,88% 88%,66% 80%,56% 100%,46% 82%,26% 96%,26% 74%,4% 78%,14% 58%,0 40%,20% 34%,12% 12%,34% 20%)',padding:'90px 120px'},g);
      H.abs({inset:'8px',background:'#ffe14d',clipPath:'inherit'},b);H.el('div',{position:'relative',fontFamily:F.pop,fontSize:fs(s,120,520)+'px',color:'#222',whiteSpace:'nowrap'},b,s)}
    else{b=H.el('div',{position:'relative',background:'#fff',border:'6px solid #222',borderRadius:'50%',padding:'50px 70px',fontFamily:F.pop,fontSize:fz+'px',color:'#222',whiteSpace:'nowrap'},g,s);
      H.abs({left:'22%',bottom:'-34px',width:'0',height:'0',borderLeft:'18px solid transparent',borderRight:'18px solid transparent',borderTop:'40px solid #222'},b);H.abs({left:'calc(22% + 7px)',bottom:'-22px',width:'0',height:'0',borderLeft:'11px solid transparent',borderRight:'11px solid transparent',borderTop:'26px solid #fff'},b)}
    H.a(b,[{transform:'scale(0)'},{transform:'scale(1.15)',offset:.7},{transform:'scale(1)'}],{d:350,dl:i*450,e:E.back});items.push(b)});
  const all=(n-1)*450+350+500;items.forEach(b=>H.a(b,[{transform:'scale(1)'},{transform:'scale(1.05)'},{transform:'scale(1)'}],{d:300,dl:all,f:'none'}));
  H.wait(3600,()=>items.forEach(b=>H.a(b.parentNode,[{opacity:1},{opacity:0}],{d:500,f:'forwards'})));
}});

def({no:'59',cat:'PLAY',name:'ころころ',en:'Rolling In',lead:'タイヤのように転がってきた文字が、ちょうどの位置で止まる。',
text:'ころがる毎日',loop:3800,bg:'#e9f7e3',
use:'<b>日常・継続・コツコツ</b>の表現に。「毎日続ける」系の企画、ゆるいトーク動画、雑談配信のタイトルに。',
tips:['転がる距離と回転量を合わせる（移動距離÷文字の円周）と、滑らずに転がって見えます','止まる直前に少し揺り戻すと、重さのある物体に見えます','文字ごとに違う色の丸い台紙を付けると、ボールが転がるように'],
p:`「{T}」の各文字が丸い台紙に乗って、タイヤのように左から転がってきて、ちょうどの位置で止まる演出を作ってください。
・背景：#E9F7E3。床の線（#B5D9A6、高さ6px）
・各文字：直径170pxの円の台紙（#FFFFFF、フチ6px #2F5D24）の中央に文字（#2F5D24、Dela Gothic One、100px）
・転がり方：translateX を −1700px → 0、rotate を −720° → 0 に同時に変化（滑らずに転がるよう、回転量 = 移動距離 ÷ 円周 × 360°）。1.4秒、イージング cubic-bezier(.22,1,.36,1)
・文字ごとに0.1秒ずつ遅らせる。左の文字ほど遠くまで転がるよう、移動距離に「文字の位置 × 200px」を足す
・止まる直前に少し揺り戻す：最後に rotate +8° → 0 の揺れを0.3秒
・止まった文字の下に、小さな砂ぼこり（灰緑の丸3つ）をふわっと出す
・3.2秒でフェードアウト、尺3.8秒でループ`,
run(H,t){const B=H.box({flexDirection:'column'});const row=H.el('div',{display:'flex',gap:'16px'},B);const n=[...t].length;const D=Math.min(170,(1450-16*(n-1))/n);H.el('div',{width:'1450px',height:'6px',background:'#b5d9a6',marginTop:'8px'},B);
  [...t].forEach((ch,i)=>{const c=H.el('div',{width:D+'px',height:D+'px',borderRadius:'50%',background:'#fff',border:'6px solid #2f5d24',boxSizing:'border-box',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:F.heavy,fontSize:D*.58+'px',color:'#2f5d24'},row,ch);
    const dist=1700+(n-1-i)*200;const rot=-(dist/(Math.PI*D))*360;
    H.a(c,[{transform:`translateX(${-dist}px) rotate(${rot}deg)`},{transform:'translateX(0) rotate(0deg)',offset:.82},{transform:'translateX(0) rotate(8deg)',offset:.9},{transform:'translateX(0) rotate(0deg)'}],{d:1700,dl:i*100,e:'cubic-bezier(.22,1,.36,1)'});
    H.wait(1500+i*100,()=>{const p=rel(H,c);for(let k=0;k<3;k++){const d=H.abs({left:p.x+p.w/2+(k-1)*30+'px',top:p.y+p.h-10+'px',width:'14px',height:'14px',borderRadius:'50%',background:'#9bbf8d'});H.a(d,[{transform:'translate(0,0) scale(.5)',opacity:.9},{transform:`translate(${(k-1)*30}px,-30px) scale(1.2)`,opacity:0}],{d:600})}})});
  H.a(B,[{opacity:1},{opacity:0}],{d:500,dl:3200,f:'forwards'});
}});

def({no:'60',cat:'PLAY',name:'カラオケ字幕',en:'Karaoke Lyric',lead:'歌詞の色が左から塗り替わり、ボールが文字の上を跳ねる。',
text:'君と見た夏の空 いつまでも忘れない',multi:true,loop:7000,bg:'#1b1033',
use:'<b>歌ってみた・歌詞動画・名言の読み上げ</b>に。読み上げに合わせて色が変わるので、ナレーションの字幕にも使えます。',
tips:['塗り替えの速さを、読み上げや歌の速さ（1文字0.18秒前後）に合わせるのが基本','跳ねるボールは文字1つにつき1回弾ませると、リズムが分かりやすい','2行目は1行目が終わってから塗り始めると、カラオケらしくなります'],
p:`カラオケの字幕のように、歌詞の文字色が左から順に塗り替わり、その上を小さなボールが跳ねていく演出を作ってください。
・背景：#1B1033（夜の紫）。下から #3B1F6E のグラデーション
・歌詞：「{T}」をスペースで区切り、1行目・2行目として2行に表示（2行目は右寄せで少し下げる）。Noto Sans JP 900、96px、文字色は白、黒の太フチ（6px）
・塗り替え：同じ文字のコピーを重ね、色 #FF7AC6（フチは白）にして、clip-path: inset(0 100% 0 0) → inset(0 0 0 0) で左から塗る。速さは1文字0.18秒の等速。1行目が終わったら2行目を塗る
・ボール：直径26pxの #FFE14D の丸。常に「塗り替えの先端」の真上にいて、文字1つ進むごとに1回、高さ50pxで弾む（|sin| の動き）
・各行は0.3秒前に下から translateY 30px → 0 でフェードイン
・全部塗り終わったら1秒止めて、0.5秒でフェードアウト
・尺：7秒でループ`,
run(H,t,w){const l1=w[0]||t,l2=w[1]||'';const B=H.abs({left:'0',right:'0',top:'0',bottom:'0',background:'linear-gradient(transparent 40%,#3b1f6e)'});
  const box=H.abs({left:'150px',right:'150px',top:'470px',display:'flex',flexDirection:'column',gap:'40px'});const CH=0.18;
  const mkLine=(s,align)=>{const wr=H.el('div',{position:'relative',alignSelf:align,fontFamily:F.sans,fontWeight:'900',fontSize:fs(s,96,1300)+'px',whiteSpace:'nowrap',lineHeight:'1.2'},box);
    H.el('div',{color:'#fff',WebkitTextStroke:'6px #000',paintOrder:'stroke fill'},wr,s);const fill=H.abs({left:'0',top:'0',color:'#ff7ac6',WebkitTextStroke:'6px #fff',paintOrder:'stroke fill',clipPath:'inset(0 100% 0 0)'},wr,s);return{wr,fill,n:[...s].length}};
  const L=[mkLine(l1,'flex-start')];if(l2)L.push(mkLine(l2,'flex-end'));
  const ball=H.abs({left:'0',top:'0',width:'26px',height:'26px',borderRadius:'50%',background:'#ffe14d',boxShadow:'0 0 14px #ffe14d',opacity:0});
  let st=400;L.forEach(l=>{l.st=st;H.a(l.wr,[{transform:'translateY(30px)',opacity:0},{transform:'translateY(0)',opacity:1}],{d:300,dl:Math.max(0,st-300)});H.a(l.fill,[{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'}],{d:l.n*CH*1000,dl:st,e:E.lin});st+=l.n*CH*1000});
  const end=st;H.a(box,[{opacity:1},{opacity:0}],{d:500,dl:end+1000,f:'forwards'});
  H.raf(s=>{const ms=s*1000;const l=L.find(q=>ms>=q.st&&ms<q.st+q.n*CH*1000);if(!l){ball.style.opacity=0;return}const r=rel(H,l.wr);const k=(ms-l.st)/(l.n*CH*1000);const ph=(ms-l.st)/(CH*1000);
    ball.style.opacity=1;ball.style.transform=`translate(${r.x+r.w*k-13}px,${r.y-40-50*Math.abs(Math.sin(ph*Math.PI))}px)`});
}});

/* ===== DESIGN 61-70 ===== */
const BLU='#5aa9ff';

def({no:'61',cat:'DESIGN',name:'マスクリビール',en:'Line Mask Reveal',lead:'見えない枠の下から、行ごとにスッとせり上がる。',
text:'伝わる 動画は 文字で決まる',multi:true,loop:4200,bg:'#f3f6fa',
use:'<b>キャッチコピー・結論・見出し</b>に。最も汎用的な「品のいい」文字出し。企業PR、解説動画のまとめ、どんなジャンルにも馴染みます。',
tips:['イージング cubic-bezier(.16,1,.3,1) が「上質さ」の正体。これだけは変えない','行の遅れは0.12〜0.18秒。速すぎると一塊に、遅すぎると間延びします','最後の行だけ色を変えると、結論が自然に目に入ります'],
p:`複数行のコピーが、行ごとに「見えない枠」の下からスッとせり上がって現れる、上品なマスクリビールを作ってください。
・背景：#F3F6FA。文字：#0F1B2D、Noto Sans JP 900、1行の高さ150px（文字120px）、左揃え。画面の左から200pxの位置
・「{T}」をスペースで区切り、1語＝1行にする。最後の行だけ色 #2B7BE4
・コピーの上に小さな見出しラベル「KEY MESSAGE」（JetBrains Mono、28px、#5AA9FF、文字間0.2em）。左に長さ40pxの線
・仕組み：各行を overflow: hidden の枠に入れ、中の文字を translateY 110% → 0 へ動かす
・出方：0.2秒から、行ごとに0.15秒ずつ遅らせて0.8秒。イージング cubic-bezier(.16,1,.3,1)
・ラベルは最初に、左の線が scaleX 0→1、文字が不透明度0→1
・3.2秒から、同じ順番で translateY 0 → −110% へ0.6秒で抜ける（cubic-bezier(.7,0,.84,0)）
・尺：4.2秒でループ`,
run(H,t,w){if(!w.length)w=[t];const box=H.abs({left:'200px',top:'50%',transform:'translateY(-50%)',display:'flex',flexDirection:'column'});
  const lab=H.el('div',{display:'flex',alignItems:'center',gap:'16px',fontFamily:F.mono,fontSize:'28px',color:BLU,letterSpacing:'.2em',marginBottom:'24px'},box);const ln=H.el('span',{width:'40px',height:'3px',background:BLU,transformOrigin:'0 50%'},lab);const lt=H.el('span',{},lab,'KEY MESSAGE');
  H.a(ln,[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{d:500});H.a(lt,[{opacity:0},{opacity:1}],{d:500,dl:150});
  w.forEach((s,i)=>{const m=H.el('div',{overflow:'hidden',height:'150px'},box);const el=H.el('div',{fontFamily:F.sans,fontWeight:'900',fontSize:fs(s,120,1250)+'px',lineHeight:'150px',color:i===w.length-1?'#2b7be4':'#0f1b2d',whiteSpace:'nowrap'},m,s);
    H.a(el,[{transform:'translateY(110%)'},{transform:'translateY(0)'}],{d:800,dl:200+i*150});H.a(el,[{transform:'translateY(0)'},{transform:'translateY(-110%)'}],{d:600,dl:3200+i*100,e:E.in,f:'forwards'})});
  H.a(lab,[{opacity:1},{opacity:0}],{d:400,dl:3200,f:'forwards'});
}});

def({no:'62',cat:'DESIGN',name:'蛍光マーカー',en:'Highlighter Sweep',lead:'大事な言葉に、蛍光ペンがシュッと引かれる。',
text:'作業時間が 半分 になる',multi:true,loop:4000,bg:'#ffffff',
use:'<b>解説・ビジネス・教育</b>動画の要点に。文章の中の「ここだけ覚えて」を1語だけ光らせると、記憶に残ります。',
tips:['マーカーは文字の下半分〜2/3だけに引くと、本物の蛍光ペンに見えます','わずかに傾ける（−1.5°）と手で引いた感じになります','強調語だけ少し大きくする（1.1倍）と、マーカーとの相乗効果が出ます'],
p:`文章の中の大事な1語に、蛍光ペンのマーカーがシュッと引かれて強調される演出を作ってください。
・背景：#FFFFFF。文字：#1F2937、Noto Sans JP 900、画面幅いっぱいに1行で
・文章：「{T}」をスペースで区切り、つなげて1行に表示する。2番目の語を「強調語」にする
・0.0〜0.5秒：文章全体を translateY 24px → 0 でフェードイン
・0.8秒：強調語の後ろに、黄色 #FFE14D のマーカー（文字の高さの下60%、角を少し丸く、−1.5°傾ける）を左から右へ scaleX 0→1 で0.45秒（cubic-bezier(.65,0,.35,1)）。マーカーの端は少しかすれさせる（右端を透明にするグラデーション）
・1.3秒：強調語を scale 1 → 1.1、色を #111 に（0.3秒、cubic-bezier(.34,1.56,.64,1)）
・強調語の上に小さく「POINT」のラベル（JetBrains Mono、#5AA9FF）を下からポンと出す
・3.4秒でフェードアウト、尺4秒でループ`,
run(H,t,w){if(w.length<2)w=['',t,''];const B=H.box();const line=H.el('div',{fontFamily:F.sans,fontWeight:'900',fontSize:fs(w.join(''),120,1350)+'px',color:'#1f2937',whiteSpace:'nowrap',display:'flex',alignItems:'baseline'},B);
  H.a(line,[{transform:'translateY(24px)',opacity:0},{transform:'translateY(0)',opacity:1}],{d:500});
  w.forEach((s,i)=>{if(i!==1){H.el('span',{},line,s);return}const k=H.el('span',{position:'relative',display:'inline-block',margin:'0 .1em'},line);
    const mk=H.abs({left:'-.08em',right:'-.08em',bottom:'.02em',height:'60%',background:'linear-gradient(90deg,#ffe14d 92%,rgba(255,225,77,.4))',borderRadius:'.12em',transform:'rotate(-1.5deg) scaleX(0)',transformOrigin:'0 50%'},k);
    const tx=H.el('span',{position:'relative',display:'inline-block'},k,s);const lab=H.abs({left:'50%',top:'-.55em',fontFamily:F.mono,fontWeight:'700',fontSize:'.26em',color:BLU,letterSpacing:'.15em',transform:'translateX(-50%)'},k,'POINT');
    H.a(mk,[{transform:'rotate(-1.5deg) scaleX(0)'},{transform:'rotate(-1.5deg) scaleX(1)'}],{d:450,dl:800,e:'cubic-bezier(.65,0,.35,1)'});
    H.a(tx,[{transform:'scale(1)',color:'#1f2937'},{transform:'scale(1.1)',color:'#111'}],{d:300,dl:1300,e:E.back});
    H.a(lab,[{transform:'translate(-50%,20px)',opacity:0},{transform:'translate(-50%,0)',opacity:1}],{d:300,dl:1400,e:E.back})});
  H.a(B,[{opacity:1},{opacity:0}],{d:500,dl:3400,f:'forwards'});
}});

def({no:'63',cat:'DESIGN',name:'ブロックリビール',en:'Block Reveal',lead:'色の板が走り抜けた跡に、文字が残っている。',
text:'CHAPTER 01 はじめに',multi:true,loop:3800,bg:'#0e1a2b',
use:'<b>章タイトル・目次・セクションの区切り</b>に。長い解説動画の章立てに使うと、視聴者が「今どこか」を見失いません。',
tips:['板が文字を覆いきった瞬間に文字を出すのが、きれいに見える唯一のコツ','2行目の板を別の色にして0.15秒遅らせると、リズムが生まれます','板の動きは「伸びる0.4秒＋縮む0.4秒」が基本'],
p:`色の板が左から伸びて文字の場所を覆い、右へ縮んで抜けると、その跡に文字が現れている「ブロックリビール」を作ってください。
・背景：#0E1A2B。画面左寄せ（左から200px）で2行
・1行目：「{T}」の最初の語（またはスペース区切りの1・2語目）を、JetBrains Mono の太字、60px、#5AA9FF
・2行目：残りの語を、Noto Sans JP 900、170px、白
・各行の板：その行の文字と同じ幅・高さの長方形。1行目は #5AA9FF、2行目は白
・板の動き：①左端を基準に scaleX 0 → 1（0.4秒）②右端を基準に scaleX 1 → 0（0.4秒）。どちらもイージング cubic-bezier(.87,0,.13,1)
・板が完全に覆った瞬間（0.4秒の時点）に、その行の文字を表示する（それまでは不透明度0）
・1行目は0.2秒、2行目は0.35秒から開始
・3.0秒から、同じ板の動きで今度は文字を隠して消す
・尺：3.8秒でループ`,
run(H,t,w){if(!w.length)w=[t];let a,b;if(w.length>=3){a=w.slice(0,2).join(' ');b=w.slice(2).join(' ')}else{a=w.length>1?w[0]:'';b=w[w.length-1]}
  const box=H.abs({left:'200px',top:'50%',transform:'translateY(-50%)',display:'flex',flexDirection:'column',alignItems:'flex-start',gap:'18px'});
  const row=(s,css,col,dl)=>{const r=H.el('div',{position:'relative'},box);const tx=H.el('div',Object.assign({whiteSpace:'nowrap',opacity:0},css),r,s);const bl=H.abs({inset:'0',background:col,transform:'scaleX(0)'},r);
    const sweep=(d0,show)=>{H.a(bl,[{transform:'scaleX(0)',transformOrigin:'0 50%'},{transform:'scaleX(1)',transformOrigin:'0 50%'}],{d:400,dl:d0,e:E.io,f:'none'});H.a(bl,[{transform:'scaleX(1)',transformOrigin:'100% 50%'},{transform:'scaleX(0)',transformOrigin:'100% 50%'}],{d:400,dl:d0+400,e:E.io,f:'none'});H.wait(d0+400,()=>{tx.style.opacity=show?1:0})};
    sweep(dl,1);sweep(3000+dl-200,0)};
  if(a)row(a,{fontFamily:F.mono,fontWeight:'700',fontSize:'60px',color:BLU,letterSpacing:'.08em'},BLU,200);row(b,{fontFamily:F.sans,fontWeight:'900',fontSize:fs(b,170,1250)+'px',color:'#fff',lineHeight:'1.15'},'#fff',350);
}});

def({no:'64',cat:'DESIGN',name:'タイル組み上げ',en:'Tile Assemble',lead:'バラバラのタイルが飛んできて、1枚のタイトルに組み上がる。',
text:'PROJECT',loop:4200,bg:'#0d1b2a',
use:'<b>プロジェクト名・チーム紹介・完成発表</b>に。「みんなで作り上げた」ストーリーや、ロゴ・タイトルの組み上がりに。',
tips:['タイルの数は横6×縦3が見やすい。細かくするほど「パズル」っぽく','飛んでくる順番をランダムにすると、組み上がる瞬間の気持ちよさが増します','最後に光の帯を1回走らせると「完成」の合図になります'],
p:`横長のタイトル「{T}」を、6列×3行のタイルに分割し、バラバラの位置から飛んできたタイルが組み上がって1枚になる演出を作ってください。
・背景：#0D1B2A
・タイトル板：幅1400px×高さ420px、背景 #5AA9FF、文字 #0D1B2A（Dela Gothic One、板に収まる最大サイズ）
・分割：板を6×3＝18枚のタイルに分け、各タイルは overflow: hidden で、中に板全体を「タイルの位置ぶんずらして」置く（並べると1枚の絵になる）
・初期状態：各タイルを、元の位置から x ±900px・y ±500px・translateZ −800px のランダムな位置、rotateX/rotateY ±180°、不透明度0 に置く（親に perspective: 1600px）
・0.2〜1.4秒：各タイルを元の位置へ0.9秒で戻す（cubic-bezier(.16,1,.3,1)）。開始は0〜0.5秒のランダムな遅れ
・組み上がったら（1.6秒）：板の上を白い光の帯（幅15%、角度110°、不透明度0.6）が左から右へ0.6秒で通過
・3.0秒：タイルが逆の動きで、ランダムな方向へ飛び散る（0.7秒、cubic-bezier(.7,0,.84,0)）
・尺：4.2秒でループ`,
run(H,t){const P=H.box({perspective:'1600px'});const W=H.el('div',{position:'relative',width:'1400px',height:'420px',transformStyle:'preserve-3d'},P);const C=6,R=3,tw=1400/C,th=420/R;const sz=fs(t,330,1300);
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const tl=H.abs({left:c*tw+'px',top:r*th+'px',width:tw+'px',height:th+'px',overflow:'hidden'},W);
    H.abs({left:-c*tw+'px',top:-r*th+'px',width:'1400px',height:'420px',background:BLU,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:F.heavy,fontSize:sz+'px',color:'#0d1b2a',whiteSpace:'nowrap'},tl,t);
    const from=`translate3d(${rnd(-900,900)}px,${rnd(-500,500)}px,-800px) rotateX(${rnd(-180,180)}deg) rotateY(${rnd(-180,180)}deg)`;const to=`translate3d(${rnd(-900,900)}px,${rnd(-500,500)}px,-800px) rotateX(${rnd(-180,180)}deg) rotateY(${rnd(-180,180)}deg)`;
    H.a(tl,[{transform:from,opacity:0},{transform:'none',opacity:1}],{d:900,dl:200+rnd(0,500)});H.a(tl,[{transform:'none',opacity:1},{transform:to,opacity:0}],{d:700,dl:3000+rnd(0,200),e:E.in,f:'forwards'})}
  const sh=H.abs({inset:'0',background:'linear-gradient(110deg,transparent 42%,rgba(255,255,255,.6) 50%,transparent 58%)',backgroundSize:'250% 100%',backgroundPosition:'150% 0',pointerEvents:'none'},W);
  H.a(sh,[{backgroundPosition:'150% 0'},{backgroundPosition:'-50% 0'}],{d:600,dl:1600,e:E.soft,f:'none'});
}});

def({no:'65',cat:'DESIGN',name:'スプリットVS',en:'Split Versus',lead:'画面が左右に割れて2つの言葉が対決、中央にVSが落ちる。',
text:'理想 現実',multi:true,loop:4200,bg:'#0b1220',
use:'<b>比較・対決・AとBの違い</b>に。「理想と現実」「初心者とプロ」「iPhone vs Android」など、比べる系の動画の定番。',
tips:['左右の色は「冷たい色×暖かい色」の対比にすると、対立がはっきりします','境界線を斜め（約8°）にすると、ゲームの対戦画面のような勢いが出ます','VSが落ちた瞬間に画面を揺らすと迫力が出ます'],
p:`画面が斜めの境界線で左右に分かれ、2つの言葉が向かい合い、中央に「VS」が落ちてくる対決画面を作ってください。
・背景：#0B1220
・左パネル：#1E3A5F、clip-path: polygon(0 0, 54% 0, 46% 100%, 0 100%)。「{T}」の1語目を白、Dela Gothic One、左パネル中央に
・右パネル：#5AA9FF、clip-path: polygon(54% 0, 100% 0, 100% 100%, 46% 100%)。2語目を #0B1220、Dela Gothic One、右パネル中央に
・0.0〜0.5秒：左パネルは左外から、右パネルは右外からスライドイン（cubic-bezier(.16,1,.3,1)）
・0.5〜0.8秒：各語を scale 1.4・不透明度0 → scale 1 でドンと出す
・0.9秒：中央に「VS」（白、Dela Gothic One、200px、黒フチ10px、−8°傾き）を上から scale 3→1 で落とし、画面を12px・0.3秒揺らす。境界線に沿って白い光の線を走らせる
・3.4秒：左右パネルがそれぞれ外へスライドアウト、VSは scale 0 で消える
・尺：4.2秒でループ`,
run(H,t,w){const a=w[0]||t,b=w[1]||t;const W=H.box();
  const L=H.abs({inset:'0',background:'#1e3a5f',clipPath:'polygon(0 0,54% 0,46% 100%,0 100%)'},W),R=H.abs({inset:'0',background:BLU,clipPath:'polygon(54% 0,100% 0,100% 100%,46% 100%)'},W);
  const la=BIG(H,a,{position:'absolute',left:'0',width:'800px',top:'360px',textAlign:'center',color:'#fff',fontSize:fs(a,180,640)+'px'},L);const rb=BIG(H,b,{position:'absolute',left:'800px',width:'800px',top:'360px',textAlign:'center',color:'#0b1220',fontSize:fs(b,180,640)+'px'},R);
  H.a(L,[{transform:'translateX(-100%)'},{transform:'translateX(0)'}],{d:500});H.a(R,[{transform:'translateX(100%)'},{transform:'translateX(0)'}],{d:500});
  [la,rb].forEach(e=>H.a(e,[{transform:'scale(1.4)',opacity:0},{transform:'scale(1)',opacity:1}],{d:300,dl:500,e:E.in}));
  const ln=H.svg(1600,900,W);const l=H.sv('line',{x1:864,y1:0,x2:736,y2:900,stroke:'#fff','stroke-width':8,'stroke-dasharray':910,'stroke-dashoffset':910},ln);H.a(l,[{strokeDashoffset:910,opacity:1},{strokeDashoffset:0,opacity:1},{strokeDashoffset:0,opacity:0}],{d:500,dl:900});
  const vs=H.abs({left:'0',right:'0',top:'0',bottom:'0',display:'flex',alignItems:'center',justifyContent:'center'},W);const v=H.el('div',{fontFamily:F.heavy,fontSize:'200px',color:'#fff',WebkitTextStroke:'10px #000',paintOrder:'stroke fill',transform:'rotate(-8deg)'},vs,'VS');
  H.a(v,[{transform:'rotate(-8deg) scale(3)',opacity:0},{transform:'rotate(-8deg) scale(1)',opacity:1}],{d:250,dl:900,e:E.in});H.shake(W,1150,12,300);
  H.a(L,[{transform:'translateX(0)'},{transform:'translateX(-100%)'}],{d:500,dl:3400,e:E.in,f:'forwards'});H.a(R,[{transform:'translateX(0)'},{transform:'translateX(100%)'}],{d:500,dl:3400,e:E.in,f:'forwards'});H.a(v,[{transform:'rotate(-8deg) scale(1)'},{transform:'rotate(-8deg) scale(0)'}],{d:300,dl:3400,e:E.in,f:'forwards'});
}});

def({no:'66',cat:'DESIGN',name:'線画から塗り',en:'Stroke to Fill',lead:'輪郭線が描かれ、下から色が満ちていく。',
text:'DESIGN',loop:4200,bg:'#0b1320',
use:'<b>ロゴ出し・ブランド名・作品タイトル</b>に。「描く→完成する」の2段階で、制作・クリエイティブ系の動画と好相性。',
tips:['線を描く時間と、塗りが満ちる時間を同じくらいにするとバランスが良い','塗りの上端を波打たせる（SVGで波形のマスク）と液体が満ちるように','線の色と塗りの色を変えると、版画のような味わいが出ます'],
p:`巨大な「{T}」の輪郭線がペンで描かれるように現れ、その後、下から色が満ちて塗りつぶされる演出を作ってください。
・背景：#0B1320
・文字：SVG の <text>、Dela Gothic One、画面幅の約80%
・線画：塗りなし、線 #5AA9FF・線幅3px。stroke-dasharray を十分長く（例：1600）し、stroke-dashoffset 1600 → 0 で1.4秒かけて描く（cubic-bezier(.65,0,.35,1)）。文字ごとに0.1秒ずつ遅らせると、より手描き感が出る
・塗り：同じ位置に塗りつぶしの文字（#5AA9FF）を重ね、clip-path: inset(100% 0 0 0) → inset(0 0 0 0) で、1.4秒から1.0秒かけて下から満たす（cubic-bezier(.16,1,.3,1)）
・塗りの上端に、白い細い光の線（高さ4px、不透明度0.8）を一緒に上昇させる
・満ち終わったら、文字全体を scale 1 → 1.03 へゆっくり拡大し、文字の下に小さく「— since 2026 —」（JetBrains Mono、#5AA9FF）をフェードイン
・3.6秒でフェードアウト、尺4.2秒でループ`,
run(H,t){const svg=H.svg(1600,900);const sz=fitPx(t,"'Dela Gothic One'",330,1300);const G=H.sv('g',{},svg);G.style.transformOrigin='800px 450px';
  const mk=a=>{const e=H.sv('text',Object.assign({x:800,y:450,'text-anchor':'middle','dominant-baseline':'central','font-family':"Dela Gothic One, sans-serif",'font-size':sz},a),G);e.textContent=t;return e};
  const top=450-sz*.55,bot=450+sz*.55;const cid='cf'+Math.floor(Math.random()*1e6);const cp=H.sv('clipPath',{id:cid},H.sv('defs',{},svg));const cr=H.sv('rect',{x:0,y:bot,width:1600,height:0},cp);
  const o=mk({fill:'none',stroke:BLU,'stroke-width':3,'stroke-dasharray':1600,'stroke-dashoffset':1600});const f=mk({fill:BLU,'clip-path':`url(#${cid})`});
  H.a(o,[{strokeDashoffset:1600},{strokeDashoffset:0}],{d:1400,e:'cubic-bezier(.65,0,.35,1)'});
  H.raf(s=>{const k=Math.max(0,Math.min(1,(s-1.4)/1));const e=1-Math.pow(1-k,4);const h=(bot-top)*e;cr.setAttribute('y',bot-h);cr.setAttribute('height',h)});const ln=H.abs({left:'150px',width:'1300px',height:'4px',background:'#fff',opacity:0,top:bot+'px'});
  H.a(ln,[{top:bot+'px',opacity:.8},{top:top+'px',opacity:.8,offset:.95},{top:top+'px',opacity:0}],{d:1000,dl:1400,f:'none'});
  H.a(G,[{transform:'scale(1)'},{transform:'scale(1.03)'}],{d:1400,dl:2400,e:E.soft,f:'forwards'});
  const cap=H.abs({left:'0',right:'0',top:bot+40+'px',textAlign:'center',fontFamily:F.mono,fontSize:'34px',color:BLU,letterSpacing:'.2em'},null,'— since 2026 —');H.a(cap,[{opacity:0},{opacity:1}],{d:600,dl:2500});
  H.wait(3600,()=>[svg,cap].forEach(e=>H.a(e,[{opacity:1},{opacity:0}],{d:500,f:'forwards'})));
}});

def({no:'67',cat:'DESIGN',name:'雑誌の表紙組み',en:'Editorial Grid',lead:'罫線と大小の文字が、拍に合わせて雑誌の表紙のように組まれる。',
text:'新しい 働き方 特集',multi:true,loop:5200,bg:'#eef1f5',
use:'<b>特集・まとめ・企画もの</b>のタイトルに。「〇〇特集」「2026年版まとめ」など、雑誌のように見せたい解説動画に。',
tips:['文字の大きさに極端な差（ジャンプ率）をつけると、一気に雑誌らしくなります','罫線を先に引いてから文字を置くと「組版している」感が出ます','号数・日付・ページ番号などの小さな情報が、本物っぽさを支えます'],
p:`雑誌の表紙のように、罫線と大小の文字が拍に合わせて次々に組まれていく演出を作ってください。
・背景：#EEF1F5。文字色：#0F1B2D。アクセント：#2B7BE4
・グリッド：画面の上下左右に80pxの余白をとり、上から140pxの位置と下から140pxの位置に横罫線（2px）、左から1/3の位置に縦罫線（2px）
・罫線は0.0〜0.6秒で、横線は左から、縦線は上から scale 0→1 で引く（cubic-bezier(.65,0,.35,1)）
・文字の配置（「{T}」をスペースで区切った語を使う）：
　・上段左：「VOL.26 — 2026 AUTUMN」（JetBrains Mono、28px）
　・右側の大きな領域：1語目を Noto Sans JP 900・130px、2語目を Dela Gothic One・260px（アクセント色）で縦に積む
　・左の細い列：3語目を縦書き（writing-mode: vertical-rl）、Shippori Mincho B1・90px
　・下段：「P.001 / 特別号 / 永久保存版」（JetBrains Mono、24px）を左・中・右に
・拍：0.8秒から0.32秒ごとに1要素ずつ表示。各要素は clip-path: inset(0 100% 0 0) → inset(0) で左から現れる（0.4秒、cubic-bezier(.16,1,.3,1)）
・4.6秒でフェードアウト、尺5.2秒でループ`,
run(H,t,w){const a=w[0]||t,b=w[1]||'',c=w[2]||'';const W=H.abs({inset:'0'});const ink='#0f1b2d',ac='#2b7be4';
  const rule=(css,dl,ori)=>{const r=H.abs(Object.assign({background:ink},css),W);H.a(r,[{transform:ori==='v'?'scaleY(0)':'scaleX(0)'},{transform:'none'}],{d:600,dl,e:'cubic-bezier(.65,0,.35,1)'})};
  rule({left:'80px',right:'80px',top:'140px',height:'2px',transformOrigin:'0 50%'},0);rule({left:'80px',right:'80px',bottom:'140px',height:'2px',transformOrigin:'0 50%'},100);rule({left:'560px',top:'140px',bottom:'140px',width:'2px',transformOrigin:'50% 0'},200,'v');
  const items=[];const it=(css,txt)=>{const e=H.abs(Object.assign({color:ink,whiteSpace:'nowrap'},css),W,txt);items.push(e);return e};
  it({left:'80px',top:'90px',fontFamily:F.mono,fontSize:'28px',letterSpacing:'.12em'},'VOL.26 — 2026 AUTUMN');
  it({left:'620px',top:'190px',fontFamily:F.sans,fontWeight:'900',fontSize:fs(a,130,880)+'px'},a);
  if(b)it({left:'610px',top:'360px',fontFamily:F.heavy,fontSize:fs(b,260,900)+'px',color:ac,lineHeight:'1.1'},b);
  if(c)it({left:'200px',top:'190px',writingMode:'vertical-rl',fontFamily:F.min,fontWeight:'800',fontSize:Math.min(90,520/[...c].length)+'px'},c);
  it({left:'80px',bottom:'90px',fontFamily:F.mono,fontSize:'24px',letterSpacing:'.12em'},'P.001');it({left:'0',right:'0',textAlign:'center',bottom:'90px',fontFamily:F.mono,fontSize:'24px',letterSpacing:'.12em'},'特別号');it({right:'80px',bottom:'90px',fontFamily:F.mono,fontSize:'24px',letterSpacing:'.12em'},'永久保存版');
  items.forEach((e,i)=>H.a(e,[{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'}],{d:400,dl:800+i*320}));
  H.a(W,[{opacity:1},{opacity:0}],{d:500,dl:4600,f:'forwards'});
}});

def({no:'68',cat:'DESIGN',name:'名前テロップ',en:'Lower Third',lead:'画面左下に、名前と肩書きがスマートに出て、スッと消える。',
text:'山田 花子／AIコンサルタント',multi:true,loop:5400,bg:'#2a3442',
use:'<b>インタビュー・登場人物紹介・対談</b>に。人が話す動画には必ず要る実用テロップ。肩書きの代わりにSNSアカウント名を入れても。',
tips:['名前と肩書きは「／」で区切って入力すると、2段に分かれます','色の縦棒を先に出すと、視線が自然にテロップへ向きます','出ている時間は「名前を2回読める」3秒前後が目安'],
p:`インタビュー動画で使う、画面左下の「名前テロップ（ローワーサード）」を作ってください。
・背景：映像の代わりに、#2A3442 にぼかした色の円（#5AA9FF と #FF7AC6、直径600px、ぼかし120px、不透明度0.35）を2つ置き、ゆっくり動かす
・テロップの位置：画面の左から120px、下から140px
・構成：「{T}」を「／」で区切り、前を名前、後ろを肩書きにする
　① 縦の色棒：幅10px×高さ170px、#5AA9FF
　② 名前の帯：白、高さ100px。名前は #0F1B2D、Noto Sans JP 900、64px、左右の余白36px
　③ 肩書きの帯：#0F1B2D、高さ58px。肩書きは白、Noto Sans JP 700、32px、文字間0.06em
・出方：
　0.3秒：色棒が scaleY 0 → 1（下基準、0.3秒）
　0.5秒：名前の帯が左から scaleX 0 → 1（0.45秒、cubic-bezier(.16,1,.3,1)）、0.15秒遅れて名前の文字が translateX −30px → 0 でフェードイン
　0.7秒：肩書きの帯と文字が同様に
・消え方：4.2秒から、帯が右基準で scaleX 1 → 0（肩書き→名前の順、0.35秒、cubic-bezier(.7,0,.84,0)）、最後に色棒が上へ縮んで消える
・尺：5.4秒でループ`,
run(H,t,w){const parts=t.split(/[／\/]/);const name=(parts[0]||t).trim(),role=(parts[1]||'').trim();
  [[300,200,BLU,[200,-80]],[1100,400,'#ff7ac6',[-160,60]]].forEach(([x,y,c,[dx,dy]])=>{const b=H.abs({left:x+'px',top:y+'px',width:'600px',height:'600px',borderRadius:'50%',background:c,filter:'blur(120px)',opacity:.35});H.a(b,[{transform:'translate(0,0)'},{transform:`translate(${dx}px,${dy}px)`}],{d:5400,e:'ease-in-out'})});
  const box=H.abs({left:'120px',bottom:'140px',display:'flex',gap:'0'});const bar=H.el('div',{width:'10px',height:role?'170px':'100px',background:BLU,transformOrigin:'50% 100%'},box);const col=H.el('div',{display:'flex',flexDirection:'column',alignItems:'flex-start',gap:'12px'},box);
  const band=(txt,bg,css,dl)=>{const bd=H.el('div',{background:bg,display:'flex',alignItems:'center',padding:'0 36px',transformOrigin:'0 50%',overflow:'hidden',height:css.h},col);const tx=H.el('div',Object.assign({whiteSpace:'nowrap'},css.s),bd,txt);
    H.a(bd,[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{d:450,dl});H.a(tx,[{transform:'translateX(-30px)',opacity:0},{transform:'translateX(0)',opacity:1}],{d:400,dl:dl+150});return bd};
  H.a(bar,[{transform:'scaleY(0)'},{transform:'scaleY(1)'}],{d:300,dl:300});
  const nb=band(name,'#fff',{h:'100px',s:{color:'#0f1b2d',fontFamily:F.sans,fontWeight:'900',fontSize:'64px'}},500);let rb=null;if(role)rb=band(role,'#0f1b2d',{h:'58px',s:{color:'#fff',fontFamily:F.sans,fontWeight:'700',fontSize:'32px',letterSpacing:'.06em'}},700);
  const out=(el,dl)=>H.a(el,[{transform:'scaleX(1)',transformOrigin:'100% 50%'},{transform:'scaleX(0)',transformOrigin:'100% 50%'}],{d:350,dl,e:E.in,f:'forwards'});
  if(rb)out(rb,4200);out(nb,4350);H.a(bar,[{transform:'scaleY(1)',transformOrigin:'50% 0'},{transform:'scaleY(0)',transformOrigin:'50% 0'}],{d:300,dl:4600,e:E.in,f:'forwards'});
}});

def({no:'69',cat:'DESIGN',name:'データ見出し',en:'Stat Callout',lead:'リングが描かれながら、数字が目標値までカウントアップ。',
text:'87% 満足度',multi:true,loop:4600,bg:'#0d1626',
use:'<b>実績・アンケート結果・達成率</b>に。「満足度87%」「リピート率92%」など、数字で信頼を伝える場面に。',
tips:['リングと数字のカウントを同じイージングにすると、ぴったり連動して見えます','数字は等幅フォントにすると、カウント中に横幅がガタつきません','数字の出典（例：2026年 当社調べ n=300）を小さく添えると信頼感が上がります'],
p:`円形のリングが描かれていくのに合わせて、中央の数字が0から目標値までカウントアップする「データ見出し」を作ってください。
・背景：#0D1626
・入力：「{T}」をスペースで区切り、1語目を数字（%付きでも可）、2語目をラベルにする
・リング：直径520px、線幅30px、線端は丸く。下地の円 #1E2C44、進捗の円 #5AA9FF。12時の位置から時計回りに、目標値（%）まで stroke-dashoffset で描く。1.8秒、cubic-bezier(.16,1,.3,1)、0.3秒から開始
・中央の数字：JetBrains Mono の太字、180px、白。リングと同じ時間・同じイージングで 0 → 目標値 までカウントアップ（整数で表示し、% は少し小さく横に）
・ラベル：数字の下に、#8FB8E8、Noto Sans JP 700、44px
・リングの右側に、補足を3行：「回答者 300名」「2026年10月 調査」「※サンプルの数値です」（JetBrains Mono、26px、#8FB8E8）を、0.15秒ずつ遅らせて左からフェードイン
・描き終わった瞬間、リングの先端に白い光の点（直径30px）をパッと光らせる
・4.0秒でフェードアウト、尺4.6秒でループ`,
run(H,t,w){const num=parseFloat((w[0]||t).replace(/[^\d.]/g,''))||0;const pct=Math.min(100,num);const unit=(w[0]||'').replace(/[\d.,\s]/g,'')||'%';const label=w[1]||'';
  const svg=H.svg(1600,900);const cx=620,cy=450,r=260,C=2*Math.PI*r;H.sv('circle',{cx,cy,r,fill:'none',stroke:'#1e2c44','stroke-width':30},svg);
  const pr=H.sv('circle',{cx,cy,r,fill:'none',stroke:BLU,'stroke-width':30,'stroke-linecap':'round','stroke-dasharray':C,'stroke-dashoffset':C,transform:`rotate(-90 ${cx} ${cy})`},svg);
  H.a(pr,[{strokeDashoffset:C},{strokeDashoffset:C*(1-pct/100)}],{d:1800,dl:300});
  const mid=H.abs({left:cx-260+'px',top:cy-130+'px',width:'520px',textAlign:'center'});const n=H.el('div',{fontFamily:F.mono,fontWeight:'700',fontSize:'180px',color:'#fff',lineHeight:'1',fontVariantNumeric:'tabular-nums'},mid);const nv=H.el('span',{},n,'0');H.el('span',{fontSize:'80px'},n,unit);
  H.el('div',{fontFamily:F.sans,fontWeight:'700',fontSize:'44px',color:'#8fb8e8',marginTop:'10px'},mid,label);
  const notes=H.abs({left:'1000px',top:'340px',display:'flex',flexDirection:'column',gap:'18px',fontFamily:F.mono,fontSize:'26px',color:'#8fb8e8'});['回答者 300名','2026年10月 調査','※サンプルの数値です'].forEach((s,i)=>{const e=H.el('div',{},notes,s);H.a(e,[{transform:'translateX(-30px)',opacity:0},{transform:'translateX(0)',opacity:1}],{d:500,dl:900+i*150})});
  const ease=k=>1-Math.pow(1-k,4);H.raf(s=>{const k=Math.max(0,Math.min(1,(s-.3)/1.8));nv.textContent=Math.round(num*ease(k))});
  const ang=(-90+360*pct/100)*Math.PI/180;const dot=H.abs({left:cx+r*Math.cos(ang)-15+'px',top:cy+r*Math.sin(ang)-15+'px',width:'30px',height:'30px',borderRadius:'50%',background:'#fff',boxShadow:'0 0 30px #fff',opacity:0});H.a(dot,[{opacity:1,transform:'scale(1.6)'},{opacity:0,transform:'scale(.6)'}],{d:600,dl:2100,f:'none'});
  H.wait(4000,()=>[svg,mid,notes].forEach(e=>H.a(e,[{opacity:1},{opacity:0}],{d:500,f:'forwards'})));
}});

def({no:'70',cat:'DESIGN',name:'シネマタイトル',en:'Cinematic Tracking',lead:'広がった文字間が静かに締まり、映画のタイトルが浮かび上がる。',
text:'はじまりの物語',loop:5400,bg:'#05070b',
use:'<b>エンディング・作品タイトル・ドキュメンタリー</b>に。この本の締めくくりにふさわしい、静かで格のある型。動画の最初か最後に1回だけ使うのが効果的です。',
tips:['文字間の締まり（トラッキングイン）は4秒以上かけると「映画」の品格になります','明朝体にすると文学的、ゴシックにするとドキュメンタリー寄りに','効果音は使わず、低いドローン音（持続音）だけを合わせるのがおすすめ'],
p:`映画のオープニングのように、大きく広がった文字間が静かに締まりながら「{T}」が浮かび上がる、品のあるタイトル演出を作ってください。
・背景：#05070B。画面の上下に黒い帯（高さ各110px、シネマスコープ比率の黒帯）
・文字：Shippori Mincho B1（太さ800）、#F2F2F0、画面幅の約55%
・トラッキングイン：letter-spacing を 1.2em → 0.12em へ4.2秒かけて締める（cubic-bezier(.16,1,.3,1)）。同時に filter: blur(18px) → blur(0)、不透明度 0 → 1（最初の1.6秒で）
・文字の左右に、細い線（高さ1px、#F2F2F0、不透明度0.5、長さ160px）を1.2秒から中央から外へ伸ばす
・文字の下に小さく「A FILM BY YOU — 2026」（JetBrains Mono、24px、文字間0.4em、#8A8F98）を1.8秒からフェードイン
・全体をゆっくり scale 1 → 1.04 へ5秒かけてズーム（カメラが寄る）
・4.6秒から0.8秒かけて全体をフェードアウト
・尺：5.4秒でループ`,
run(H,t){H.abs({left:0,right:0,top:0,height:'110px',background:'#000',zIndex:'5'});H.abs({left:0,right:0,bottom:0,height:'110px',background:'#000',zIndex:'5'});
  const B=H.box({flexDirection:'column',gap:'36px'});const row=H.el('div',{display:'flex',alignItems:'center',gap:'40px'},B);
  const lnL=H.el('div',{width:'160px',height:'1px',background:'#f2f2f0',opacity:.5,transformOrigin:'100% 50%'},row);
  const el=H.el('div',{fontFamily:F.min,fontWeight:'800',fontSize:Math.min(150,900/[...t].length)+'px',color:'#f2f2f0',whiteSpace:'nowrap'},row,t);
  const lnR=H.el('div',{width:'160px',height:'1px',background:'#f2f2f0',opacity:.5,transformOrigin:'0 50%'},row);
  const sub=H.el('div',{fontFamily:F.mono,fontSize:'24px',letterSpacing:'.4em',color:'#8a8f98'},B,'A FILM BY YOU — 2026');
  H.a(el,[{letterSpacing:'1.2em'},{letterSpacing:'.12em'}],{d:4200});H.a(el,[{filter:'blur(18px)',opacity:0},{filter:'blur(0px)',opacity:1}],{d:1600,e:E.soft});
  [lnL,lnR].forEach(l=>H.a(l,[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{d:1200,dl:1200}));H.a(sub,[{opacity:0},{opacity:1}],{d:900,dl:1800});
  H.a(B,[{transform:'scale(1)'},{transform:'scale(1.04)'}],{d:5000,e:E.lin});H.a(B,[{opacity:1},{opacity:0}],{d:800,dl:4600,f:'forwards'});
}});

/* ===== TRANSITION 共通 ===== */
CUR_SEC='t';
function scene(H,which,label,parent,css){
  const s=H.abs(Object.assign({left:'0',top:'0',width:'1600px',height:'900px',overflow:'hidden',background:which?'#ff9a3c':'#0f1c2e'},css||{}),parent);
  if(!which){H.abs({inset:'0',backgroundImage:'linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px)',backgroundSize:'80px 80px'},s);
    H.abs({right:'160px',top:'130px',width:'260px',height:'260px',borderRadius:'50%',border:'3px solid rgba(255,255,255,.22)'},s);H.abs({left:'140px',bottom:'120px',width:'420px',height:'6px',background:'rgba(255,255,255,.3)'},s)}
  else{H.abs({left:'-140px',bottom:'-200px',width:'640px',height:'640px',borderRadius:'50%',background:'rgba(255,255,255,.2)'},s);H.abs({right:'130px',top:'110px',width:'180px',height:'180px',background:'rgba(15,28,46,.14)',transform:'rotate(12deg)'},s)}
  H.abs({left:'60px',top:'50px',fontFamily:F.mono,fontSize:'26px',letterSpacing:'.2em',color:which?'#0f1c2e':'#fff',opacity:.7},s,which?'SCENE B':'SCENE A');
  const tt=H.box({},s);H.el('div',{fontFamily:F.heavy,fontSize:fs(label,320,1200)+'px',color:which?'#0f1c2e':'#fff',whiteSpace:'nowrap',lineHeight:'1'},tt,label);
  s._title=tt;return s;
}
function defT(o){const D=o.d,half=700+D+700;o.loop=half*2;o.multi=true;o.bg=o.bg||'#000';o.text=o.text||'A B';
  o.p='シーン名：「{T}」（スペースの前がシーンA、後ろがシーンB）\n'+o.p;
  o.run=(H,t,w)=>{const a=w[0]||'A',b=w[1]||'B';
    const phase=(from,to,fw,tw)=>{const root=H.abs({inset:'0',overflow:'hidden'});const mk=(k,css,parent)=>k?scene(H,tw,to,parent||root,css):scene(H,fw,from,parent||root,css);o.tr(H,root,mk,700,D);return root};
    let r=phase(a,b,0,1);H.wait(half,()=>{r.getAnimations({subtree:true}).forEach(x=>x.cancel());r.remove();r=phase(b,a,1,0)})};
  def(o)}
const hide=(H,el,at)=>H.wait(at,()=>{el.style.display='none'});

/* ===== CUT 01-10 ===== */
defT({no:'01',cat:'CUT',name:'ホイップパン',en:'Whip Pan',lead:'カメラを横に振り抜いたように、ブレながら次の場面へ。',d:500,
use:'<b>Vlog・旅動画・テンポの速い編集</b>の定番。場所が変わるとき、「一方その頃…」の切り替えに。',
tips:['ブラーは40px前後。強くするほどカメラを速く振った感じになります','振る方向を「次の場所がある方向」に合わせると、空間がつながって見えます','効果音「シュッ」を中心の時刻に合わせるのが鉄則'],
p:`カメラを横に勢いよく振ったような「ホイップパン」で、シーンAからシーンBへ切り替えてください。
・時間：0.5秒。イージング cubic-bezier(.87,0,.13,1)（真ん中で一番速い）
・シーンA：translateX 0 → −100%、同時に filter: blur(0) → blur(40px)
・シーンB：translateX +100% → 0、同時に blur(40px) → blur(0)
・AとBは同じ速度で隙間なく並んで動く（つなぎ目に黒い隙間を出さない）
・真ん中の時刻に、横方向の白い残像の線（高さ2〜6px、不透明度0.3、20本）を0.15秒だけ重ねてスピード感を足す`,
tr(H,root,mk,st,D){const B=mk(1),A=mk(0);H.a(A,[{transform:'translateX(0)',filter:'blur(0)'},{transform:'translateX(-1600px)',filter:'blur(40px)'}],{d:D,dl:st,e:E.io});H.a(B,[{transform:'translateX(1600px)',filter:'blur(40px)'},{transform:'translateX(0)',filter:'blur(0)'}],{d:D,dl:st,e:E.io});
  const L=H.abs({inset:'0',pointerEvents:'none'},root);for(let i=0;i<20;i++)H.abs({left:'0',right:'0',top:rnd(0,900)+'px',height:rnd(2,6)+'px',background:'#fff',opacity:.3},L);H.a(L,[{opacity:0},{opacity:1},{opacity:0}],{d:150,dl:st+D/2-75,f:'both'})}});

defT({no:'02',cat:'CUT',name:'ズームバースト',en:'Zoom Burst',lead:'画面へ一気に突っ込み、放射状の光とともに次の場面が弾ける。',d:600,
use:'<b>サビ・盛り上がり・結果発表</b>の直前に。テンションを一段上げたいときの切り替え。',
tips:['放射線（集中線）を一瞬だけ重ねると、突っ込んだ勢いが倍増します','Aを拡大する時間をBの登場より短くすると、キレが出ます','ドラムの「ドン」に中心を合わせると気持ちいい'],
p:`画面の中心へ一気に突っ込むような「ズームバースト」で、シーンAからシーンBへ切り替えてください。
・時間：0.6秒
・0.00〜0.30秒：シーンAを scale 1 → 3、blur 0 → 24px、不透明度 1 → 0（イージング cubic-bezier(.7,0,.84,0)）
・0.25〜0.60秒：シーンBを scale 0.6 → 1、blur 16px → 0、不透明度 0 → 1（イージング cubic-bezier(.16,1,.3,1)）
・0.25秒の瞬間：中心から放射状の白い光（repeating-conic-gradient で白と透明を交互に5°ずつ、中心は透明の円で抜く）を不透明度 0 → 0.8 → 0 で0.3秒、同時に scale 0.8 → 1.6 に広げる`,
tr(H,root,mk,st,D){const B=mk(1),A=mk(0);H.a(A,[{transform:'scale(1)',filter:'blur(0)',opacity:1},{transform:'scale(3)',filter:'blur(24px)',opacity:0}],{d:300,dl:st,e:E.in});
  H.a(B,[{transform:'scale(.6)',filter:'blur(16px)',opacity:0},{transform:'scale(1)',filter:'blur(0)',opacity:1}],{d:350,dl:st+250});
  const R=H.abs({left:'-400px',top:'-700px',width:'2400px',height:'2400px',background:'radial-gradient(circle,transparent 12%,rgba(0,0,0,0) 12%),repeating-conic-gradient(rgba(255,255,255,.9) 0 5deg,transparent 5deg 10deg)',WebkitMaskImage:'radial-gradient(circle,transparent 14%,#000 30%)',maskImage:'radial-gradient(circle,transparent 14%,#000 30%)',opacity:0},root);
  H.a(R,[{opacity:0,transform:'scale(.8)'},{opacity:.8,offset:.4},{opacity:0,transform:'scale(1.6)'}],{d:300,dl:st+250})}});

defT({no:'03',cat:'CUT',name:'スピンズーム',en:'Spin Zoom',lead:'回転しながら吸い込まれ、逆回転で次の場面が出てくる。',d:800,
use:'<b>ゲーム実況・ダンス・ハイテンションなVlog</b>に。「次の日」「場面転換」を派手に見せたいときに。',
tips:['Aは時計回り、Bは反時計回り（逆方向）にするのがポイント','回転角は180°が派手さの上限。上品にするなら90°','ブラーを足すと、回転の速さがなめらかに見えます'],
p:`回転しながら画面の奥へ吸い込まれ、逆回転で次の場面が現れる「スピンズーム」でシーンAからシーンBへ切り替えてください。
・時間：0.8秒
・前半0.4秒：シーンAを rotate 0 → 180°、scale 1 → 4、blur 0 → 20px、不透明度 1 → 0（イージング cubic-bezier(.7,0,.84,0)）
・後半0.4秒：シーンBを rotate −180° → 0、scale 0.2 → 1、blur 20px → 0、不透明度 0 → 1（イージング cubic-bezier(.16,1,.3,1)）
・背景（AとBの後ろ）は黒`,
tr(H,root,mk,st,D){const B=mk(1),A=mk(0);H.a(A,[{transform:'rotate(0) scale(1)',filter:'blur(0)',opacity:1},{transform:'rotate(180deg) scale(4)',filter:'blur(20px)',opacity:0}],{d:D/2,dl:st,e:E.in});
  H.a(B,[{transform:'rotate(-180deg) scale(.2)',filter:'blur(20px)',opacity:0},{transform:'rotate(0) scale(1)',filter:'blur(0)',opacity:1}],{d:D/2,dl:st+D/2})}});

defT({no:'04',cat:'CUT',name:'グリッチジャンプ',en:'Glitch Jump',lead:'映像がバグったように乱れ、ノイズの中で場面が飛ぶ。',d:520,
use:'<b>テック系・ゲーム・ホラー・サイバー</b>な動画に。「異変」「システム起動」の演出や、話題が急に変わる場面に。',
tips:['乱れは0.05秒刻みで不規則に。一定のリズムだと機械的に見えます','乱れの途中で一瞬だけBを見せる（チラ見せ）と期待感が出ます','色ずれは赤と水色の2色が定番'],
p:`映像がバグったように乱れて、ノイズの中で場面が飛ぶ「グリッチジャンプ」でシーンAからシーンBへ切り替えてください。
・時間：約0.5秒（0.055秒ごとに9コマ）
・各コマで、表示するシーンをランダムに選ぶ（前半はAが多め、後半はBが多め、最後のコマは必ずB）
・各コマで、表示中のシーンに次の乱れをランダムにかける
　・横方向に −80〜80px ずらす
　・clip-path: inset() で高さ10〜40%の横帯だけを残す
　・filter: hue-rotate(0〜180deg) と、drop-shadow で赤 #FF0040 と水色 #00E5FF の色ずれ（±12px）
・最後のコマで乱れをすべて解除し、Bをぴたっと表示する`,
tr(H,root,mk,st,D){const B=mk(1),A=mk(0);B.style.visibility='hidden';
  for(let k=0;k<=9;k++)H.wait(st+k*55,()=>{const last=k===9;const showB=last||Math.random()<k/9;A.style.visibility=showB?'hidden':'visible';B.style.visibility=showB?'visible':'hidden';const el=showB?B:A;
    if(last){B.style.transform='none';B.style.clipPath='none';B.style.filter='none';return}
    const top=rnd(0,70);el.style.transform=`translateX(${rnd(-80,80)}px)`;el.style.clipPath=Math.random()<.6?`inset(${top}% 0 ${Math.max(0,100-top-rnd(10,40))}% 0)`:'none';const o=rnd(-12,12);el.style.filter=`hue-rotate(${rnd(0,180)}deg) drop-shadow(${o}px 0 0 #ff0040) drop-shadow(${-o}px 0 0 #00e5ff)`})}});

defT({no:'05',cat:'CUT',name:'フラッシュカット',en:'Flash Cut',lead:'カメラのフラッシュのように白く光った瞬間、場面が変わる。',d:420,
use:'<b>決定的瞬間・写真・記念撮影</b>のシーンに。「パシャッ」という効果音と合わせると定番の気持ちよさ。',
tips:['白の上がりは速く（0.12秒）、下がりはゆっくり（0.3秒）が自然','白の代わりに淡い黄色にすると、暖かい思い出の雰囲気に','連続写真のように3回くり返すのもアリ'],
p:`カメラのフラッシュのように白く光った瞬間に場面が変わる「フラッシュカット」でシーンAからシーンBへ切り替えてください。
・時間：約0.42秒
・白い全面レイヤー（#FFFFFF）を、0.12秒で不透明度 0 → 1（イージング cubic-bezier(.7,0,.84,0)）
・真っ白になった瞬間にAを非表示にしてBを表示（Bは scale 1.06 → 1 へ0.4秒でわずかに引く）
・白を0.3秒で不透明度 1 → 0 に戻す（イージング cubic-bezier(.16,1,.3,1)）`,
tr(H,root,mk,st,D){const B=mk(1),A=mk(0);const W=H.abs({inset:'0',background:'#fff',opacity:0},root);
  H.a(W,[{opacity:0},{opacity:1,offset:.29},{opacity:0}],{d:D,dl:st,e:E.lin});hide(H,A,st+120);H.a(B,[{transform:'scale(1.06)'},{transform:'scale(1)'}],{d:400,dl:st+120})}});

defT({no:'06',cat:'CUT',name:'シェイクカット',en:'Shake Cut',lead:'画面が激しく揺れて、揺れの最中に場面がすり替わる。',d:450,
use:'<b>衝撃・地震・ツッコミ・ドッキリ</b>のリアクションに。お笑い系、ゲーム実況の「やられた！」シーンに。',
tips:['揺れ幅は最初が大きく、だんだん小さくするのがリアル','揺れと同時に少しズーム（1.1倍）すると、揺れで画面端が見えません','切り替えは揺れの一番大きい瞬間に'],
p:`画面が激しく揺れ、その最中に場面がすり替わる「シェイクカット」でシーンAからシーンBへ切り替えてください。
・時間：0.45秒
・画面全体（AとBを入れた親）を scale 1.1 に拡大した状態で、0.05秒ごとにランダムに揺らす。揺れ幅は最初 ±50px・回転 ±3°、最後は 0 に向かって小さくする
・揺れの2コマ目（0.1秒）でAを非表示にしてBを表示
・揺れが終わったら scale 1 に戻す`,
tr(H,root,mk,st,D){const W=H.abs({inset:'0'},root);const B=mk(1,{},W),A=mk(0,{},W);const k=[];for(let i=0;i<9;i++){const a=(1-i/9)*50;k.push({transform:`scale(1.1) translate(${rnd(-a,a)}px,${rnd(-a,a)}px) rotate(${rnd(-3,3)*(1-i/9)}deg)`})}k.push({transform:'scale(1)'});
  H.a(W,k,{d:D,dl:st,e:E.lin,f:'none'});hide(H,A,st+100)}});

defT({no:'07',cat:'CUT',name:'キューブ回転',en:'Cube Rotate',lead:'立方体の面が回るように、立体的に次の場面へ。',d:900,
use:'<b>章立て・ステップ紹介・比較</b>に。「次のポイントは…」のように、同じ流れの中で区切りたいときに。',
tips:['奥行き（translateZ）は画面幅の半分にすると、正確な立方体になります','回転の途中で少し縮める（scale 0.85）と、立方体の全体が見えて立体感が増します','縦方向（rotateX）にすると、エレベーターのような印象に'],
p:`立方体が回るように、シーンAの面からシーンBの面へ立体的に切り替える「キューブ回転」を作ってください。
・時間：0.9秒。イージング cubic-bezier(.65,0,.35,1)
・CSS 3D：親に perspective: 2000px。立方体のグループに transform-style: preserve-3d
・シーンAは translateZ(画面幅の半分)、シーンBは rotateY(90°) translateZ(画面幅の半分) に配置し、立方体の隣り合った面にする
・立方体全体を translateZ(−画面幅の半分) rotateY(0) → rotateY(−90°) へ回転させる。回転の中盤（50%）だけ全体を scale 0.85 に縮める
・背景は黒。各面に、回転に合わせて暗くなる影（黒の不透明度 0 → 0.5）を重ねる`,
tr(H,root,mk,st,D){root.style.perspective='2000px';const C=H.abs({inset:'0',transformStyle:'preserve-3d'},root);const A=mk(0,{transform:'translateZ(800px)',backfaceVisibility:'hidden'},C),B=mk(1,{transform:'rotateY(90deg) translateZ(800px)',backfaceVisibility:'hidden'},C);
  H.a(C,[{transform:'translateZ(-800px) rotateY(0deg) scale(1)'},{transform:'translateZ(-800px) rotateY(-45deg) scale(.85)',offset:.5},{transform:'translateZ(-800px) rotateY(-90deg) scale(1)'}],{d:D,dl:st,e:'cubic-bezier(.65,0,.35,1)',f:'backwards'});
  const sa=H.abs({inset:'0',background:'#000',opacity:0},A),sb=H.abs({inset:'0',background:'#000',opacity:.5},B);H.a(sa,[{opacity:0},{opacity:.5}],{d:D,dl:st,f:'none'});H.a(sb,[{opacity:.5},{opacity:0}],{d:D,dl:st});hide(H,A,st+D);H.wait(st+D,()=>{B.style.transform='none';sb.style.opacity=0})}});

defT({no:'08',cat:'CUT',name:'カードフリップ',en:'Card Flip',lead:'画面がカードのようにくるっと裏返り、裏面が次の場面。',d:900,
use:'<b>答え合わせ・種明かし・ビフォーアフター</b>に。「正解は…」でくるっと裏返すと、クイズ動画が一気に盛り上がります。',
tips:['裏返る途中で画面を少し縮める（0.8倍）と、カードらしさが出ます','角を丸くする（border-radius 30px）と、より「カード」に見えます','横回転は「切り替え」、縦回転は「めくる」印象'],
p:`画面全体が1枚のカードのようにくるっと裏返り、裏面がシーンBになる「カードフリップ」を作ってください。
・時間：0.9秒。イージング cubic-bezier(.65,0,.35,1)
・CSS 3D：親に perspective: 2400px。カードに transform-style: preserve-3d
・表面＝シーンA、裏面＝シーンB（rotateY(180°) で配置）。どちらも backface-visibility: hidden
・カードを rotateY 0 → 180° へ回転。途中（50%）だけ scale 0.8・角丸30px・影 0 40px 80px rgba(0,0,0,.6)
・背景は黒`,
tr(H,root,mk,st,D){root.style.perspective='2400px';const C=H.abs({inset:'0',transformStyle:'preserve-3d'},root);const A=mk(0,{backfaceVisibility:'hidden'},C),B=mk(1,{transform:'rotateY(180deg)',backfaceVisibility:'hidden'},C);
  H.a(C,[{transform:'rotateY(0) scale(1)'},{transform:'rotateY(90deg) scale(.8)',offset:.5},{transform:'rotateY(180deg) scale(1)'}],{d:D,dl:st,e:'cubic-bezier(.65,0,.35,1)'});
  [A,B].forEach(e=>H.a(e,[{borderRadius:'0'},{borderRadius:'30px',offset:.5},{borderRadius:'0'}],{d:D,dl:st,f:'none'}))}});

defT({no:'09',cat:'CUT',name:'RGBスプリット',en:'RGB Split',lead:'画面が赤と青に分解して、ずれが戻ると次の場面になっている。',d:620,
use:'<b>音楽・ファッション・ストリート系</b>の編集に。ビートに合わせると、MVのような切り替えになります。',
tips:['ずれ幅は60px前後が見栄えの限界。大きすぎると何の映像か分からなくなります','縦方向のずれを少し混ぜると、より「壊れた映像」っぽくなります','白黒の映像にかけると、色ずれだけが際立っておしゃれ'],
p:`画面が赤と青の色に分解してずれていき、ずれが戻ると次の場面になっている「RGBスプリット」でシーンAからシーンBへ切り替えてください。
・時間：0.62秒
・前半0.31秒：シーンAに filter: drop-shadow(x 0 0 #FF0040) drop-shadow(−x 0 0 #00E5FF) をかけ、x を 0 → 60px に広げながら、Aの不透明度を 1 → 0（イージング cubic-bezier(.7,0,.84,0)）。同時に scale 1 → 1.08
・後半0.31秒：シーンBに同じ色ずれを x = 60px → 0 でかけながら、不透明度 0 → 1（イージング cubic-bezier(.16,1,.3,1)）。scale 1.08 → 1
・中心の時刻に、画面全体を横に ±20px 1コマだけずらす`,
tr(H,root,mk,st,D){const B=mk(1),A=mk(0);const sh=x=>`drop-shadow(${x}px 0 0 #ff0040) drop-shadow(${-x}px 0 0 #00e5ff)`;
  H.a(A,[{filter:sh(0),opacity:1,transform:'scale(1)'},{filter:sh(60),opacity:0,transform:'scale(1.08)'}],{d:D/2,dl:st,e:E.in});H.a(B,[{filter:sh(60),opacity:0,transform:'scale(1.08)'},{filter:sh(0),opacity:1,transform:'scale(1)'}],{d:D/2,dl:st+D/2});
  H.a(root,[{transform:'translateX(20px)'},{transform:'translateX(-20px)'},{transform:'none'}],{d:90,dl:st+D/2-45,e:'steps(3)',f:'none'})}});

defT({no:'10',cat:'CUT',name:'ストロボ連打',en:'Strobe Cut',lead:'ストロボのように白い閃光とAとBが連打され、Bに落ち着く。',d:700,
use:'<b>ライブ・クラブ・ダンス・スポーツのハイライト</b>に。BPMの速い曲のサビ前に入れると一気に盛り上がります。',
tips:['光の点滅は0.1秒より速くしないのがマナー（光に敏感な人への配慮）','後半に行くほどBの時間を長くすると、自然に落ち着きます','白の代わりにブランドカラーで点滅させると個性が出ます'],
p:`ストロボのように白い閃光とシーンA・シーンBが交互に連打され、最後にBで落ち着く「ストロボ連打」を作ってください。
・時間：0.7秒
・0.1秒ごとに、次の順番でハードカット（フェードなし）で切り替える：A → 白 → B → 白 → A → 白 → B

・光の点滅は0.1秒より速くしない（光に敏感な人への配慮）`,
tr(H,root,mk,st,D){const B=mk(1),A=mk(0);const W=H.abs({inset:'0',background:'#fff',visibility:'hidden'},root);B.style.visibility='hidden';
  ['A','W','B','W','A','W','B'].forEach((k,i)=>H.wait(st+i*100,()=>{A.style.visibility=k==='A'?'visible':'hidden';B.style.visibility=k==='B'?'visible':'hidden';W.style.visibility=k==='W'?'visible':'hidden';if(k==='B')H.a(B,[{transform:'scale(1.1)'},{transform:'scale(1)'}],{d:300})}))}});

p:`次の場面が下からスッと重なってきて、今の場面は奥へ沈んでいく「スライドオーバー」でシーンAからシーンBへ切り替えてください。

defT({no:'14',cat:'SLIDE',name:'エラスティック',en:'Elastic Slide',lead:'次の場面が勢いよく飛び込み、ゴムのように行き過ぎて戻る。',d:950,

defT({no:'15',cat:'SLIDE',name:'パララックススライド',en:'Parallax Slide',lead:'背景と文字が違う速さでずれながら、奥行きのある切り替え。',d:900,

p:`次の場面がカードとして下から積み上がり、そのまま全画面に広がる「スタックカード」でシーンAからシーンBへ切り替えてください。

tr(H,root,mk,st,D){const A=mk(0),B=mk(1);H.a(B,[{transform:'translateY(110%) scale(.78) rotate(3deg)',borderRadius:'36px',boxShadow:'0 30px 70px rgba(0,0,0,.5)',offset:0},{transform:'translateY(0) scale(.78) rotate(3deg)',borderRadius:'36px',boxShadow:'0 30px 70px rgba(0,0,0,.5)',offset:.5,easing:E.out},{transform:'translateY(0) scale(.78) rotate(3deg)',borderRadius:'36px',offset:.65,easing:IOS},{transform:'translateY(0) scale(1) rotate(0)',borderRadius:'0',boxShadow:'0 0 0 rgba(0,0,0,0)',offset:1}],{d:D,dl:st,e:E.lin});

tr(H,root,mk,st,D){root.style.perspective='2000px';const C=H.abs({inset:'0',transformStyle:'preserve-3d'},root);const A=mk(0,{transform:'translateZ(450px)',backfaceVisibility:'hidden'},C),B=mk(1,{transform:'rotateX(-90deg) translateZ(450px)',backfaceVisibility:'hidden'},C);

tr(H,root,mk,st,D){const B=mk(1);const L=mk(0,{clipPath:'inset(0 50% 0 0)'}),R=mk(0,{clipPath:'inset(0 0 0 50%)'});const s1=H.abs({left:'770px',top:'0',width:'30px',height:'900px',background:'linear-gradient(90deg,transparent,rgba(0,0,0,.5))',opacity:0},L);const s2=H.abs({left:'800px',top:'0',width:'30px',height:'900px',background:'linear-gradient(-90deg,transparent,rgba(0,0,0,.5))',opacity:0},R);[s1,s2].forEach(x=>H.a(x,[{opacity:0},{opacity:1,offset:.15},{opacity:1}],{d:D,dl:st,f:'none'}));

defT({no:'19',cat:'SLIDE',name:'スラッシュワイプ',en:'Slash Wipe',lead:'斜めの刃が画面を横切り、その跡が次の場面になる。',d:700,

tr(H,root,mk,st,D){const A=mk(0);const g=H.abs({inset:'0',background:'#c6f432',clipPath:'polygon(0 0,0 0,-25% 100%,-25% 100%)'},root);const B=mk(1,{clipPath:'polygon(0 0,0 0,-25% 100%,-25% 100%)'});
  const k=[{clipPath:'polygon(0 0,0 0,-25% 100%,-25% 100%)'},{clipPath:'polygon(0 0,125% 0,100% 100%,-25% 100%)'}];H.a(g,k,{d:D,dl:st-60,e:E.io});H.a(B,k,{d:D,dl:st,e:E.io});

defT({no:'20',cat:'SLIDE',name:'ストライプワイプ',en:'Stripe Wipe',lead:'横の帯が左右交互に滑り込み、次の場面を組み上げる。',d:900,

・時間：0.9秒
・シーンA：0〜0.5秒で scale 1 → 0.8、translateY 0 → 60px、brightness 1 → 0.4（cubic-bezier(.65,0,.35,1)）
・シーンB：0.25〜0.75秒で scale 1.5 → 1、不透明度 0 → 1（cubic-bezier(.7,0,.84,0)・加速して落ちる）。着地後に scale 0.97 → 1（0.15秒）で小さくバウンド
・着地の瞬間に、画面全体を最大10pxで0.25秒揺らす`,
tr(H,root,mk,st,D){const A=mk(0),B=mk(1);H.a(A,[{transform:'scale(1) translateY(0)',filter:'brightness(1)'},{transform:'scale(.8) translateY(60px)',filter:'brightness(.4)'}],{d:500,dl:st,e:'cubic-bezier(.65,0,.35,1)'});
  H.a(B,[{transform:'scale(1.5)',opacity:0},{transform:'scale(1)',opacity:1,offset:.77},{transform:'scale(.97)',offset:.88},{transform:'scale(1)',opacity:1}],{d:650,dl:st+250,e:E.in});H.shake(root,st+750,10,250);hide(H,A,st+D)}});

defT({no:'29',cat:'ZOOM',name:'ワープホール',en:'Warp Hole',lead:'画面の中心に穴が開き、吸い込まれるように次の世界へ。',d:1000,
use:'<b>異世界・ゲームの世界へ・夢の中へ</b>に。「〇〇の世界へようこそ」のようなオープニングにぴったり。',
tips:['穴の縁に光るリングを付けると、ポータル（入口）らしくなります','穴の中のBは大きい状態から縮めると、遠くの世界がのぞいている感じに','穴を画面の外まで広げきるのがポイント（途中で止めない）'],
p:`画面の中心に丸い穴が開き、吸い込まれるように次の世界へ入っていく「ワープホール」でシーンAからシーンBへ切り替えてください。
・時間：1.0秒
・シーンA：scale 1 → 2.6、blur 0 → 10px（加速、cubic-bezier(.7,0,.84,0)）
・シーンB（手前に重ねる）：clip-path: circle(0% at 50% 50%) → circle(80% at 50% 50%) で穴を広げる。同時に穴の中のBは scale 2 → 1（cubic-bezier(.65,0,.35,1)）
・穴の縁に、白と #38D6FF の光るリング（線幅12px、box-shadow 0 0 40px #38D6FF）を穴と同じ大きさで広げる。最後にリングはフェードアウト`,
tr(H,root,mk,st,D){const A=mk(0),B=mk(1,{clipPath:'circle(0% at 50% 50%)'});H.a(A,[{transform:'scale(1)',filter:'blur(0)'},{transform:'scale(2.6)',filter:'blur(10px)'}],{d:D,dl:st,e:E.in,f:'none'});
  H.a(B,[{clipPath:'circle(0% at 50% 50%)',transform:'scale(2)'},{clipPath:'circle(80% at 50% 50%)',transform:'scale(1)'}],{d:D,dl:st,e:'cubic-bezier(.65,0,.35,1)'});
  const R=H.abs({left:'800px',top:'450px',width:'0',height:'0',borderRadius:'50%',border:'12px solid #fff',boxShadow:'0 0 40px #38d6ff, inset 0 0 40px #38d6ff',transform:'translate(-50%,-50%)',opacity:0},root);
  H.a(R,[{width:'0px',height:'0px',opacity:1},{width:'2950px',height:'2950px',opacity:1,offset:.85},{width:'3500px',height:'3500px',opacity:0}],{d:D,dl:st,e:'cubic-bezier(.65,0,.35,1)'});hide(H,A,st+D)}});

defT({no:'30',cat:'ZOOM',name:'タイルディゾルブ',en:'Tile Dissolve',lead:'画面が四角いタイルでランダムに埋まり、めくれると次の場面。',d:1100,
use:'<b>ゲーム・デジタル・テック系</b>に。ピクセルのように細かく切り替わるので、デジタルな世界観と相性抜群。',
tips:['タイルは横16×縦9（正方形）にすると画面にぴったり','タイルの色をAとBの中間色にすると、なめらかにつながります','出る順番を「左上から右下へ」にすると、波のように切り替わります'],
p:`画面が四角いタイルでランダムに埋まっていき、タイルが消えると次の場面になっている「タイルディゾルブ」を作ってください。
・時間：1.1秒
・画面を横16×縦9＝144枚の正方形タイル（各100px角）に分割したレイヤーをAとBの上に重ねる。タイルの色は #38D6FF と #0F1C2E を交互に
・0〜0.5秒：各タイルを、0〜0.4秒のランダムな遅れで scale 0 → 1 に出す（0.12秒、cubic-bezier(.34,1.56,.64,1)）
・0.55秒：全タイルが埋まった瞬間にAを非表示にしてBを表示
・0.6〜1.1秒：各タイルを、0〜0.4秒のランダムな遅れで scale 1 → 0 に消す`,
