  const c=H.canvas();const x=c.getContext('2d');c.style.opacity=.08;H.raf(()=>{const im=x.createImageData(320,180);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}const o=document.createElement('canvas');o.width=320;o.height=180;o.getContext('2d').putImageData(im,0,0);x.drawImage(o,0,0,1600,900);W.style.filter=`grayscale(1) brightness(${rnd(.95,1.05).toFixed(2)})`});fadeAll(H,W,6200,700)}});

defA({no:'13',cat:'SHOW',name:'しずくと波紋',en:'Water Drop',lead:'仕事の流儀を描く番組のような、水面に落ちたしずくの波紋からタイトルが浮かぶ。',loop:7000,bg:'#02060f',
use:'<b>プロの仕事紹介・インタビュー・企業のブランド動画</b>に。静けさと緊張感のある、凛とした始まり方です。',
tips:['しずくが落ちる瞬間までは、音を消して静かにするのが効果的','波紋は3重にして、外側ほど薄く・遅く広げると美しい','タイトルは明朝体の太字にすると、凛とした印象に'],
p:`暗い水面にひとしずくが落ち、広がる波紋の中からタイトルがゆっくり浮かび上がる「ウォータードロップ」のオープニングを作ってください。
・タイトル：「{T}」
・背景：ほぼ黒の深い紺 #02060F。画面下半分は水面（奥に向かって暗くなるグラデーション、かすかに揺れる光の反射）
・0.0〜1.0秒：画面上から、白く光る小さなしずく（涙型）がゆっくり落ちてくる
・1.0秒：水面に当たった瞬間、白い光が一瞬広がり、楕円の波紋（線幅3px、白）を3重に、時間差（0.25秒）で広げながら消す（2.5秒）
・水面から小さな水しぶきの点が数個跳ね上がって落ちる
・2.0〜3.5秒：波紋の中心の上に、タイトルを太い明朝体（Shippori Mincho B1 800、白）で、下から水が引くように現す（mask を下から上へ）
・タイトルの下に、細い横線と小さな英字のサブタイトル「THE PROFESSIONAL WAY」
・尺：7秒`,
run(H,t){H.abs({left:'0',right:'0',top:'500px',bottom:'0',background:'linear-gradient(#0a1830,#02060f)'});for(let i=0;i<8;i++){const r=H.abs({left:rnd(100,1300)+'px',top:rnd(520,880)+'px',width:rnd(80,200)+'px',height:'3px',background:'rgba(255,255,255,.12)',borderRadius:'2px'});H.a(r,[{opacity:.1,transform:'translateX(0)'},{opacity:.4,transform:'translateX(30px)'},{opacity:.1,transform:'translateX(0)'}],{d:rnd(2000,3500),i:Infinity})}
  const dp=H.abs({left:'788px',top:'0',width:'24px',height:'36px',borderRadius:'50% 50% 50% 50% / 60% 60% 40% 40%',background:'#fff',boxShadow:'0 0 20px #9fd0ff'});H.a(dp,[{transform:'translateY(-60px)',opacity:1},{transform:'translateY(560px)',opacity:1,offset:.98},{transform:'translateY(560px)',opacity:0}],{d:1000,e:'cubic-bezier(.55,0,1,.45)'});
  const fl=H.abs({left:'500px',top:'440px',width:'600px',height:'240px',borderRadius:'50%',background:'radial-gradient(#fff,transparent 60%)',opacity:0});H.a(fl,[{opacity:.9,transform:'scale(.3)'},{opacity:0,transform:'scale(1.4)'}],{d:600,dl:1000,f:'none'});
  for(let i=0;i<3;i++){const r=H.abs({left:'700px',top:'560px',width:'200px',height:'60px',borderRadius:'50%',border:'3px solid rgba(255,255,255,.9)',opacity:0});H.a(r,[{transform:'scale(.2)',opacity:1},{transform:'scale(6)',opacity:0}],{d:2500,dl:1000+i*250,e:E.out})}
  for(let i=0;i<7;i++){const s=dot(H,800,590,rnd(3,6),'#cfe8ff');const dx=rnd(-120,120);H.a(s,[{transform:'translate(0,0)',opacity:0},{transform:`translate(${dx*.5}px,-${rnd(80,160)}px)`,opacity:1,offset:.45},{transform:`translate(${dx}px,0)`,opacity:0}],{d:900,dl:1000,e:'ease-out'})}
  const T=H.abs({left:'0',right:'0',top:'250px',textAlign:'center'});H.el('div',{fontFamily:F.min,fontWeight:'800',fontSize:titleSz(t,120,1100)+'px',color:'#fff',letterSpacing:'.1em'},T,t);const ln=H.el('div',{width:'300px',height:'1px',background:'#fff',margin:'24px auto 14px'},T);H.el('div',{fontFamily:F.serif,fontSize:'26px',letterSpacing:'.5em',color:'#9fb6d6'},T,'THE PROFESSIONAL WAY');
  H.a(T,[{clipPath:'inset(100% 0 0 0)'},{clipPath:'inset(0 0 0 0)'}],{d:1500,dl:2000,e:'cubic-bezier(.4,0,.2,1)'});H.a(ln,[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{d:800,dl:3000})}});

defA({no:'14',cat:'SHOW',name:'車窓から',en:'Train Window',lead:'鉄道の旅番組のような、列車の窓の外を景色が流れ、タイトルがやさしく出る。',loop:8000,bg:'#2a1d14',
use:'<b>旅行Vlog・帰省の記録・のんびり系の番組</b>の冒頭に。ゆったりと流れる時間を感じさせる、穏やかな始まり。',
tips:['窓枠を手前に置くだけで、一気に「車内から見ている」感じになります','景色は遠く（山）をゆっくり、近く（電柱）を速く流すのがコツ','列車の揺れを表すため、全体をほんの少し上下に揺らします'],
p:`列車の窓から外の景色が流れていくのを眺めているような、のどかな「トレインウィンドウ」のオープニングを作ってください。
・タイトル：「{T}」
・手前：木目調の窓枠（角の丸い窓、茶色の枠、下に小さなテーブルの縁）。窓ガラスにうっすら反射の光
・窓の外（すべて右から左へ流す・パララックス）：空と雲（ゆっくり）、遠くの山（16秒で1周期）、田んぼと林（6秒）、電柱（1.2秒、時々通過）
・季節は初夏：空は水色、山は青緑、田んぼは黄緑
・列車の揺れ：画面全体を ±2px、0.4秒周期で小さく上下させる。レールのつなぎ目のリズム（タタン、タタン）で時々カクッと揺らす
・2.0〜3.0秒：窓の下部に、タイトルをやわらかい明朝体（Shippori Mincho B1、白、うっすら影）でフェードイン。上に小さく「THE WORLD THROUGH THE WINDOW」
・尺：8秒`,
run(H,t){const V=H.abs({left:'200px',top:'90px',width:'1200px',height:'620px',borderRadius:'60px',overflow:'hidden',background:'#9fd6ff'});const svg=H.svg(1200,620,V);
  const lay=(build,T)=>{const g=H.sv('g',{},svg);build(g,0);build(g,1200);H.a(g,[{transform:'translateX(0)'},{transform:'translateX(-1200px)'}],{d:T,e:E.lin,i:Infinity})};
  lay((g,o)=>{for(let i=0;i<3;i++)H.sv('ellipse',{cx:o+i*400+150,cy:90+i*20,rx:120,ry:30,fill:'#fff',opacity:.8},g)},24000);lay((g,o)=>H.sv('path',{d:`M${o} 360 L${o+180} 220 L${o+360} 330 L${o+560} 190 L${o+800} 340 L${o+1000} 230 L${o+1200} 340 V620 H${o}Z`,fill:'#5c9e8f'},g),16000);
  lay((g,o)=>{H.sv('rect',{x:o,y:400,width:1200,height:220,fill:'#b6d96a'},g);for(let i=0;i<6;i++)H.sv('circle',{cx:o+i*220+60,cy:400,r:rnd(40,70),fill:'#3f8a4a'},g)},6000);
  lay((g,o)=>{H.sv('rect',{x:o+300,y:120,width:14,height:500,fill:'#4a3a2c'},g);H.sv('line',{x1:o,y1:160,x2:o+1200,y2:180,stroke:'#333','stroke-width':2},g)},1200);
  H.abs({inset:'0',background:'linear-gradient(120deg,rgba(255,255,255,.18),transparent 40%)'},V);H.abs({left:'150px',top:'40px',width:'1300px',height:'720px',borderRadius:'90px',border:'50px solid #6b4426',boxSizing:'border-box',boxShadow:'inset 0 0 30px rgba(0,0,0,.5)'});H.abs({left:'0',right:'0',top:'760px',bottom:'0',background:'linear-gradient(#5a3a22,#2a1d14)'});
  H.a(V,[{transform:'translateY(0)'},{transform:'translateY(2px)'},{transform:'translateY(0)'},{transform:'translateY(0)',offset:.8},{transform:'translateY(3px)',offset:.85},{transform:'translateY(0)'}],{d:800,i:Infinity});
  const T=H.abs({left:'0',right:'0',top:'500px',textAlign:'center',color:'#fff',textShadow:'0 2px 12px rgba(0,0,0,.6)'});H.el('div',{fontFamily:F.serif,fontSize:'22px',letterSpacing:'.4em'},T,'THE WORLD THROUGH THE WINDOW');H.el('div',{fontFamily:F.min,fontWeight:'800',fontSize:titleSz(t,100,900)+'px',letterSpacing:'.08em'},T,t);H.a(T,[{opacity:0},{opacity:1}],{d:1000,dl:2000})}});

defA({no:'15',cat:'SHOW',name:'ニュース番組',en:'News Open',lead:'報道番組のような、地球と光の帯が回り込み、赤いバーとタイトルがバシッと決まる。',loop:6000,bg:'#020b1f',
use:'<b>情報発信・ニュース解説・週間まとめ・社内報</b>の冒頭に。「今から大事なことを伝える」信頼感が出ます。',
tips:['地球は点の集まり（ドット地球儀）にすると、今っぽい報道感に','光の帯は青と赤の2色で、画面を横切らせる','タイトルが決まる瞬間に「ジャン！」のジングルを合わせます'],
p:`報道番組のオープニングのような、点で描かれた地球がゆっくり回り、光の帯がその周りを回り込んで、赤いバーとタイトルがバシッと決まる「ニュースオープン」を作ってください。
・タイトル：「{T}」
・背景：深い紺 #020B1F に、細い格子の線（不透明度0.06）
・地球：画面中央やや右に、点（ドット）で描いた地球儀（直径600px、青白い点、Canvas）。ゆっくり自転させる
・光の帯：青 #1E90FF と赤 #E60012 の細長い光の帯（グラデーション、ぼかし）が、0.0〜2.0秒に地球の周りを楕円を描いて回り込み、画面の外へ抜ける
・2.0秒：画面の左下から、赤いバー（高さ90px）が左から伸び、白い帯（高さ130px）が続いて伸びる
・2.2秒：白い帯の中に、タイトルを太いゴシック（Noto Sans JP 900、紺 #0B1F44）でバシッと出す（scale 1.2 → 1）。赤いバーの中に白い文字で「NEWS」
・画面右上に、時刻（実際の時刻）を白で表示
・尺：6秒`,
run(H,t){H.abs({inset:'0',backgroundImage:'linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px)',backgroundSize:'80px 80px'});const c=H.canvas();const x=c.getContext('2d');const pts=[];for(let i=0;i<1400;i++){const u=Math.acos(2*Math.random()-1),v=Math.random()*Math.PI*2;pts.push([u,v])}
  H.raf(s=>{x.clearRect(0,0,1600,900);pts.forEach(([u,v])=>{const vv=v+s*.4;const X=Math.sin(u)*Math.cos(vv),Y=Math.cos(u),Z=Math.sin(u)*Math.sin(vv);if(Z<0)return;x.fillStyle=`rgba(140,190,255,${.3+Z*.7})`;x.fillRect(980+X*300,450+Y*300,3,3)})});
  [['#1e90ff',0],['#e60012',300]].forEach(([col,dl])=>{const b=H.abs({left:'0',top:'0',width:'600px',height:'14px',borderRadius:'7px',background:`linear-gradient(90deg,transparent,${col})`,filter:'blur(2px)',boxShadow:`0 0 20px ${col}`,offsetPath:'path("M-400 700 C 400 900 1500 700 1300 300 S 400 0 2000 200")',offsetRotate:'auto'});H.a(b,[{offsetDistance:'0%'},{offsetDistance:'100%'}],{d:2000,dl,e:'ease-in-out'})});
  const W=H.abs({left:'0',top:'620px'});const red=H.abs({left:'0',top:'0',width:'240px',height:'90px',background:'#e60012',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:F.heavy,fontSize:'44px',color:'#fff',transformOrigin:'0 50%'},W,'NEWS');const wh=H.abs({left:'240px',top:'-20px',width:'1100px',height:'130px',background:'#fff',transformOrigin:'0 50%',display:'flex',alignItems:'center',padding:'0 40px',boxSizing:'border-box',overflow:'hidden'},W);
  const tt=H.el('div',{fontFamily:F.sans,fontWeight:'900',fontSize:titleSz(t,80,900)+'px',color:'#0b1f44',whiteSpace:'nowrap'},wh,t);H.a(red,[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{d:300,dl:2000,e:E.out});H.a(wh,[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{d:400,dl:2100,e:E.out});H.a(tt,[{transform:'scale(1.2)',opacity:0},{transform:'scale(1)',opacity:1}],{d:300,dl:2300,e:E.out});
  const ck=H.abs({right:'60px',top:'40px',fontFamily:F.smono,fontSize:'40px',color:'#fff'});H.raf(()=>{ck.textContent=new Date().toTimeString().slice(0,5)})}});

/* ===== OPENING 16-30 ===== */
defA({no:'16',cat:'SHOW',name:'恋愛ドラマのタイトルバック',en:'Romance Drama',lead:'月曜夜の恋愛ドラマのような、きらめく光の玉の中に、やさしい筆記体のタイトル。',loop:7000,bg:'#2a0f2e',
use:'<b>ウェディング・カップル動画・恋愛系ショートドラマ</b>の冒頭に。胸がときめく、キラキラした始まり方です。',
tips:['光の玉（ボケ）はピンク・白・金を混ぜて、ゆっくり漂わせる','英語の筆記体＋日本語の細い明朝の組み合わせが、ドラマらしさのコツ','バラード調のピアノのBGMを合わせると完成度が上がります'],
p:`恋愛ドラマのタイトルバックのような、きらめく光の玉（ボケ）がふわふわ漂う中に、やさしい筆記体のタイトルと日本語の副題が浮かぶ「ロマンスドラマ」のオープニングを作ってください。
・タイトル：「{T}」
・背景：深いワインレッド #2A0F2E から、中央が明るいピンク #B0457A への円形グラデーション
・光の玉：直径30〜180pxの円を40個。色はピンク・白・金色、半透明（0.15〜0.5）、ぼかし4〜20px、mix-blend-mode: screen。ゆっくり上へ漂いながら、明るさを点滅させる
・キラキラ：小さな4方向の星を20個、ランダムに瞬かせる
・1.0〜2.5秒：タイトルを、筆記体（Great Vibes、白、ピンクの光のにじみ）で左から書くように現す
・2.5秒：タイトルの下に、日本語の副題「この恋は、きっと運命だった。」を細い明朝体（白、字間広め）でフェードイン
・3.0秒〜：全体をゆっくり寄せる（scale 1 → 1.05）
・尺：7秒`,
run(H,t){H.abs({inset:'0',background:'radial-gradient(circle,#b0457a,#2a0f2e 70%)'});const W=H.abs({inset:'0'});for(let i=0;i<40;i++){const s=rnd(30,180);const b=dot(H,rnd(0,1600),rnd(0,900),s/2,pick(['#ffb3d1','#fff','#ffd98a']),W,{opacity:rnd(.15,.5),filter:`blur(${rnd(4,20)}px)`,mixBlendMode:'screen'});H.a(b,[{transform:'translateY(0)'},{transform:`translateY(-${rnd(60,200)}px)`}],{d:7000,e:E.lin})}
  for(let i=0;i<20;i++){const s=H.abs({left:rnd(0,1600)+'px',top:rnd(0,900)+'px',fontSize:rnd(20,40)+'px',color:'#fff'},W,'✦');H.a(s,[{opacity:0,transform:'scale(.3)'},{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.3)'}],{d:rnd(1200,2000),dl:rnd(0,3000),i:Infinity})}
  const T=H.abs({left:'0',right:'0',top:'300px',textAlign:'center'},W);const tt=H.el('div',{fontFamily:"'Great Vibes',cursive",fontSize:titleSz(t,170,1100)+'px',color:'#fff',textShadow:'0 0 30px #ff7ab8'},T,t);H.a(tt,[{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'}],{d:1500,dl:1000,e:'ease-in-out'});
  const sub=H.el('div',{fontFamily:F.min,fontSize:'34px',letterSpacing:'.3em',color:'#fff',marginTop:'20px'},T,'この恋は、きっと運命だった。');H.a(sub,[{opacity:0},{opacity:1}],{d:1000,dl:2500});H.a(W,[{transform:'scale(1)'},{transform:'scale(1.05)'}],{d:4000,dl:3000,e:E.lin})}});

defA({no:'17',cat:'SHOW',name:'日曜夜の重厚ドラマ',en:'Heavy Drama',lead:'日曜夜の社会派ドラマのような、墨の筆文字が叩きつけられ、金の線が走る。',loop:6500,bg:'#060606',
use:'<b>ビジネス系の真剣な動画・挑戦の記録・決意表明</b>に。「ここから本気の物語が始まる」重みを出せます。',
tips:['筆文字は大きく、画面からはみ出すくらいがインパクト大','叩きつけの瞬間に画面を揺らし、墨しぶきを飛ばすのがポイント','オーケストラの重低音を合わせると、ぐっと重厚に'],
p:`日曜夜の社会派ドラマのタイトルバックのような、暗闇に墨の筆文字のタイトルが叩きつけられ、墨しぶきが飛び、金色の細い線が走る「ヘビードラマ」のオープニングを作ってください。
・タイトル：「{T}」
・背景：ほぼ黒 #060606 に、上からうっすらスポットライト。煙のようなもや（灰色、ぼかし、ゆっくり動く）
・0.0〜1.0秒：静かな暗闇。画面中央に細い金色 #C9A45C の横線が、中央から左右へゆっくり伸びる
・1.2秒：タイトルを、毛筆体（Yuji Syuku など、白）の大きな文字で、scale 2.5・blur 10px → scale 1・blur 0 へ0.25秒で叩きつける（cubic-bezier(.7,0,.84,0)）
・叩きつけの瞬間：画面を12px・0.3秒揺らし、文字のまわりに白い墨しぶき（大小の点と細長い飛沫）を飛ばす
・2.0秒〜：金の線が文字の上下に1本ずつ走り、文字の上を金の光がゆっくり横切る
・最後に、右下に小さく「第一話」を縦書きで
・尺：6.5秒`,
run(H,t){const W=H.abs({inset:'0'});H.abs({left:'400px',top:'-300px',width:'800px',height:'900px',background:'radial-gradient(ellipse,rgba(255,255,255,.12),transparent 60%)'},W);for(let i=0;i<5;i++){const m=H.abs({left:rnd(0,1200)+'px',top:rnd(300,800)+'px',width:'600px',height:'200px',borderRadius:'50%',background:'rgba(160,160,160,.08)',filter:'blur(40px)'},W);H.a(m,[{transform:'translateX(0)'},{transform:'translateX(200px)'}],{d:6500,e:E.lin})}

p:`深夜アニメのオープニングのような、集中線が走り、背景色がビートに合わせてフラッシュする中で、タイトルがスタンプのように叩きつけられる「アニメオープニング」を作ってください。

・2.0秒：タイトルの下に、英字のサブタイトル「NOBU MOVIE THE ANIMATION」を細い字で

p:`宇宙を舞台にした映画の幕開けのような、「青い一文 → 巨大なタイトルが奥へ遠ざかる → あらすじの文章が奥へ流れていく」3段構成の「スペースサーガクロール」のオープニングを作ってください。

tips:['白い点は等間隔に並べて、左から右へ「トン、トン、トン」と横切らせる','丸いレンズの内側にらせん状の溝（同心円）を描くと本物らしい','最後に赤い色がレンズの上から流れ落ちる演出で締める'],
p:`スパイ映画の冒頭のような、黒い画面を白い丸い点が等間隔に横切り、最後の点が丸いレンズ（のぞき穴）に広がって、その中にタイトルが現れ、上から赤く染まっていく「スパイバレル」のオープニングを作ってください。
・タイトル：「{T}」
・背景：真っ黒
・0.0〜1.6秒：画面中央の高さを、白い丸い点（直径60px）が左から右へ、0.2秒おきに8個「トン、トン、トン」と横切る（各点は移動しながら残り、最後に全部消える）
・1.6〜2.4秒：最後の点が画面中央で止まり、直径600pxの丸いレンズに広がる。レンズの中は暗い灰色に、らせん状の溝（同心円の細い線、濃淡交互）を描き、ゆっくり回転させる
・2.4〜3.6秒：レンズの中央に、タイトルを細身の大文字（Montserrat 300、白、字間0.4em）でフェードイン
・3.6〜5.0秒：レンズの上から、赤 #B00000 の液体が波打ちながら流れ落ちて、レンズの中を赤く染める
・5.0秒：レンズが揺れながら下へ落ちて消える
・尺：7.5秒`,
run(H,t){for(let i=0;i<8;i++){const d=dot(H,0,450,30,'#fff');const X=100+i*190;H.a(d,[{transform:'translateX(-100px)',opacity:1},{transform:`translateX(${X}px)`,opacity:1,offset:.5},{transform:`translateX(${X}px)`,opacity:1,offset:.95},{transform:`translateX(${X}px)`,opacity:0}],{d:1600-i*150,dl:i*200,e:E.out,f:'forwards'})}
  const L=H.abs({left:'500px',top:'150px',width:'600px',height:'600px',borderRadius:'50%',overflow:'hidden',background:'repeating-radial-gradient(circle,#2a2a2a 0 18px,#3a3a3a 18px 36px)',transform:'scale(.1)',opacity:0});const g=H.abs({inset:'-100px',background:'repeating-conic-gradient(rgba(0,0,0,.25) 0 6deg,transparent 6deg 30deg)'},L);H.a(g,[{transform:'rotate(0)'},{transform:'rotate(180deg)'}],{d:6000,e:E.lin});
  H.a(L,[{transform:'scale(.1)',opacity:1},{transform:'scale(1)',opacity:1}],{d:800,dl:1600,e:E.out});const T=H.abs({inset:'0',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:"'Montserrat',sans-serif",fontWeight:'300',fontSize:titleSz(t,70,520)+'px',letterSpacing:'.4em',color:'#fff',textAlign:'center'},L,t.toUpperCase());H.a(T,[{opacity:0},{opacity:1}],{d:1200,dl:2400});
  const blood=H.abs({left:'-50px',top:'-650px',width:'700px',height:'650px',background:'#b00000',borderRadius:'0 0 45% 55% / 0 0 20% 25%',mixBlendMode:'multiply'},L);H.a(blood,[{transform:'translateY(0)'},{transform:'translateY(700px)'}],{d:1400,dl:3600,e:'ease-in'});
  H.a(L,[{transform:'translateY(0) rotate(0)'},{transform:'translateY(0) rotate(-6deg)',offset:.3},{transform:'translateY(1100px) rotate(10deg)'}],{d:1200,dl:5000,e:'ease-in',f:'forwards'})}});

defA({no:'23',cat:'GENRE',name:'ヒーロー映画のコミックめくり',en:'Comic Flip',lead:'ヒーロー映画のロゴのような、コミックのコマが高速でめくれ、赤いブロックのロゴが決まる。',loop:6000,bg:'#000',
use:'<b>ゲーム実況・スポーツのハイライト・仲間紹介</b>の冒頭に。高揚感がすごい、ヒーロー登場の演出です。',
tips:['コマは0.08秒ごとに、色や構図の違うパネルを高速で切り替える','最後は赤い長方形の中に白い太い文字、というシンプルなロゴで締める','重低音の「ドン！」と、ロゴの決まる瞬間を合わせます'],
p:`ヒーロー映画のロゴのような、コミックのコマ（パネル）が高速でパラパラとめくれていき、最後に赤い長方形の中に白い太文字のタイトルがバシッと決まる「コミックフリップ」のオープニングを作ってください。
・タイトル：「{T}」（大文字）
・0.0〜2.4秒：コミック風のパネルを0.08秒ごとに切り替える（30枚）。各パネルは、CSS で描いた抽象的なコミックの1コマ（集中線、網点、爆発の形、拳のシルエット、ビルのシルエット、「POW!」「BAM!」の吹き出しなど）を、赤・青・黄の原色でランダムに組み合わせる
・パネルは毎回、少し角度（±6°）と大きさ（1〜1.15倍）を変え、カメラがゆっくり引いていく（scale 1.4 → 1）
・2.4〜2.8秒：パネルが画面の奥へ一気に縮み、赤 #E62429 の長方形のロゴ枠に変わる
・2.8秒：枠の中に、タイトルを太く縦長のブロック体（Bebas Neue、白）でバシッと出し、画面を揺らす
・ロゴの上を、光の反射が1回走る
・尺：6秒`,
run(H,t){const P=H.abs({inset:'0',overflow:'hidden'});const bang=['POW!','BAM!','ZAP!','WHAM!'];const cols=['#e62429','#1e5bff','#ffd400','#111','#fff'];
  for(let i=0;i<30;i++)H.wait(i*80,()=>{P.innerHTML='';const bg=pick(cols.slice(0,3));const p=H.abs({inset:'0',background:bg,transform:`rotate(${rnd(-6,6)}deg) scale(${rnd(1,1.15)})`},P);
    H.abs({inset:'0',background:`repeating-conic-gradient(rgba(255,255,255,.25) 0 4deg,transparent 4deg 12deg)`},p);H.abs({inset:'0',backgroundImage:'radial-gradient(rgba(0,0,0,.3) 3px,transparent 4px)',backgroundSize:'18px 18px'},p);
    const k=i%4;if(k===0)H.abs({left:rnd(300,900)+'px',top:'200px',width:'400px',height:'400px',background:'#ffd400',clipPath:'polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)'},p);
    if(k===1){let x=0;while(x<1600){const h=rnd(200,600);H.abs({left:x+'px',top:900-h+'px',width:'120px',height:h+'px',background:'#111'},p);x+=130}}
    if(k===2)H.abs({left:'500px',top:'250px',width:'600px',height:'400px',borderRadius:'50%',background:'#fff',border:'10px solid #111'},p);
    H.abs({left:rnd(200,900)+'px',top:rnd(150,500)+'px',fontFamily:F.heavy,fontSize:rnd(120,200)+'px',color:pick(['#fff','#ffd400','#e62429']),WebkitTextStroke:'8px #111',paintOrder:'stroke fill',transform:`rotate(${rnd(-12,12)}deg)`},p,pick(bang))});
  H.a(P,[{transform:'scale(1.4)'},{transform:'scale(1)',offset:.4},{transform:'scale(1)',offset:.4},{transform:'scale(.35,.28)',offset:.46},{transform:'scale(.35,.28)',opacity:0,offset:.47},{opacity:0}],{d:6000,e:'ease-in'});
  const B=H.box();const lg=H.el('div',{background:'#e62429',padding:'10px 50px',fontFamily:"'Bebas Neue',sans-serif",fontSize:titleSz(t,230,1200)+'px',lineHeight:'1',color:'#fff',letterSpacing:'.02em',position:'relative',overflow:'hidden'},B,t.toUpperCase());H.a(lg,[{opacity:0,transform:'scale(1.15)'},{opacity:0,offset:.46},{opacity:1,transform:'scale(1)',offset:.47},{opacity:1}],{d:6000});H.shake(B,2820,14,300);
  const sh=H.abs({inset:'0',background:'linear-gradient(110deg,transparent 40%,rgba(255,255,255,.6) 50%,transparent 60%)',backgroundSize:'250% 100%',backgroundPosition:'150% 0'},lg);H.a(sh,[{backgroundPosition:'150% 0'},{backgroundPosition:'-50% 0'}],{d:800,dl:3400})}});

defA({no:'24',cat:'GENRE',name:'ホラーのタイトル',en:'Horror Title',lead:'ホラー映画のような、蛍光灯がまたたき、ひっかき傷のような赤い文字がにじむ。',loop:7000,bg:'#050505',
use:'<b>怪談・肝試し・ハロウィン・ミステリー企画</b>の冒頭に。見る人の背筋をぞくっとさせる演出です。',
tips:['明滅は不規則に。規則的だと怖さが半減します','文字はひっかいたような、かすれた書体（Creepster など）か、手書きの筆文字で','静寂 → 突然の大きな音、の落差が一番怖さを生みます'],
p:`ホラー映画のタイトルのような、古い蛍光灯がまたたく暗い部屋で、ひっかき傷のような赤い文字がじわっとにじみ出てくる「ホラータイトル」のオープニングを作ってください。
・タイトル：「{T}」
・背景：ほぼ黒の古い壁（ざらついたノイズのテクスチャ、灰緑がかった色）。画面の端を強く暗くする（ビネット）
・0.0〜2.5秒：画面全体の明るさを、蛍光灯のように不規則にまたたかせる（0.05〜0.3秒の間隔で brightness 0.1 ⇄ 1.2）。またたきの合間に、一瞬だけ人影のシルエットが部屋の奥に映る
・2.5〜4.5秒：壁に、タイトルを赤 #8B0000 の、ひっかいたようなかすれた書体（Creepster など）で、上から下へにじみ出すように現す（mask で上から少しずつ）。文字の下端から、赤い液体のしずくを数本、ゆっくり垂らす
・4.5秒：画面が一瞬真っ白に光って（0.1秒）、すぐ暗くなる
・画面全体に細かいフィルムのざらつきと縦の傷を重ねる
・尺：7秒`,
run(H,t){const W=H.abs({inset:'0',background:'#1a1f1a'});const c=H.canvas(W);const x=c.getContext('2d');c.style.opacity=.25;H.abs({inset:'0',background:'radial-gradient(ellipse,transparent 30%,#000 80%)'},W);
  const sh=H.abs({left:'1100px',top:'280px',width:'120px',height:'420px',borderRadius:'60px 60px 10px 10px',background:'#000',opacity:0},W);let next=0,on=1;H.raf(s=>{const im=x.createImageData(320,180);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}const o=document.createElement('canvas');o.width=320;o.height=180;o.getContext('2d').putImageData(im,0,0);x.drawImage(o,0,0,1600,900);
    if(s<2.5&&s>next){on=!on;next=s+rnd(.05,.3);W.style.filter=`brightness(${on?1.2:.1})`;sh.style.opacity=!on&&Math.random()<.3?.8:0}else if(s>=2.5&&s<4.5){W.style.filter='brightness(.9)';sh.style.opacity=0}});
  const T=H.box({},W);const tt=H.el('div',{fontFamily:"'Creepster','Yuji Syuku',cursive",fontSize:titleSz(t,200,1200)+'px',color:'#8b0000',textShadow:'0 0 12px #4a0000',whiteSpace:'nowrap'},T,t);H.a(tt,[{clipPath:'inset(0 0 100% 0)'},{clipPath:'inset(0 0 0 0)'}],{d:2000,dl:2500,e:'ease-in-out'});
  for(let i=0;i<7;i++){const d=H.abs({left:rnd(350,1250)+'px',top:'520px',width:'10px',height:'0',borderRadius:'0 0 6px 6px',background:'#8b0000'},W);H.a(d,[{height:'0'},{height:rnd(60,220)+'px'}],{d:2000,dl:3500+rnd(0,800),e:'ease-in'})}
  const fl=H.abs({inset:'0',background:'#fff',opacity:0});H.a(fl,[{opacity:1},{opacity:0}],{d:120,dl:4500,f:'none'});for(let i=0;i<4;i++){const s=H.abs({left:rnd(0,1600)+'px',top:'0',bottom:'0',width:'2px',background:'rgba(255,255,255,.15)'});H.a(s,[{transform:'translateX(0)'},{transform:`translateX(${rnd(-40,40)}px)`}],{d:300,i:Infinity,dir:'alternate'})}}});

defA({no:'25',cat:'GENRE',name:'金曜夜の映画劇場',en:'Friday Cinema',lead:'金曜夜の映画番組のような、夕暮れの空と影絵の人物、懐かしいメロディが聞こえてくる。',loop:7000,bg:'#2a1530',
use:'<b>家族で観る動画・思い出のスライドショー・映画レビュー</b>の冒頭に。「さあ、今夜の映画が始まる」わくわく感。',
tips:['夕焼けのオレンジ → 紫のグラデーションが、ノスタルジーの決め手','影絵の人物は動かさず、雲と光だけゆっくり動かすと上品','トランペットのような郷愁のあるメロディが似合います'],
p:`金曜夜の映画番組のオープニングのような、大きな夕日が沈む空と、遠くを見つめる人物の影絵、懐かしい雰囲気のタイトルが浮かぶ「フライデーシネマ」のオープニングを作ってください。
・タイトル：「{T}」
・空：上 #2A1530（紫）→ 中 #C2456B（ピンク）→ 下 #FF9F43（オレンジ）のグラデーション。横に長くたなびく雲（紫がかった灰色、ゆっくり右へ）
・夕日：地平線の上に、大きな太陽（直径360px、黄〜オレンジのグラデーション、光のにじみ）が、ゆっくり沈んでいく（7秒で 80px）
・地上：地平線に、街並みと丘のシルエット（黒に近い紫）。丘の上に、帽子をかぶった人物が夕日を見つめて立つ影絵
・1.5〜3.0秒：画面上部に、タイトルを太いセリフ体（Playfair Display 900、白、うっすら影）でフェードイン。上に小さく「今夜の映画は」
・画面全体に、古いフィルムのようなやさしいざらつき
・尺：7秒`,
run(H,t){H.abs({inset:'0',background:'linear-gradient(#2a1530 0%,#c2456b 55%,#ff9f43 80%)'});const sun=dot(H,800,560,180,'#ffcf5a',null,{background:'radial-gradient(#fff3b0,#ffb347 60%,#ff7a3c)',boxShadow:'0 0 120px 40px rgba(255,170,80,.6)'});H.a(sun,[{transform:'translateY(0)'},{transform:'translateY(80px)'}],{d:7000,e:E.lin});
  for(let i=0;i<5;i++){const c=H.abs({left:rnd(-200,1200)+'px',top:rnd(150,450)+'px',width:rnd(500,900)+'px',height:'30px',borderRadius:'15px',background:'rgba(110,70,120,.6)'});H.a(c,[{transform:'translateX(0)'},{transform:'translateX(120px)'}],{d:7000,e:E.lin})}
  const svg=H.svg(1600,900);H.sv('path',{d:'M0 900 L0 680 Q300 600 600 660 Q900 720 1100 640 Q1350 560 1600 650 L1600 900Z',fill:'#1a0d1f'},svg);H.sv('circle',{cx:1180,cy:540,r:22,fill:'#1a0d1f'},svg);H.sv('path',{d:'M1150 525 L1210 525 L1200 512 L1160 512 Z',fill:'#1a0d1f'},svg);H.sv('path',{d:'M1160 560 L1200 560 L1210 650 L1150 650 Z',fill:'#1a0d1f'},svg);
  const T=H.abs({left:'0',right:'0',top:'130px',textAlign:'center',color:'#fff',textShadow:'0 4px 20px rgba(0,0,0,.4)'});H.el('div',{fontFamily:F.min,fontSize:'34px',letterSpacing:'.3em'},T,'今夜の映画は');H.el('div',{fontFamily:"'Playfair Display',serif",fontWeight:'900',fontSize:titleSz(t,140,1100)+'px',letterSpacing:'.04em'},T,t);H.a(T,[{opacity:0,transform:'translateY(20px)'},{opacity:1,transform:'translateY(0)'}],{d:1500,dl:1500})}});

defA({no:'26',cat:'GENRE',name:'映画の予告編',en:'Movie Trailer',lead:'映画の予告編のような、黒い画面に短い言葉が雷鳴とともに1つずつ打ち込まれる。',loop:9000,bg:'#000',
use:'<b>新企画の告知・イベントの予告・動画シリーズの予告編</b>に。「近日公開」の期待感を最大限に高めます。',
tips:['言葉は短く、句読点で区切って3〜4枚に分けるのがコツ','言葉と言葉の間は真っ暗にして、雷のフラッシュでつなぐ','最後の「COMING SOON」は小さく、タイトルは大きく'],
p:`映画の予告編のような、黒い画面に短い言葉が1枚ずつ雷鳴とともに打ち込まれ、最後にタイトルと「COMING SOON」が出る「ムービートレーラー」のオープニングを作ってください。
・タイトル：「{T}」
・背景：黒。画面の奥で、雷雲のような灰色のもやがゆっくり動く
・言葉のカード（白、細身の明朝体 Shippori Mincho B1、中央、字間広め）を、1.2秒ずつ順に表示：「この秋、」→「ひとつの企画が、」→「すべてを変える。」
・各カードの切り替えで：画面全体を白く一瞬光らせる（雷のフラッシュ、0.08秒）＋カードを scale 1.05 → 1 でゆっくり引く。カードとカードの間に、0.3秒の真っ暗な間
・4.5〜6.0秒：タイトルを、太いセリフ体（Cinzel 700、銀色のグラデーション）で大きく、ゆっくり寄りながら（scale 0.9 → 1）フェードイン
・6.0秒：タイトルの下に、小さく「COMING SOON」と公開日「2026.12.24」
・尺：9秒`,
run(H,t){for(let i=0;i<4;i++){const m=H.abs({left:rnd(0,1200)+'px',top:rnd(0,700)+'px',width:'700px',height:'300px',borderRadius:'50%',background:'rgba(120,120,140,.12)',filter:'blur(50px)'});H.a(m,[{transform:'translateX(0)'},{transform:'translateX(160px)'}],{d:9000,e:E.lin})}
  const fl=H.abs({inset:'0',background:'#fff',opacity:0});['この秋、','ひとつの企画が、','すべてを変える。'].forEach((s,i)=>{const at=200+i*1500;const c=H.abs({left:'0',right:'0',top:'410px',textAlign:'center',fontFamily:F.min,fontWeight:'500',fontSize:'64px',letterSpacing:'.3em',color:'#fff',opacity:0},null,s);
    H.a(c,[{opacity:0,transform:'scale(1.05)'},{opacity:1,offset:.05},{opacity:1,transform:'scale(1)',offset:.8},{opacity:0,transform:'scale(1)'}],{d:1200,dl:at});H.a(fl,[{opacity:.9},{opacity:0}],{d:120,dl:at,f:'none'})});
  const T=H.abs({left:'0',right:'0',top:'330px',textAlign:'center'});H.el('div',{fontFamily:"'Cinzel',serif",fontWeight:'700',fontSize:titleSz(t,150,1200)+'px',letterSpacing:'.08em',backgroundImage:'linear-gradient(#fff,#9ba3af 60%,#fff)',WebkitBackgroundClip:'text',backgroundClip:'text',color:'transparent'},T,t.toUpperCase());
  H.a(T,[{opacity:0,transform:'scale(.9)'},{opacity:1,transform:'scale(1)'}],{d:1500,dl:4800,e:E.out});H.a(fl,[{opacity:.9},{opacity:0}],{d:150,dl:4800,f:'none'});const cs=H.abs({left:'0',right:'0',top:'560px',textAlign:'center',color:'#bbb',fontFamily:"'Montserrat',sans-serif",fontWeight:'300',letterSpacing:'.6em'});H.el('div',{fontSize:'34px'},cs,'COMING SOON');H.el('div',{fontSize:'24px',marginTop:'10px'},cs,'2026.12.24');H.a(cs,[{opacity:0},{opacity:1}],{d:1000,dl:6300})}});

defA({no:'27',cat:'GENRE',name:'YouTuberのオープニング',en:'Creator Intro',lead:'人気YouTuberのような、3秒でテンポよく弾けるポップなチャンネルロゴ。',loop:4000,bg:'#ff4f6d',
use:'<b>YouTubeチャンネルの毎回の冒頭・ショート動画の頭</b>に。短くテンポがよいので、視聴者が離れずに本編へ入れます。',
tips:['全体を3秒以内に収めるのが、最後まで見てもらうコツ','背景色を2回ハードカットで切り替えると、テンポよく見えます','チャンネル登録ボタンをポンと出すと、自然に登録をうながせます'],
p:`人気YouTuberのチャンネルのような、3秒でテンポよく弾けるポップなロゴ演出「クリエイターイントロ」を作ってください。
・タイトル：「{T}」
・0.0〜0.4秒：背景がピンク #FF4F6D → 0.2秒で黄 #FFD23F → 0.4秒で水色 #3ED1FF にハードカットで切り替わる。そのたびに中央の白い円が scale 0 → 1.2 で広がる
・0.4秒：白い円の中に、タイトルを太い丸ゴシック（Mochiy Pop One、黒）で1文字ずつ0.04秒おきにポンポンと出す（scale 0 → 1.3 → 1）
・0.8秒：タイトルの下から、赤い「チャンネル登録」ボタン（角丸、白い文字、再生マークのアイコン）がぴょんと出る
・1.4秒：ボタンにマウスカーソルが動いてきてクリック → ボタンが灰色の「登録済み」に変わり、ベルのアイコンが揺れる
・まわりに丸と星の図形がはじける
・2.8秒〜：全体がくるっと回りながら小さくなって消える
・尺：4秒`,
run(H,t){[[0,'#ff4f6d'],[200,'#ffd23f'],[400,'#3ed1ff']].forEach(([ms,c])=>H.wait(ms,()=>{H.S.style.background=c}));const W=H.abs({inset:'0'});const ci=dot(H,800,400,300,'#fff',W);[0,200,400].forEach(ms=>H.a(ci,[{transform:'scale(0)'},{transform:'scale(1.2)',offset:.7},{transform:'scale(1)'}],{d:220,dl:ms,f:'none'}));
  const row=H.abs({left:'0',right:'0',top:'330px',textAlign:'center',fontFamily:F.pop,fontSize:titleSz(t,140,560)+'px',color:'#111'},W);H.chars(t,row).forEach((c,i)=>H.a(c,[{transform:'scale(0)'},{transform:'scale(1.3)',offset:.6},{transform:'scale(1)'}],{d:300,dl:400+i*40,e:E.back}));
  const bt=H.abs({left:'620px',top:'560px',width:'360px',height:'90px',borderRadius:'45px',background:'#ff0033',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',gap:'14px',fontFamily:F.sans,fontWeight:'900',fontSize:'34px'},W);const bi=H.el('span',{},bt,'▶');const bx=H.el('span',{},bt,'チャンネル登録');H.a(bt,[{transform:'translateY(60px) scale(.5)',opacity:0},{transform:'translateY(0) scale(1)',opacity:1}],{d:400,dl:800,e:E.back});

defA({no:'28',cat:'GENRE',name:'レトロゲームの起動画面',en:'Game Boot',lead:'昔のゲーム機のような、ドット絵のロゴが上から降りてきて「PRESS START」が点滅。',loop:7000,bg:'#000',
use:'<b>ゲーム実況・レトロ好き向け・企画の始まり</b>に。電子音の「ピロン♪」と合わせると、懐かしさで一気に引き込めます。',
tips:['フォントは DotGothic16 や Press Start 2P などのドット書体で','ロゴが止まる瞬間に、画面を一瞬白く光らせると起動音っぽくなります','「PRESS START」は0.5秒間隔の点滅が定番'],
p:`昔の家庭用ゲーム機の起動画面のような、ドット絵のロゴが上からゆっくり降りてきて止まり、「PRESS START」が点滅する「ゲームブート」のオープニングを作ってください。
・タイトル：「{T}」
・背景：黒。画面全体に走査線（横線、不透明度0.2）と、四隅が少し暗いブラウン管の丸み
・0.0〜2.0秒：画面上から、タイトルをドット書体（DotGothic16、大きく、文字ごとに虹色のグラデーション：赤→橙→黄→緑→青）で、ゆっくり等速で降ろす。画像が粗く見えるよう、image-rendering: pixelated や 4px単位の位置移動にする
・2.0秒：ロゴが止まった瞬間、画面を一瞬白く光らせ、ロゴの文字を上から1行ずつ光らせる（キラッ）
・2.5秒〜：下に「PRESS START」（白、ドット書体）を0.5秒間隔で点滅させる
・最下部に小さく「© 2026 NOBU MOVIE」
・ロゴの周りに、ドットの星（白い四角）をいくつか瞬かせる
・尺：7秒`,

  H.raf(s=>{const k=Math.min(1,s/2);const y=Math.round((-200+k*500)/4)*4;L.style.transform=`translateY(${y}px)`});const fl=H.abs({inset:'0',background:'#fff',opacity:0});H.a(fl,[{opacity:.8},{opacity:0}],{d:200,dl:2000,f:'none'});H.a(L,[{filter:'brightness(1)'},{filter:'brightness(2)'},{filter:'brightness(1)'}],{d:400,dl:2100,f:'none'});
  const ps=H.abs({left:'0',right:'0',top:'600px',textAlign:'center',fontFamily:F.dot,fontSize:'56px',color:'#fff',opacity:0},W,'PRESS START');H.wait(2500,()=>H.a(ps,[{opacity:1},{opacity:0}],{d:1000,e:'steps(2,jump-none)',i:Infinity}));H.abs({left:'0',right:'0',top:'800px',textAlign:'center',fontFamily:F.dot,fontSize:'26px',color:'#888'},W,'© 2026 NOBU MOVIE');
  for(let i=0;i<12;i++){const s=H.abs({left:Math.round(rnd(100,1500)/8)*8+'px',top:Math.round(rnd(60,560)/8)*8+'px',width:'8px',height:'8px',background:'#fff'},W);H.a(s,[{opacity:0},{opacity:1},{opacity:0}],{d:rnd(600,1200),dl:rnd(0,1500),e:'steps(3)',i:Infinity})}
  H.abs({inset:'0',background:'repeating-linear-gradient(rgba(0,0,0,.2) 0 2px,transparent 2px 4px)',pointerEvents:'none'});H.abs({inset:'0',background:'radial-gradient(ellipse,transparent 55%,rgba(0,0,0,.7))',pointerEvents:'none'})}});

defA({no:'29',cat:'GENRE',name:'サスペンス劇場',en:'Suspense Theater',lead:'2時間サスペンスのような、夜の海に赤いタイトルがズームで迫り、不穏な和音が響く。',loop:7000,bg:'#020409',
use:'<b>謎解き企画・推理ゲーム・ドッキリの種明かし</b>の冒頭に。誰もが知る「あの不穏な始まり」で笑いと緊張を誘えます。',
tips:['タイトルは赤い明朝体の太字を、奥から手前へ一気にズームさせる','断崖や夜の海のシルエットを背景に置くと、一気にそれらしく','「ジャジャジャーン」の和音に合わせて、タイトルを止めます'],
p:`2時間サスペンスドラマの冒頭のような、夜の断崖と暗い海を背景に、赤いタイトルが奥から手前へズームで迫って止まる「サスペンスシアター」のオープニングを作ってください。
・タイトル：「{T}」
・背景：深夜の海。上は濃紺の空に満月（雲がかかって、ときどき隠れる）、下は黒い海（月の光の反射が揺れる）。左に断崖のシルエット
・波：海面に、白い細い波の線がゆっくり寄せては返す
・0.5〜1.5秒：カメラがゆっくり断崖に寄る（scale 1 → 1.08）
・1.5〜2.0秒：タイトルを、赤 #D10000 の太い明朝体（Shippori Mincho B1 800、白いにじみ）で、奥から手前へ一気にズーム（scale 0.1 → 1.15 → 1、0.5秒）して画面中央に止める
・2.0秒：止まった瞬間に、画面全体を一瞬赤く染めて（不透明度0.3）戻す。タイトルの両脇に、白い縦書きで「湯けむり」「殺人事件」などの副題
・3.5秒：タイトルの下に、小さく「〜断崖に消えた、ある企画の謎〜」
・尺：7秒`,

  for(let i=0;i<10;i++){const r=H.abs({left:1150+rnd(-120,120)+'px',top:520+i*35+'px',width:rnd(60,180)+'px',height:'4px',background:'#f4f0dc',opacity:.5},W);H.a(r,[{opacity:.15,transform:'translateX(0)'},{opacity:.6,transform:'translateX(20px)'},{opacity:.15,transform:'translateX(0)'}],{d:rnd(1500,2500),i:Infinity})}
  for(let i=0;i<4;i++){const w=H.abs({left:'0',right:'0',top:560+i*80+'px',height:'2px',background:'rgba(255,255,255,.3)'},W);H.a(w,[{transform:'translateY(0) scaleX(.6)'},{transform:'translateY(14px) scaleX(1)'},{transform:'translateY(0) scaleX(.6)'}],{d:3000,dl:i*400,i:Infinity})}
  const svg=H.svg(1600,900,W);H.sv('path',{d:'M0 900 L0 300 L120 310 L260 380 L330 470 L380 560 L420 900 Z',fill:'#000'},svg);H.a(W,[{transform:'scale(1)'},{transform:'scale(1)',offset:.07},{transform:'scale(1.08)',offset:.22},{transform:'scale(1.08)'}],{d:7000,e:'ease-in-out'});
  const B=H.box();const tt=H.el('div',{fontFamily:F.min,fontWeight:'800',fontSize:titleSz(t,170,950)+'px',color:'#d10000',textShadow:'0 0 20px rgba(255,255,255,.5),0 0 4px #fff',whiteSpace:'nowrap'},B,t);H.a(tt,[{transform:'scale(.1)',opacity:0},{transform:'scale(1.15)',opacity:1,offset:.8},{transform:'scale(1)',opacity:1}],{d:500,dl:1500,e:E.in});
  const red=H.abs({inset:'0',background:'#d10000',opacity:0});H.a(red,[{opacity:.35},{opacity:0}],{d:500,dl:2000,f:'none'});[['湯けむり',150],['殺人事件',1400]].forEach(([s,x])=>{const v=H.abs({left:x+'px',top:'300px',writingMode:'vertical-rl',fontFamily:F.min,fontWeight:'800',fontSize:'48px',color:'#fff'},null,s);H.a(v,[{opacity:0},{opacity:1}],{d:500,dl:2100})});
  const sub=H.abs({left:'0',right:'0',top:'620px',textAlign:'center',fontFamily:F.min,fontSize:'34px',color:'#fff'},null,'〜断崖に消えた、ある企画の謎〜');H.a(sub,[{opacity:0},{opacity:1}],{d:800,dl:3500})}});

defA({no:'30',cat:'GENRE',name:'フィルムのカウントダウン',en:'Film Leader',lead:'古い映写機の始まりのような、5・4・3・2・1のカウントと回る扇形、そしてタイトル。',loop:7500,bg:'#1b1b1b',
use:'<b>レトロな映像・思い出のホームビデオ・自主映画の上映</b>の冒頭に。「カタカタ」と回る映写機の音が聞こえてくるような始まり。',
tips:['数字のまわりを、時計の針のように回る扇形が見せ場','フィルムの傷・ちらつき・ゆれを重ねると、一気に本物らしく','最後の「1」の後に一瞬真っ白なコマを入れてからタイトルへ'],
p:`古い映写機でフィルムを上映するときの始まりのような、5・4・3・2・1のカウントダウン（フィルムリーダー）のあとに、タイトルが映る「フィルムリーダー」のオープニングを作ってください。
・タイトル：「{T}」
・背景：セピアがかった灰色。画面の中央に、二重の白い円と十字の照準線
・0.0〜5.0秒：円の中央に、大きな数字（5 → 4 → 3 → 2 → 1、太いセリフ体、黒）を1秒ずつ表示。同時に、円の中で12時から時計回りに、暗い灰色の扇形が1秒で1周する（conic-gradient を回す）
・画面全体に、フィルムのちらつき（明るさ 0.9〜1.1 を0.05秒ごと）、縦の細い傷（白い線、ランダムに現れる）、小さなゴミ（黒い点）、上下の小さなゆれ（±3px）を重ねる
・5.0秒：真っ白なコマを0.1秒
・5.1〜7.0秒：セピア調の画面に、タイトルを細身のセリフ体（Playfair Display、こげ茶、字間広め）で中央にフェードイン。下に「THE END … OR THE BEGINNING」
・尺：7.5秒`,
run(H,t){const W=H.abs({inset:'0',background:'#9a9184'});H.abs({left:'500px',top:'150px',width:'600px',height:'600px',borderRadius:'50%',border:'6px solid #f2ede4',boxSizing:'border-box'},W);H.abs({left:'560px',top:'210px',width:'480px',height:'480px',borderRadius:'50%',border:'4px solid #f2ede4',boxSizing:'border-box'},W);H.abs({left:'0',right:'0',top:'449px',height:'3px',background:'#f2ede4'},W);H.abs({left:'799px',top:'0',bottom:'0',width:'3px',background:'#f2ede4'},W);

  const T=H.abs({left:'0',right:'0',top:'0',bottom:'0',background:'#d9c9a8',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',opacity:0});H.el('div',{fontFamily:"'Playfair Display',serif",fontWeight:'900',fontSize:titleSz(t,140,1100)+'px',color:'#3b2a1a',letterSpacing:'.1em'},T,t);H.el('div',{fontFamily:F.serif,fontSize:'28px',letterSpacing:'.4em',color:'#6b5338',marginTop:'20px'},T,'THE END … OR THE BEGINNING');

defH({no:'01',cat:'CORP',name:'ダークSaaS',en:'Dark Grid & Glow',lead:'黒地に光のグリッド。AI・ITサービスの「今っぽい」定番。',text:'Flowbase',bg:'#06070b',
use:'<b>AIツール・SaaS・アプリ・IT企業</b>のサービスサイトに。暗い背景に光る要素で、先進性と信頼感を同時に出せます。',
tips:['見出しの一部だけグラデーション文字にするのが今風。全部にかけるとくどくなります','背景のグリッドは不透明度5%以下に。主張させないのがコツ','実際の画面（ダッシュボード）の画像を入れる枠は、少し傾けて浮かせると立体感が出ます'],
p:`AI・SaaS向けの、暗い背景に光るグリッドが映える「ダークSaaS」スタイルのサービスサイトを作ってください。
・サービス名：{T}（業務を自動化するAIツールという想定。コピーは自由に考えてOK）
・配色：背景 #06070B、文字 #F4F5F7、サブ文字 #8A8F9C、アクセント #7C5CFF → #2EE6C9 のグラデーション
・フォント：見出し Noto Sans JP 900、英字と数字は Inter Tight または Space Grotesk
・ファーストビュー：
　・背景に60px間隔の細いグリッド線（不透明度0.05）と、上部中央に紫の大きな光（radial-gradient、ぼかし120px）がゆっくり脈打つ
　・小さなバッジ「NEW｜v2.0 リリース」→ 大見出し2行（2行目だけグラデーション文字）→ 説明文 → ボタン2つ（「無料ではじめる」白塗り／「デモを見る」枠線）
　・下に、少し傾けたダッシュボード画面の枠（角丸20px、ガラス風の枠線、内側にグラフと数字のダミーUI）がふわふわ浮く
・セクション：導入企業ロゴの帯（自動で横に流れる）→ 3つの特徴（アイコン付きカード）→ 使い方3ステップ → 料金表（3プラン、真ん中を強調）→ よくある質問（開閉式）→ 最後のCTA → フッター
・動き：見出しは行ごとに下からマスクで現れる。カードはホバーで縁が光る`,
run(H,t){H.abs({inset:'0',backgroundImage:'linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px)',backgroundSize:'60px 60px'});
  const g=H.abs({left:'400px',top:'-300px',width:'800px',height:'600px',borderRadius:'50%',background:'radial-gradient(#7c5cff,transparent 70%)',filter:'blur(60px)',opacity:.7});H.a(g,[{opacity:.5,transform:'scale(1)'},{opacity:.85,transform:'scale(1.1)'},{opacity:.5,transform:'scale(1)'}],{d:4000,e:'ease-in-out',i:Infinity});
  nav(H,{logo:t,items:['機能','料金','導入事例','ブログ'],cta:'無料ではじめる',lf:F.sans});

  const h1=H.el('div',{fontFamily:F.sans,fontWeight:'900',fontSize:'76px',lineHeight:'1.15',color:'#f4f5f7'},c);H.el('div',{},h1,'面倒な定型業務は、');const l2=H.el('div',{backgroundImage:'linear-gradient(90deg,#7c5cff,#2ee6c9)',WebkitBackgroundClip:'text',backgroundClip:'text',color:'transparent'},h1,'AIにまかせよう。');
  const sub=H.el('div',{fontSize:'22px',color:'#8a8f9c'},c,t+' は、毎日の作業を自動でこなすAIアシスタントです。');const bt=H.el('div',{display:'flex',gap:'16px'},c);H.el('div',{padding:'16px 34px',borderRadius:'12px',background:'#fff',color:'#06070b',fontWeight:'700',fontSize:'19px'},bt,'無料ではじめる');H.el('div',{padding:'16px 34px',borderRadius:'12px',border:'1px solid rgba(255,255,255,.3)',fontSize:'19px'},bt,'デモを見る ▶');

  for(let i=0;i<3;i++){const k=H.el('div',{flex:'1',height:'120px',borderRadius:'12px',background:'rgba(255,255,255,.05)',padding:'16px'},card);H.el('div',{fontSize:'14px',color:'#8a8f9c'},k,['処理件数','削減時間','精度'][i]);H.el('div',{fontFamily:F.mono,fontSize:'34px',fontWeight:'700',marginTop:'8px'},k,['12,480','326h','99.2%'][i])}
  H.a(card,[{transform:'perspective(1400px) rotateX(18deg) translateY(120px)',opacity:0},{transform:'perspective(1400px) rotateX(18deg) translateY(0)',opacity:1}],{d:1200,dl:900});H.a(card,[{marginTop:'0px'},{marginTop:'-12px'},{marginTop:'0px'}],{d:3000,dl:2100,e:'ease-in-out',i:Infinity});
}});

defH({no:'02',cat:'CORP',name:'グラスモーフィズム',en:'Glass Fintech',lead:'色の光の上に、すりガラスのカード。お金・アプリ系の上品な定番。',text:'Mint Pay',bg:'#0b1022',
use:'<b>フィンテック・家計簿アプリ・会員サービス</b>に。すりガラスのカードは、スマホアプリのような親しみと高級感を両立します。',
tips:['すりガラスは「背景に色の光があること」が前提。単色背景では効果が出ません','カードの縁に1pxの白い半透明の線を入れると、ガラスの厚みが出ます','数字は等幅フォントにすると、カウントアップ時にガタつきません'],
p:`色の光の上にすりガラスのカードが浮かぶ「グラスモーフィズム」スタイルの、アプリ紹介サイトを作ってください。
・サービス名：{T}（家計簿・キャッシュレス決済アプリという想定）
・配色：背景 #0B1022、光 #5EE6A8・#7FB8FF・#FF8FAB（大きなぼかし円、ゆっくり漂う）、文字 #FFFFFF
・フォント：見出し Zen Kaku Gothic New 700、数字 JetBrains Mono
・ファーストビュー：左に見出し「お金の流れが、ひと目でわかる。」と説明文、App Store／Google Play 風のボタン2つ。右に、すりガラスのカードを3枚重ねて浮かせる（backdrop-filter: blur(24px)、背景 rgba(255,255,255,.08)、縁 1px rgba(255,255,255,.25)、角丸28px）
　・カード1：今月の残高（数字がカウントアップ）とミニグラフ
　・カード2：最近の支払い3件
　・カード3：貯金目標の進捗リング
・セクション：アプリの3つの特徴 → 画面の紹介（スマホ枠が横にスライド）→ 利用者の声（3枚のカード）→ セキュリティの説明 → ダウンロードCTA → フッター
・動き：カードはマウスの位置に合わせて少し傾く（3Dチルト）。光の円はゆっくり位置を変え続ける`,
run(H,t){[['#5ee6a8',200,500,1],['#7fb8ff',1000,150,-1],['#ff8fab',1100,650,1]].forEach(([c,x,y,d])=>{const b=H.abs({left:x+'px',top:y+'px',width:'520px',height:'520px',borderRadius:'50%',background:c,filter:'blur(90px)',opacity:.55,transform:'translate(-50%,-50%)'});H.a(b,[{transform:'translate(-50%,-50%)'},{transform:`translate(${-50+d*12}%,${-50-d*10}%)`},{transform:'translate(-50%,-50%)'}],{d:7000,e:'ease-in-out',i:Infinity})});
  nav(H,{logo:'◎ '+t,items:['機能','安全性','料金'],cta:'ダウンロード',lf:F.zen,ls:'28px'});
  const L=H.abs({left:'110px',top:'230px',width:'640px',display:'flex',flexDirection:'column',gap:'26px'});const h=H.el('div',{fontFamily:F.zen,fontWeight:'700',fontSize:'70px',lineHeight:'1.2'},L,'お金の流れが、\nひと目でわかる。');h.style.whiteSpace='pre-line';
  const s=H.el('div',{fontSize:'22px',color:'rgba(255,255,255,.75)'},L,'レシートを撮るだけで家計簿が完成。'+t+'で、毎月の「なんとなく」をなくしましょう。');const bt=H.el('div',{display:'flex',gap:'14px'},L);['App Store','Google Play'].forEach(x=>H.el('div',{padding:'14px 26px',borderRadius:'14px',background:'#fff',color:'#0b1022',fontWeight:'700',fontSize:'18px'},bt,'▶ '+x));[h,s,bt].forEach((e,i)=>rise(H,e,200+i*150));
  const glass=(x,y,w,hh,dl)=>{const g=H.abs({left:x+'px',top:y+'px',width:w+'px',height:hh+'px',borderRadius:'28px',background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.25)',backdropFilter:'blur(24px)',WebkitBackdropFilter:'blur(24px)',padding:'28px',boxShadow:'0 30px 60px rgba(0,0,0,.25)'});H.a(g,[{transform:'translateY(60px) rotate(-3deg)',opacity:0},{transform:'translateY(0) rotate(0)',opacity:1}],{d:1000,dl});return g};
  const c1=glass(880,200,520,260,500);H.el('div',{fontSize:'18px',opacity:.7},c1,'今月の残高');const num=H.el('div',{fontFamily:F.mono,fontWeight:'700',fontSize:'64px',margin:'6px 0 14px'},c1,'¥0');const gsv=H.svg(460,70,c1,{position:'relative'});H.sv('polyline',{points:'0,60 60,48 120,52 180,30 240,36 300,18 360,24 460,6',fill:'none',stroke:'#5ee6a8','stroke-width':4},gsv);
  const c2=glass(980,500,440,250,750);H.el('div',{fontSize:'18px',opacity:.7,marginBottom:'10px'},c2,'最近の支払い');[['カフェ','−¥620'],['電車','−¥230'],['書店','−¥1,540']].forEach(([a,b])=>{const r=H.el('div',{display:'flex',justifyContent:'space-between',fontSize:'22px',padding:'8px 0',borderBottom:'1px solid rgba(255,255,255,.12)'},c2);H.el('span',{},r,a);H.el('span',{fontFamily:F.mono},r,b)});
  H.raf(s=>{const k=Math.min(1,Math.max(0,(s-.8)/1.6));const e=1-Math.pow(1-k,4);num.textContent='¥'+Math.round(248300*e).toLocaleString()});
}});

defH({no:'03',cat:'CORP',name:'ミニマル・コーポレート',en:'Minimal Corporate',lead:'白い余白と大きな日本語見出し。信頼を語るコンサル・士業向け。',text:'KASUGA & Partners',bg:'#f7f7f5',
use:'<b>コンサル・法律事務所・会計事務所・BtoB企業</b>に。余白を大きくとるだけで「格」が出ます。派手さより信頼を伝えたいときに。',
tips:['見出しは左揃え・特大（画面幅の6〜7%）にして、余白を恐れないこと','色はほぼ黒と白だけ。アクセントは1色を細い線にだけ使います','数字（創業年・実績件数）を大きく見せると、言葉より説得力が出ます'],
p:`余白を大きくとった、上品で信頼感のある「ミニマル・コーポレート」スタイルの企業サイトを作ってください。
・会社名：{T}（経営コンサルティング会社という想定）
・配色：背景 #F7F7F5、文字 #111111、サブ文字 #777777、アクセント #1F4FD8（細い線と小さなラベルだけに使う）
・フォント：見出し Noto Sans JP 700（字間を少し詰める）、英字ラベル JetBrains Mono
・ファーストビュー：左寄せの特大見出し「変化を、成長の理由に。」（画面幅の6.5%）。上に小さく「MANAGEMENT CONSULTING」。下に細い横線（左から伸びる）と、説明文・「お問い合わせ」のテキストリンク（→付き）。右下に「01 戦略／02 組織／03 実行」の縦並びの番号付きメニュー
・セクション：私たちについて（左に大きな数字「1998」創業年、右に文章）→ サービス3つ（番号01〜03と細い罫線で区切る）→ 実績の数字（カウントアップ）→ 代表メッセージ → ニュース一覧 → お問い合わせ → フッター
・動き：見出しは1行ずつマスクで下から現れる。罫線は左から右へ伸びる。それ以外はほとんど動かさない（上品さ優先）`,
run(H,t){nav(H,{logo:t,items:['私たちについて','サービス','実績','採用'],c:'#111',lf:"'Cormorant Garamond',serif",ls:'30px',cta:'お問い合わせ',cb:'#111',cc:'#fff'});
  const L=H.abs({left:'120px',top:'230px',display:'flex',flexDirection:'column',gap:'26px',color:'#111'});H.el('div',{fontFamily:F.mono,fontSize:'17px',letterSpacing:'.2em',color:'#1f4fd8'},L,'MANAGEMENT CONSULTING');
  ['変化を、','成長の理由に。'].forEach((x,i)=>{const m=H.el('div',{overflow:'hidden'},L);const e=H.el('div',{fontFamily:F.sans,fontWeight:'700',fontSize:'104px',lineHeight:'1.15',letterSpacing:'-.02em'},m,x);H.a(e,[{transform:'translateY(110%)'},{transform:'translateY(0)'}],{d:1000,dl:300+i*150})});
  const ln=H.el('div',{width:'620px',height:'1px',background:'#111',transformOrigin:'0 50%'},L);H.a(ln,[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{d:1200,dl:900,e:'cubic-bezier(.65,0,.35,1)'});
  const s=H.el('div',{fontSize:'20px',color:'#777',maxWidth:'620px',lineHeight:'1.8'},L,'事業の転換期にこそ、外からの視点が力になります。戦略づくりから現場の実行まで、伴走します。');rise(H,s,1200);
  const lk=H.el('div',{fontSize:'20px',fontWeight:'700'},L,'お問い合わせ →');rise(H,lk,1350);
  const R=H.abs({right:'120px',bottom:'110px',display:'flex',flexDirection:'column',gap:'18px',color:'#111'});[['01','戦略'],['02','組織'],['03','実行']].forEach(([n,x],i)=>{const r=H.el('div',{display:'flex',gap:'24px',alignItems:'baseline',borderTop:'1px solid #ccc',paddingTop:'14px',width:'340px'},R);H.el('span',{fontFamily:F.mono,color:'#1f4fd8',fontSize:'16px'},r,n);H.el('span',{fontSize:'28px',fontWeight:'700'},r,x);rise(H,r,1400+i*120)});
}});

defH({no:'04',cat:'CORP',name:'モーフィングブロブ',en:'Morphing Blob',lead:'中央でうねる光のかたまり。AI・新規事業の「未来感」を一瞬で。',text:'NOVA AI',bg:'#0a0a12',
use:'<b>AIスタートアップ・新規事業・研究開発・イベント</b>に。形の定まらないブロブは「進化」「可能性」を象徴します。',
tips:['ブロブは border-radius の8つの値をアニメーションさせるだけで作れます','色は2〜3色のグラデーション。紫×ライムなど意外な組み合わせが今っぽい','ブロブの上に見出しを重ねるなら、mix-blend-mode: difference で反転させるとおしゃれ'],
p:`画面中央でゆっくり形を変える光のかたまり（ブロブ）が主役の、「モーフィングブロブ」スタイルのスタートアップサイトを作ってください。

・配色：背景 #0A0A12、ブロブ #7C5CFF → #C6F432 → #38D6FF のグラデーション、文字 #FFFFFF
・フォント：見出し Dela Gothic One、英字 Space Grotesk
・ファーストビュー：
　・中央に直径560pxのブロブ。border-radius の8つの値を8秒周期で変化させてうねらせ、同時にゆっくり回転。ぼかし2px、外側に同色の光（box-shadow 0 0 120px）
　・ブロブの上に、特大の英字見出し「THINK BEYOND」（mix-blend-mode: difference）と、日本語のサブコピー「AIで、まだ誰も見たことのない答えを。」
　・画面の四隅に小さな情報（左上ロゴ、右上メニュー、左下「SCROLL ↓」、右下「EST. 2026」）
・セクション：ミッション（大きな文字が1語ずつ明るくなる）→ プロダクト3つ（ホバーでブロブが形を変えるカード）→ チーム紹介 → 採用 → ニュース → フッター
・動き：マウスを動かすとブロブが少し追いかけてくる`,
run(H,t){const b=H.abs({left:'520px',top:'170px',width:'560px',height:'560px',background:'linear-gradient(135deg,#7c5cff,#c6f432 55%,#38d6ff)',boxShadow:'0 0 120px rgba(124,92,255,.6)',filter:'blur(2px)'});
  H.a(b,[{borderRadius:'42% 58% 70% 30% / 45% 45% 55% 55%',transform:'rotate(0deg)'},{borderRadius:'70% 30% 46% 54% / 30% 39% 61% 70%',transform:'rotate(120deg)'},{borderRadius:'31% 69% 39% 61% / 61% 64% 36% 39%',transform:'rotate(240deg)'},{borderRadius:'42% 58% 70% 30% / 45% 45% 55% 55%',transform:'rotate(360deg)'}],{d:8000,e:'ease-in-out',i:Infinity});
  H.a(b,[{opacity:0,scale:.6},{opacity:1,scale:1}],{d:1400,f:'none'});
  nav(H,{logo:t,items:['Research','Product','Careers'],lf:F.heavy});
  const h=H.abs({left:'0',right:'0',top:'330px',textAlign:'center',fontFamily:F.heavy,fontSize:'150px',color:'#fff',mixBlendMode:'difference',letterSpacing:'.02em'},null,'THINK BEYOND');rise(H,h,400,1000);
  const s=H.abs({left:'0',right:'0',top:'540px',textAlign:'center',fontSize:'26px',color:'#fff'},null,'AIで、まだ誰も見たことのない答えを。');rise(H,s,700);
  [['SCROLL ↓',{left:'70px',bottom:'50px'}],['EST. 2026',{right:'70px',bottom:'50px'}]].forEach(([x,c],i)=>{const e=H.abs(Object.assign({fontFamily:F.mono,fontSize:'16px',letterSpacing:'.2em',color:'rgba(255,255,255,.6)'},c),null,x);rise(H,e,900+i*100)});
}});

defH({no:'05',cat:'CORP',name:'ベントーグリッド',en:'Bento Grid',lead:'大小のカードをお弁当箱のように詰める。機能紹介に最適。',text:'Taskly',bg:'#f2f3f7',

p:`大小のカードをお弁当箱のように隙間なく並べる「ベントーグリッド」スタイルの、製品・機能紹介サイトを作ってください。
・製品名：{T}（チームで使うタスク管理アプリという想定）
・配色：背景 #F2F3F7、カード #FFFFFF、文字 #111827、アクセント #5AA9FF、濃いカード #111827（文字白）
・フォント：見出し Noto Sans JP 900、数字 Space Grotesk
・ファーストビュー：上部に中央揃えの見出し「チームの仕事が、ぜんぶここに。」とボタン。その下に、4列×2行のベントーグリッド（gap 16px、角丸24px）
　・大きいカード（2列×2行）：アプリ画面の枠（タスクのリストがゆっくりスクロール）
　・濃いカード：大きな数字「3.2倍」と「作業スピード」
　・アクセント色のカード：「AIが自動で振り分け」とアイコン
　・ほかのカード：連携アプリのアイコン群、利用者数、カレンダー表示など
・セクション：ベントーグリッドの機能紹介（もう1セット）→ 導入事例 → 料金 → FAQ → CTA → フッター
・動き：カードはスクロールで少しずつ時間差で現れる（scale 0.95 → 1、不透明度 0 → 1）。ホバーで少し浮く`,

  H.a(lst,[{transform:'translateY(0)'},{transform:'translateY(-180px)'},{transform:'translateY(0)'}],{d:7000,dl:1000,e:'ease-in-out'});
  const d=card({background:'#111827',color:'#fff'},550);H.el('div',{fontFamily:F.heavy,fontSize:'72px'},d,'3.2倍');H.el('div',{opacity:.7,fontSize:'18px'},d,'作業スピード（当社調べ）');

  const ic=card({},750);H.el('div',{fontWeight:'700',fontSize:'18px',marginBottom:'12px'},ic,'連携アプリ');const row=H.el('div',{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'10px'},ic);['#ff8fab','#5ee6a8','#f2c94c','#a78bfa','#38d6ff','#ff9a3c'].forEach(c=>H.el('div',{height:'54px',borderRadius:'14px',background:c},row));
  const u=card({},850);H.el('div',{fontFamily:F.heavy,fontSize:'56px'},u,'12万');H.el('div',{color:'#6b7280',fontSize:'18px'},u,'チームが利用中');
}});

defH({no:'06',cat:'CREATOR',name:'ネオブルータリズム',en:'Neo Brutalism',lead:'太い黒フチ、原色、ずらした影。個性で記憶に残すクリエイター向け。',text:'MOJI WORKS',bg:'#fff4d6',

p:`太い黒フチと原色、ずらした黒い影が特徴の「ネオブルータリズム」スタイルのクリエイターサイトを作ってください。

  const mq=H.abs({left:'0',right:'0',bottom:'0',height:'64px',background:'#000',display:'flex',alignItems:'center',overflow:'hidden'});const tr=H.el('div',{display:'flex',whiteSpace:'nowrap',fontFamily:F.heavy,fontSize:'26px',color:'#ffc24b'},mq);for(let i=0;i<8;i++)H.el('span',{paddingRight:'50px'},tr,'THE MIDNIGHTS ★ 夕凪バンド ★ DJ KAI ★ LUNA SOUND ★');H.a(tr,[{transform:'translateX(0)'},{transform:'translateX(-25%)'}],{d:9000,e:E.lin,i:Infinity});
}});

defH({no:'16',cat:'LOCAL',name:'和モダン旅館',en:'Japanese Modern Inn',lead:'藍色、縦書き、金の細線、霧。旅館・料亭・和菓子店に。',text:'湯宿 しずく',bg:'#14213d',
use:'<b>旅館・料亭・和菓子店・神社仏閣・着物レンタル</b>に。日本の美意識を、モダンに上品に伝えられます。',
tips:['縦書きの見出しを1つ置くだけで、一気に和の格が出ます','色は藍・生成り・金の3色まで。多色にすると和の静けさが消えます','霧（白いぼかし）をゆっくり流すと、温泉や山の空気感が出ます'],
p:`藍色と縦書き、金の細い線が美しい「和モダン」スタイルの旅館のサイトを作ってください。

・ファーストビュー：
　・全面に、藍色の夜の山並みのシルエット（SVGの重なった山、奥ほど明るい藍）と、ゆっくり左右に流れる白い霧（ぼかした白い楕円、不透明度0.15）
　・右側に、縦書きの大きな見出し「湯けむりに、ほどける夜。」（1文字ずつ上からにじむように現れる）
　・左下に、宿の名前と「ONSEN RYOKAN — SINCE 1925」、金の細い線（左から伸びる）
　・右下に、縦長の「ご予約」ボタン（金の枠線）
　・空に、小さな月（生成り色の円、光のにじみ）
・セクション：宿について（縦書きの文章と写真枠）→ 客室（3タイプ、料金）→ 温泉 → お料理（季節の献立）→ アクセス → ご予約 → フッター
・動き：すべてゆっくり（1.5〜2秒）。和紙のようなざらつきを全体にうっすら重ねる`,
run(H,t){const sv=H.svg(1600,900);[['#1f3157',560],['#18284a',650],['#101a33',740]].forEach(([c,y],i)=>{let d=`M0 ${y}`;for(let x=0;x<=1600;x+=200)d+=` Q ${x+100} ${y-120+i*20+Math.sin(x+i)*40} ${x+200} ${y}`;d+=' V900 H0Z';H.sv('path',{d,fill:c},sv)});
  const moon=H.abs({left:'1240px',top:'120px',width:'90px',height:'90px',borderRadius:'50%',background:'#f3eee3',boxShadow:'0 0 60px rgba(243,238,227,.5)'});H.a(moon,[{opacity:0},{opacity:1}],{d:2000});
  for(let i=0;i<3;i++){const m=H.abs({left:'-400px',top:500+i*100+'px',width:'1400px',height:'160px',borderRadius:'50%',background:'#fff',opacity:.12,filter:'blur(40px)'});H.a(m,[{transform:'translateX(0)'},{transform:'translateX(900px)'},{transform:'translateX(0)'}],{d:14000+i*3000,e:'ease-in-out',i:Infinity})}
  nav(H,{logo:'',items:['宿について','客室','温泉','お料理'],f:F.min,c:'#f3eee3'});

  const L=H.abs({left:'110px',bottom:'110px',color:'#f3eee3',display:'flex',flexDirection:'column',gap:'14px'});H.el('div',{fontFamily:F.min,fontWeight:'800',fontSize:'56px',letterSpacing:'.15em'},L,t);H.el('div',{fontFamily:F.serif,fontSize:'18px',letterSpacing:'.35em',color:'#c9a45c'},L,'ONSEN RYOKAN — SINCE 1925');const gl=H.el('div',{width:'360px',height:'1px',background:'#c9a45c',transformOrigin:'0 50%'},L);H.a(gl,[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{d:1800,dl:1200,e:'cubic-bezier(.65,0,.35,1)'});H.a(L,[{opacity:0},{opacity:1}],{d:1800,dl:400});
  const rv=H.abs({right:'110px',bottom:'110px',writingMode:'vertical-rl',padding:'30px 18px',border:'1px solid #c9a45c',color:'#c9a45c',fontFamily:F.min,fontWeight:'800',fontSize:'24px',letterSpacing:'.4em'},null,'ご予約');H.a(rv,[{opacity:0},{opacity:1}],{d:1800,dl:1600});
}});

defH({no:'17',cat:'LOCAL',name:'クリニック',en:'Clean Clinic',lead:'白と青緑、丸いカード、予約ボタンが目立つ。医療・整体・歯科に。',text:'みどり皮フ科クリニック',bg:'#f4fbfa',
use:'<b>クリニック・歯科・整骨院・動物病院・保育施設</b>に。清潔感と安心感、そして「すぐ予約できる」導線を重視した型です。',

p:`清潔感と安心感を最優先にした、予約しやすい「クリニック」スタイルの医療機関サイトを作ってください。

・フォント：Zen Kaku Gothic New（見出し700、本文400、本文は18px以上で読みやすく）
・ファーストビュー：

　・下に、丸いアイコン付きのバッジ3つ「駅から徒歩2分」「土曜も診療」「キャッシュレス対応」
・セクション：お知らせ → 診療時間の表（曜日×午前/午後、休診は「—」）→ 診療内容（アイコン付きカード6つ）→ 医師紹介 → 初めての方へ（流れ4ステップ）→ アクセス（地図枠）→ フッター。スマホでは画面下に「Web予約」「電話」を固定
・動き：控えめなフェードインのみ`,
run(H,t){nav(H,{logo:'✚ '+t,items:['診療案内','医師紹介','アクセス'],c:'#23322f',lf:F.zen,ls:'24px',cta:'Web予約',cb:'#1e9e8e',cc:'#fff'});
  const L=H.abs({left:'110px',top:'200px',width:'700px',display:'flex',flexDirection:'column',gap:'24px',color:'#23322f'});H.el('div',{fontFamily:F.zen,fontWeight:'700',fontSize:'64px',lineHeight:'1.35'},L,'肌の悩みに、\nていねいに寄り添う。').style.whiteSpace='pre-line';
  H.el('div',{fontSize:'21px',lineHeight:'1.9',color:'#4f615d'},L,'ニキビ・湿疹・アトピーなど、肌のことなら何でもご相談ください。小さなお子さまの診療も行っています。');

  const bg=H.el('div',{display:'flex',gap:'14px',marginTop:'10px'},L);['駅から徒歩2分','土曜も診療','キャッシュレス対応'].forEach(x=>{const b=H.el('div',{display:'flex',alignItems:'center',gap:'8px',background:'#fff',borderRadius:'999px',padding:'8px 16px 8px 8px',fontSize:'16px',boxShadow:'0 4px 14px rgba(15,94,87,.08)'},bg);H.el('span',{width:'28px',height:'28px',borderRadius:'50%',background:'#d5f0ec',display:'inline-block'},b);H.el('span',{},b,x)});[...L.children].forEach((e,i)=>rise(H,e,200+i*150,1000));
  const ph=H.abs({left:'900px',top:'150px',width:'600px',height:'640px',borderRadius:'40px',background:'linear-gradient(160deg,#d5f0ec,#9bd6cd 60%,#5fb7aa)'});H.a(ph,[{opacity:0,transform:'translateY(30px)'},{opacity:1,transform:'translateY(0)'}],{d:1200});
  const cd=H.abs({left:'820px',top:'560px',width:'380px',padding:'24px 28px',borderRadius:'24px',background:'#fff',boxShadow:'0 20px 50px rgba(15,94,87,.15)',color:'#23322f'});H.el('div',{fontSize:'16px',color:'#1e9e8e',fontWeight:'700'},cd,'● 本日の診療');H.el('div',{fontFamily:F.mono,fontSize:'34px',fontWeight:'700',margin:'6px 0'},cd,'9:00 – 18:00');H.el('div',{fontSize:'17px',color:'#4f615d'},cd,'現在の待ち時間 約15分');
  H.a(cd,[{transform:'translateY(0)'},{transform:'translateY(-12px)'},{transform:'translateY(0)'}],{d:4000,dl:1200,e:'ease-in-out',i:Infinity});rise(H,cd,700);

defH({no:'18',cat:'LOCAL',name:'フィットネスジム',en:'Dynamic Fitness',lead:'黒と赤、斜めの帯、太い斜体文字。勢いで入会させるジム向け。',text:'IRON PULSE GYM',bg:'#0c0c0c',
use:'<b>ジム・パーソナルトレーニング・格闘技・スポーツチーム</b>に。斜めの構図と太い文字で、エネルギーと勢いを伝えます。',
tips:['見出しは太い斜体（italic）にするだけでスピード感が出ます','背景に斜めの帯を1本入れると、画面全体に動きが生まれます','「体験無料」「入会金0円」など数字の特典は大きく、赤で'],
p:`黒と赤、斜めの構図と太い斜体の文字で勢いを出す「ダイナミック・フィットネス」スタイルのジムのサイトを作ってください。
・ジム名：{T}（24時間営業のトレーニングジムという想定）
・配色：背景 #0C0C0C、赤 #E63946、白 #FFFFFF、グレー #8A8A8A
・フォント：見出し Dela Gothic One（transform: skewX(−10°) で斜体風に）、英字 Anton または Archivo Black、数字 Space Mono
・ファーストビュー：
　・画面を斜め（−12°）に横切る赤い太帯。帯の上に白い大文字「NO LIMIT.」が流れる
　・左に、特大の斜体見出し「昨日の自分を、超えていけ。」と、赤い丸のバッジ「体験 0円」
　・右に、トレーニングする人の写真枠（暗いグラデーションと赤い光）を斜めに切り抜いて配置（clip-path）
　・下に、実績の数字3つ「会員 2,400人」「24時間営業」「マシン 80台」（カウントアップ）
　・「無料体験を予約」ボタン（赤、ホバーで矢印が右へ動く）
・セクション：選ばれる理由（3つ）→ 料金プラン（3つ、おすすめを赤で強調）→ トレーナー紹介 → 会員のビフォーアフター → 施設紹介 → アクセス → フッター
・動き：要素は斜め下から勢いよく入ってくる（translate と skew を戻す）`,
run(H,t){const band=H.abs({left:'-200px',top:'560px',width:'2000px',height:'130px',background:'#e63946',transform:'rotate(-12deg)',overflow:'hidden',display:'flex',alignItems:'center'});const tr=H.el('div',{display:'flex',whiteSpace:'nowrap',fontFamily:F.heavy,fontSize:'74px',color:'#0c0c0c',fontStyle:'italic'},band);for(let i=0;i<8;i++)H.el('span',{paddingRight:'60px'},tr,'NO LIMIT. PUSH HARDER.');H.a(tr,[{transform:'translateX(0)'},{transform:'translateX(-25%)'}],{d:8000,e:E.lin,i:Infinity});
  H.a(band,[{transform:'rotate(-12deg) translateX(-2000px)'},{transform:'rotate(-12deg) translateX(0)'}],{d:800,dl:200});
  const ph=H.abs({left:'900px',top:'0',width:'700px',height:'900px',clipPath:'polygon(25% 0,100% 0,100% 100%,0 100%)',background:'linear-gradient(200deg,#3a1215,#0c0c0c 70%)'});H.abs({left:'250px',top:'200px',width:'380px',height:'380px',borderRadius:'50%',background:'#e63946',filter:'blur(110px)',opacity:.6},ph);H.a(ph,[{transform:'translateX(300px)',opacity:0},{transform:'translateX(0)',opacity:1}],{d:900});
  nav(H,{logo:t,items:['料金','トレーナー','施設'],lf:F.heavy,cta:'無料体験',cb:'#e63946',cc:'#fff'});
  const h=H.abs({left:'100px',top:'150px',fontFamily:F.heavy,fontSize:'96px',lineHeight:'1.15',color:'#fff',transform:'skewX(-10deg)'},null,'昨日の自分を、\n超えていけ。');h.style.whiteSpace='pre-line';H.a(h,[{transform:'skewX(-25deg) translate(-120px,60px)',opacity:0},{transform:'skewX(-10deg) translate(0,0)',opacity:1}],{d:700,dl:300,e:E.out});
  const bd=H.abs({left:'760px',top:'130px',width:'150px',height:'150px',borderRadius:'50%',background:'#e63946',color:'#fff',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',fontFamily:F.heavy,fontSize:'22px',transform:'rotate(12deg)'});H.el('div',{},bd,'体験');H.el('div',{fontSize:'52px',lineHeight:'1'},bd,'0円');H.a(bd,[{transform:'rotate(12deg) scale(0)'},{transform:'rotate(12deg) scale(1)'}],{d:500,dl:900,e:E.back});
  const st=H.abs({left:'100px',bottom:'70px',display:'flex',gap:'60px'});const nums=[];[['会員',2400,'人'],['営業',24,'時間'],['マシン',80,'台']].forEach(([l,n,u])=>{const b=H.el('div',{},st);H.el('div',{fontSize:'17px',color:'#8a8a8a'},b,l);const v=H.el('div',{fontFamily:F.smono,fontSize:'52px',color:'#fff'},b,'0');nums.push([v,n,u])});rise(H,st,600);
  H.raf(s=>{const k=Math.min(1,Math.max(0,(s-.8)/1.4));const e=1-Math.pow(1-k,3);nums.forEach(([v,n,u])=>v.textContent=Math.round(n*e).toLocaleString()+u)});
}});

defH({no:'19',cat:'LOCAL',name:'レストラン',en:'Fullscreen Dining',lead:'全画面の料理写真がゆっくり寄っていく。予約を取りたい飲食店に。',text:'Trattoria Sole',bg:'#120c08',
use:'<b>レストラン・バー・ビストロ・ホテルのダイニング</b>に。写真の力で「食べたい」「行きたい」を直感的に引き出します。',
tips:['写真がゆっくり拡大していく（Ken Burns効果）だけで、映像のような高級感が出ます','文字は写真の上に置くので、下から黒のグラデーションを敷いて読みやすく','予約ボタンは、ページのどこにいても押せるように右上に固定'],
p:`全画面の料理写真がゆっくり寄っていく、映画のような「フルスクリーン・ダイニング」スタイルのレストランサイトを作ってください。
・店名：{T}（薪窯のあるイタリアンレストランという想定）
・配色：背景 #120C08、文字 #F5EBDD、アクセント #D98E48（薪の火の色）
・フォント：店名 Cormorant Garamond の斜体、日本語 Shippori Mincho B1
・ファーストビュー：
　・画面全体に料理の写真（今は暖色のグラデーションと、皿に見える円で代用）。8秒かけて scale 1 → 1.12 へゆっくり拡大（Ken Burns効果）
　・写真の下半分に、黒への縦グラデーションを敷く
　・左下に、斜体の店名（特大）と「薪窯で焼く、ナポリの味。」、営業時間
　・右上に固定の「ご予約」ボタン（アクセント色）、右下に「MENU ／ COURSE ／ ACCESS」
　・薪の火の粉のような小さな光の点が、下からゆっくり舞い上がる
・セクション：シェフのこだわり → メニュー（前菜・パスタ・ピッツァ・ドルチェ、価格付き）→ コース料理 → 店内の様子（写真ギャラリー）→ アクセスと営業時間 → ご予約フォーム → フッター
・動き：ゆっくりしたフェードとズームのみ`,
run(H,t){const ph=H.abs({inset:'0',background:'radial-gradient(circle at 60% 45%,#6b3a1d,#2b170c 60%,#120c08)'});H.abs({left:'760px',top:'160px',width:'560px',height:'560px',borderRadius:'50%',background:'radial-gradient(circle at 45% 40%,#f2e6d4,#d9c4a5 55%,#a88660 70%,transparent 72%)'},ph);H.abs({left:'880px',top:'280px',width:'320px',height:'320px',borderRadius:'50%',background:'radial-gradient(circle,#c8452b,#9a2f1c 60%,#e8b04b 70%,transparent 72%)'},ph);
  H.a(ph,[{transform:'scale(1)'},{transform:'scale(1.12)'}],{d:7000,e:E.lin});H.abs({inset:'0',background:'linear-gradient(transparent 35%,rgba(18,12,8,.95))'});
  const c=H.canvas();const x=c.getContext('2d');const P=[...Array(40)].map(()=>({x:rnd(0,1600),y:rnd(300,900),v:rnd(20,60),r:rnd(1.5,3.5)}));let last=0;H.raf(s=>{const dt=s-last;last=s;x.clearRect(0,0,1600,900);P.forEach(p=>{p.y-=p.v*dt;if(p.y<200)p.y=900;x.globalAlpha=(p.y-200)/700;x.fillStyle='#d98e48';x.beginPath();x.arc(p.x+Math.sin(s+p.r)*10,p.y,p.r,0,7);x.fill()})});
  nav(H,{logo:'',items:['MENU','COURSE','ACCESS'],f:F.serif,cta:'ご予約',cb:'#d98e48',cc:'#120c08'});
  const L=H.abs({left:'100px',bottom:'90px',color:'#f5ebdd',display:'flex',flexDirection:'column',gap:'14px'});H.el('div',{fontFamily:F.serif,fontStyle:'italic',fontWeight:'700',fontSize:fs(t,140,1100)+'px',lineHeight:'1'},L,t);H.el('div',{fontFamily:F.min,fontWeight:'800',fontSize:'32px',letterSpacing:'.1em'},L,'薪窯で焼く、ナポリの味。');H.el('div',{fontFamily:F.mono,fontSize:'18px',color:'#d98e48',letterSpacing:'.1em'},L,'LUNCH 11:30–14:30 ／ DINNER 17:30–22:00');
  [...L.children].forEach((e,i)=>H.a(e,[{opacity:0,transform:'translateY(20px)'},{opacity:1,transform:'translateY(0)'}],{d:1600,dl:400+i*250,e:E.soft}));
}});

defH({no:'20',cat:'LOCAL',name:'手描きナチュラル',en:'Hand-drawn Kids',lead:'クレヨンのような線と、ぽよんと弾む図形。教室・保育・子ども向けに。',text:'こどもアトリエ そらいろ',bg:'#fffaf0',
use:'<b>子ども向け教室・保育園・学童・習い事・家族向けイベント</b>に。手描きの線とカラフルな形で、親しみやすさと楽しさを伝えます。',
tips:['線をわざとガタガタ（SVGのノイズ）にすると、手描きのぬくもりが出ます','色は4〜5色のパステルを、図形ごとに使い分けると楽しい','図形がぽよんと弾む動きは、子ども向けサイトとの相性が抜群'],
p:`クレヨンで描いたような線と、ぽよんと弾むカラフルな図形が楽しい「手描きナチュラル」スタイルの子ども教室のサイトを作ってください。

p:`ネイルサロンのショップカード（表）とスタンプカード（裏）を、名刺サイズ（91×55mm、横向き）の2面で、金箔のような上品なデザインで作ってください。

p:`【スタイル】やわらかいタッチのイラスト（ここを好きな画風に書き換える）

・色：写真の色を少し明るく、彩度を少し上げる
・光：写真の光の向きを保つ
・背景：写真と同じ場所を、同じ画風で簡略化して描く
【必ず残すもの】顔の形とパーツの位置、髪型、服の形と色、ポーズ、写真の構図
【避けるもの】写真のような質感、顔の形が変わること、余計な人物や物の追加`,

p:`【スタイル】子どもが塗りやすい、白い紙に黒い線だけの「塗り絵（線画）」
【描き方】
・線：黒一色、太さは均一でやや太め（3〜4px相当）。線は途切れずに閉じた形にして、色を塗る範囲がはっきり分かるようにする
・塗り：一切塗らない。影・グレー・ハッチング（斜線）も入れない
・細部：髪の毛や服のしわは、主要な線だけに簡略化する
・背景：主要な形だけを残して簡略化。細かい模様は省く
・紙：真っ白な背景
【避けるもの】色、グレーの影、細かすぎる線、ぼやけた線`,
enp:'Convert the attached photo into a clean black and white coloring page. Bold uniform black outlines (3-4px), closed shapes, no shading, no gray, no hatching. Simplify hair, clothing folds and background details. Pure white background, printable.'});

defI({no:'05',cat:'BASIC',name:'季節を変える',en:'Season Swap',lead:'同じ場所・同じ構図のまま、夏を冬に、春を秋に描き変える。',
before:'夏に撮った公園・街・家の前の写真',after:'同じ構図のまま、雪が積もった冬のイラスト',kw:['構図キープ','季節の要素を追加','光の色を変える','服装も季節に'],pal:['#e0fbfc','#c2dfe3','#9db4c0','#5c6b73','#253237'],tools:[GPT,GEM,FF],
use:'<b>季節のあいさつ・年賀状・お店の季節告知</b>に。同じ写真を4季節ぶん作ると、SNSのシリーズ投稿にもなります。',
tips:['「光の色」まで変えるのがコツ（冬は青白く、秋は夕方のオレンジ）','人物がいる場合は「服装も季節に合わせて」と追加','4季節を1枚にまとめる（4分割）のも人気です'],
p:`【スタイル】写真と同じ場所・同じ構図・同じアングルのまま、季節を「冬」に変えたイラスト（季節は書き換え可：春・夏・秋・冬）
【描き方】
・季節の要素：屋根や地面、木の枝に雪を積もらせ、空からやさしく雪を降らせる。吐く息を白く
・光：冬の午後らしい、青白くやわらかい光
・色：全体を寒色寄りに。窓や街灯だけ暖かいオレンジで灯す
・人物：顔と体はそのまま、服装をコート・マフラーなど冬の装いに変える
・画風：やわらかい水彩タッチのイラスト
【避けるもの】建物や道の形・位置の変化、構図の変化`,
enp:'Redraw the attached photo as the same place, same composition and camera angle, but in winter: snow on roofs, ground and branches, gentle snowfall, visible breath, pale blue soft afternoon light, cool palette with warm orange windows and street lamps. People keep their faces and poses but wear coats and scarves. Soft watercolor illustration.'});

defI({no:'06',cat:'BASIC',name:'昼を夜のネオン街に',en:'Day to Neon Night',lead:'昼間の街の写真を、ネオンが光るエモい夜景イラストに。',
before:'昼間の商店街・駅前・ビルの写真',after:'看板がネオンに光る、雨上がりの夜の街',kw:['夜景化','ネオン','濡れた路面の反射','シネマティック'],pal:['#0b0f2b','#3a0ca3','#f72585','#4cc9f0','#ffd166'],tools:[GPT,GEM,MJ],
use:'<b>音楽・MVのサムネ、エモいSNS投稿、ゲームの背景素材</b>に。ありふれた街の写真が、映画のワンシーンに変わります。',
tips:['「雨上がりで路面が濡れている」と入れると、ネオンの反射が映えて一気にエモくなります','ネオンの色はピンク×水色が定番、紫×オレンジでレトロに','看板の文字は崩れやすいので、文字は入れない指示が安全'],
p:`【スタイル】写真の街並みを、ネオンが光る雨上がりの夜の街に描き変えたシネマティックなイラスト
【描き方】
・時間：深夜。空は深い紺〜紫のグラデーション
・光：看板・窓・街灯をネオン（ピンク #F72585、水色 #4CC9F0、黄色）で光らせ、まわりに光のにじみ（グロー）を出す
・路面：雨上がりで濡れていて、ネオンの光が反射して縦に伸びる
・空気：うっすら霧がかかり、光の筋が見える
・構図：建物の形・配置・遠近は写真のまま
・看板の文字：読める文字は入れず、光る模様だけにする
【避けるもの】昼間の光、建物の形の変化、読める文字`,
enp:'Transform the attached daytime street photo into a cinematic rainy night scene. Deep navy-purple sky, neon signs and windows glowing pink (#F72585), cyan (#4CC9F0) and yellow with soft bloom, wet asphalt with long neon reflections, light fog and light rays. Keep buildings, layout and perspective identical. No readable text on signs.'});

defI({no:'07',cat:'BASIC',name:'服装・髪型だけ変える',en:'Outfit Change',lead:'顔とポーズはそのまま、服や髪型だけを着せ替える。',
before:'正面に近い人物の全身〜上半身の写真',after:'同じ顔・同じポーズで、別の衣装を着たイラスト',kw:['顔キープ','ポーズキープ','着せ替え','コスプレ風'],pal:['#22223b','#4a4e69','#9a8c98','#c9ada7','#f2e9e4'],tools:[GPT,GEM],
use:'<b>コスプレの試着・制服や衣装のイメージ確認・キャラ作り</b>に。「この服を着たらどう見える？」をすぐに試せます。',
tips:['衣装は「色・素材・形」の3点で指定すると思いどおりになりやすい','髪型も変えるなら「髪の長さと色」を具体的に','実写のまま着せ替えたいときは、【スタイル】を「写真のまま」に変える'],
p:`【スタイル】顔・表情・体型・ポーズは写真のまま、服装と髪型だけを変えたイラスト
【変更内容】（書き換えて使う）
・服装：深い紺色のブレザーに、白いシャツと赤いネクタイの制服（素材はウール）
・髪型：肩までの長さ、こげ茶色、ゆるいウェーブ
【描き方】
・顔：目・鼻・口の形と位置、肌の色を写真のまま残す
・ポーズ：手足の位置・体の向きを写真のまま
・画風：きれいな線と、やわらかい影のアニメ風イラスト
・背景：写真の背景をそのまま同じ画風で
【避けるもの】顔立ちの変化、体型の変化、ポーズの変化`,
enp:'Keep the face, expression, body shape and pose of the person in the attached photo. Change only the outfit to a navy wool blazer school uniform with white shirt and red tie, and the hair to shoulder-length dark brown loose waves. Clean anime-style illustration with soft shading, same background redrawn in the same style.'});

defI({no:'08',cat:'BASIC',name:'古い写真をカラーで蘇らせる',en:'Restore & Colorize',lead:'色あせたモノクロ写真を、鮮やかなカラーのイラストに描き起こす。',
before:'昔のモノクロ写真・色あせた家族写真',after:'傷やシミが消え、当時の色を想像して塗られたイラスト',kw:['修復','カラー化','傷・シミ除去','当時の色'],pal:['#d4a373','#faedcd','#fefae0','#ccd5ae','#606c38'],tools:[GPT,GEM],
use:'<b>家族の思い出・ご先祖の写真・地域の昔の写真</b>に。贈り物や、法事・記念日のスライドショーにも喜ばれます。',
tips:['写真に写っている時代（昭和30年代など）を書くと、服や物の色が自然になります','「本人の顔は変えずに」を強めに入れるのが大切','イラストではなく写真のまま修復したいなら【スタイル】を「写真として修復」に'],
p:`【スタイル】古いモノクロ写真を修復し、当時の色を想像してカラーで描き起こしたイラスト
【描き方】
・修復：写真の傷・折り目・シミ・ノイズをすべて消す
・色：写っている時代（例：昭和30年代）にふさわしい、落ち着いた自然な色で塗る。肌は健康的な自然な色
・画風：写真の質感を少し残した、やわらかい手描きの絵画調
・光：写真の光の向きを保つ
・顔：写っている人の顔立ちと表情を一切変えない
【避けるもの】顔の変化、派手すぎる色、現代の物の追加`,
enp:'Restore the attached old black-and-white photo: remove scratches, folds, stains and noise, then colorize it with natural, period-appropriate muted colors (1950s Japan) as a soft hand-painted illustration that keeps a hint of photographic texture. Preserve every face and expression exactly. No modern objects.'});

defI({no:'09',cat:'BASIC',name:'ラフから完成イラストへ',en:'Sketch to Finished Art',lead:'手描きのラフや落書きを、プロが仕上げたような完成イラストに。',
before:'紙に描いたラフ・落書き・棒人間の構図メモ',after:'ラフの構図どおりに清書・着色された完成イラスト',kw:['清書','着色','構図キープ','アイデアを形に'],pal:['#003049','#d62828','#f77f00','#fcbf49','#eae2b7'],tools:[GPT,GEM],
use:'<b>絵が苦手な人のアイデアスケッチ・漫画のネーム・資料の挿絵</b>に。頭の中のイメージを、ラフ1枚から完成させられます。',
tips:['ラフに「ここは空」「これは犬」など文字でメモを書いておくと、AIが正しく読み取ります','画風を指定しないと平均的な絵になるので、必ず【スタイル】を具体的に','気に入らない部分は「左の人物だけ描き直して」と部分指定で直せます'],
p:`【スタイル】添付した手描きのラフ（落書き）を、プロが仕上げたような完成イラストにする
【描き方】
・構図：ラフの人物や物の位置・大きさ・向きをそのまま守る
・読み取り：ラフに書かれたメモ（文字）は、描く内容の指示として読み取り、絵の中には描かない
・線：きれいに清書した、強弱のある線
・塗り：明るい色で、影と光をしっかり入れた丁寧な塗り
・背景：ラフに描かれた場所を、奥行きのある背景として描き込む
【避けるもの】ラフにない大きな要素の追加、構図の変更、メモ文字の描き込み`,
enp:'Turn the attached rough hand-drawn sketch into a polished, professionally finished illustration. Keep the exact positions, sizes and directions of all figures and objects. Treat handwritten notes as instructions and do not draw them. Clean lineart with line weight variation, bright colors with full lighting and shading, detailed background with depth.'});

defI({no:'10',cat:'BASIC',name:'写真からロゴ・アイコン素材',en:'Photo to Simple Icon',lead:'写真の被写体を、ロゴやアイコンに使えるシンプルな図形にする。',
before:'お店の外観・商品・ペット・料理の写真',after:'少ない色と単純な形でできた、ロゴに使える図案',kw:['シンプル化','3色以内','単色背景','ベクター風'],pal:['#1d3557','#457b9d','#a8dadc','#f1faee','#e63946'],tools:[GPT,GEM,CV],
use:'<b>お店のロゴ案・SNSアイコン・ショップカード・ステッカー</b>に。写真の特徴を残したまま、デザイン素材として使える形にします。',
tips:['色数を「3色以内」と決めると、ロゴとして使いやすい図案になります','背景は単色にして、あとで切り抜きやすく','正式なロゴにする場合は、デザイナーにベクター化して整えてもらうと安心'],
p:`【スタイル】写真の主役（人物・動物・建物・商品など）を、ロゴやアイコンに使えるシンプルな図案にする
【描き方】
・形：主役の特徴的なシルエットだけを残し、細部を大胆に省略した単純な形にする
・色：3色以内（例：紺・水色・白）。グラデーションは使わない
・線：線を使う場合は太さを均一に
・構図：主役を中央に大きく、正方形の中にバランスよく収める
・背景：無地の単色
【避けるもの】写真のような質感、細かい模様、4色以上の色、文字`,
enp:'Simplify the main subject of the attached photo into a minimal flat icon suitable for a logo: keep only the characteristic silhouette, bold simplified shapes, maximum 3 flat colors (navy, light blue, white), no gradients, uniform line weight, centered in a square, solid plain background, no text.'});

/* ANIME */
defI({no:'11',cat:'ANIME',name:'セル画アニメ風',en:'Cel Anime',lead:'くっきりした線と2段階の影。今のテレビアニメのような王道スタイル。',
before:'自撮り・友達との写真・推し活の写真',after:'テレビアニメのワンシーンのような、くっきり塗りのキャラ',kw:['アニメ塗り','影2段階','ハイライト','大きな瞳'],pal:['#ffd6e0','#ffb3c6','#8ecae6','#219ebc','#023047'],tools:[GPT,GEM,MJ],
use:'<b>SNSアイコン・推し活・友達へのプレゼント</b>に。いちばん人気で、誰が見ても「アニメになった！」と分かる定番の変換。',
tips:['「影は2段階」「髪にハイライト」と入れると、アニメらしさが一気に増します','目を大きくしすぎると本人に似なくなるので「目は少しだけ大きく」が◎','背景は「背景美術のように」と指定すると、作品のワンシーン感が出ます'],
p:`【スタイル】日本のテレビアニメのワンシーンのような、セル画風のアニメイラスト
【描き方】
・線：くっきりとした黒〜こげ茶の主線。輪郭はやや太く、内側の線は細く
・塗り：アニメ塗り（ベタ塗り＋はっきりした影を2段階）。髪には帯状のツヤ（ハイライト）
・顔：顔立ちの特徴は残しつつ、目は少しだけ大きく、瞳に光を2つ入れる
・色：明るく鮮やか。肌は透明感のある色
・背景：写真の場所を、アニメの背景美術のように描き込む（空はグラデーションと雲）
【避けるもの】写真っぽい質感、顔立ちが別人になること`,
enp:'Redraw the attached photo as a still from a modern Japanese TV anime: crisp dark brown lineart (thicker outer lines), flat cel shading with two hard shadow tones, glossy band highlights on hair, slightly larger eyes with two catchlights, bright saturated colors, background painted like anime background art with gradient sky and clouds. Keep facial features recognizable.'});

defI({no:'12',cat:'ANIME',name:'90年代レトロアニメ風',en:'90s Retro Anime',lead:'少しくすんだ色、フィルムのざらつき。懐かしいビデオアニメの雰囲気。',
before:'夕方の街・部屋・人物の写真',after:'90年代のビデオアニメのような、くすんだ色とざらつきのある絵',kw:['レトロ','くすみカラー','フィルムグレイン','セル画の質感'],pal:['#3d405b','#e07a5f','#f2cc8f','#81b29a','#f4f1de'],tools:[GPT,MJ,GEM],
use:'<b>シティポップのMV・エモいSNS投稿・レトロ好きのアイコン</b>に。平成レトロブームで、若い世代にも人気のスタイル。',
tips:['「フィルムのざらつき」「わずかな色ズレ」を入れると、ビデオ映像らしい懐かしさが出ます','夕方のオレンジ〜紫の空と相性が抜群','画面の比率を4:3にすると、さらに当時っぽくなります'],
p:`【スタイル】1990年代のビデオアニメ（OVA）のような、懐かしいレトロアニメ調のイラスト
【描き方】
・線：やや太めで少しだけ揺らぎのある主線
・塗り：セル画風のベタ塗りと影。影はやや青みがかった色
・色：少しくすんだ（彩度を落とした）色。夕焼けのオレンジ・紫・ピンクを多めに
・質感：フィルムのざらつき（グレイン）、わずかな色のにじみ、少しだけぼやけた輪郭
・顔：顔立ちを残しつつ、当時のアニメらしい細めのあご・大きめの瞳
・背景：写真の場所を、手描きの背景画のように
【避けるもの】今どきのくっきりしたデジタル塗り、鮮やかすぎる色`,
enp:'Redraw the attached photo as a frame from a 1990s Japanese OVA anime: slightly thick, subtly wobbly lineart, cel shading with bluish shadows, muted desaturated palette with sunset orange, purple and pink, film grain, slight chromatic bleed and softness, hand-painted background, retro character proportions. Keep the person recognizable. 4:3 framing.'});

defI({no:'13',cat:'ANIME',name:'少女漫画風',en:'Shoujo Manga',lead:'キラキラの瞳、花と光のトーン。ときめく少女漫画の1コマに。',
before:'カップル・友達・自撮りの写真',after:'花びらとキラキラに囲まれた、少女漫画の1ページ',kw:['キラキラの瞳','花のトーン','繊細な線','ときめき'],pal:['#ffe5ec','#ffc2d1','#ffb3c6','#fb6f92','#ffffff'],tools:[GPT,MJ,GEM],
use:'<b>カップル写真・結婚式・記念日のプレゼント</b>に。ロマンチックな演出で、贈り物として特に喜ばれる変換です。',
tips:['「背景に花びらとキラキラのトーン」で一気に少女漫画らしくなります','モノクロにすると漫画本のページらしく、カラーにすると表紙イラストらしくなります','瞳の描き込みを強調すると、ときめき度が上がります'],
p:`【スタイル】昔ながらの少女漫画のような、繊細でロマンチックなイラスト
【描き方】
・線：細く繊細な線。まつ毛を長く、髪の毛は流れるような細い線で
・瞳：大きく、星や光をたくさん描き込んだキラキラの瞳
・塗り：淡いパステル調の水彩風の塗り
・背景：写真の背景の代わりに、バラの花びら・光の玉・キラキラのトーンを散らす
・表情：写真の表情を、少しだけやさしく
・顔：顔立ちの特徴は残す
【避けるもの】太い線、暗い色、写真の背景をそのまま残すこと`,
enp:'Redraw the attached photo as a classic romantic shoujo manga illustration: delicate thin lines, long eyelashes, flowing fine hair strands, huge sparkling eyes full of stars and light, soft pastel watercolor coloring, background replaced with rose petals, light orbs and sparkle screentones. Keep facial features recognizable.'});

defI({no:'14',cat:'ANIME',name:'少年漫画（白黒）',en:'Shounen Manga B&W',lead:'白黒の力強い線、スクリーントーン、集中線。熱いバトル漫画の1コマ。',
before:'スポーツ・ガッツポーズ・真剣な表情の写真',after:'集中線とトーンで迫力が出た、白黒の漫画の1コマ',kw:['白黒','スクリーントーン','集中線','力強い線'],pal:['#000000','#333333','#777777','#bbbbbb','#ffffff'],tools:[GPT,GEM],
use:'<b>スポーツの決定的瞬間・部活の思い出・ネタ画像</b>に。日常の写真が、熱い漫画のクライマックスに変わります。',
tips:['「背景に集中線」で迫力が倍増。スピード線にすると動きが出ます','擬音（ドン！など）を入れたい場合は【避けるもの】から「文字」を外して、入れたい擬音を指定','トーンは「網点」と指定すると、より本物の漫画らしく'],
p:`【スタイル】日本の少年漫画の1コマのような、白黒の迫力あるイラスト
【描き方】
・線：黒のインクで描いたような力強い線。強弱をはっきりつける
・影：黒ベタと、網点のスクリーントーン（グレーの点の模様）で表現する
・背景：写真の背景の代わりに、中心（人物）に向かう集中線を描く
・表情：写真の表情を、少しだけ力強く・真剣に
・顔：顔立ちの特徴は残す
・色：白と黒とグレーのトーンだけ
【避けるもの】カラー、やわらかい水彩、文字（擬音を入れたい場合はここを外す）`,
enp:'Redraw the attached photo as a black and white shounen manga panel: bold inked lines with strong weight variation, solid black fills and halftone dot screentones for shading, intense radial speed lines in the background focused on the person, slightly more determined expression. Pure black, white and gray tones only. Keep features recognizable. No text.'});

defI({no:'15',cat:'ANIME',name:'ちびキャラ',en:'Chibi Character',lead:'2〜3頭身のデフォルメキャラに。かわいさ全振りの人気スタイル。',
before:'全身が写った人物・家族・ペットとの写真',after:'頭が大きく手足が短い、2〜3頭身のかわいいキャラ',kw:['2〜3頭身','デフォルメ','まるいシルエット','スタンプ向き'],pal:['#fff1e6','#fde2e4','#fad2e1','#bee1e6','#cddafd'],tools:[GPT,GEM,CV],
use:'<b>LINEスタンプ・SNSアイコン・グッズ・名刺</b>に。家族全員をちびキャラにして並べるのも大人気です。',

p:`【スタイル】2.5頭身のかわいいデフォルメキャラクター（ちびキャラ）

・特徴：髪型・髪色・服の色・メガネやアクセサリーなど、本人の目印になる特徴は必ず残す
・線：やや太めで均一な、やわらかい色の線
・塗り：明るいパステル調、影は1段階だけ
・背景：白、または淡い単色
【避けるもの】リアルな頭身、細かすぎる描き込み、本人の特徴が消えること`,
enp:'Turn the person in the attached photo into a cute 2.5-head-tall chibi character: big round head, short body and limbs, round silhouette, big round eyes, tiny or no nose, pink cheek blush. Keep identifying features: hairstyle, hair color, outfit colors, glasses and accessories. Soft uniform outlines, bright pastel colors, single-step shading, plain white background.'});

p:`【スタイル】劇場アニメ映画のワンシーンのような、手描きの背景美術が美しいイラスト

・自然：草木の緑は、明るい緑と深い緑を細かく描き分け、葉の一枚一枚に光を当てる
・光：夏の午後のあたたかい日差し。光と影のコントラストをはっきり
・人物：やさしい線とシンプルなアニメ塗り。顔立ちの特徴は残す
・空気感：少しノスタルジックで、どこか懐かしい雰囲気
【避けるもの】実在のアニメ作品のキャラクターや場所に似せること、写真の質感`,
enp:'Redraw the attached photo as a scene from a hand-painted Japanese animated feature film: lush painterly background art, deep blue gradient sky with towering layered cumulus clouds, richly detailed greenery with sunlit leaves, warm summer afternoon light with strong contrast, characters with gentle lines and simple anime shading, nostalgic atmosphere. Do not imitate any specific existing film.'});

・セリフ：1コマ10文字以内の短いセリフをフキダシに入れる
【避けるもの】コマごとに主人公の見た目が変わること、長いセリフ`,
enp:'Create a vertical 4-panel comic strip starring the person or pet from the attached photo. Panel 1: relaxing in the same scene as the photo. Panel 2: notices something curious. Panel 3: an unexpected small mishap. Panel 4: a heartwarming punchline. Simple soft-line manga style with gentle muted colors, consistent character design in all panels, short speech bubbles (or leave bubbles empty).'});

use:'<b>家族写真のネタ・子どもへのサプライズ・会社やお店の紹介</b>に。建物の写真をブロックの街にするのも楽しい使い方です。',
tips:['特定のブランド名は出さず、「組み立てブロックのおもちゃ」と表現するのが安全','建物の写真は「ブロックで組み立てたミニチュア」にすると作品感が出ます','人物は「円筒形の頭と、四角い体のミニ人形」と形を指定すると安定します'],
p:`【スタイル】組み立てブロックのおもちゃで作られた世界と、ミニ人形になった人物
【描き方】
・人物：円筒形の頭、四角い胴体、C字型の手を持つ、プラスチックのミニ人形。顔はシンプルなプリントの表情、髪型と服の色・柄は写真の特徴を再現
・世界：写真の背景（建物・道・木など）を、凸のある四角いブロックを組み合わせて再現する
・質感：つやのあるプラスチック。ブロックの凸の形がはっきり見える
・撮影：おもちゃを接写したような、少しぼけた背景と明るい照明
【避けるもの】実在のブランド名・ロゴ、リアルな人間の質感`,
enp:'Rebuild the attached photo as a toy brick world: people become plastic minifigures with cylindrical heads, blocky torsos and C-shaped hands, simple printed faces, hair and outfit colors matching the photo; buildings, roads and trees built from studded interlocking bricks; glossy plastic, close-up toy photography with shallow depth of field and bright lighting. No brand names or logos.'});

defI({no:'26',cat:'TOY',name:'ぬいぐるみ化',en:'Plush Toy',lead:'ふわふわの布とぬい目で、抱きしめたくなるぬいぐるみに。',

tips:['「ぬい目」「タグ」を入れると、本物のぬいぐるみのリアルさが出ます','布の素材（ふわふわのボア、フェルト）を指定すると質感が変わります','ベッドやソファの上に置いた写真にすると、生活感があってかわいい'],
p:`【スタイル】写真の人物（またはペット）を、ふわふわの布で作ったぬいぐるみにして撮影したような写真
【描き方】
・形：丸みのある、少しずんぐりしたぬいぐるみ。顔立ち・毛の色・模様・服の特徴を残す

【避けるもの】リアルな動物や人間の質感、プラスチックのようなつや`,
enp:'Turn the person or pet in the attached photo into a soft plush toy and photograph it: rounded chubby shape, keep facial features, fur colors, markings and outfit, fluffy minky fabric, embroidered or button eyes and stitched mouth, visible seams, small fabric tag behind the ear, sitting on a white-sheeted bed in soft window light.'});

defI({no:'27',cat:'TOY',name:'ミニチュアジオラマ',en:'Miniature Diorama',lead:'街の風景を、手のひらに乗るミニチュア模型のように見せる。',

p:`【スタイル】写真の風景を、精巧なミニチュア模型（ジオラマ）を接写したように見せる
【描き方】
・ぼかし：画面の上と下を強くぼかし、中央の帯だけにピントを合わせる（チルトシフト効果）
・質感：建物は樹脂や紙でできた模型の質感。木はスポンジ素材のミニチュアの木
・人や車：小さな模型の人形とミニカーに見えるようにする
・色：彩度とコントラストを少し上げ、おもちゃのような鮮やかさに
・構図：写真の構図をそのまま保つ
【避けるもの】構図の変化、実写の質感がそのまま残ること`,
enp:'Make the attached cityscape photo look like a macro shot of a detailed miniature diorama: strong tilt-shift blur at top and bottom with a sharp middle band, buildings with resin and paper model textures, sponge model trees, people and cars as tiny figurines and toy cars, boosted saturation and contrast. Keep the original composition.'});

defI({no:'28',cat:'TOY',name:'ボクセルアート',en:'Voxel Art',lead:'小さな立方体を積み上げてつくった、ゲームのような3Dの世界に。',

tips:['立方体の大きさ（解像度）を「粗め」にするとレトロに、「細かめ」にすると精巧に','斜め上から見下ろす視点（アイソメトリック）と相性抜群','特定のゲームの名前は出さないのが安全'],

・形：すべてを同じ大きさの立方体の組み合わせで表現する（人物・物・地面・背景すべて）

・色：写真の色を、少しだけ鮮やかな単色の立方体に置き換える（グラデーションなし）
・視点：斜め上から見下ろす視点
・光：やわらかい太陽の光と、立方体の面ごとのはっきりした明暗
・背景：単色の空
【避けるもの】なめらかな曲線、写真の質感、特定のゲームのロゴ`,
enp:'Rebuild the attached photo as voxel art: everything made of equal-sized cubes (people, objects, ground, background), medium resolution (a person is about 30 voxels tall), flat slightly saturated colors per cube, elevated isometric-like view, soft sunlight with clear per-face shading, plain sky background. No smooth curves, no game logos.'});

artI({no:'31',cat:'ART',name:'透明水彩',en:'Transparent Watercolor',lead:'にじみと紙の白が美しい、やさしい透明水彩画に。',
before:'風景・花・人物・ペットの写真',after:'紙の白が透ける、にじみのあるやわらかい水彩画',kw:['にじみ','紙の白','淡い色','水彩紙の質感'],pal:['#bde0fe','#a2d2ff','#ffc8dd','#cdb4db','#fefae0'],tools:[GPT,GEM,MJ],
use:'<b>結婚式のウェルカムボード・年賀状・絵はがき・お店の看板</b>に。どんな写真でも上品でやさしい印象になります。',
tips:['「紙の白を残す」と入れると、本物の透明水彩らしい抜け感が出ます','輪郭線を「なし」にすると、より絵画的な仕上がりに','色数を3〜4色にしぼると、統一感のある作品になります'],
p:`【スタイル】水彩紙に描いた、やさしい透明水彩画
【描き方】
・線：輪郭線はほとんど描かず、色の境目で形を表す（必要な所だけ鉛筆の細い線をうっすら）
・塗り：水を多く含んだ絵の具のにじみとぼかし。色が重なった所は少し濃くなる
・余白：明るい部分は塗らずに、紙の白をそのまま残す
・色：淡く透明感のある色を3〜4色で
・質感：水彩紙のざらざらした凹凸と、絵の具がたまってできる縁の濃いライン
・顔：顔立ちの特徴を残す
【避けるもの】くっきりした黒い線、ベタ塗り、デジタルっぽいなめらかさ`,
enp:'Repaint the attached photo as a delicate transparent watercolor on textured cold-press paper: almost no outlines (only faint pencil lines where needed), wet-in-wet blooms and soft gradients, darker edges where pigment pools, white paper left unpainted for highlights, light translucent palette of 3-4 colors. Keep faces recognizable.'});

artI({no:'32',cat:'ART',name:'印象派の油絵',en:'Impressionist Oil',lead:'光のつぶを重ねたような筆のタッチ。美術館に飾られた油絵のように。',

use:'<b>風景写真・記念写真をアート作品に</b>。額に入れて飾ったり、贈り物にしたりするのに向いています。',
tips:['光の当たる水辺や花畑の写真ほど、印象派らしさが引き立ちます','「キャンバスの布目」まで指定すると、本物の油絵らしくなります','画家の名前ではなく「短い筆のタッチ」「光のつぶ」など特徴で指示'],
p:`【スタイル】19世紀の印象派の画家が描いたような、光あふれる油絵
【描き方】
・筆づかい：短く太い筆のタッチを、たくさん重ねて描く。筆の跡がはっきり残る
・光：光の当たる部分に、黄色・オレンジ・白の明るい絵の具をのせ、きらめきを表現する
・影：影は黒ではなく、青や紫で描く
・輪郭：くっきりした輪郭線は描かず、色のかたまりで形を表す
・質感：キャンバスの布目と、厚く盛り上がった絵の具
・構図：写真の構図を保つ
【避けるもの】なめらかなデジタル塗り、黒い輪郭線、特定の画家の名前`,
enp:'Repaint the attached photo as a 19th-century impressionist oil painting: short thick visible brushstrokes layered densely, sparkling sunlight in yellow, orange and white dabs, shadows painted in blues and violets instead of black, no outlines, forms built from patches of color, canvas weave and impasto texture. Keep the original composition.'});

artI({no:'33',cat:'ART',name:'浮世絵',en:'Ukiyo-e Woodblock',lead:'太い輪郭線、平らな色、木版のかすれ。江戸の浮世絵のように。',
before:'人物・富士山などの景色・海や波の写真',after:'木版で刷ったような、江戸時代の浮世絵',kw:['木版画','藍色','平塗り','和紙'],pal:['#1d3557','#457b9d','#e9d8a6','#ee9b00','#9b2226'],tools:[GPT,MJ,GEM],
use:'<b>外国人向けのおみやげ・和風のポスター・ユニークなプロフィール画像</b>に。海外の人にも喜ばれる日本らしい画風です。',
tips:['藍色（ベロ藍）を多めに使うと、浮世絵らしさが一気に出ます','空は上が濃く下が薄い「ぼかし」にするのがポイント','人物は細い目・切れ長の眉に少し寄せると、時代の雰囲気が出ます'],
p:`【スタイル】江戸時代の木版画・浮世絵
【描き方】
・線：墨の黒で、太さが一定のくっきりした輪郭線
・色：平らなベタ塗り。藍色・朱色・黄土色・生成りを中心に、色数は少なく
・空：上が濃い藍色、下に向かって薄くなる「ぼかし」のグラデーション
・質感：木版で刷ったような、色のかすれとわずかなずれ。和紙の繊維の質感
・人物：顔立ちの特徴を残しつつ、浮世絵らしい細い目と切れ長の眉に寄せる
・波や雲：写真にあれば、浮世絵らしい様式化した形で描く
【避けるもの】立体的な陰影、グラデーションの多用、現代的なものをそのまま描くこと`,
enp:'Redraw the attached photo as an Edo-period Japanese ukiyo-e woodblock print: uniform bold sumi ink outlines, flat areas of limited color (Prussian indigo, vermilion, ochre, cream), bokashi sky gradient from deep indigo to pale, woodblock texture with slight misregistration and washi fibers, stylized waves and clouds, figures with narrow eyes and long brows. No 3D shading.'});

artI({no:'34',cat:'ART',name:'水墨画',en:'Sumi-e Ink Wash',lead:'墨の濃淡とにじみ、たっぷりの余白。静かで凛とした墨絵に。',
before:'山・木・花・動物・人物の横顔の写真',after:'墨の濃淡と余白で描いた、静かな水墨画',kw:['墨','濃淡','余白','にじみ'],pal:['#111111','#444444','#888888','#d9d4c7','#c1121f'],tools:[GPT,MJ,GEM],
use:'<b>和風の作品・座右の銘と組み合わせた書画・お茶やお香のお店</b>に。モノトーンなので、どんなデザインにもなじみます。',
tips:['「画面の半分以上を余白に」と入れると、水墨画らしい静けさが出ます','赤い落款（ハンコ）を1つだけ入れると作品として締まります','動物や植物の写真と特に相性が良い画風です'],

【描き方】
・墨：濃い墨・中くらいの墨・薄い墨の3段階の濃淡だけで描く
・筆：太い筆で一気に描いたような、勢いのある線。かすれとにじみを残す
・省略：主役だけを描き、背景はほとんど描かずに余白として残す（画面の半分以上を余白に）

・アクセント：右下に小さな朱色の落款（四角いハンコ）を1つ

【避けるもの】カラー、細かい描き込み、背景を埋め尽くすこと`,
enp:'Repaint the attached photo as a Japanese sumi-e ink wash painting on cream washi paper: only three ink tones (dark, mid, pale), bold confident brush strokes with dry-brush and bleeding edges, subject only with more than half of the canvas left as empty space, one small red square seal stamp in the lower right. Monochrome ink plus red seal only.'});

・質感：画用紙の凹凸（紙の目）が見え、紙の白が少し残る
・色：あたたかく、やさしい中間色
・背景：主役のまわりだけ軽く塗り、外側は紙の白のまま
