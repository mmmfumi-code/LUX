defT({no:'41',cat:'OBJECT',name:'ページめくり',en:'Page Turn',lead:'本のページをめくるように、今の場面が左へめくれて次のページへ。',d:1100,
use:'<b>絵本・日記・ストーリー・アルバム</b>に。思い出の写真をめくっていくような、やさしい場面転換。',
tips:['めくれる途中のページに、内側へ向かう影のグラデーションを付けると紙らしくなります','回転軸は左端。めくり角は−110°くらいで消すと自然','下のBに、めくれるページの影を落とすとリアルさが増します'],
p:`本のページをめくるように、今の場面が左端を軸にめくれて、次のページ（シーンB）が現れる「ページめくり」を作ってください。
・時間：1.1秒。イージング cubic-bezier(.65,0,.35,1)
・CSS 3D：親に perspective: 2200px
・シーンA：transform-origin は左端（0 50%）。rotateY 0 → −110°。めくれる途中、Aの上に「右端が暗い」グラデーション（透明 → rgba(0,0,0,.45)）を重ねて紙の陰影を出す
・シーンB（下）：めくれるページの影として、左から右へ動く黒いグラデーション（不透明度0.4 → 0）を重ねる
・Aが −90° を超えたら非表示にする`,
tr(H,root,mk,st,D){root.style.perspective='2200px';const B=mk(1),A=mk(0,{transformOrigin:'0 50%',backfaceVisibility:'hidden'});const sh=H.abs({inset:'0',background:'linear-gradient(90deg,transparent 40%,rgba(0,0,0,.45))',opacity:0},A);
  H.a(A,[{transform:'rotateY(0)'},{transform:'rotateY(-110deg)'}],{d:D,dl:st,e:'cubic-bezier(.65,0,.35,1)'});H.a(sh,[{opacity:0},{opacity:1}],{d:D*.7,dl:st});
  const bs=H.abs({inset:'0',background:'linear-gradient(90deg,rgba(0,0,0,.4),transparent 60%)',opacity:0},B);H.a(bs,[{opacity:.8,transform:'translateX(0)'},{opacity:0,transform:'translateX(-40%)'}],{d:D,dl:st,f:'none'});hide(H,A,st+D)}});

defT({no:'42',cat:'OBJECT',name:'ガラス割れ',en:'Glass Shatter',lead:'今の場面がガラスのように割れて崩れ落ち、奥から次の場面。',d:1300,
use:'<b>衝撃の事実・常識を壊す・ビフォーアフター</b>に。「今までのやり方は終わり」と見せたい場面に。',
tips:['ひびを先に0.15秒見せてから割ると、「割れる」と分かって気持ちいい','破片は10枚前後。多すぎると細かくて何が割れたか分からなくなります','割れる瞬間に効果音と画面の揺れを合わせると迫力が出ます'],
p:`今の場面がガラスのように割れて崩れ落ち、その奥から次の場面が現れる「ガラス割れ」を作ってください。
・時間：1.3秒
・0〜0.15秒：画面中央から放射状に白いひび（SVG、線幅3px）を10本描く
・0.25秒：シーンAを10枚に複製し、それぞれ clip-path: polygon で中心から36°ずつの三角形に切り抜いて「破片」にする
・各破片を 0〜0.2秒のランダムな遅れで、下へ 900〜1200px 落とす（横に −250〜250px、回転 −100〜100°、cubic-bezier(.7,0,.84,0)、0.9秒）
・割れる瞬間に、画面を12px・0.3秒揺らし、白を0.15秒だけ光らせる
・破片の下にはシーンBを置いておく`,
tr(H,root,mk,st,D){const B=mk(1);const W=H.abs({inset:'0'},root);const N=10;const svg=H.svg(1600,900,W);svg.style.zIndex=2;
  for(let i=0;i<N;i++){const a0=i/N*Math.PI*2,a1=(i+1)/N*Math.PI*2;const pt=a=>`${50+300*Math.cos(a)}% ${50+300*Math.sin(a)}%`;const pc=mk(0,{clipPath:`polygon(50% 50%,${pt(a0)},${pt((a0+a1)/2)},${pt(a1)})`},W);W.insertBefore(pc,svg);
    H.a(pc,[{transform:'translate(0,0) rotate(0)'},{transform:`translate(${rnd(-250,250)}px,${rnd(1100,1400)}px) rotate(${rnd(-100,100)}deg)`}],{d:900,dl:st+250+rnd(0,200),e:E.in});hide(H,pc,st+D+100);
    const len=rnd(300,750);const l=H.sv('line',{x1:800,y1:450,x2:800+Math.cos(a0)*len,y2:450+Math.sin(a0)*len,stroke:'#fff','stroke-width':3,'stroke-dasharray':len,'stroke-dashoffset':len},svg);H.a(l,[{strokeDashoffset:len,opacity:1},{strokeDashoffset:0,opacity:1}],{d:150,dl:st});H.a(l,[{opacity:1},{opacity:0}],{d:80,dl:st+250,f:'forwards'})}
  const fl=H.abs({inset:'0',background:'#fff',opacity:0},root);H.a(fl,[{opacity:.7},{opacity:0}],{d:150,dl:st+250,f:'none'});H.shake(W,st+250,12,300)}});

defT({no:'43',cat:'OBJECT',name:'紙破り',en:'Paper Tear',lead:'今の場面が紙のようにギザギザに破れて、左右へ裂けていく。',d:1000,
use:'<b>手作り感・DIY・スクラップブック風</b>の動画に。「本当の姿は…」「中身を公開」のような種明かしにも。',
tips:['破れ目のギザギザは不規則にすると、本物の紙らしくなります','破れ目に白い縁（紙の断面）を付けるのがリアルさのポイント','左右に少し回転させながら裂くと、手で破った感じが出ます'],
p:`今の場面が紙のようにギザギザに破れて、左右へ裂けていく「紙破り」でシーンBを見せてください。
・時間：1.0秒
・破れ目：画面の中央を上から下へ通る、ランダムなギザギザの線（12〜20個の折れ点、左右に ±40px）
・シーンAを2枚複製し、破れ目の左側と右側に clip-path: polygon で切り抜く
・破れ目の両側に、白い紙の断面（幅8px、少しざらついた白 #F4F1EA）を付ける
・左半分は translateX −60% ＋ rotate −6°、右半分は translateX +60% ＋ rotate +6° へ、0.9秒で裂く（cubic-bezier(.65,0,.35,1)）。回転の軸はそれぞれ下の外側の角
・裂ける直前に0.1秒だけ両側を ±6px 引っぱる（ためを作る）`,
tr(H,root,mk,st,D){const B=mk(1);const pts=[];const n=16;for(let i=0;i<=n;i++)pts.push([50+rnd(-2.5,2.5),i/n*100]);
  const left='polygon(0 0,'+pts.map(p=>`${p[0]}% ${p[1]}%`).join(',')+',0 100%)';const right='polygon(100% 0,'+pts.map(p=>`${p[0]}% ${p[1]}%`).join(',')+',100% 100%)';
  const mkHalf=(clip,side)=>{const g=H.abs({inset:'0',clipPath:clip,transformOrigin:side<0?'0 100%':'100% 100%'},root);mk(0,{},g);const svg=H.svg(1600,900,g);H.sv('polyline',{points:pts.map(p=>`${p[0]*16} ${p[1]*9}`).join(' '),fill:'none',stroke:'#f4f1ea','stroke-width':16},svg);return g};
  const L=mkHalf(left,-1),R=mkHalf(right,1);
  [[L,-1],[R,1]].forEach(([g,s])=>H.a(g,[{transform:'translateX(0) rotate(0)'},{transform:`translateX(${-s*6}px) rotate(0)`,offset:.12},{transform:`translateX(${s*60}%) rotate(${s*6}deg)`}],{d:D,dl:st,e:'cubic-bezier(.65,0,.35,1)'}));hide(H,L,st+D);hide(H,R,st+D)}});

defT({no:'44',cat:'OBJECT',name:'ドミノフリップ',en:'Domino Flip',lead:'縦長の板が左から順にパタパタと裏返り、次の場面に変わる。',d:1100,
use:'<b>連続紹介・一覧の切り替え・リズムのある編集</b>に。板が順番に返る動きで、テンポよく次へ進めます。',
tips:['板は8〜12枚がちょうどいい','遅れ（0.06秒）を大きくすると波のように、小さくすると一斉に返る感じに','回転の中盤で板を暗くすると、立体的に見えます'],
p:`画面を縦長の板8枚に分け、左から順にパタパタと裏返って次の場面に変わる「ドミノフリップ」を作ってください。
・時間：1.1秒
・CSS 3D：親に perspective: 2000px
・画面を幅200pxの縦長の板8枚に分ける。各板の表にはシーンAの該当部分、裏にはシーンBの該当部分（rotateY(180°)、backface-visibility: hidden）を表示する（clip-path で板の位置だけを切り抜いた複製を使う）
・各板を rotateY 0 → 180° へ0.6秒で回転（cubic-bezier(.65,0,.35,1)）。左の板から0.06秒ずつ遅らせる
・回転の中盤（90°付近）で板を brightness 0.6 に暗くする`,
tr(H,root,mk,st,D){root.style.perspective='2000px';const N=8,w=1600/N;for(let i=0;i<N;i++){const s=H.abs({left:i*w+'px',top:'0',width:(w+1)+'px',height:'900px',transformStyle:'preserve-3d',transformOrigin:'50% 50%'},root);
  const f=H.abs({inset:'0',overflow:'hidden',backfaceVisibility:'hidden'},s);mk(0,{left:-i*w+'px'},f);const b=H.abs({inset:'0',overflow:'hidden',backfaceVisibility:'hidden',transform:'rotateY(180deg)'},s);mk(1,{left:-i*w+'px'},b);
  H.a(s,[{transform:'rotateY(0)'},{transform:'rotateY(180deg)'}],{d:600,dl:st+i*60,e:'cubic-bezier(.65,0,.35,1)'});[f,b].forEach(x=>H.a(x,[{filter:'brightness(1)'},{filter:'brightness(.6)'},{filter:'brightness(1)'}],{d:600,dl:st+i*60,f:'none'}))}}});

defT({no:'45',cat:'OBJECT',name:'ロールアップ',en:'Roll Up Blind',lead:'ロールスクリーンを巻き上げるように、今の場面が上へ巻き取られる。',d:900,
use:'<b>朝・お店のオープン・幕開け</b>に。シャッターやブラインドが上がる動きで、「始まり」を表現できます。',
tips:['巻き取る棒（ローラー）を描くのがポイント。円柱のようなグラデーションで立体に','巻き上げは最初ゆっくり、途中から速くすると実物らしい','逆に下へ降ろすと「閉店」「おしまい」の表現に'],
p:`ロールスクリーンを巻き上げるように、今の場面が上へ巻き取られて次の場面が見えてくる「ロールアップ」を作ってください。
・時間：0.9秒。イージング cubic-bezier(.65,0,.35,1)
・シーンA：clip-path: inset(0 0 0 0) → inset(0 0 100% 0)（下から上へ巻き取られて短くなる）
・巻き取りの棒（ローラー）：画面幅いっぱい・高さ40pxの円柱（上下に暗く、中央が明るい linear-gradient：#2A2F38 → #9AA3B2 → #2A2F38）を、Aの下端に沿って一緒に上へ動かす。影 0 10px 20px rgba(0,0,0,.5)
・シーンB：下に置いておき、brightness 0.7 → 1 へ明るくする`,
tr(H,root,mk,st,D){const B=mk(1),A=mk(0);const e='cubic-bezier(.65,0,.35,1)';H.a(A,[{clipPath:'inset(0 0 0 0)'},{clipPath:'inset(0 0 100% 0)'}],{d:D,dl:st,e});H.a(B,[{filter:'brightness(.7)'},{filter:'brightness(1)'}],{d:D,dl:st,e});
  const r=H.abs({left:'0',width:'1600px',height:'40px',top:'880px',background:'linear-gradient(#2a2f38,#9aa3b2 50%,#2a2f38)',boxShadow:'0 10px 20px rgba(0,0,0,.5)'},root);H.a(r,[{top:'880px'},{top:'-40px'}],{d:D,dl:st,e})}});

defT({no:'46',cat:'OBJECT',name:'スクイーズライン',en:'Squeeze Line',lead:'場面が横一本の光る線に押しつぶされ、線が開くと次の場面。',d:800,
use:'<b>SF・テクノロジー・ゲームのロード画面</b>に。データが一本に圧縮されて別の画面に展開されるようなクールさ。',
tips:['線になった瞬間に光（白い発光）を強めると、エネルギーを感じさせます','つぶれる前に横に少し伸ばす（scaleX 1.05）とキレが出ます','縦一本にすれば、扉が閉まって開くような表現に'],
p:`場面が横一本の光る線に押しつぶされ、その線が上下に開くと次の場面になっている「スクイーズライン」を作ってください。
・時間：0.8秒
・0〜0.35秒：シーンAを scaleY 1 → 0.004、scaleX 1 → 1.05（cubic-bezier(.7,0,.84,0)）。つぶれるにつれ brightness 1 → 3
・0.35〜0.45秒：画面中央に、白く光る横線（高さ4px、box-shadow 0 0 30px #FFF, 0 0 60px #C6F432）を表示
・0.45〜0.8秒：シーンBを scaleY 0.004 → 1（cubic-bezier(.16,1,.3,1)）、brightness 3 → 1
・背景は黒`,
tr(H,root,mk,st,D){const B=mk(1,{transform:'scaleY(.004)',filter:'brightness(3)'}),A=mk(0);H.a(A,[{transform:'scale(1,1)',filter:'brightness(1)'},{transform:'scale(1.05,.004)',filter:'brightness(3)'}],{d:350,dl:st,e:E.in});
  const ln=H.abs({left:'0',top:'448px',width:'1600px',height:'4px',background:'#fff',boxShadow:'0 0 30px #fff,0 0 60px #c6f432',opacity:0},root);H.a(ln,[{opacity:1},{opacity:1}],{d:120,dl:st+340,f:'none'});
  hide(H,A,st+350);H.a(B,[{transform:'scaleY(.004)',filter:'brightness(3)'},{transform:'scaleY(1)',filter:'brightness(1)'}],{d:350,dl:st+450})}});

defT({no:'47',cat:'OBJECT',name:'テレビオフ',en:'TV Off / On',lead:'古いテレビの電源を切るように、線→点になって消え、また点く。',d:1200,
use:'<b>「チャンネルを変えると…」「場面は変わって」</b>に。レトロな味わいとユーモアのある切り替え。',
tips:['消える順番は「縦につぶれて横線→横に縮んで点→点が消える」','点く時は逆の順番。最初に白く光らせるとブラウン管らしい','テレビの砂嵐（ノイズ）を0.1秒挟むのもアリ'],
p:`古いブラウン管テレビの電源を切るように、場面が「横線→点」になって消え、また逆の順番で点いて次の場面が映る「テレビオフ」を作ってください。
・時間：1.2秒。背景は黒
・電源オフ（0〜0.5秒）：シーンAを scaleY 1 → 0.005（0.2秒）→ scaleX 1 → 0（0.15秒）。同時に brightness 1 → 3。最後に中央に白い点（直径16px、光る）を0.15秒残して消す
・0.5〜0.6秒：真っ暗
・電源オン（0.6〜1.2秒）：シーンBを白い点 → scaleX 0 → 1（0.15秒、高さ0.005のまま横線）→ scaleY 0.005 → 1（0.25秒）。brightness 3 → 1
・画面に走査線（2px間隔の横線、不透明度0.2）を重ねる`,
tr(H,root,mk,st,D){const B=mk(1,{transform:'scale(0,.005)'}),A=mk(0);H.a(A,[{transform:'scale(1,1)',filter:'brightness(1)'},{transform:'scale(1,.005)',filter:'brightness(3)',offset:.57},{transform:'scale(0,.005)',filter:'brightness(3)'}],{d:350,dl:st,e:E.in});hide(H,A,st+350);
  const dot=H.abs({left:'792px',top:'442px',width:'16px',height:'16px',borderRadius:'50%',background:'#fff',boxShadow:'0 0 20px #fff',opacity:0},root);H.a(dot,[{opacity:1},{opacity:0}],{d:150,dl:st+350,f:'none'});H.a(dot,[{opacity:1},{opacity:0}],{d:100,dl:st+600,f:'none'});
  H.a(B,[{transform:'scale(0,.005)',filter:'brightness(3)'},{transform:'scale(1,.005)',filter:'brightness(3)',offset:.375},{transform:'scale(1,1)',filter:'brightness(1)'}],{d:400,dl:st+650,e:E.out});
  H.abs({inset:'0',background:'repeating-linear-gradient(rgba(0,0,0,.2) 0 1px,transparent 1px 3px)',pointerEvents:'none'},root)}});

defT({no:'48',cat:'OBJECT',name:'ディストーション',en:'Distort Warp',lead:'場面がぐにゃりと歪んで溶け、歪みが戻ると別の場面。',d:1000,
use:'<b>めまい・混乱・夢・不思議な世界</b>に。「頭がぐるぐる」「意識が遠のく」などの演出や、MVの幻想的な場面転換に。',
tips:['歪みの強さ（scale）は150前後がピーク。それ以上は形が完全に崩れます','歪みのノイズを少しずつ動かすと、液体のようにうねります','色相を少し回すと、サイケデリックな印象が加わります'],
p:`場面がぐにゃりと歪んで溶けていき、歪みが戻ると別の場面になっている「ディストーションワープ」を作ってください。
・時間：1.0秒
・SVGフィルター：feTurbulence（type=turbulence、baseFrequency 0.008 0.02、numOctaves 2）＋ feDisplacementMap を、AとBの両方にかける
・0〜0.5秒：シーンAにかけた displacement の scale を 0 → 160（cubic-bezier(.7,0,.84,0)）。同時に hue-rotate 0 → 40°、不透明度 1 → 0（後半0.2秒で）
・0.5〜1.0秒：シーンBの scale を 160 → 0（cubic-bezier(.16,1,.3,1)）、hue-rotate 40° → 0、不透明度 0 → 1（前半0.2秒で）
・歪みの間、feTurbulence の seed を0.05秒ごとに変えて、うねりを動かす`,
tr(H,root,mk,st,D){const id='dw'+Math.floor(Math.random()*1e6);const svg=H.svg(1,1,root);const f=H.sv('filter',{id,x:'-10%',y:'-10%',width:'120%',height:'120%'},H.sv('defs',{},svg));const tb=H.sv('feTurbulence',{type:'turbulence',baseFrequency:'0.008 0.02',numOctaves:2,seed:1},f);const dm=H.sv('feDisplacementMap',{in:'SourceGraphic',scale:0},f);
  const B=mk(1,{opacity:0}),A=mk(0);A.style.filter=B.style.filter=`url(#${id})`;
  H.raf(s=>{const t=s*1000-st;if(t<0||t>D+50)return;const k=t/D;let sc;if(k<.5){const q=k/.5;sc=160*q*q*q;A.style.opacity=k>.3?Math.max(0,1-(k-.3)/.2):1;B.style.opacity=k>.3?Math.min(1,(k-.3)/.2):0}else{const q=(k-.5)/.5;sc=160*Math.pow(1-q,3);A.style.opacity=0;B.style.opacity=1}
    dm.setAttribute('scale',Math.max(0,sc).toFixed(1));tb.setAttribute('seed',Math.floor(t/50));root.style.filter=`hue-rotate(${(40*Math.sin(Math.min(1,k)*Math.PI)).toFixed(0)}deg)`;if(k>=1){A.style.filter=B.style.filter=root.style.filter='none';A.style.visibility='hidden'}})}});

defT({no:'49',cat:'OBJECT',name:'インクにじみ',en:'Ink Bleed',lead:'墨や絵の具が紙ににじんで広がるように、次の場面が染み出す。',d:1200,
use:'<b>アート・和風・手描き・クリエイティブ</b>な動画に。にじむ動きは有機的で、イラスト系・書道系の作品紹介と好相性。',
tips:['にじみの起点を3か所に分けると、自然なインクの広がりになります','輪郭をSVGのノイズで少し揺らすと、紙ににじんだ感じが出ます','広がる速さを起点ごとに変えると、より有機的に'],
p:`墨や絵の具が紙ににじんで広がるように、次の場面が3か所から染み出して画面を覆う「インクにじみ」を作ってください。
・時間：1.2秒
・シーンBをAの上に重ね、mask-image に radial-gradient を3つ重ねる（起点は 30% 60%、70% 35%、55% 80% あたり）
・各円の半径を 0 → 120% まで、それぞれ少し違う速さ（0.9〜1.2秒）と開始の遅れ（0〜0.2秒）で広げる。円の縁は8%幅でぼかす
・Bの外側の輪郭に、SVGフィルター（feTurbulence＋feDisplacementMap scale 30）をかけて、にじんだギザギザ感を出す（または輪郭用に黒い墨の層を同じ形で少し先行して広げる）
・墨の層：#111 の同じ形のマスクを、Bより0.08秒先行させて広げ、Bとの境目に墨の縁が見えるようにする`,
tr(H,root,mk,st,D){const A=mk(0);const ink=H.abs({inset:'0',background:'#111'},root);const B=mk(1);const C=[[30,60,0,1.0],[70,35,120,1.1],[55,80,200,.9]];
  const mask=(lead)=>{const s=performance.now();return t=>C.map(([x,y,dl,sp])=>{const k=Math.max(0,Math.min(1,(t-dl-lead)/(D*sp)));const e=1-Math.pow(1-k,3);const r=(e*120).toFixed(1);return `radial-gradient(circle at ${x}% ${y}%,#000 ${r}%,transparent ${(+r+8).toFixed(1)}%)`}).join(',')};
  const mB=mask(80),mI=mask(0);const set=(el,v)=>{el.style.webkitMaskImage=v;el.style.maskImage=v};set(B,mB(-1e4));set(ink,mI(-1e4));
  H.raf(s=>{const t=s*1000-st;if(t<-20||t>D+300)return;set(B,mB(t));set(ink,mI(t))})}});

defT({no:'50',cat:'OBJECT',name:'シェイプワイプ',en:'Shape Wipe',lead:'丸・四角・三角の図形が次々に広がって、最後の図形が次の場面に。',d:1100,
use:'<b>ポップ・キッズ・教育・明るいブランド</b>に。カラフルな図形がリズムよく広がるので、楽しい雰囲気の転換にぴったり。',
tips:['図形の色はシーンBの色と、その補色を交互にするときれい','最後の図形だけ回転させながら広げると、動きにメリハリが出ます','図形を画面の端から出すと、また違ったリズムになります'],
p:`丸・四角・三角の色付き図形が中央から次々に広がっていき、最後の図形の中に次の場面が現れる「シェイプワイプ」を作ってください。
・時間：1.1秒
・図形1：#C6F432 の円。0〜0.45秒で scale 0 → 画面を覆う大きさ（cubic-bezier(.65,0,.35,1)）
・図形2：#38D6FF の正方形（45°回転）。0.15〜0.6秒で同様に広げる
・図形3：#FF8FAB の正三角形（clip-path: polygon(50% 0, 100% 100%, 0 100%)）。0.3〜0.75秒、回転 0 → 90° しながら広げる
・最後：シーンBを clip-path: circle(0% at 50% 50%) → circle(80%) で0.45〜1.1秒に広げ、図形の上に重ねる
・図形がすべて画面を覆ったらAを非表示にし、Bが広がりきったら図形も非表示にする`,
tr(H,root,mk,st,D){const A=mk(0);const e='cubic-bezier(.65,0,.35,1)';const sh=[['#c6f432','50%','none',0],['#38d6ff','0','rotate(45deg)',150],['#ff8fab','0','none',300]];const els=sh.map(([c,r,rot,dl],i)=>{const s=H.abs({left:'500px',top:'150px',width:'600px',height:'600px',background:c,borderRadius:r,clipPath:i===2?'polygon(50% 0,100% 100%,0 100%)':'none',transform:'scale(0)'},root);
    H.a(s,[{transform:`scale(0) ${rot} rotate(0)`},{transform:`scale(${i===2?5:3.8}) ${rot} rotate(${i===2?90:0}deg)`}],{d:450,dl:st+dl,e});return s});
  const B=mk(1,{clipPath:'circle(0% at 50% 50%)'});H.a(B,[{clipPath:'circle(0% at 50% 50%)'},{clipPath:'circle(80% at 50% 50%)'}],{d:650,dl:st+450,e});hide(H,A,st+750);els.forEach(s=>hide(H,s,st+D))}});

defH({no:'01',cat:'CORP',name:'ダークSaaS',en:'Dark Grid & Glow',lead:'黒地に光のグリッド。AI・ITサービスの「今っぽい」定番。',text:'Flowbase',bg:'#06070b',

・配色：背景 #06070B、文字 #F4F5F7、サブ文字 #8A8F9C、アクセント #7C5CFF → #2EE6C9 のグラデーション
・フォント：見出し Noto Sans JP 900、英字と数字は Inter Tight または Space Grotesk

p:`色の光の上にすりガラスのカードが浮かぶ「グラスモーフィズム」スタイルの、アプリ紹介サイトを作ってください。

・動き：カードはマウスの位置に合わせて少し傾く（3Dチルト）。光の円はゆっくり位置を変え続ける`,

defH({no:'03',cat:'CORP',name:'ミニマル・コーポレート',en:'Minimal Corporate',lead:'白い余白と大きな日本語見出し。信頼を語るコンサル・士業向け。',text:'KASUGA & Partners',bg:'#f7f7f5',

p:`余白を大きくとった、上品で信頼感のある「ミニマル・コーポレート」スタイルの企業サイトを作ってください。

defH({no:'09',cat:'CREATOR',name:'キネティック・ネーム',en:'Kinetic Name',lead:'自分の名前が画面いっぱいに動く。デザイナーの自己紹介サイトに。',text:'SORA',bg:'#e9ff70',
use:'<b>デザイナー・アーティスト・タレント・個人ブランド</b>に。名前そのものをグラフィックにすると、一度で覚えてもらえます。',
tips:['名前は画面幅いっぱい（はみ出すくらい）にするのが迫力のコツ','塗り文字とフチ文字を交互にすると、動いているときにリズムが出ます','背景色は1色に絞り、蛍光色など記憶に残る色を選ぶ'],
p:`自分の名前が画面いっぱいの巨大な文字で動き続ける「キネティック・ネーム」スタイルの自己紹介サイトを作ってください。
・名前：{T}（グラフィックデザイナーという想定）
・配色：背景 #E9FF70（蛍光イエロー）、文字 #111111
・フォント：名前は Dela Gothic One（英字なら Archivo Black でも可）、本文は Zen Kaku Gothic New
・ファーストビュー：
　・名前を画面の高さの約35%の大きさで3段並べる。1段目と3段目は塗り、2段目は黒フチだけ（-webkit-text-stroke 3px）
　・各段は左右逆方向にゆっくり流れ続ける（無限マーキー）
　・マウスの横の位置で、流れる速さと方向が少し変わる
　・中央に、黒い丸いバッジ「HELLO, I'M {T}」が回転しながら浮かぶ
　・左下に「GRAPHIC DESIGNER / TOKYO」、右下に「SCROLL」
・セクション：自己紹介（大きな文字で一文）→ 作品一覧（黒背景に切り替わる）→ スキル → 経歴 → お問い合わせ（名前と同じ巨大な文字で「LET'S TALK」）→ フッター
・動き：スクロールすると名前の段が横に伸びる（scaleX 1 → 1.2）`,

  const bd=H.abs({left:'690px',top:'340px',width:'220px',height:'220px',borderRadius:'50%',background:'#111',color:'#e9ff70',display:'flex',alignItems:'center',justifyContent:'center',textAlign:'center',fontFamily:F.smono,fontSize:'22px',lineHeight:'1.3',padding:'20px'},null,`HELLO,\nI'M ${t}`);bd.style.whiteSpace='pre-line';

defH({no:'10',cat:'CREATOR',name:'サイバーパンク',en:'Cyberpunk HUD',lead:'ネオンとスキャンライン、照準のような枠。ゲーム・配信者向け。',text:'NEON//RAID',bg:'#07040f',

p:`ネオンとスキャンライン、照準のような枠が特徴の「サイバーパンク」スタイルの、ゲーム配信者サイトを作ってください。

　・中央に名前を特大で。マゼンタとシアンの文字を左右に3pxずらして重ね、4秒に1回だけ0.2秒グリッチ
　・その下に「LIVE NOW」の赤い点滅バッジと、配信プラットフォームへのボタン2つ（ネオンの枠線）

・セクション：メンバー紹介（キャラクターカード風）→ 配信スケジュール（週間表）→ 戦績・数字 → グッズ → スポンサー募集 → フッター
・動き：カードはホバーでネオンが強く光り、少しグリッチする`,
run(H,t){const fl=H.abs({left:'-400px',right:'-400px',top:'460px',height:'900px',perspective:'400px'});const gr=H.abs({inset:'0',backgroundImage:'linear-gradient(rgba(255,46,136,.6) 2px,transparent 2px),linear-gradient(90deg,rgba(255,46,136,.6) 2px,transparent 2px)',backgroundSize:'80px 80px',transform:'rotateX(70deg)',transformOrigin:'50% 0'},fl);H.a(gr,[{backgroundPosition:'0 0'},{backgroundPosition:'0 80px'}],{d:900,e:E.lin,i:Infinity});
  H.abs({left:'0',right:'0',top:'420px',height:'160px',background:'linear-gradient(transparent,#07040f 40%,transparent)'});
  const B=H.abs({left:'0',right:'0',top:'250px',textAlign:'center'});const sz=fs(t,170,1300);const mk=(c,x,bl)=>H.abs({left:'0',right:'0',top:'0',fontFamily:F.heavy,fontSize:sz+'px',color:c,transform:`translateX(${x}px)`,mixBlendMode:bl||'normal'},B,t);
  const a=mk('#ff2e88',-3,'screen'),b=mk('#22f0ff',3,'screen'),c=mk('#ede9ff',0);H.a(B,[{opacity:0},{opacity:1}],{d:600,dl:200});

  const row=H.abs({left:'0',right:'0',top:'500px',display:'flex',justifyContent:'center',gap:'20px',alignItems:'center'});const lv=H.el('div',{display:'flex',gap:'10px',alignItems:'center',fontFamily:F.smono,fontSize:'20px',color:'#ff2e88'},row);const dt=H.el('span',{width:'14px',height:'14px',borderRadius:'50%',background:'#ff2e88'},lv);H.el('span',{},lv,'LIVE NOW');H.a(dt,[{opacity:1},{opacity:.2}],{d:800,i:Infinity,dir:'alternate'});
  ['WATCH STREAM','JOIN DISCORD'].forEach((x,i)=>H.el('div',{fontFamily:F.smono,fontSize:'20px',padding:'14px 28px',border:`2px solid ${i?'#22f0ff':'#ff2e88'}`,color:'#ede9ff',boxShadow:`0 0 18px ${i?'#22f0ff':'#ff2e88'}`},row,x));rise(H,row,500);
  [[40,40,'0 0'],[1500,40,'90deg'],[40,800,'-90deg'],[1500,800,'180deg']].forEach(([x,y,r])=>{const c=H.abs({left:x+'px',top:y+'px',width:'60px',height:'60px',borderTop:'4px solid #22f0ff',borderLeft:'4px solid #22f0ff',transform:`rotate(${r==='0 0'?0:r})`})});
  H.abs({left:'120px',top:'50px',fontFamily:F.smono,fontSize:'16px',color:'#22f0ff',letterSpacing:'.2em'},null,'SYS.ONLINE');const clk=H.abs({right:'120px',top:'50px',fontFamily:F.smono,fontSize:'16px',color:'#22f0ff'});H.raf(()=>{const d=new Date();clk.textContent=d.toTimeString().slice(0,8)});
  H.abs({inset:'0',background:'repeating-linear-gradient(rgba(0,0,0,.35) 0 1px,transparent 1px 3px)',pointerEvents:'none'});

defH({no:'11',cat:'SHOP',name:'ラグジュアリー',en:'Black & Gold Luxury',lead:'黒と金、細い線、ゆったりした余白。ジュエリー・高級品の世界観。',text:'MAISON LUNE',bg:'#0b0a08',

p:`黒と金を基調にした、ゆったりと上品な「ラグジュアリー」スタイルのブランドサイトを作ってください。

　・左右の端に、縦書きの細い文字「HANDMADE IN KYOTO」「SINCE 2012」
　・下部中央に、細い縦線がゆっくり伸び縮みする「SCROLL」

・動き：すべてゆっくり（1.5秒以上）。光の反射（白い帯）が数秒に1回、金の文字や枠を斜めに走る`,
run(H,t){const gold='linear-gradient(135deg,#f3dfa2,#d9b76e 40%,#8c6a2f)';nav(H,{logo:'',items:['COLLECTION','STORY','STORE'],f:F.serif});

defH({no:'12',cat:'SHOP',name:'Y2Kポップ',en:'Y2K Chrome Pop',lead:'クロームの文字、キラキラ、パステル。平成レトロなアパレル向け。',text:'GLITTER CLUB',bg:'#f6e8ff',

p:`クロームの文字とキラキラ、パステルカラーが特徴の「Y2Kポップ」スタイルのアパレルブランドサイトを作ってください。
・ブランド名：{T}（10〜20代向けのアパレル・雑貨ブランドという想定）
・配色：背景 #F6E8FF → #DDF3FF のグラデーション、ピンク #FF6FD8、水色 #7FD8FF、文字 #2B1B3D
・フォント：ロゴはクローム風（太い欧文 Dela Gothic One に、白〜灰の縞のグラデーションを background-clip: text）、本文 Zen Kaku Gothic New
・ファーストビュー：
　・中央に巨大なクロームのロゴ。数秒ごとに光が横切る
　・ロゴのまわりに4方向の星（✦）のキラキラを8個、ばらばらのタイミングで点滅・回転
　・シャボン玉のような半透明の丸（虹色の縁）が5個ふわふわ上昇

  const bt=H.abs({left:'0',right:'0',top:'600px',display:'flex',justifyContent:'center'});H.el('div',{padding:'18px 44px',borderRadius:'999px',background:'#ff6fd8',color:'#fff',fontFamily:F.smono,fontSize:'22px',boxShadow:'0 8px 0 #c94aa8'},bt,'NEW ARRIVALS ✦');rise(H,bt,700);

defH({no:'13',cat:'SHOP',name:'オーガニックカフェ',en:'Organic Cafe',lead:'やわらかい曲線と葉っぱ、湯気。手しごと感のあるお店に。',text:'木もれび珈琲',bg:'#e7e9df',
use:'<b>カフェ・パン屋・自然食品・ハンドメイドのお店</b>に。角のない形とやさしい色で、「行ってみたい」と思わせる温かさを出します。',
tips:['写真の枠を丸みのある有機的な形（blob）にするだけで、ぐっと手しごと感が出ます','緑は彩度を落としたセージグリーンにすると落ち着いた印象に','湯気や葉のゆらぎなど「小さな動き」を1つだけ入れると心地いい'],
p:`やわらかい曲線と葉っぱのモチーフが温かい「オーガニックカフェ」スタイルのお店のサイトを作ってください。
・店名：{T}（自家焙煎のコーヒーと焼き菓子のカフェという想定）
・配色：背景 #E7E9DF、セージグリーン #6E8B6B、深緑 #2F3E2E、テラコッタ #C77B58、白 #FBFBF7
・フォント：見出し Zen Kaku Gothic New 700（またはやわらかい丸ゴシック）、英字 Cormorant Garamond の斜体
・ファーストビュー：
　・右側に、有機的なかたち（角のない不定形、border-radius の8値で作る）の大きな写真枠（グラデーションで代用）。枠の形がゆっくり呼吸するように変わる
　・枠の上に、カップから立ちのぼる湯気（白い半透明の曲線3本がゆらゆら上昇）
　・左側に、英字の斜体「slow coffee, slow days」と見出し「ひと息つける、まちの小さな珈琲店。」、営業時間と「メニューを見る」ボタン
　・葉っぱのイラスト（SVG）を2〜3枚、ゆっくり揺らす
・セクション：お店のこだわり → メニュー（写真付きカード、価格）→ 焼き菓子のオンライン注文 → アクセス（地図の枠と営業時間）→ Instagram → フッター

defH({no:'18',cat:'LOCAL',name:'フィットネスジム',en:'Dynamic Fitness',lead:'黒と赤、斜めの帯、太い斜体文字。勢いで入会させるジム向け。',text:'IRON PULSE GYM',bg:'#0c0c0c',

p:`黒と赤、斜めの構図と太い斜体の文字で勢いを出す「ダイナミック・フィットネス」スタイルのジムのサイトを作ってください。

・セクション：選ばれる理由（3つ）→ 料金プラン（3つ、おすすめを赤で強調）→ トレーナー紹介 → 会員のビフォーアフター → 施設紹介 → アクセス → フッター

run(H,t){const band=H.abs({left:'-200px',top:'560px',width:'2000px',height:'130px',background:'#e63946',transform:'rotate(-12deg)',overflow:'hidden',display:'flex',alignItems:'center'});const tr=H.el('div',{display:'flex',whiteSpace:'nowrap',fontFamily:F.heavy,fontSize:'74px',color:'#0c0c0c',fontStyle:'italic'},band);for(let i=0;i<8;i++)H.el('span',{paddingRight:'60px'},tr,'NO LIMIT. PUSH HARDER.');H.a(tr,[{transform:'translateX(0)'},{transform:'translateX(-25%)'}],{d:8000,e:E.lin,i:Infinity});

  const bd=H.abs({left:'760px',top:'130px',width:'150px',height:'150px',borderRadius:'50%',background:'#e63946',color:'#fff',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',fontFamily:F.heavy,fontSize:'22px',transform:'rotate(12deg)'});H.el('div',{},bd,'体験');H.el('div',{fontSize:'52px',lineHeight:'1'},bd,'0円');H.a(bd,[{transform:'rotate(12deg) scale(0)'},{transform:'rotate(12deg) scale(1)'}],{d:500,dl:900,e:E.back});
  const st=H.abs({left:'100px',bottom:'70px',display:'flex',gap:'60px'});const nums=[];[['会員',2400,'人'],['営業',24,'時間'],['マシン',80,'台']].forEach(([l,n,u])=>{const b=H.el('div',{},st);H.el('div',{fontSize:'17px',color:'#8a8a8a'},b,l);const v=H.el('div',{fontFamily:F.smono,fontSize:'52px',color:'#fff'},b,'0');nums.push([v,n,u])});rise(H,st,600);

defH({no:'19',cat:'LOCAL',name:'レストラン',en:'Fullscreen Dining',lead:'全画面の料理写真がゆっくり寄っていく。予約を取りたい飲食店に。',text:'Trattoria Sole',bg:'#120c08',

p:`全画面の料理写真がゆっくり寄っていく、映画のような「フルスクリーン・ダイニング」スタイルのレストランサイトを作ってください。

run(H,t){const ph=H.abs({inset:'0',background:'radial-gradient(circle at 60% 45%,#6b3a1d,#2b170c 60%,#120c08)'});H.abs({left:'760px',top:'160px',width:'560px',height:'560px',borderRadius:'50%',background:'radial-gradient(circle at 45% 40%,#f2e6d4,#d9c4a5 55%,#a88660 70%,transparent 72%)'},ph);H.abs({left:'880px',top:'280px',width:'320px',height:'320px',borderRadius:'50%',background:'radial-gradient(circle,#c8452b,#9a2f1c 60%,#e8b04b 70%,transparent 72%)'},ph);
  H.a(ph,[{transform:'scale(1)'},{transform:'scale(1.12)'}],{d:7000,e:E.lin});H.abs({inset:'0',background:'linear-gradient(transparent 35%,rgba(18,12,8,.95))'});
  const c=H.canvas();const x=c.getContext('2d');const P=[...Array(40)].map(()=>({x:rnd(0,1600),y:rnd(300,900),v:rnd(20,60),r:rnd(1.5,3.5)}));let last=0;H.raf(s=>{const dt=s-last;last=s;x.clearRect(0,0,1600,900);P.forEach(p=>{p.y-=p.v*dt;if(p.y<200)p.y=900;x.globalAlpha=(p.y-200)/700;x.fillStyle='#d98e48';x.beginPath();x.arc(p.x+Math.sin(s+p.r)*10,p.y,p.r,0,7);x.fill()})});

defH({no:'20',cat:'LOCAL',name:'手描きナチュラル',en:'Hand-drawn Kids',lead:'クレヨンのような線と、ぽよんと弾む図形。教室・保育・子ども向けに。',text:'こどもアトリエ そらいろ',bg:'#fffaf0',

p:`クレヨンで描いたような線と、ぽよんと弾むカラフルな図形が楽しい「手描きナチュラル」スタイルの子ども教室のサイトを作ってください。

run(H,t){const sv=H.svg(1600,900);const id='cr'+Math.floor(Math.random()*1e6);const f=H.sv('filter',{id},H.sv('defs',{},sv));H.sv('feTurbulence',{type:'fractalNoise',baseFrequency:'.04',numOctaves:2,result:'n'},f);H.sv('feDisplacementMap',{in:'SourceGraphic',in2:'n',scale:5},f);
  const sun=H.sv('g',{filter:`url(#${id})`},sv);sun.style.transformOrigin='1380px 170px';H.sv('circle',{cx:1380,cy:170,r:60,fill:'#ffc94a'},sun);for(let i=0;i<10;i++){const a=i/10*Math.PI*2;H.sv('line',{x1:1380+Math.cos(a)*80,y1:170+Math.sin(a)*80,x2:1380+Math.cos(a)*115,y2:170+Math.sin(a)*115,stroke:'#ffc94a','stroke-width':10,'stroke-linecap':'round'},sun)}H.a(sun,[{transform:'rotate(0)'},{transform:'rotate(360deg)'}],{d:20000,e:E.lin,i:Infinity});
  nav(H,{logo:t,items:['クラス','料金','ギャラリー'],c:'#3b3b3b',lf:F.pop,ls:'24px'});

  const C=H.abs({left:'0',right:'0',top:'300px',display:'flex',flexDirection:'column',alignItems:'center',gap:'20px',color:'#3b3b3b'});const h=H.el('div',{fontFamily:F.pop,fontSize:'84px'},C,'すきなものを、すきなだけ。');H.a(h,[{transform:'scale(.7)',opacity:0},{transform:'scale(1)',opacity:1}],{d:700,dl:200,e:E.back});
  const ws=H.svg(820,40,C,{position:'relative'});const wp=H.sv('path',{d:'M10 20 Q 60 0 110 20 T 210 20 T 310 20 T 410 20 T 510 20 T 610 20 T 710 20 T 810 20',fill:'none',stroke:'#ff8fab','stroke-width':10,'stroke-linecap':'round',filter:`url(#${id})`,'stroke-dasharray':1000,'stroke-dashoffset':1000},ws);H.a(wp,[{strokeDashoffset:1000},{strokeDashoffset:0}],{d:1200,dl:700});
  H.el('div',{fontSize:'24px',color:'#6b6b6b',marginTop:'10px'},C,'3〜12歳のアート教室。絵の具も、ねんども、ぜんぶ自由。');const bt=H.el('div',{padding:'20px 44px',borderRadius:'24px',background:'#ffc94a',border:'4px solid #3b3b3b',fontFamily:F.pop,fontSize:'24px',boxShadow:'0 6px 0 #3b3b3b'},C,'無料体験に申し込む');rise(H,bt,1000);
}});

defI({no:'01',cat:'BASIC',name:'画風チェンジの基本形',en:'Style Transfer Template',lead:'どんな画風にも使える「型」。まずはこれで変換のコツをつかむ。',
before:'人物が写ったスナップ写真',after:'構図と顔立ちはそのまま、指定した画風のイラスト',kw:['構図キープ','顔立ちキープ','線と塗りを指定','色数を指定'],pal:['#2b2d42','#8d99ae','#edf2f4','#ef233c','#ffd166'],tools:[GPT,GEM,FF],
use:'<b>すべての変換の土台</b>です。【スタイル】の1行を書き換えるだけで、水彩にもアニメにもなります。迷ったらここから始めてください。',
tips:['「線」「塗り」「色」「光」「背景」の5項目を指定すると、仕上がりのブレが一気に減ります','似なかったら「顔のパーツの位置と大きさは写真のまま」と追加で送る','最初は【スタイル】を短く、慣れたら細かく足していく'],
p:`【スタイル】やわらかいタッチのイラスト（ここを好きな画風に書き換える）
【描き方】
・線：輪郭に細めの線を入れる（太さは均一、色は濃い茶色）
・塗り：影は1段階だけのシンプルな塗り
・色：写真の色を少し明るく、彩度を少し上げる
・光：写真の光の向きを保つ
・背景：写真と同じ場所を、同じ画風で簡略化して描く
【必ず残すもの】顔の形とパーツの位置、髪型、服の形と色、ポーズ、写真の構図
【避けるもの】写真のような質感、顔の形が変わること、余計な人物や物の追加`,
enp:'Redraw the attached photo as a soft illustration. Keep the exact composition, pose, face shape, hairstyle and outfit. Thin uniform brown outlines, simple one-step cel shading, slightly brighter and more saturated colors, same lighting direction, simplified background in the same style. No photorealism, no extra people.'});

defI({no:'02',cat:'BASIC',name:'背景だけイラストにする',en:'Illustrated Background Only',lead:'人物は写真のまま、背景だけを絵本のような世界に描き変える。',
before:'街中・部屋など、ごちゃついた背景の写真',after:'人物は実写のまま、背景だけ手描きイラストの世界',kw:['人物はそのまま','背景だけ変換','合成感をなくす','光を合わせる'],pal:['#f4a261','#e9c46a','#2a9d8f','#264653','#fefae0'],tools:[GPT,GEM,FF],
use:'<b>プロフィール写真・SNS投稿・サムネイル</b>に。人物はリアルなまま、背景を変えるだけで「おしゃれな写真」に変わります。',
tips:['「人物の輪郭のまわりに不自然な縁を出さない」と入れると合成感が消えます','背景の色を、服の色の補色にすると人物が際立ちます','背景のテーマ（森・宇宙・海など）を一言で指定すると狙いどおりに'],
p:`【スタイル】写っている人物は写真のまま一切変えず、背景だけを手描きの絵本のようなイラストに描き変える
【描き方】
・人物：顔・髪・服・肌の質感をすべて写真のまま残す（イラスト化しない）
・背景：元の背景と同じ奥行きと配置を保ちつつ、水彩とクレヨンを混ぜたようなやさしいイラストに
・色：背景はあたたかいパステル調（オレンジ・黄・緑）
・光：人物にあたっている光の向きと色に、背景の光を合わせる
・境目：人物の輪郭のまわりに白い縁やぼやけを出さず、自然になじませる
【避けるもの】人物の顔や体の変化、合成したような不自然な境目`,
enp:'Keep the person in the attached photo completely photorealistic and unchanged. Replace only the background with a warm hand-drawn storybook illustration (watercolor and crayon texture, pastel orange, yellow and green), keeping the same depth and layout. Match the lighting on the person. Seamless edges, no halo.'});

defI({no:'03',cat:'BASIC',name:'人物だけイラストにする',en:'Illustrated Person Only',lead:'背景は写真のまま、人物だけをアニメ調のキャラクターに。',
before:'旅行先・カフェなどで撮った人物写真',after:'実写の風景の中に、アニメ調のキャラになった本人',kw:['背景は実写','人物だけ変換','影を落とす','サイズ感キープ'],pal:['#ffb4a2','#e5989b','#b5838d','#6d6875','#ffcdb2'],tools:[GPT,GEM],
use:'<b>旅行の記念写真・SNSのネタ投稿</b>に。「実写の世界にアニメのキャラがいる」違和感が面白く、バズりやすい表現です。',
tips:['「人物の足元に、実写の影を落とす」と入れると、その場にいる感じが出ます','人物の大きさと位置が変わらないよう「写真と同じサイズ・位置で」と明記','キャラの画風は11〜20のアニメ系から選んで組み合わせても◎'],
p:`【スタイル】背景は写真のまま一切変えず、写っている人物だけを日本のアニメ調のキャラクターに描き変える
【描き方】
・人物：顔立ち・髪型・服装・ポーズの特徴を残したまま、くっきりした線とアニメ塗り（影2段階）のキャラクターにする
・大きさと位置：写真の人物とまったく同じ大きさ・同じ位置に描く
・なじませ方：人物の足元や体の下に、写真の光に合った実写らしい影を落とす
・背景：写真のまま（色・ピント・ボケ感を変えない）
【避けるもの】背景のイラスト化、人物の大きさや向きの変化`,
enp:'Keep the background of the attached photo photorealistic and unchanged. Turn only the person into a Japanese anime-style character with clean lineart and two-tone cel shading, keeping face features, hairstyle, outfit and pose. Same size and position as in the photo. Add a realistic cast shadow matching the scene lighting.'});

defI({no:'04',cat:'BASIC',name:'塗り絵（線画）にする',en:'Coloring Page Lineart',lead:'写真をくっきりした黒い線だけの塗り絵に。子どもと遊べる。',
before:'家族・ペット・お気に入りの景色の写真',after:'白い紙に黒い線だけの、塗りやすい塗り絵',kw:['白黒の線画','塗りやすい太さ','影なし','A4印刷向け'],pal:['#ffffff','#e5e5e5','#999999','#333333','#000000'],tools:[GPT,GEM,CV],
use:'<b>子ども向けの塗り絵・お絵かきの下絵・ワークショップ</b>に。家族やペットの写真が、世界にひとつの塗り絵になります。',
tips:['線の太さを「3〜4px相当」と指定すると、子どもでも塗りやすい','細かすぎる背景は「簡略化して」と入れると塗り絵として使いやすくなります','A4で印刷するなら比率を「縦長（3:4）」に'],
p:`【スタイル】子どもが塗りやすい、白い紙に黒い線だけの「塗り絵（線画）」
【描き方】
・線：黒一色、太さは均一でやや太め（3〜4px相当）。線は途切れずに閉じた形にして、色を塗る範囲がはっきり分かるようにする
・塗り：一切塗らない。影・グレー・ハッチング（斜線）も入れない
・細部：髪の毛や服のしわは、主要な線だけに簡略化する
・背景：主要な形だけを残して簡略化。細かい模様は省く
・紙：真っ白な背景
【避けるもの】色、グレーの影、細かすぎる線、ぼやけた線`,
enp:'Convert the attached photo into a clean black and white coloring page. Bold uniform black outlines (3-4px), closed shapes, no shading, no gray, no hatching. Simplify hair, clothing folds and background details. Pure white background, printable.'});

defI({no:'05',cat:'BASIC',name:'季節を変える',en:'Season Swap',lead:'同じ場所・同じ構図のまま、夏を冬に、春を秋に描き変える。',
before:'夏に撮った公園・街・家の前の写真',after:'同じ構図のまま、雪が積もった冬のイラスト',kw:['構図キープ','季節の要素を追加','光の色を変える','服装も季節に'],pal:['#e0fbfc','#c2dfe3','#9db4c0','#5c6b73','#253237'],tools:[GPT,GEM,FF],
use:'<b>季節のあいさつ・年賀状・お店の季節告知</b>に。同じ写真を4季節ぶん作ると、SNSのシリーズ投稿にもなります。',
tips:['「光の色」まで変えるのがコツ（冬は青白く、秋は夕方のオレンジ）','人物がいる場合は「服装も季節に合わせて」と追加','4季節を1枚にまとめる（4分割）のも人気です'],
p:`【スタイル】写真と同じ場所・同じ構図・同じアングルのまま、季節を「冬」に変えたイラスト（季節は書き換え可：春・夏・秋・冬）
【描き方】
・季節の要素：屋根や地面、木の枝に雪を積もらせ、空からやさしく雪を降らせる。吐く息を白く
・光：冬の午後らしい、青白くやわらかい光
・色：全体を寒色寄りに。窓や街灯だけ暖かいオレンジで灯す
・人物：顔と体はそのまま、服装をコート・マフラーなど冬の装いに変える
・画風：やわらかい水彩タッチのイラスト
【避けるもの】建物や道の形・位置の変化、構図の変化`,
enp:'Redraw the attached photo as the same place, same composition and camera angle, but in winter: snow on roofs, ground and branches, gentle snowfall, visible breath, pale blue soft afternoon light, cool palette with warm orange windows and street lamps. People keep their faces and poses but wear coats and scarves. Soft watercolor illustration.'});

defI({no:'06',cat:'BASIC',name:'昼を夜のネオン街に',en:'Day to Neon Night',lead:'昼間の街の写真を、ネオンが光るエモい夜景イラストに。',
before:'昼間の商店街・駅前・ビルの写真',after:'看板がネオンに光る、雨上がりの夜の街',kw:['夜景化','ネオン','濡れた路面の反射','シネマティック'],pal:['#0b0f2b','#3a0ca3','#f72585','#4cc9f0','#ffd166'],tools:[GPT,GEM,MJ],
use:'<b>音楽・MVのサムネ、エモいSNS投稿、ゲームの背景素材</b>に。ありふれた街の写真が、映画のワンシーンに変わります。',
tips:['「雨上がりで路面が濡れている」と入れると、ネオンの反射が映えて一気にエモくなります','ネオンの色はピンク×水色が定番、紫×オレンジでレトロに','看板の文字は崩れやすいので、文字は入れない指示が安全'],
p:`【スタイル】写真の街並みを、ネオンが光る雨上がりの夜の街に描き変えたシネマティックなイラスト
【描き方】
・時間：深夜。空は深い紺〜紫のグラデーション
・光：看板・窓・街灯をネオン（ピンク #F72585、水色 #4CC9F0、黄色）で光らせ、まわりに光のにじみ（グロー）を出す
・路面：雨上がりで濡れていて、ネオンの光が反射して縦に伸びる
・空気：うっすら霧がかかり、光の筋が見える
・構図：建物の形・配置・遠近は写真のまま
・看板の文字：読める文字は入れず、光る模様だけにする
【避けるもの】昼間の光、建物の形の変化、読める文字`,
enp:'Transform the attached daytime street photo into a cinematic rainy night scene. Deep navy-purple sky, neon signs and windows glowing pink (#F72585), cyan (#4CC9F0) and yellow with soft bloom, wet asphalt with long neon reflections, light fog and light rays. Keep buildings, layout and perspective identical. No readable text on signs.'});

defI({no:'07',cat:'BASIC',name:'服装・髪型だけ変える',en:'Outfit Change',lead:'顔とポーズはそのまま、服や髪型だけを着せ替える。',
before:'正面に近い人物の全身〜上半身の写真',after:'同じ顔・同じポーズで、別の衣装を着たイラスト',kw:['顔キープ','ポーズキープ','着せ替え','コスプレ風'],pal:['#22223b','#4a4e69','#9a8c98','#c9ada7','#f2e9e4'],tools:[GPT,GEM],
use:'<b>コスプレの試着・制服や衣装のイメージ確認・キャラ作り</b>に。「この服を着たらどう見える？」をすぐに試せます。',
tips:['衣装は「色・素材・形」の3点で指定すると思いどおりになりやすい','髪型も変えるなら「髪の長さと色」を具体的に','実写のまま着せ替えたいときは、【スタイル】を「写真のまま」に変える'],
p:`【スタイル】顔・表情・体型・ポーズは写真のまま、服装と髪型だけを変えたイラスト
【変更内容】（書き換えて使う）
・服装：深い紺色のブレザーに、白いシャツと赤いネクタイの制服（素材はウール）
・髪型：肩までの長さ、こげ茶色、ゆるいウェーブ
【描き方】
・顔：目・鼻・口の形と位置、肌の色を写真のまま残す
・ポーズ：手足の位置・体の向きを写真のまま
・画風：きれいな線と、やわらかい影のアニメ風イラスト
・背景：写真の背景をそのまま同じ画風で
【避けるもの】顔立ちの変化、体型の変化、ポーズの変化`,
enp:'Keep the face, expression, body shape and pose of the person in the attached photo. Change only the outfit to a navy wool blazer school uniform with white shirt and red tie, and the hair to shoulder-length dark brown loose waves. Clean anime-style illustration with soft shading, same background redrawn in the same style.'});

defI({no:'08',cat:'BASIC',name:'古い写真をカラーで蘇らせる',en:'Restore & Colorize',lead:'色あせたモノクロ写真を、鮮やかなカラーのイラストに描き起こす。',
before:'昔のモノクロ写真・色あせた家族写真',after:'傷やシミが消え、当時の色を想像して塗られたイラスト',kw:['修復','カラー化','傷・シミ除去','当時の色'],pal:['#d4a373','#faedcd','#fefae0','#ccd5ae','#606c38'],tools:[GPT,GEM],
use:'<b>家族の思い出・ご先祖の写真・地域の昔の写真</b>に。贈り物や、法事・記念日のスライドショーにも喜ばれます。',
tips:['写真に写っている時代（昭和30年代など）を書くと、服や物の色が自然になります','「本人の顔は変えずに」を強めに入れるのが大切','イラストではなく写真のまま修復したいなら【スタイル】を「写真として修復」に'],
p:`【スタイル】古いモノクロ写真を修復し、当時の色を想像してカラーで描き起こしたイラスト
【描き方】
・修復：写真の傷・折り目・シミ・ノイズをすべて消す
・色：写っている時代（例：昭和30年代）にふさわしい、落ち着いた自然な色で塗る。肌は健康的な自然な色
・画風：写真の質感を少し残した、やわらかい手描きの絵画調
・光：写真の光の向きを保つ
・顔：写っている人の顔立ちと表情を一切変えない
【避けるもの】顔の変化、派手すぎる色、現代の物の追加`,
enp:'Restore the attached old black-and-white photo: remove scratches, folds, stains and noise, then colorize it with natural, period-appropriate muted colors (1950s Japan) as a soft hand-painted illustration that keeps a hint of photographic texture. Preserve every face and expression exactly. No modern objects.'});

defI({no:'09',cat:'BASIC',name:'ラフから完成イラストへ',en:'Sketch to Finished Art',lead:'手描きのラフや落書きを、プロが仕上げたような完成イラストに。',
before:'紙に描いたラフ・落書き・棒人間の構図メモ',after:'ラフの構図どおりに清書・着色された完成イラスト',kw:['清書','着色','構図キープ','アイデアを形に'],pal:['#003049','#d62828','#f77f00','#fcbf49','#eae2b7'],tools:[GPT,GEM],
use:'<b>絵が苦手な人のアイデアスケッチ・漫画のネーム・資料の挿絵</b>に。頭の中のイメージを、ラフ1枚から完成させられます。',
tips:['ラフに「ここは空」「これは犬」など文字でメモを書いておくと、AIが正しく読み取ります','画風を指定しないと平均的な絵になるので、必ず【スタイル】を具体的に','気に入らない部分は「左の人物だけ描き直して」と部分指定で直せます'],
p:`【スタイル】添付した手描きのラフ（落書き）を、プロが仕上げたような完成イラストにする
【描き方】
・構図：ラフの人物や物の位置・大きさ・向きをそのまま守る
・読み取り：ラフに書かれたメモ（文字）は、描く内容の指示として読み取り、絵の中には描かない
・線：きれいに清書した、強弱のある線
・塗り：明るい色で、影と光をしっかり入れた丁寧な塗り
・背景：ラフに描かれた場所を、奥行きのある背景として描き込む
【避けるもの】ラフにない大きな要素の追加、構図の変更、メモ文字の描き込み`,
enp:'Turn the attached rough hand-drawn sketch into a polished, professionally finished illustration. Keep the exact positions, sizes and directions of all figures and objects. Treat handwritten notes as instructions and do not draw them. Clean lineart with line weight variation, bright colors with full lighting and shading, detailed background with depth.'});

defI({no:'10',cat:'BASIC',name:'写真からロゴ・アイコン素材',en:'Photo to Simple Icon',lead:'写真の被写体を、ロゴやアイコンに使えるシンプルな図形にする。',
before:'お店の外観・商品・ペット・料理の写真',after:'少ない色と単純な形でできた、ロゴに使える図案',kw:['シンプル化','3色以内','単色背景','ベクター風'],pal:['#1d3557','#457b9d','#a8dadc','#f1faee','#e63946'],tools:[GPT,GEM,CV],
use:'<b>お店のロゴ案・SNSアイコン・ショップカード・ステッカー</b>に。写真の特徴を残したまま、デザイン素材として使える形にします。',
tips:['色数を「3色以内」と決めると、ロゴとして使いやすい図案になります','背景は単色にして、あとで切り抜きやすく','正式なロゴにする場合は、デザイナーにベクター化して整えてもらうと安心'],
p:`【スタイル】写真の主役（人物・動物・建物・商品など）を、ロゴやアイコンに使えるシンプルな図案にする
【描き方】
・形：主役の特徴的なシルエットだけを残し、細部を大胆に省略した単純な形にする
・色：3色以内（例：紺・水色・白）。グラデーションは使わない
・線：線を使う場合は太さを均一に
・構図：主役を中央に大きく、正方形の中にバランスよく収める
・背景：無地の単色
【避けるもの】写真のような質感、細かい模様、4色以上の色、文字`,
enp:'Simplify the main subject of the attached photo into a minimal flat icon suitable for a logo: keep only the characteristic silhouette, bold simplified shapes, maximum 3 flat colors (navy, light blue, white), no gradients, uniform line weight, centered in a square, solid plain background, no text.'});

/* ANIME */
defI({no:'11',cat:'ANIME',name:'セル画アニメ風',en:'Cel Anime',lead:'くっきりした線と2段階の影。今のテレビアニメのような王道スタイル。',
before:'自撮り・友達との写真・推し活の写真',after:'テレビアニメのワンシーンのような、くっきり塗りのキャラ',kw:['アニメ塗り','影2段階','ハイライト','大きな瞳'],pal:['#ffd6e0','#ffb3c6','#8ecae6','#219ebc','#023047'],tools:[GPT,GEM,MJ],
use:'<b>SNSアイコン・推し活・友達へのプレゼント</b>に。いちばん人気で、誰が見ても「アニメになった！」と分かる定番の変換。',
tips:['「影は2段階」「髪にハイライト」と入れると、アニメらしさが一気に増します','目を大きくしすぎると本人に似なくなるので「目は少しだけ大きく」が◎','背景は「背景美術のように」と指定すると、作品のワンシーン感が出ます'],
p:`【スタイル】日本のテレビアニメのワンシーンのような、セル画風のアニメイラスト
【描き方】
・線：くっきりとした黒〜こげ茶の主線。輪郭はやや太く、内側の線は細く
・塗り：アニメ塗り（ベタ塗り＋はっきりした影を2段階）。髪には帯状のツヤ（ハイライト）
・顔：顔立ちの特徴は残しつつ、目は少しだけ大きく、瞳に光を2つ入れる
・色：明るく鮮やか。肌は透明感のある色
・背景：写真の場所を、アニメの背景美術のように描き込む（空はグラデーションと雲）
【避けるもの】写真っぽい質感、顔立ちが別人になること`,
enp:'Redraw the attached photo as a still from a modern Japanese TV anime: crisp dark brown lineart (thicker outer lines), flat cel shading with two hard shadow tones, glossy band highlights on hair, slightly larger eyes with two catchlights, bright saturated colors, background painted like anime background art with gradient sky and clouds. Keep facial features recognizable.'});

defI({no:'12',cat:'ANIME',name:'90年代レトロアニメ風',en:'90s Retro Anime',lead:'少しくすんだ色、フィルムのざらつき。懐かしいビデオアニメの雰囲気。',
before:'夕方の街・部屋・人物の写真',after:'90年代のビデオアニメのような、くすんだ色とざらつきのある絵',kw:['レトロ','くすみカラー','フィルムグレイン','セル画の質感'],pal:['#3d405b','#e07a5f','#f2cc8f','#81b29a','#f4f1de'],tools:[GPT,MJ,GEM],
use:'<b>シティポップのMV・エモいSNS投稿・レトロ好きのアイコン</b>に。平成レトロブームで、若い世代にも人気のスタイル。',
tips:['「フィルムのざらつき」「わずかな色ズレ」を入れると、ビデオ映像らしい懐かしさが出ます','夕方のオレンジ〜紫の空と相性が抜群','画面の比率を4:3にすると、さらに当時っぽくなります'],
p:`【スタイル】1990年代のビデオアニメ（OVA）のような、懐かしいレトロアニメ調のイラスト
【描き方】
・線：やや太めで少しだけ揺らぎのある主線
・塗り：セル画風のベタ塗りと影。影はやや青みがかった色
・色：少しくすんだ（彩度を落とした）色。夕焼けのオレンジ・紫・ピンクを多めに
・質感：フィルムのざらつき（グレイン）、わずかな色のにじみ、少しだけぼやけた輪郭
・顔：顔立ちを残しつつ、当時のアニメらしい細めのあご・大きめの瞳
・背景：写真の場所を、手描きの背景画のように
【避けるもの】今どきのくっきりしたデジタル塗り、鮮やかすぎる色`,
enp:'Redraw the attached photo as a frame from a 1990s Japanese OVA anime: slightly thick, subtly wobbly lineart, cel shading with bluish shadows, muted desaturated palette with sunset orange, purple and pink, film grain, slight chromatic bleed and softness, hand-painted background, retro character proportions. Keep the person recognizable. 4:3 framing.'});

defI({no:'13',cat:'ANIME',name:'少女漫画風',en:'Shoujo Manga',lead:'キラキラの瞳、花と光のトーン。ときめく少女漫画の1コマに。',
before:'カップル・友達・自撮りの写真',after:'花びらとキラキラに囲まれた、少女漫画の1ページ',kw:['キラキラの瞳','花のトーン','繊細な線','ときめき'],pal:['#ffe5ec','#ffc2d1','#ffb3c6','#fb6f92','#ffffff'],tools:[GPT,MJ,GEM],
use:'<b>カップル写真・結婚式・記念日のプレゼント</b>に。ロマンチックな演出で、贈り物として特に喜ばれる変換です。',
tips:['「背景に花びらとキラキラのトーン」で一気に少女漫画らしくなります','モノクロにすると漫画本のページらしく、カラーにすると表紙イラストらしくなります','瞳の描き込みを強調すると、ときめき度が上がります'],
p:`【スタイル】昔ながらの少女漫画のような、繊細でロマンチックなイラスト
【描き方】
・線：細く繊細な線。まつ毛を長く、髪の毛は流れるような細い線で
・瞳：大きく、星や光をたくさん描き込んだキラキラの瞳

・紙：生成りの和紙。墨が和紙ににじむ質感
・アクセント：右下に小さな朱色の落款（四角いハンコ）を1つ
・色：墨の黒〜グレーと、落款の朱色だけ
【避けるもの】カラー、細かい描き込み、背景を埋め尽くすこと`,
enp:'Repaint the attached photo as a Japanese sumi-e ink wash painting on cream washi paper: only three ink tones (dark, mid, pale), bold confident brush strokes with dry-brush and bleeding edges, subject only with more than half of the canvas left as empty space, one small red square seal stamp in the lower right. Monochrome ink plus red seal only.'});

artI({no:'35',cat:'ART',name:'色鉛筆画',en:'Colored Pencil',lead:'紙の目が見える、やさしい色鉛筆の手描きイラスト。',
before:'子ども・ペット・食べ物・身近な風景の写真',after:'色鉛筆で丁寧に描いた、あたたかい手描きの絵',kw:['色鉛筆','紙の目','やさしい線','手描き'],pal:['#ffcdb2','#ffb4a2','#e5989b','#b5838d','#6d6875'],tools:[GPT,GEM,MJ],
use:'<b>子どもやペットの記念・絵日記風の投稿・手紙やカード</b>に。手描きのぬくもりで、見る人をほっとさせます。',
tips:['「紙の白が少し残る程度の塗り」にすると、色鉛筆らしさが出ます','線の方向をそろえた細かいストロークで塗ると、本物らしくなります','背景を描かず白のままにすると、絵本の挿絵のように'],
p:`【スタイル】画用紙に色鉛筆で描いた、やさしい手描きのイラスト
【描き方】
・線：色鉛筆の細い線。輪郭は茶色やこげ茶の色鉛筆で、少しだけ揺らぎを残す
・塗り：細かいストロークを同じ方向に重ねて塗る。強く塗る所と軽く塗る所の差を出す
・質感：画用紙の凹凸（紙の目）が見え、紙の白が少し残る
・色：あたたかく、やさしい中間色
・背景：主役のまわりだけ軽く塗り、外側は紙の白のまま
・顔：顔立ちの特徴を残す
【避けるもの】ベタ塗り、デジタルの質感、黒い太い線`,
enp:'Redraw the attached photo as a gentle colored pencil drawing on textured drawing paper: thin slightly wobbly brown outlines, fine directional pencil strokes layered with varying pressure, visible paper tooth with specks of white showing through, warm soft mid-tone palette, background lightly shaded only around the subject and fading to white paper. Keep faces recognizable.'});

artI({no:'36',cat:'ART',name:'パステル画',en:'Soft Pastel',lead:'指でぼかしたような、ふんわりやわらかいパステル画。',
before:'夕焼け・花・赤ちゃん・恋人の写真',after:'粉っぽい質感でふんわりぼかした、夢のようなパステル画',kw:['パステル','ぼかし','粉の質感','夢のよう'],pal:['#ffd6ff','#e7c6ff','#c8b6ff','#b8c0ff','#bbd0ff'],tools:[GPT,GEM,MJ],
use:'<b>赤ちゃん・マタニティ・ウェディング・夕焼けの写真</b>に。やわらかく夢のような印象で、記念の一枚にぴったり。',
tips:['「色紙（いろがみ）の上に描いた」とすると、紙の色が透けて味わいが出ます','空や光は指でぼかしたように、輪郭はチョークの線を残すとメリハリが出ます','淡いピンク〜紫の色紙が、パステルと相性抜群'],
p:`【スタイル】淡い色紙（いろがみ）の上に、ソフトパステルで描いたやわらかい絵
【描き方】
・塗り：パステルを指でこすってぼかしたような、ふんわりしたグラデーション
・線：ところどころにチョークのような粉っぽい線を残し、形を表す
・質感：粉っぽいマットな質感と、色紙のざらざらした凹凸
・色：やわらかいピンク・ラベンダー・水色を中心に
・光：光のあたる部分は白いパステルでやさしく明るく
・顔：顔立ちの特徴を残す
【避けるもの】くっきりした線、つやのある質感、濃すぎる色`,
enp:'Redraw the attached photo as a soft pastel drawing on light tinted paper: finger-blended dreamy gradients, a few chalky powdery strokes defining forms, matte dusty texture with visible paper grain, soft pink, lavender and sky blue palette, gentle white pastel highlights. Keep faces recognizable. No hard lines, no gloss.'});

artI({no:'37',cat:'ART',name:'ポップアート',en:'Pop Art Halftone',lead:'あざやかな原色と網点のドット、太い黒線。アメコミのようなポップアート。',
before:'人物の顔アップ・表情のある写真',after:'原色と網点で描かれた、60年代風のポップアート',kw:['網点','原色','太い黒線','アメコミ'],pal:['#ffd60a','#ff006e','#3a86ff','#000000','#ffffff'],tools:[GPT,MJ,GEM],
use:'<b>インパクトのあるアイコン・ポスター・Tシャツのデザイン</b>に。4色違いを並べる「4分割」も人気です。',
tips:['「4分割で、それぞれ背景色を変えて」と入れると、おなじみのポップアートの構成に','網点のドットを大きめにすると、印刷物らしさが強調されます','表情は少し大げさにすると、ポップアートらしくなります'],
p:`【スタイル】1960年代のポップアートのような、原色と網点のイラスト
【描き方】
・線：太く黒い、くっきりした輪郭線
・塗り：黄・ピンク・青・赤などの原色のベタ塗り。肌や影は大きめの網点（ドット）で表現
・背景：原色1色のベタ、または大きなドット模様
・構成：（任意）画面を4分割し、同じ顔をそれぞれ違う配色で並べる
・顔：顔立ちの特徴を残し、表情を少しだけ大げさに
【避けるもの】中間色、グラデーション、写真の質感、文字`,
enp:'Redraw the attached portrait as 1960s pop art: bold black outlines, flat primary colors (yellow, magenta, blue, red), skin and shading rendered with large halftone dots, solid or big-dot background, optional 2x2 grid with the same face in four different color schemes, slightly exaggerated expression. No gradients, no text.'});

artI({no:'38',cat:'ART',name:'ステンドグラス',en:'Stained Glass',lead:'鉛の黒い線で区切られた色ガラス。光が透ける教会の窓のように。',
before:'人物・動物・花・風景の写真',after:'色ガラスの破片を鉛の線でつないだ、光が透けるステンドグラス',kw:['ステンドグラス','鉛の線','色ガラス','透過光'],pal:['#003049','#d62828','#f77f00','#fcbf49','#2a9d8f'],tools:[GPT,MJ,GEM],
use:'<b>結婚式・記念日・アート作品・お店の装飾デザイン</b>に。光が透ける表現で、神聖で特別な一枚になります。',
tips:['ガラスの1枚1枚を大きめにすると、本物のステンドグラスらしくなります','後ろから光が透けている設定にすると、色が宝石のように輝きます','アーチ型の窓の枠に収めると、教会の窓のような雰囲気に'],
p:`【スタイル】教会の窓のようなステンドグラス
【描き方】
・形：写真の内容を、大きめの色ガラスの破片に分割して表現する
・線：ガラスとガラスの間を、太さが一定の黒い鉛の線でつなぐ
・色：深い青・赤・オレンジ・黄・緑など、宝石のように澄んだ色。ガラス1枚の中に少しだけ濃淡
・光：後ろから太陽の光が透けて、色が輝いている。ガラスの気泡やゆがみも少し
・枠：上が半円のアーチ型の窓枠に収める
・顔：顔立ちの特徴が分かる程度に残す
【避けるもの】細かすぎる分割、写真の質感、くすんだ色`,
enp:'Recreate the attached photo as a stained glass window: the scene divided into fairly large pieces of colored glass joined by uniform black lead came lines, jewel-toned deep blue, red, orange, yellow and green with subtle variation inside each piece, backlit by sunlight so colors glow, slight bubbles and distortion in the glass, arched window frame. Keep faces recognizable.'});

artI({no:'39',cat:'ART',name:'切り絵',en:'Layered Paper Cut',lead:'色紙を何層にも重ねて切り抜いた、立体的な切り絵アートに。',
before:'風景・動物・人物のシルエットが分かる写真',after:'色紙を重ねて影ができた、奥行きのある切り絵',kw:['切り絵','紙の層','影','立体感'],pal:['#03045e','#0077b6','#00b4d8','#90e0ef','#caf0f8'],tools:[GPT,MJ,GEM],
use:'<b>絵本の表紙・ポスター・季節のディスプレイ</b>に。紙の重なりと影で、手作りの温かさと立体感が出ます。',
tips:['「6〜8層の紙」と層の数を指定すると、奥行きがコントロールできます','色は同じ系統（青なら青だけ）の濃淡でまとめると美しい','層と層の間に影を落とすのが、立体感の一番のポイント'],
p:`【スタイル】色紙を何層にも重ねて切り抜いた、立体的なレイヤード切り絵（ペーパーカット）アート
【描き方】
・層：手前から奥へ、6〜8枚の紙の層で構成する。手前ほど濃い色、奥ほど淡い色
・形：写真の主役や風景を、なめらかな曲線のシルエットに単純化して切り抜く
・影：層と層の間にやわらかい影を落とし、紙が浮いているような奥行きを出す
・質感：紙の繊維と、切り口のわずかな白い断面
・色：同じ系統の色（例：深い青〜水色）の濃淡でまとめる
【避けるもの】細かすぎる切り抜き、写真の質感、平面的な仕上がり`,
enp:'Recreate the attached photo as a layered paper-cut artwork: 6-8 stacked layers of cut colored paper, darker in front and lighter toward the back, subjects simplified into smooth curved silhouettes, soft drop shadows between layers for depth, visible paper fiber and thin white cut edges, monochromatic palette from deep navy to pale cyan.'});

artI({no:'40',cat:'ART',name:'鉛筆デッサン',en:'Graphite Sketch',lead:'鉛筆の濃淡だけで描いた、美術室のようなリアルなデッサン。',
before:'人物の顔・手・静物の写真',after:'鉛筆の線と陰影で描いた、モノクロの写実的なデッサン',kw:['鉛筆','陰影','ハッチング','モノクロ'],pal:['#f8f9fa','#dee2e6','#adb5bd','#495057','#212529'],tools:[GPT,GEM,MJ],
use:'<b>似顔絵のプレゼント・アートなプロフィール・思い出の記録</b>に。シンプルなモノクロで、時代を問わない品のある一枚に。',
tips:['「仕上げきらず、端は線のまま残す」と入れると、作品らしい余韻が出ます','クロスハッチング（交差する線）で影をつけると、手描き感が増します','紙を少し黄ばんだクリーム色にすると、古いスケッチブックのように'],
p:`【スタイル】スケッチブックに鉛筆で描いた、写実的なデッサン
【描き方】
・線：HB〜6Bの鉛筆の線。輪郭は軽く、影の部分はしっかり描き込む
・陰影：線を重ねるハッチング・クロスハッチングと、指でこすったぼかしで立体感を出す
・仕上げ：主役の顔（または中心）はしっかり描き、外側に向かってだんだん線だけのラフな状態になる
・紙：少しクリーム色がかったスケッチブックの紙。消しゴムでつけたハイライトも少し
・顔：顔立ち・表情を正確に残す
・色：鉛筆のグレーだけ（モノクロ）
【避けるもの】カラー、写真のような完全な仕上がり、デジタルっぽい線`,
enp:'Redraw the attached photo as a realistic graphite pencil sketch in a sketchbook: HB to 6B pencil, light construction lines, hatching and cross-hatching with finger-blended smudges for volume, fully rendered center fading to loose unfinished lines at the edges, slightly cream paper with eraser highlights. Accurate facial features and expression. Monochrome graphite only.'});

/* GRAPHIC */
artI({no:'41',cat:'GRAPHIC',name:'フラットイラスト',en:'Flat Illustration',lead:'線なし・影少なめ・シンプルな形。Webや資料で使いやすい定番。',
before:'仕事中・カフェ・街角などの人物写真',after:'シンプルな形と少ない色でできた、今っぽいフラットイラスト',kw:['フラット','線なし','少ない色','Web素材'],pal:['#264653','#2a9d8f','#e9c46a','#f4a261','#e76f51'],tools:[GPT,GEM,CV],
use:'<b>Webサイト・プレゼン資料・ブログのアイキャッチ・SNSの図解</b>に。どんなデザインにもなじむ、いちばん実用的なスタイル。',
tips:['「5色以内」と色を限定すると、資料に使ったときに統一感が出ます','顔は目と口だけ、または顔のパーツなしにすると、より今っぽくなります','ブランドカラーを指定すれば、自社専用の素材が作れます'],
p:`【スタイル】Webサイトや資料で使える、シンプルなフラットイラスト
【描き方】
・形：人物も物も、丸・四角などの単純な形の組み合わせに簡略化する
・線：輪郭線は使わない
・塗り：ベタ塗り。影は同じ色の少し濃い色で1段階だけ
・色：5色以内（例：深緑・青緑・黄・オレンジ・赤オレンジ）。背景は淡い単色
・顔：目と口だけのシンプルな表情（または顔のパーツなし）。髪型と服の色で本人らしさを出す
・小物：写真にある物（PC・コーヒーなど）も単純な形で描く
【避けるもの】写真の質感、細かい描き込み、グラデーション`,
enp:'Redraw the attached photo as a modern flat vector-style illustration: people and objects simplified into basic geometric shapes, no outlines, flat fills with one darker shade for shadows, max 5 colors (deep teal, teal, yellow, orange, coral) on a pale solid background, minimal faces (dots for eyes or no features), identity shown through hairstyle and clothing colors.'});

artI({no:'42',cat:'GRAPHIC',name:'一筆書きライン',en:'Continuous Line Art',lead:'一本の線だけで描いたような、おしゃれなミニマル線画。',
before:'横顔・人物・カップル・動物の写真',after:'途切れない一本の線で描かれた、ミニマルな線画',kw:['一本線','ミニマル','余白','おしゃれ'],pal:['#f5f0e8','#111111','#c9ada7','#9a8c98','#f2e9e4'],tools:[GPT,MJ,GEM],
use:'<b>ロゴ・タトゥーのデザイン案・Tシャツ・インテリアのポスター</b>に。シンプルなので、どんな雰囲気のデザインにも合います。',
tips:['横顔の写真がいちばんきれいに仕上がります','線の色を1色、背景を生成りにすると、北欧インテリアのポスターのように','「顔の一部に1色だけ丸い色面を置く」と、今っぽいアート感が出ます'],
p:`【スタイル】途切れない一本の線だけで描いたような、ミニマルな線画（一筆書き風のラインアート）
【描き方】
・線：黒の細い線1本で、ペンを紙から離さずに描いたように、すべてがつながっている

・色：線は黒1色。（任意）ほほの位置などに、淡いピンクの丸い色面を1つだけ置く
・背景：生成り（#F5F0E8）の無地。たっぷりの余白
・顔：横顔のラインや髪型など、本人らしさが分かる特徴を残す
【避けるもの】塗りつぶし、影、線が途切れること、細かい描き込み`,
enp:'Redraw the attached photo as a minimalist continuous single-line drawing: one thin unbroken black line that never lifts from the paper, capturing only defining contours (profile, hair flow, shoulders), bold omission of detail, optional single soft pink circular color shape on the cheek, plain cream (#F5F0E8) background with generous negative space.'});

artI({no:'43',cat:'GRAPHIC',name:'昭和レトロポスター',en:'Showa Retro Poster',lead:'色あせたインク、ざらついた紙。昭和の観光ポスターのように。',

tips:['「色あせ」「印刷のズレ」「紙の折り目」を足すと、本物の古いポスターらしさが増します','文字を入れたい場合は短く。崩れたら文字なしで作って後から入れましょう','空を大きくとった構図にすると、観光ポスターらしくなります'],
p:`【スタイル】昭和40年代の観光ポスター・広告のような、レトロなイラスト
【描き方】
・画風：単純化した形と、太めの輪郭の手描きイラスト

・質感：ざらついた紙、インクのかすれ、色版のわずかなズレ、うっすら黄ばんだ紙
・構図：空を大きくとり、主役を印象的に配置したポスターの構図

enp:'Redraw the attached photo as a 1960s-70s Japanese Showa-era travel poster illustration: simplified shapes with thick hand-drawn outlines, faded limited ink palette (vermilion, mustard, teal, navy, cream), rough paper grain, ink wear, slight color plate misregistration, yellowed paper, poster composition with a big sky, cheerful retro characters. No long readable text.'});

artI({no:'44',cat:'GRAPHIC',name:'シティポップ',en:'80s City Pop',lead:'夏の夕暮れ、プール、ヤシの木。80年代のレコードジャケット風。',

enp:'Redraw the attached photo as a 1980s Japanese city pop album cover illustration: clean simplified shapes with crisp outlines, flat blue or purple cast shadows, sunset sky gradient orange to pink to aqua, bright pastel palette, add palm trees, pool, sea, cars or lit windows as fits the scene, warm low sun with long shadows, square composition. No text.'});

artI({no:'45',cat:'GRAPHIC',name:'北欧イラスト',en:'Scandinavian Folk',lead:'ゆるい線と、草花の模様。北欧の雑貨のような、ほっこりしたイラスト。',
before:'家・家族・ペット・森の写真',after:'草花の模様に囲まれた、北欧雑貨のようなほっこりイラスト',kw:['北欧','草花の模様','くすみカラー','手描き'],pal:['#f2e8cf','#a7c957','#6a994e','#bc4749','#386641'],tools:[GPT,GEM,MJ],
use:'<b>インテリアのポスター・テキスタイルのデザイン案・カフェのメニュー</b>に。家族やペットを描くと、あたたかい記念品になります。',
tips:['まわりに草花やドットの模様を散らすと、一気に北欧らしくなります','色は赤・緑・からし色など、少しくすんだ色を4色ほど','線はわざと少し揺らすと、手描きの味が出ます'],
p:`【スタイル】北欧の雑貨やテキスタイルのような、ほっこりした手描きイラスト
【描き方】
・線：少し揺らぎのある、やわらかい手描きの線
・形：人物・動物・家を、まるみのある素朴な形に単純化する
・模様：まわりに草花・葉・小さなドット・鳥などの模様を散らして飾る
・色：くすんだ赤・緑・からし色・紺など4色ほど＋生成りの背景
・質感：紙に印刷したような、ほんの少しのかすれ
・人物：髪型や服の色など、本人の目印を残す
【避けるもの】リアルな陰影、鮮やかすぎる色、デジタルっぽいなめらかさ`,
enp:'Redraw the attached photo as a cozy Scandinavian folk-style illustration: soft slightly wobbly hand-drawn lines, rounded naive shapes, surrounded by decorative flowers, leaves, small dots and birds, muted palette of brick red, sage green, mustard and navy on cream, slight printed texture. Keep identifying features like hairstyle and clothing colors.'});

p:`【スタイル】斜め上から見下ろした、箱庭のようなアイソメトリック（等角投影）の立体イラスト

・家具：写真にある家具や物を、同じ配置で、少しデフォルメして描く
・色：やわらかいパステル調。面ごとに明・中・暗の3段階の色で立体感を出す
・光：窓から差し込むやさしい光と、小さな影
・背景：無地の単色。箱が宙に浮いているように
【避けるもの】遠近法（奥が小さくなる描き方）、写真の質感`,
enp:'Recreate the room or building in the attached photo as an isometric 3D illustration: true isometric view with parallel depth lines, a cutaway box showing the floor and two walls, the same furniture and objects in the same layout slightly stylized, soft pastel colors with three-tone face shading, gentle window light and small shadows, floating on a plain solid background. No perspective distortion.'});

artI({no:'51',cat:'TREND',name:'自分のLINEスタンプ8種',en:'Sticker Set x8',lead:'写真1枚から、表情違いのスタンプ8種類を1枚にまとめて作る。',

p:`【スタイル】写真の人物をちびキャラにした、LINEスタンプ風の8種類のセット
※この変換では、スタンプに短い日本語の文字を入れてOKです

・文字：太くて読みやすい丸ゴシック体の、短い文字
・背景：白
【避けるもの】キャラごとに見た目が変わること、長い文字、細かすぎる描き込み`,
enp:'From the attached selfie, create a sticker sheet of 8 chibi stickers in a 4x2 grid with the same character (identical hairstyle, hair color, outfit, glasses in all 8): waving hello, OK sign, bowing thanks, teary sorry, surprised, fist pump cheering, sleepy good night, holding a heart. Bold outlines, bright flat colors, white die-cut border around each, white background. Short captions optional.'});

artI({no:'53',cat:'TREND',name:'似顔絵（カリカチュア）',en:'Caricature',lead:'特徴を楽しく大げさにした、イベント会場で描いてもらうような似顔絵。',

tips:['「失礼にならない程度に、愛される方向に強調」と入れると、ほどよい仕上がりに','趣味や仕事の小物（ギター・パソコンなど）を持たせると、その人らしさが出ます','頭を大きく体を小さくするのが、似顔絵らしいバランス'],
p:`【スタイル】イベント会場で似顔絵師が描いてくれるような、楽しいカリカチュア（似顔絵）
【描き方】
・強調：顔のいちばんの特徴（笑顔・眉・髪型・メガネなど）を、ユーモラスに少し大げさにする。ただし失礼にならず、本人が見て笑顔になる方向に

・小物：その人の趣味や仕事を表す小物を1つ持たせる（例：ギター、ノートパソコン、カメラ）
・画風：マーカーで描いたような、くっきりした線とあざやかな色
・背景：白、またはシンプルな色のかたまり
【避けるもの】本人が傷つくような誇張、リアルな写真の質感`,
enp:'Draw a fun, flattering caricature of the person in the attached photo, like an event caricature artist: playfully exaggerate the most distinctive features (smile, brows, hairstyle, glasses) in an affectionate way, big head and small body, holding one hobby or work prop (guitar, laptop or camera), bold marker-style lines and vivid colors, white or simple color-block background.'});

tips:['実在の雑誌名やロゴは使わず、オリジナルの雑誌名にするのがマナー','見出しの文字は短く3〜4個に。長いと崩れやすくなります','人物はイラストにしても、写真のままでもOK（【スタイル】で選ぶ）'],
p:`【スタイル】写真の人物が表紙を飾る、ファッション雑誌の表紙

【避けるもの】実在の雑誌名・ロゴ、長い文章`,
enp:'Create a fashion magazine cover featuring the person in the attached photo with studio cover lighting, keeping face and outfit. Original masthead "LUMIÈRE" at the top (not resembling any real magazine), 3-4 short cover lines, small issue number and barcode bottom right, solid bright background, head slightly overlapping the masthead, authentic magazine typography.'});

<script>
/* ===== アプリ ===== */
const $=s=>document.querySelector(s);
let ar='16:9';try{ar=localStorage.getItem('pz-ar')||'16:9'}catch(e){}
const custom={};
const SEC=SECTIONS();
const ORDER=['m','t','h','i'];
const pages=['cover'];ORDER.forEach(s=>{pages.push(s+'-top');ITEMS[s].forEach(it=>pages.push(it.id))});
let curPage='cover';
const player=new Player($('#coverStage'),$('#coverScreen'));
let mplayer=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const findItem=id=>ITEMS[id[0]]&&ITEMS[id[0]].find(x=>x.id===id);
const fill=(p,t)=>p.replaceAll('{T}',t);

function buildChrome(){
  $('#tabs').innerHTML=ORDER.map(s=>`<button class="tab" type="button" data-tab="${s}" style="--k:var(${SEC[s].k})">${SEC[s].name}<small>${ITEMS[s].length}</small></button>`).join('');
  $('#shelf').innerHTML=ORDER.map(s=>`<button type="button" data-go="${s}-top" style="--k:var(${SEC[s].k})"><small>${SEC[s].en}</small><b>${SEC[s].name}<em> ${ITEMS[s].length}</em></b><span>${SEC[s].lead}</span></button>`).join('');
  document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
    const tb=e.target.closest('[data-tab]');if(tb){go(tb.dataset.tab+'-top');return}
    const c=e.target.closest('[data-cat]');if(c){const it=ITEMS[c.dataset.sec].find(m=>m.cat===c.dataset.cat);if(it)go(it.id)}});
  $('#brand').onclick=()=>go('cover');
  $('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
  document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
}
function step(d){const i=pages.indexOf(curPage);go(pages[Math.min(pages.length-1,Math.max(0,i+d))])}
function setChrome(sec,cat){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===sec));
  $('#chap').innerHTML=sec?Object.keys(SEC[sec].cats).map(c=>`<button type="button" data-sec="${sec}" data-cat="${c}" aria-current="${c===cat}" style="--k:var(${CAT[c].k})"><i></i>${c}｜${CAT[c].ja}</button>`).join(''):'';
}

function renderSec(s){
  const S=SEC[s];const P=$('#p-sec');P.style.setProperty('--k',`var(${S.k})`);
  P.innerHTML=`<div class="doc"><div class="eyebrow">${S.en} — ${ITEMS[s].length}</div><h2>${S.name}<em> ${ITEMS[s].length}選</em></h2><p>${S.desc}</p>
    <h3>使い方</h3><ol class="steps">${S.steps.map(x=>`<li><div>${x}</div></li>`).join('')}</ol>
    <details class="base"><summary>共通仕様（コピーすると自動で先頭に入ります）</summary><pre>${esc(S.base(S.arDefault||ar))}</pre></details>
    ${S.fix?`<h3>思いどおりにならないときの「追い指示」</h3><div class="tbl"><table><thead><tr><th>症状</th><th>AIにそのまま送る一言</th></tr></thead><tbody>${S.fix.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div>`:''}
    ${S.extra||''}</div>
    <h3 class="idxhead">目次</h3>
    ${Object.keys(S.cats).map(c=>{const list=ITEMS[s].filter(m=>m.cat===c);if(!list.length)return'';const n0=list[0].no,n1=list[list.length-1].no;return `<div class="idxcat" style="--k:var(${CAT[c].k})"><h3>${n0}–${n1} ${c}<small>${CAT[c].ja}｜${CAT[c].d}</small></h3><div class="idxgrid">${list.map(m=>`<button class="idx" type="button" data-go="${m.id}"><b>${m.no}</b><div><span>${m.name}</span><small>${m.lead}</small></div></button>`).join('')}</div></div>`}).join('')}
    <div class="cta"><button class="nb pri" type="button" data-go="${ITEMS[s][0].id}">No.${ITEMS[s][0].no} から見る</button></div>`;
}

function promptBlock(m,S){
  const arSel=S.ars?`<label for="arSel">${S.arLabel||'画面比率'}</label><select id="arSel">${S.ars.map(a=>`<option>${a}</option>`).join('')}</select>`:'';
  return `<div><div class="label">プロンプト</div>
    <div class="prompt"><div class="ptools">${arSel}<button class="copy" id="copyBtn" type="button">プロンプトをコピー</button></div>
    <pre class="ptext" id="ptext"></pre>${m.enp?`<div class="ptools"><label>英語版（Midjourneyなど向け）</label><button class="copy sub" id="copyEn" type="button">英語版をコピー</button></div><pre class="ptext en" id="ptextEn">${esc(m.enp)}</pre>`:''}</div>
    <div class="hint">コピーされるのは「共通仕様」＋この「${S.unit}指示」の完成版です。表示は${S.unit}指示のみ。</div></div>`;
}

function renderItem(m){
  const S=SEC[m.sec];const k=`var(${CAT[m.cat].k})`;const i=ITEMS[m.sec].indexOf(m);const pv=ITEMS[m.sec][i-1],nx=ITEMS[m.sec][i+1];
  const P=$('#p-item');P.style.setProperty('--k',k);
  const txt=custom[m.id]??m.text;
  const left=S.ui==='illust'?illustCard(m):`
      <div class="label">${S.showLabel}</div>
      <div class="monitor"><div class="screen" id="mScreen"><div class="stage" id="mStage"></div></div>
        <div class="mbar"><span class="rec"></span><span class="tc" id="mTc">00:00:00:00</span><span class="sp"></span><span class="tc">${S.monLabel}</span><button class="mini" id="replay" type="button">最初から再生</button></div></div>
      <div class="txtrow"><label for="mText">${S.inputLabel}</label><input id="mText" value="${esc(txt)}" maxlength="40"><button class="mini" id="resetText" type="button">元に戻す</button></div>
      <div class="hint">${m.multi?'スペースか「／」で区切ると、言葉ごとに使い分けられます。':'入力するとプレビューと右のプロンプトが同時に変わります。'}</div>`;
  P.innerHTML=`
  <div class="mhead"><div class="mno">No.${m.no}</div><div class="mtitle">
    <div class="meta"><span class="chip">${m.cat}｜${CAT[m.cat].ja}</span><span>${m.en||''}</span>${m.loop&&S.ui!=='illust'?`<span>LOOP ${(m.loopFn?m.loopFn(words(m.text)):m.loop)/1000}s</span>`:''}</div>
    <h2>${m.name}</h2><p>${m.lead}</p></div></div>
  <div class="mgrid">
    <div>${left}<div style="margin-top:22px" class="usebox"><div class="label">使いどころ</div>${m.use}</div></div>
    <div class="side">${promptBlock(m,S)}
      <div><div class="label">アレンジのコツ</div><ul class="tips">${m.tips.map(t=>`<li><span>${t}</span></li>`).join('')}</ul></div>
    </div>
  </div>
  <nav class="pager">
    <button type="button" data-go="${pv?pv.id:m.sec+'-top'}"><small>← ${pv?'PREV '+pv.no:'目次'}</small><span>${pv?pv.name:'目次へ'}</span></button>
    <button type="button" data-go="${nx?nx.id:m.sec+'-top'}"><small>${nx?'NEXT '+nx.no:'目次'} →</small><span>${nx?nx.name:'目次へ戻る'}</span></button>
  </nav>`;
  const getT=()=>{const e=$('#mText');return e?(e.value.trim()||m.text):(m.text||'')};
  const sel=$('#arSel');if(sel){sel.value=S.ars.includes(S.curAr)?S.curAr:S.ars[0];sel.onchange=()=>{S.curAr=sel.value;if(m.sec==='m'||m.sec==='t'){ar=sel.value;try{localStorage.setItem('pz-ar',ar)}catch(e){}}}}
  const showP=()=>{const t=getT();let h=esc(fill(m.p,t));if(t)h=h.replaceAll(esc(t),`<span class="ph">${esc(t)}</span>`);$('#ptext').innerHTML=h};
  showP();
  if(mplayer)mplayer.stop();mplayer=null;
  if(S.ui!=='illust'){mplayer=new Player($('#mStage'),$('#mScreen'));const start=()=>mplayer.play(m,getT(),reduce);start();
    let deb;$('#mText').addEventListener('input',()=>{custom[m.id]=$('#mText').value;showP();clearTimeout(deb);deb=setTimeout(start,350)});
    $('#resetText').onclick=()=>{delete custom[m.id];$('#mText').value=m.text;showP();start()};$('#replay').onclick=start;}
  const copyTo=(btn,text,label)=>{const ok=()=>{btn.textContent='コピーしました';btn.classList.add('done');setTimeout(()=>{btn.textContent=label;btn.classList.remove('done')},1600)};
    try{navigator.clipboard.writeText(text).then(ok,()=>{fallback(text);ok()})}catch(e){fallback(text);ok()}};
  $('#copyBtn').onclick=()=>{const a=sel?sel.value:S.ars?S.ars[0]:'';copyTo($('#copyBtn'),S.base(a)+`\n\n【${S.unit}指示】\n`+fill(m.p,getT()),'プロンプトをコピー')};
  const ce=$('#copyEn');if(ce)ce.onclick=()=>copyTo(ce,m.enp,'英語版をコピー');
}
function fallback(full){const p=$('#ptext');p.textContent=full;const r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r)}

function illustCard(m){
  const pal=m.pal||['#222','#555','#888','#bbb','#eee'];
  const ex=m.img?`<div class="exrow"><figure><img src="img/base.jpg" alt="作例の元写真：公園に立つ架空の男の子" loading="lazy"><figcaption>BEFORE｜元の写真</figcaption></figure><i>→</i><figure><img src="${m.img}" alt="${esc(m.name)}の作例" loading="lazy"><figcaption>AFTER｜${esc(m.name)}</figcaption></figure></div><div class="exnote">作例：AIで生成した架空の男の子の写真をもとに作成した参考イメージです。仕上がりはAIや写真によって変わります。</div>`:'';
  return `<div class="label">このプロンプトで、こうなる</div>
  <div class="scard">${ex}<div class="sart" ${m.img?'hidden':''}><div class="sw">${pal.map(c=>`<i style="background:${c}"></i>`).join('')}</div>
    <div style="position:absolute;inset:0;background:${m.art||'linear-gradient(transparent,rgba(0,0,0,.55))'}"></div>
    <div class="ttl"><span>STYLE ${m.no} / ${m.en}</span><b>${m.name}</b></div></div>
    <div class="flow"><div><b>BEFORE｜元の写真</b>${m.before}</div><i>→</i><div><b>AFTER｜仕上がり</b>${m.after}</div></div>
    <div class="kw">${m.kw.map(k=>`<span>${k}</span>`).join('')}</div>
    <div class="pal">配色の目安 ${pal.map(c=>`<i style="background:${c}" title="${c}"></i>`).join('')}</div>
    ${m.img?'':'<div class="note">※この変換の作例画像は準備中です。仕上がりの特徴・配色・キーワードで表しています。</div>'}</div>
  <div style="margin-top:18px"><div class="label">向いているAI</div><div class="tools">${m.tools.map(t=>`<span>${t}</span>`).join('')}</div></div>`;
}

let coverI=0,coverT;
function coverLoop(){const picks=['m01','t01','m21','t18','h02','m35','t34','h08','m48','t42'].map(findItem).filter(Boolean);
  const m=picks[coverI%picks.length];coverI++;player.play(m,m.text,true);$('#coverName').textContent=`${SEC[m.sec].name} No.${m.no} ${m.name}`;coverT=setTimeout(coverLoop,Math.min(m.loop,6000))}

function go(id){
  if(!pages.includes(id))id='cover';curPage=id;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  clearTimeout(coverT);player.stop();if(mplayer){mplayer.stop();mplayer=null}
  if(id==='cover'){$('#p-cover').classList.add('on');$('#count').textContent='表紙';setChrome(null);if(!reduce)coverLoop()}
  else if(id.endsWith('-top')){const s=id[0];renderSec(s);$('#p-sec').classList.add('on');$('#count').textContent='目次';setChrome(s)}
  else{const m=findItem(id);renderItem(m);$('#p-item').classList.add('on');$('#count').textContent=`${m.no} / ${ITEMS[m.sec].length}`;setChrome(m.sec,m.cat)}
  try{history.replaceState(null,'','#'+id)}catch(e){}
  window.scrollTo(0,0);
}
function tickTc(){const el=$('#mTc');if(el&&mplayer)el.textContent=tcode(mplayer.time());const ct=$('#coverTc');if(ct&&curPage==='cover')ct.textContent=tcode(player.time());requestAnimationFrame(tickTc)}
buildChrome();
const h0=(location.hash||'').slice(1);go(h0==='m-index'?'m-top':h0);
tickTc();
</script>
