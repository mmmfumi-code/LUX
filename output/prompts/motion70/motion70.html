<title>AIプロンプト図鑑339</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=JetBrains+Mono:wght@400;700&family=Mochiy+Pop+One&family=Noto+Sans+JP:wght@400;700;900&family=Shippori+Mincho+B1:wght@500;800&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;700&family=Cormorant+Garamond:wght@500;700&family=Space+Mono:wght@700&family=Bebas+Neue&family=Nunito:wght@800&family=Cinzel:wght@700&family=Anton&family=Great+Vibes&family=Fredoka:wght@700&family=Playfair+Display:wght@900&family=Abril+Fatface&family=Montserrat:wght@300;800&family=Kaisei+Decol:wght@700&family=Zen+Maru+Gothic:wght@500;900&family=Klee+One:wght@600&family=Creepster&display=swap">
<style>
/* Layout: Apple の製品ページの考え方。すりガラスのナビ＋セグメントのタブ、中央寄せの大見出し、角丸のカードとたっぷりの余白。1項目=1ページ */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface2:#f5f5f7; --fill:rgba(0,0,0,.05);
  --fg:#1d1d1f; --fg2:#6e6e73; --fg3:#86868b; --line:rgba(0,0,0,.1);
  --accent:#0071e3; --accent-fg:#ffffff; --link:#0066cc;
  --nav:rgba(245,245,247,.72); --shadow:0 4px 24px rgba(0,0,0,.06);
  --code:#f5f5f7; --code-fg:#1d1d1f;
  --c-impact:#ff3b30; --c-flow:#ff9f0a; --c-depth:#00c7be; --c-switch:#af52de;
  --c-texture:#ff2d55; --c-play:#34c759; --c-design:#0a84ff;
  --c-orange:#ff9500; --c-lime:#30d158; --c-cyan:#32ade6; --c-gold:#ffcc00; --c-rose:#ff375f; --c-mint:#00c7be; --c-sky:#0a84ff;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,"JetBrains Mono",monospace;
  --display:var(--sans); --body:var(--sans);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface2:#2c2c2e; --fill:rgba(255,255,255,.08);
  --fg:#f5f5f7; --fg2:#a1a1a6; --fg3:#8e8e93; --line:rgba(255,255,255,.14);
  --accent:#0a84ff; --accent-fg:#ffffff; --link:#2997ff;
  --nav:rgba(22,22,23,.72); --shadow:0 4px 24px rgba(0,0,0,.4);
  --code:#2c2c2e; --code-fg:#f5f5f7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface2:#2c2c2e; --fill:rgba(255,255,255,.08);
  --fg:#f5f5f7; --fg2:#a1a1a6; --fg3:#8e8e93; --line:rgba(255,255,255,.14);
  --accent:#0a84ff; --accent-fg:#ffffff; --link:#2997ff;
  --nav:rgba(22,22,23,.72); --shadow:0 4px 24px rgba(0,0,0,.4);
  --code:#2c2c2e; --code-fg:#f5f5f7; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nav)}
button,select,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px;border-radius:8px}

/* nav */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.bar1,.chap{max-width:1200px;margin-inline:auto}
.bar1{display:flex;align-items:center;gap:16px;min-height:52px;flex-wrap:wrap}
.brand{font-weight:600;font-size:17px;letter-spacing:-.02em;background:none;border:0;padding:0;white-space:nowrap}
.brand b{font-weight:600;color:var(--fg2)}
.tabs{display:flex;gap:2px;flex:1;min-width:0;justify-content:flex-start;background:var(--fill);border-radius:10px;padding:2px;max-width:780px;margin-inline:auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab .ts{display:none}
.tab{flex:1;background:none;border:0;border-radius:8px;padding:5px 12px;white-space:nowrap;color:var(--fg2);font-size:13px;font-weight:500;display:flex;align-items:baseline;justify-content:center;gap:5px}
.tab small{font-size:11px;color:var(--fg3);font-variant-numeric:tabular-nums}
.tab:hover{color:var(--fg)}
.tab[aria-current="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.navbtns{display:flex;gap:4px;align-items:center}
.nb{background:var(--fill);border:0;border-radius:999px;min-width:32px;height:32px;padding:0 12px;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.nb:hover{background:color-mix(in srgb,var(--fg) 12%,transparent)}
.count{font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums;min-width:56px;text-align:center}
.chap{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding-bottom:10px}
.chap:empty{display:none}
.subseg{display:inline-flex;gap:2px;background:var(--fill);border-radius:999px;padding:2px;margin-right:8px}
.chap .sub{background:none;border:0;border-radius:999px;padding:4px 14px;font-size:13px;font-weight:600;color:var(--fg2);display:flex;gap:5px;align-items:baseline}
.chap .sub small{font-size:11px;color:var(--fg3);font-weight:400}
.chap .sub[aria-current="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chap button{background:none;border:0;border-radius:999px;padding:3px 12px;font-size:12px;color:var(--fg2);display:flex;align-items:center;gap:6px}
.chap button i{width:7px;height:7px;border-radius:50%;background:var(--k)}
.chap button:hover{color:var(--fg)}
.chap button[aria-current="true"]{background:var(--fg);color:var(--bg)}
@media (max-width:760px){.chap{padding-top:6px}.chap>button{display:none}.subseg{margin:0 auto}.navbtns{margin-left:auto}.tabs{order:3;flex-basis:100%;max-width:none}.tab{padding:5px 4px;font-size:12px}.tab small{display:none}.tab .tl{display:none}.tab .ts{display:inline}}
@media (max-width:1180px) and (min-width:761px){.tab{padding:5px 8px}.tab small{display:none}}

main{max-width:1200px;margin-inline:auto;padding-top:40px}
.page{display:none}.page.on{display:block;animation:fade .4s ease}
@keyframes fade{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* item header */
.mhead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-bottom:36px}
.mno{font-size:15px;font-weight:600;color:var(--fg2);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.mtitle{min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.meta{order:-1;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--fg3);flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--fg2)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--k)}
.mtitle h2{font-weight:700;font-size:clamp(34px,5.4vw,56px);line-height:1.07;letter-spacing:-.03em;margin:0;text-wrap:balance}
.mtitle p{margin:0;color:var(--fg2);font-size:clamp(17px,2vw,21px);max-width:36em;text-wrap:balance}
.mgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:980px){.mgrid{grid-template-columns:minmax(0,1fr)}}
.label{font-size:13px;font-weight:600;color:var(--fg2);display:flex;align-items:center;gap:8px;margin-bottom:10px}

/* preview */
.monitor{background:#000;border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.screen{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;overflow:hidden;background:#000}
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;color:#fff;font-family:'Noto Sans JP',sans-serif;letter-spacing:normal}
.mbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#1c1c1e;color:#a1a1a6;flex-wrap:wrap}
.tc{font-family:var(--mono);font-size:12px;color:#a1a1a6;font-variant-numeric:tabular-nums}
.rec{width:7px;height:7px;border-radius:50%;background:#ff3b30;animation:rec 1.2s steps(2) infinite}
@keyframes rec{50%{opacity:.25}}
.mbar .sp{flex:1}
.mini{background:rgba(255,255,255,.12);color:#f5f5f7;border:0;border-radius:999px;padding:4px 12px;font-size:12px}
.mini:hover{background:rgba(255,255,255,.2)}
.txtrow{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}
.txtrow label{font-size:13px;color:var(--fg2)}
.txtrow input{flex:1;min-width:160px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:16px}
.txtrow input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.txtrow .mini{background:var(--fill);color:var(--fg)}
.hint{font-size:13px;color:var(--fg3);margin-top:8px}

/* side */
.side{display:flex;flex-direction:column;gap:24px;min-width:0}
.prompt{background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.ptools{display:flex;gap:10px;align-items:center;padding:14px 16px;flex-wrap:wrap}
.ptools select{background:var(--fill);border:0;border-radius:8px;padding:5px 10px;font-size:13px}
.ptools label{font-size:13px;color:var(--fg2)}
.copy{margin-left:auto;background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;padding:8px 18px;font-weight:500;font-size:14px}
.copy:hover{filter:brightness(1.08)}
.copy.done{background:#34c759}
.copy.sub{margin-left:auto;background:var(--fill);color:var(--fg)}
.ptext{margin:0 16px 16px;padding:16px 18px;border-radius:12px;background:var(--code);color:var(--code-fg);font-family:var(--mono);font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;max-height:440px;overflow:auto;letter-spacing:0}
.ptext .ph{color:var(--accent);font-weight:600}
.ptext.en{color:var(--fg2);max-height:200px}
.tips{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.tips li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:15px;line-height:1.55}
.tips li::before{content:"✓";width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.usebox{font-size:16px;color:var(--fg2);background:var(--surface);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.usebox .label{margin-bottom:6px}
.usebox b{color:var(--fg);font-weight:600}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:56px}
.pager button{background:var(--surface);border:0;border-radius:18px;text-align:left;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.pager button:last-child{text-align:right}
.pager button:hover{transform:translateY(-2px);transition:transform .2s}
.pager small{display:block;font-size:12px;color:var(--fg3);margin-bottom:2px}
.pager span{font-weight:600;font-size:17px;color:var(--link)}

/* illust card */
.scard{border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.sart{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden}
.sart .sw{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr)}
.sart .ttl{position:absolute;left:24px;bottom:20px;right:24px;display:flex;flex-direction:column;gap:6px}
.sart .ttl b{font-weight:700;font-size:clamp(26px,4vw,44px);line-height:1.1;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.45);letter-spacing:-.02em}
.sart .ttl span{font-size:12px;color:#fff;opacity:.85}
.flow{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;padding:16px}
.flow>div{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:14px;min-width:0}
.flow>div b{display:block;font-size:11px;font-weight:600;color:var(--fg3);margin-bottom:4px;letter-spacing:.02em}
.flow>i{align-self:center;font-style:normal;color:var(--fg3);font-weight:600}
.kw{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 14px}
.kw span{background:var(--fill);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--fg2)}
.pal{display:flex;gap:6px;padding:0 16px 16px;align-items:center;font-size:12px;color:var(--fg3);flex-wrap:wrap}
.pal i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line)}
.note{font-size:12px;color:var(--fg3);padding:0 16px 16px}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tools span{background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;box-shadow:var(--shadow)}
.tools span b{color:var(--accent);font-weight:600}
.gshot{border-radius:18px;padding:28px;background:radial-gradient(circle at 50% 35%,#eef0f3,#c9cdd4);display:flex;justify-content:center;box-shadow:var(--shadow)}
.gshot img{display:block;max-width:100%;max-height:760px;height:auto;width:auto;box-shadow:0 18px 40px rgba(0,0,0,.22)}
.exrow{display:grid;grid-template-columns:minmax(0,.8fr) auto minmax(0,1.2fr);gap:14px;align-items:center;padding:18px;background:var(--surface2)}
.exrow figure{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.exrow img{width:100%;max-width:100%;height:auto;border-radius:12px;display:block;background:var(--fill)}
.exrow figcaption{font-size:12px;font-weight:600;color:var(--fg2)}
.exrow>i{font-style:normal;color:var(--fg3);font-weight:600;font-size:20px}
.exnote{font-size:12px;color:var(--fg3);padding:12px 16px 0}

/* cover */
.cover{display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;padding-block:24px 8px}
.eyebrow{font-size:14px;font-weight:600;color:var(--fg2);letter-spacing:.01em}
.cover h1{font-weight:700;font-size:clamp(30px,7.4vw,80px);line-height:1.05;letter-spacing:-.035em;margin:0;text-wrap:balance}
.cover h1 em{font-style:normal;background:linear-gradient(90deg,#0a84ff,#af52de 55%,#ff375f);-webkit-background-clip:text;background-clip:text;color:transparent}
.cover p{max-width:34em;color:var(--fg2);font-size:clamp(17px,2.2vw,21px);margin:0;text-wrap:balance}
.cover .links{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.cover .links button{background:none;border:0;color:var(--link);font-size:17px;padding:0}
.cover .links button.pill{background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:10px 22px}
.cover .monitor{width:100%;max-width:980px;margin-top:20px}
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:56px}
.shelf button{background:var(--surface);border:0;border-radius:18px;padding:24px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .25s}
.shelf button:hover{transform:translateY(-3px)}
.shelf small{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--fg2)}
.shelf small::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--k)}
.shelf b{font-weight:700;font-size:26px;letter-spacing:-.02em}
.shelf b em{font-style:normal;color:var(--fg3);font-weight:600}
.shelf span{font-size:15px;color:var(--fg2)}

/* section top */
.doc{max-width:860px;margin-inline:auto}
.doc>.eyebrow{text-align:center}
.doc h2{font-weight:700;font-size:clamp(36px,5.6vw,60px);line-height:1.06;letter-spacing:-.03em;margin:6px 0 14px;text-align:center;text-wrap:balance}
.doc h2 em{font-style:normal;color:var(--fg3)}
.doc>p:first-of-type{text-align:center;color:var(--fg2);font-size:19px;max-width:40em;margin-inline:auto}
.doc h3{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:40px 0 12px}
.doc p,.doc li{color:var(--fg2)}
.doc b{color:var(--fg)}
.steps{counter-reset:s;list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.steps li{counter-increment:s;display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow);font-size:14px;line-height:1.55}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center}
.doc pre{background:var(--surface);border-radius:14px;padding:16px 18px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;overflow:auto;letter-spacing:0;box-shadow:var(--shadow)}
details.base{margin-top:16px;background:var(--surface);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow)}
details.base summary{cursor:pointer;font-weight:600;color:var(--link)}
details.base pre{box-shadow:none;background:var(--surface2);margin-bottom:4px}
.tbl{overflow-x:auto;background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:12px 16px;text-align:left;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:12px;color:var(--fg3);font-weight:600}
.tbl td:first-child{color:var(--fg);font-weight:500;white-space:nowrap}
.idxhead{font-weight:700;font-size:clamp(28px,4vw,40px);letter-spacing:-.025em;margin:64px 0 20px;text-align:center}
.idxcat{margin-bottom:36px}
.idxcat h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:21px;letter-spacing:-.02em;margin:0 0 12px}
.idxcat h3::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--k)}
.idxcat h3 small{font-weight:400;font-size:14px;color:var(--fg3)}
.idxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.idx{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;background:var(--surface);border:0;border-radius:14px;padding:12px 14px;text-align:left;box-shadow:var(--shadow);transition:transform .2s}
.idx:hover{transform:translateY(-2px)}
.idx b{font-weight:600;font-size:15px;color:var(--fg3);font-variant-numeric:tabular-nums}
.idx span{display:block;font-weight:600;font-size:15px;line-height:1.3}
.idx small{display:block;color:var(--fg2);font-size:12px;line-height:1.45;margin-top:2px}
.cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;justify-content:center}
.cta .nb{height:auto;padding:10px 22px;font-size:15px}
.cta .nb.pri{background:var(--accent);color:var(--accent-fg)}
@media (max-width:560px){.pager{grid-template-columns:1fr}.pager button:last-child{text-align:left}.exrow{grid-template-columns:1fr}.exrow>i{display:none}.flow{grid-template-columns:1fr}.flow>i{display:none}}
@media (prefers-reduced-motion:reduce){.rec{animation:none}.page.on{animation:none}}

</style>

<header class="bar">
  <div class="bar1">
    <button class="brand" id="brand" type="button">AIプロンプト図鑑<b>200</b></button>
    <nav class="tabs" id="tabs" aria-label="棚"></nav>
    <div class="navbtns">
      <button class="nb" id="prev" type="button" aria-label="前のページ">←</button>
      <span class="count" id="count">表紙</span>
      <button class="nb" id="next" type="button" aria-label="次のページ">→</button>
    </div>
  </div>
  <nav class="chap" id="chap" aria-label="カテゴリ"></nav>
</header>

<main id="main">
  <section class="page" id="p-cover">

    base:a=>`添付した写真をもとに、次の【変換指示】のスタイルのイラストに描き直してください。

【共通仕様】
・写っている人物の特徴（顔の形、髪型、髪色、服装、ポーズ、表情）と、写真の構図はできるだけそのまま保つ
・人数・左右の位置関係を変えない。手や指の本数を正しく描く
・変換指示で文字を入れるよう書かれている場合を除き、画像の中に文字・ロゴ・透かしを入れない
・仕上がりの比率：${a||'元の写真と同じ'}
・実在の作品名・作家名・キャラクターには寄せず、指定した画風の特徴だけで描く
・1枚目を出したら、似せ具合を「もっと似せる／もっとイラストらしく」で調整できるように一言添える`,
    fix:[['本人に似ていない','「顔のパーツの位置と形は写真のまま、塗りと線だけをイラストにして」'],['画風が弱い','「スタイルの特徴をもっと強く。線の太さと色数を指定どおりにはっきり出して」'],['背景が変わってしまう','「背景は元の写真の場所のまま、同じ画風で描いて」'],['手や指がおかしい','「手の指を5本に正しく描き直して。ほかの部分は変えないで」'],['肖像権が気になる','他人が写った写真は、本人の許可を取ってから使いましょう。販売物に使う場合は特に注意が必要です。']],
    extra:`<h3>作例に使った元の写真</h3><div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap"><img src="img/base.jpg" alt="公園に立つ架空の男の子の写真" style="width:200px;max-width:100%;border-radius:8px"><p style="flex:1;min-width:220px;margin:0">各ページの作例は、AIで生成した<b>架空の男の子</b>（実在しない人物）の写真をもとにしています。黒髪・黄色のパーカー・紺の短パン・赤い靴・青い帽子という特徴が、スタイルごとにどう描き変わるかを見比べてください。作例は Figma AI と ChatGPT（画像生成）で作った参考イメージです。実際の仕上がりは、使うAIや写真によって変わります。</p></div><h3>使う前に知っておきたいこと</h3><p>他人が写っている写真は、本人の許可を取ってから使ってください。また、特定のアニメ会社・作家・キャラクターの名前を出して「〇〇風」と指示するのは避け、この本のように<b>画風の特徴（線・塗り・色・質感）で指示する</b>のが安全で、しかも仕上がりのブレも少なくなります。</p>`}
  };

/* ===== IMPACT 01-10 ===== */
const fs=(t,max,w)=>Math.round(Math.min(max,w/Math.max(1,[...t].length)));
const BIG=(H,t,css,parent)=>H.el('div',Object.assign({fontFamily:F.heavy,fontSize:fs(t,260,1300)+'px',lineHeight:'1.05',whiteSpace:'nowrap'},css||{}),parent,t);

def({no:'01',cat:'IMPACT',name:'ショックウェーブ',en:'Shock Wave',lead:'叩きつけて、光って、揺れる。冒頭の1語に。',
text:'限界突破',loop:3200,bg:'#0b0b0d',
use:'動画の<b>最初の0.5秒</b>。サムネと同じ言葉を叩きつけると、スクロールの指が止まります。決め台詞・章タイトルにも。',
tips:['着地の瞬間（0.38秒）に効果音「ドン」を合わせると迫力が倍になります','光の色を白→ブランドカラーに変えるだけで印象が変わります','言葉は4〜6文字が最も映えます。長い場合は2行に分けて'],
p:`画面中央に「{T}」を1語だけ置き、"叩きつける"ように登場させてください。
・背景：#0B0B0D の単色。文字：白、フォント Dela Gothic One、画面幅の約80%の大きさ
・0.00〜0.38秒：文字を scale 3.2／blur 24px／透明 → scale 1／blur 0／不透明 へ。イージング cubic-bezier(.7,0,.84,0)（加速しながら叩きつける）
・0.38秒（着地の瞬間）に3つ同時に起こす
　① 画面全体を白で一瞬光らせる（不透明度0.9→0、0.25秒）
　② 文字の中心から白い線の円（線幅10px）が6倍まで広がりながら消える（0.7秒）
　③ 画面全体を上下左右ランダムに最大14px、0.32秒揺らす
・2.4秒から：文字を scale 1.15 へ拡大しつつ blur 16px で0.5秒かけて消す
・尺：3.2秒でループ`,
run(H,t){const B=H.box();const w=BIG(H,t,{},B);
  H.a(w,[{transform:'scale(3.2)',filter:'blur(24px)',opacity:0},{transform:'scale(1)',filter:'blur(0)',opacity:1}],{d:380,e:E.in});
  const r=H.abs({width:'300px',height:'300px',left:'650px',top:'300px',border:'10px solid #fff',borderRadius:'50%',opacity:0});
  H.a(r,[{transform:'scale(.2)',opacity:1},{transform:'scale(6)',opacity:0}],{d:700,dl:380});
  const fl=H.abs({inset:'0',background:'#fff',opacity:0});H.a(fl,[{opacity:.9},{opacity:0}],{d:250,dl:380,f:'none'});
  H.shake(B,380,14,320);
  H.a(w,[{transform:'scale(1)',filter:'blur(0)',opacity:1},{transform:'scale(1.15)',filter:'blur(16px)',opacity:0}],{d:500,dl:2400,e:E.in,f:'forwards'});
}});

def({no:'02',cat:'IMPACT',name:'スタンプ連打',en:'Stamp Rush',lead:'判子を3回押す。結論や評価をリズムで決める。',
text:'決定 完売 採用',multi:true,loop:3600,bg:'#efebe3',
use:'レビュー動画の<b>評価発表</b>、「結論」「完売」「合格」など断定したい場面。紙の背景なので、ビジネス系・書類系の動画と相性が良いです。',
tips:['角度は±12°の範囲でバラすと「手で押した感」が出ます','3つ目だけ少し大きく押すと締まります','インクのかすれは「SVGのfeTurbulenceでかすれを足して」と追い指示'],
p:`紙のような背景に、朱色のハンコで言葉を3回「ポン、ポン、ポン」と押していく演出を作ってください。
・背景：#EFEBE3（生成りの紙）。ハンコ色：#E0352B
・押す言葉：「{T}」（スペース区切りで3語。1語ずつ順に押す）
・ハンコの形：角丸6pxの四角い枠（線幅12px）の中に、Dela Gothic One の文字。枠も文字も同じ朱色
・押す位置：画面中央を基準に、左上・中央・右下へずらして重ねる。角度は −12°〜+12° でランダム
・1語の押し方（0.16秒）：scale 2.6／透明 → scale 1／不透明。イージング cubic-bezier(.7,0,.84,0)。着地の瞬間に画面を最大8px・0.25秒揺らす
・押すタイミング：0.0秒／0.7秒／1.4秒。3つ目だけ1.2倍の大きさ
・3.0秒で全体を0.4秒フェードアウトし、尺3.6秒でループ`,
run(H,t,w){w=w.slice(0,3);while(w.length<3)w.push(w[0]||t);const B=H.box();
  const pos=[[-330,-150,-9],[30,0,7],[330,150,-4]];
  w.forEach((s,i)=>{const sc=i===2?1.2:1;const st=H.abs({left:'50%',top:'50%',transform:`translate(-50%,-50%) translate(${pos[i][0]}px,${pos[i][1]}px) rotate(${pos[i][2]}deg) scale(${sc})`},B);
    const inner=H.el('div',{border:'12px solid #e0352b',borderRadius:'6px',color:'#e0352b',fontFamily:F.heavy,fontSize:fs(s,150,700)+'px',lineHeight:'1',padding:'18px 30px',whiteSpace:'nowrap',mixBlendMode:'multiply'},st,s);
    H.a(inner,[{transform:'scale(2.6)',opacity:0},{transform:'scale(1)',opacity:1}],{d:160,dl:i*700,e:E.in});
    H.shake(B,i*700+160,8,250)});
  H.a(B,[{opacity:1},{opacity:0}],{d:400,dl:3000,f:'forwards'});
}});

def({no:'03',cat:'IMPACT',name:'パンチイン',en:'Punch Through',lead:'言葉がこちらへ飛び込み、突き抜けて次へ。',
text:'今日から 本気で 変わる',multi:true,loop:3400,bg:'#0b0b0d',
use:'3語のキャッチコピーを<b>テンポよく畳みかける</b>とき。モチベーション系、セミナー告知、商品のベネフィット3連発に。',
tips:['語の切り替え間隔0.8秒はBPM150の曲と相性が良いです','背景色を語ごとに反転させると、カット割りしたような勢いが出ます','最後の語だけ長く止めると「結論」として残ります'],
p:`「{T}」をスペースで区切った語を1つずつ、画面の奥から手前へ飛び込ませ、そのままカメラを突き抜けて次の語に切り替える演出を作ってください。
・フォント：Dela Gothic One、画面幅の約75%の大きさ
・背景色を語ごとに切り替える：1語目 #0B0B0D（文字白）→ 2語目 #FF4B3E（文字黒）→ 3語目 #0B0B0D（文字白）
・各語の登場（0.24秒）：scale 0.2／透明 → scale 1。イージング cubic-bezier(.34,1.56,.64,1)（少し行き過ぎて戻る）
・各語の退場（0.24秒）：登場から0.56秒後に scale 1 → 7／透明 へ。イージング cubic-bezier(.7,0,.84,0)
・語の間隔：0.8秒。最後の語だけ退場させずに1.2秒止める
・尺：3.4秒でループ`,
run(H,t,w){if(!w.length)w=[t];const B=H.box();const bgs=['#0b0b0d','#ff4b3e','#0b0b0d'],fg=['#fff','#111','#fff'];
  w.forEach((s,i)=>{H.wait(i*800,()=>{H.S.style.background=bgs[i%3]});
    const el=BIG(H,s,{position:'absolute',color:fg[i%3],fontSize:fs(s,280,1200)+'px'},B);
    H.a(el,[{transform:'scale(.2)',opacity:0},{transform:'scale(1)',opacity:1}],{d:240,dl:i*800,e:E.back});
    if(i<w.length-1)H.a(el,[{transform:'scale(1)',opacity:1},{transform:'scale(7)',opacity:0}],{d:240,dl:i*800+560,e:E.in,f:'forwards'});
    else H.a(el,[{opacity:1},{opacity:0}],{d:300,dl:i*800+1800,f:'forwards'});});
}});

def({no:'04',cat:'IMPACT',name:'スラッシュカット',en:'Slash Cut',lead:'一閃で文字が斜めに斬れて、ずれて、戻る。',
text:'一刀両断',loop:3000,bg:'#101012',
use:'「論破」「バッサリ解説」「NG集」など<b>切る・断つ</b>ニュアンスの言葉に。時代劇・ゲーム実況のタイトルにも。',
tips:['斬る線の角度は6°前後が自然。大きくすると派手に、小さくすると上品に','ずれた瞬間に上下で色を変える（上=白、下=赤）と劇的になります','効果音「シャキン」は斬線が走り終わった瞬間に'],
p:`中央の文字「{T}」が、一筋の光で斜めに斬られ、上下にずれてから元に戻る演出を作ってください。
・背景：#101012。文字：白、Dela Gothic One、幅1400px・高さ300pxの枠の中央に配置
・文字は同じものを2枚重ね、clip-path で上半分 polygon(0 0,100% 0,100% 25%,0 75%) と下半分 polygon(0 75%,100% 25%,100% 100%,0 100%) に分ける（斜めの切れ目）
・0.0〜0.3秒：文字全体をフェードイン
・0.5秒：切れ目に沿って、白く光る線（高さ6px、角度 −6°）が左から右へ0.2秒で走る（scaleX 0→1、影で発光）
・0.7秒：上半分を左上へ(−40px,−24px)、下半分を右下へ(40px,24px)、0.3秒でずらす。下半分の文字色を #FF4B3E に変える
・1.9秒：0.4秒で元の位置・元の色に戻す（イージング cubic-bezier(.87,0,.13,1)）
・2.6秒からフェードアウト、尺3.0秒でループ`,
run(H,t){const B=H.box();const wrap=H.abs({width:'1400px',height:'300px',left:'100px',top:'300px'},B);
  const mk=(clip)=>{const h=H.box({clipPath:clip},wrap);BIG(H,t,{fontSize:fs(t,260,1300)+'px',color:'#fff'},h);return h};
  const top=mk('polygon(0 0,100% 0,100% 25%,0 75%)'),bot=mk('polygon(0 75%,100% 25%,100% 100%,0 100%)');
  H.a(wrap,[{opacity:0},{opacity:1}],{d:300});
  const ln=H.abs({left:'0',top:'147px',width:'1400px',height:'6px',background:'#fff',boxShadow:'0 0 18px #fff,0 0 40px #ff4b3e',transform:'rotate(-6.1deg)'},wrap);
  H.a(ln,[{transform:'rotate(-6.1deg) scaleX(0)',transformOrigin:'0 50%',opacity:1},{transform:'rotate(-6.1deg) scaleX(1)',transformOrigin:'0 50%',opacity:1,offset:.7},{transform:'rotate(-6.1deg) scaleX(1)',transformOrigin:'0 50%',opacity:0}],{d:320,dl:500,e:E.out});
  H.a(top,[{transform:'translate(0,0)'},{transform:'translate(-40px,-24px)'}],{d:300,dl:700});
  H.a(bot,[{transform:'translate(0,0)',color:'#fff'},{transform:'translate(40px,24px)'}],{d:300,dl:700});
  H.wait(700,()=>{bot.firstChild.style.color='#ff4b3e'});H.wait(1900,()=>{bot.firstChild.style.transition='color .4s';bot.firstChild.style.color='#fff'});
  H.a(top,[{transform:'translate(-40px,-24px)'},{transform:'translate(0,0)'}],{d:400,dl:1900,e:E.io,f:'forwards'});
  H.a(bot,[{transform:'translate(40px,24px)'},{transform:'translate(0,0)'}],{d:400,dl:1900,e:E.io,f:'forwards'});
  H.a(wrap,[{opacity:1},{opacity:0}],{d:300,dl:2600,f:'forwards'});
}});

def({no:'05',cat:'IMPACT',name:'ワードバースト',en:'Word Burst',lead:'1語が弾けて、文字と火花が四方へ散る。',
text:'大爆笑',loop:2800,bg:'#141414',
use:'<b>オチ・爆笑・炎上</b>など「弾ける」瞬間に。リアクション動画のテロップ、ランキングの1位発表直後にも。',
tips:['散る距離を±600px→±1000pxにすると画面外まで飛んで豪快に','火花の色を文字色と変えると、爆発の中心がはっきりします','文字数が多いほど華やか。2文字だと寂しいので4文字以上推奨'],
p:`中央に「{T}」がポンと出て、0.7秒後に文字が1文字ずつバラバラに弾け飛ぶ演出を作ってください。
・背景：#141414。文字：#FFE14D（黄色）、Dela Gothic One、画面幅の約60%
・0.0〜0.3秒：全体を scale 0 → 1 で登場。イージング cubic-bezier(.34,1.56,.64,1)
・1.0秒：爆発。各文字を中心から外へ、x方向 −600〜600px・y方向 −400〜400px のランダムな位置へ、回転 −180〜180°、scale 0.3、透明にしながら0.6秒で飛ばす（イージング cubic-bezier(.16,1,.3,1)）
・同時に中心から白い火花を16本、放射状に飛ばす（幅120px×高さ6pxの線が外へ伸びながら消える、0.5秒）
・爆発の瞬間に画面を10px・0.25秒揺らす
・尺：2.8秒でループ`,
run(H,t){const B=H.box();const w=BIG(H,t,{color:'#ffe14d',fontSize:fs(t,240,1000)+'px'},B);w.textContent='';const cs=H.chars(t,w);
  H.a(w,[{transform:'scale(0)'},{transform:'scale(1)'}],{d:300,e:E.back});
  cs.forEach(c=>H.a(c,[{transform:'translate(0,0) rotate(0) scale(1)',opacity:1},{transform:`translate(${rnd(-600,600)}px,${rnd(-400,400)}px) rotate(${rnd(-180,180)}deg) scale(.3)`,opacity:0}],{d:600,dl:1000}));
  for(let i=0;i<16;i++){const a=i/16*360;const s=H.abs({left:'800px',top:'447px',width:'120px',height:'6px',background:'#fff',borderRadius:'3px',transformOrigin:'0 50%',opacity:0});
    H.a(s,[{transform:`rotate(${a}deg) translateX(40px) scaleX(.2)`,opacity:1},{transform:`rotate(${a}deg) translateX(420px) scaleX(1)`,opacity:0}],{d:500,dl:1000})}
  H.shake(B,1000,10,250);
}});

def({no:'06',cat:'IMPACT',name:'ゴムストレッチ',en:'Rubber Stretch',lead:'縦に引き伸ばされた文字が、ゴムのように縮んで止まる。',
text:'伸びしろ',loop:2800,bg:'#ff4b3e',
use:'「伸びる」「成長」「ストレッチ」など<b>伸び縮み</b>を連想させる言葉に。フィットネス、成長記録、数字が伸びた報告に。',
tips:['伸び率3.5倍→5倍にするとコミカル、2倍にすると上品','文字の下端を基準（transform-origin: bottom）にするのが「床から生える」感のコツ','背景と文字を補色にすると、伸びた瞬間の残像が映えます'],
p:`「{T}」の各文字が、縦にビヨーンと伸びた状態から、ゴムのように縮んで止まる演出を作ってください。
・背景：#FF4B3E。文字：#111、Dela Gothic One、画面幅の約70%
・各文字は文字の下端を基準に縦方向だけ変形させる（transform-origin: 50% 100%）
・1文字の動き（0.9秒）：scaleY 3.5 → 0.7 → 1.15 → 0.95 → 1（キーフレームの位置は 0 / 40 / 65 / 85 / 100%）。同時に scaleX は 0.6 → 1.15 → 0.95 → 1 → 1
・文字ごとに0.07秒ずつ遅らせて左から順に動かす
・2.3秒：全文字を scaleY 0（上から潰れる）へ0.35秒で退場。イージング cubic-bezier(.7,0,.84,0)
・尺：2.8秒でループ`,
run(H,t){const B=H.box();const w=BIG(H,t,{color:'#111',fontSize:fs(t,280,1200)+'px'},B);w.textContent='';const cs=H.chars(t,w,{transformOrigin:'50% 100%'});
  cs.forEach((c,i)=>{H.a(c,[{transform:'scale(.6,3.5)',offset:0},{transform:'scale(1.15,.7)',offset:.4},{transform:'scale(.95,1.15)',offset:.65},{transform:'scale(1,.95)',offset:.85},{transform:'scale(1,1)',offset:1}],{d:900,dl:i*70,e:E.soft});
    H.a(c,[{transform:'scale(1,1)'},{transform:'scale(1.1,0)'}],{d:350,dl:2300,e:E.in,f:'forwards'})});
}});

def({no:'07',cat:'IMPACT',name:'ヘビードロップ',en:'Heavy Drop',lead:'重たい文字が1つずつ落ちてきて、ズシンと着地。',
text:'重大発表',loop:3400,bg:'#151515',
use:'<b>重大発表・ご報告・お知らせ</b>の頭に。「重さ」が出るので、ニュース性のある内容や真面目な告知に向きます。',
tips:['落下は必ず「加速する」イージング（ease-in）にするのが重さのコツ','着地の潰れ（scaleY 0.75）を強くするほど柔らかく、弱くするほど硬い素材に見えます','土ぼこりの粒の色を床の色に合わせるとなじみます'],
p:`「{T}」の文字が1文字ずつ画面の上から落ちてきて、床に「ズシン」と着地する演出を作ってください。
・背景：#151515。文字：白、Dela Gothic One、画面幅の約70%。文字の下に細い床の線（#444、幅1400px、高さ4px）
・1文字の落下（0.38秒）：translateY −900px → 0。イージング cubic-bezier(.7,0,.84,0)（加速して落ちる）
・着地（0.3秒）：scale(1.25, 0.75) → scale(0.95, 1.05) → scale(1,1)。transform-origin は文字の下端
・着地の瞬間：①画面全体を6px・0.2秒揺らす ②文字の足元から灰色(#888)の小さな丸（直径6〜14px）を左右に6個ずつ飛ばし、0.5秒で消す（土ぼこり）
・文字ごとに0.11秒ずつ遅らせる
・2.9秒でフェードアウト、尺3.4秒でループ`,
run(H,t){const B=H.box({flexDirection:'column'});const w=BIG(H,t,{fontSize:fs(t,260,1300)+'px'},B);w.textContent='';const cs=H.chars(t,w,{transformOrigin:'50% 100%'});
  H.el('div',{width:'1400px',height:'4px',background:'#444',marginTop:'8px'},B);
  cs.forEach((c,i)=>{const dl=i*110;H.a(c,[{transform:'translateY(-900px)'},{transform:'translateY(0)'}],{d:380,dl,e:E.in});
    H.a(c,[{transform:'scale(1.25,.75)'},{transform:'scale(.95,1.05)'},{transform:'scale(1,1)'}],{d:300,dl:dl+380,e:E.out,f:'none'});
    H.shake(B,dl+380,6,200);
    H.wait(dl+380,()=>{const r=c.getBoundingClientRect(),sr=H.S.getBoundingClientRect(),k=1600/sr.width;const cx=(r.left+r.width/2-sr.left)*k,cy=(r.bottom-sr.top)*k;
      for(let j=0;j<12;j++){const sz=rnd(6,14);const d=H.abs({left:cx+'px',top:cy-sz+'px',width:sz+'px',height:sz+'px',borderRadius:'50%',background:'#888'});const dir=j<6?-1:1;
        H.a(d,[{transform:'translate(0,0)',opacity:.9},{transform:`translate(${dir*rnd(40,140)}px,${-rnd(10,60)}px)`,opacity:0}],{d:500})}})});
  H.a(B,[{opacity:1},{opacity:0}],{d:400,dl:2900,f:'forwards'});
}});

def({no:'08',cat:'IMPACT',name:'フラッシュカット',en:'Flash Cut',lead:'0.16秒ごとに言葉と色が切り替わる、サブリミナル級の速さ。',
text:'見逃す な 今夜 20時',multi:true,loop:3000,bg:'#000',
use:'<b>告知・カウントダウン・ライブ配信の予告</b>に。短い語を高速で切り替えると、情報量のわりに一瞬で目に入ります。',
tips:['1語0.16秒は「読める限界」の速さ。読ませたい語は最後に置いて止める','白・黒・赤の3色ローテーションが最も強い。ブランド色を1色混ぜても可','光の点滅が苦手な人もいるので、0.1秒より速くはしないのがマナーです'],
p:`「{T}」をスペースで区切った語を、0.16秒ごとに画面いっぱいの文字で高速に切り替える演出を作ってください。
・フォント：Dela Gothic One、画面の高さの約40%の大きさ
・背景と文字色の組み合わせを1語ごとに順番に切り替える：①背景#000・文字白 ②背景#FF4B3E・文字#000 ③背景#FFF・文字#000
・切り替えはフェードなしのハードカット。語ごとに文字の大きさを 0.9〜1.1倍、角度を −3〜3° でランダムに変えて、躍動感を出す
・全語を2周したら、最後の語だけ背景#000・文字#FF4B3E で1.2秒止め、scale 1 → 1.06 へゆっくり拡大
・尺：3.0秒でループ（点滅が速すぎないよう、切り替えは0.1秒より速くしない）`,
run(H,t,w){if(!w.length)w=[t];const B=H.box();const el=BIG(H,'',{},B);const sch=[['#000','#fff'],['#ff4b3e','#000'],['#fff','#000']];
  const seq=[...w,...w];seq.forEach((s,i)=>H.wait(i*160,()=>{const c=sch[i%3];H.S.style.background=c[0];el.style.color=c[1];el.textContent=s;el.style.fontSize=fs(s,360,1400)+'px';el.style.transform=`scale(${rnd(.9,1.1)}) rotate(${rnd(-3,3)}deg)`}));
  const end=seq.length*160;H.wait(end,()=>{const s=w[w.length-1];H.S.style.background='#000';el.style.color='#ff4b3e';el.textContent=s;el.style.fontSize=fs(s,360,1400)+'px';el.style.transform='none';
    H.a(el,[{transform:'scale(1)'},{transform:'scale(1.06)'}],{d:1200,e:E.soft})});
}});

def({no:'09',cat:'IMPACT',name:'集中線ズーム',en:'Speed Lines',lead:'漫画の集中線がチカチカ走り、中央の言葉に視線を集める。',
text:'ここが核心',loop:2600,bg:'#f4f2ee',
use:'<b>「ここ重要」</b>を伝える場面。解説動画のポイント、ゲーム実況の決定的瞬間、漫画風の演出に。',
tips:['線の本数90本前後が漫画らしさの目安。多いほど緊迫感が出ます','毎フレーム線を描き直すと、手描きアニメのチラつきが出ます','文字に白い太フチを付けると、線と重なっても読めます'],
p:`漫画の「集中線」が毎フレーム描き直されてチラつく背景の中央に、「{T}」がズームインする演出を作ってください。
・背景：#F4F2EE。集中線：#111
・集中線は Canvas で描く。毎フレーム、ランダムな角度に90本の細長い三角形を描く。三角形は画面外（半径1200px）から、中心から半径300〜380pxの位置まで伸び、根元の太さは2〜10pxでランダム
・中央の文字：Dela Gothic One、色 #FF4B3E、白い太フチ（14px）＋黒の細フチ（2px）
・0.0〜0.35秒：文字を scale 0.3 → 1。イージング cubic-bezier(.34,1.56,.64,1)
・0.35秒以降：文字を scale 1 → 1.08 へ2秒かけてゆっくり拡大し続ける
・尺：2.6秒でループ`,
run(H,t){const c=H.canvas();const x=c.getContext('2d');
  H.raf(()=>{x.fillStyle='#f4f2ee';x.fillRect(0,0,1600,900);x.fillStyle='#111';for(let i=0;i<90;i++){const a=Math.random()*Math.PI*2,r0=rnd(300,380),w=rnd(.002,.012);
    x.beginPath();x.moveTo(800+Math.cos(a-w)*1200,450+Math.sin(a-w)*1200);x.lineTo(800+Math.cos(a)*r0,450+Math.sin(a)*r0);x.lineTo(800+Math.cos(a+w)*1200,450+Math.sin(a+w)*1200);x.fill()}});
  const B=H.box();const el=BIG(H,t,{color:'#ff4b3e',fontSize:fs(t,220,1100)+'px',WebkitTextStroke:'2px #111',textShadow:'0 0 0 #fff,-7px -7px 0 #fff,7px -7px 0 #fff,-7px 7px 0 #fff,7px 7px 0 #fff,0 9px 0 #fff,0 -9px 0 #fff,9px 0 0 #fff,-9px 0 0 #fff'},B);
  H.a(el,[{transform:'scale(.3)'},{transform:'scale(1)'}],{d:350,e:E.back});
  H.a(el,[{transform:'scale(1)'},{transform:'scale(1.08)'}],{d:2000,dl:350,e:E.soft,f:'none'});
}});

def({no:'10',cat:'IMPACT',name:'ガラスクラッシュ',en:'Glass Shatter',lead:'文字にヒビが入り、ガラスのように割れて崩れ落ちる。',
text:'常識を壊せ',loop:3200,bg:'#0e1116',
use:'<b>「常識を壊す」「ぶっ壊す」「固定観念」</b>など、破壊がテーマの言葉に。ビフォーアフターの「ビフォー」を壊して次へ繋ぐ転換にも。',
tips:['破片は8〜12枚が見やすい。多すぎると何が割れたか分からなくなります','落下を加速（ease-in）＋回転させると重力感が出ます','割れた後に、次の言葉を同じ位置にフェードインさせると場面転換に使えます'],
p:`中央の「{T}」にヒビが入り、ガラスのように割れて破片が下に崩れ落ちる演出を作ってください。
・背景：#0E1116。文字：白、Dela Gothic One、画面幅の約70%
・0.0〜0.4秒：文字をフェードイン
・0.9秒：画面中央を起点に、白いヒビの線（SVG、線幅3px）を放射状に10本、0.15秒で一気に描く
・1.2秒：文字を割る。文字のレイヤーを10枚複製し、それぞれ clip-path: polygon で中心から放射状の三角形（36°ずつ）に切り抜く
・各破片は 0〜0.2秒のランダムな遅れで、下方向へ 900〜1100px 落下（x方向 −200〜200px、回転 −90〜90°）。0.9秒、イージング cubic-bezier(.7,0,.84,0)
・割れる瞬間に画面を12px・0.3秒揺らし、白を一瞬(0.15秒)光らせる
・尺：3.2秒でループ`,
run(H,t){const N=10,pieces=[];const W=H.box();const svg=H.svg(1600,900,W);
  for(let i=0;i<N;i++){const a0=i/N*Math.PI*2,a1=(i+1)/N*Math.PI*2;const p=[`50% 50%`,`${50+300*Math.cos(a0)}% ${50+300*Math.sin(a0)}%`,`${50+300*Math.cos((a0+a1)/2)}% ${50+300*Math.sin((a0+a1)/2)}%`,`${50+300*Math.cos(a1)}% ${50+300*Math.sin(a1)}%`];
    const b=H.box({clipPath:`polygon(${p.join(',')})`},W);BIG(H,t,{fontSize:fs(t,250,1150)+'px'},b);pieces.push(b);
    const len=rnd(250,700);const l=H.sv('line',{x1:800,y1:450,x2:800+Math.cos(a0)*len,y2:450+Math.sin(a0)*len,stroke:'#fff','stroke-width':3,'stroke-dasharray':len,'stroke-dashoffset':len,opacity:.9},svg);
    H.a(l,[{strokeDashoffset:len,opacity:1},{strokeDashoffset:0,opacity:1}],{d:150,dl:900});H.a(l,[{opacity:1},{opacity:0}],{d:100,dl:1200,f:'forwards'})}
  W.appendChild(svg);
  pieces.forEach(b=>{H.a(b,[{opacity:0},{opacity:1}],{d:400});H.a(b,[{transform:'translate(0,0) rotate(0)'},{transform:`translate(${rnd(-200,200)}px,${rnd(900,1100)}px) rotate(${rnd(-90,90)}deg)`}],{d:900,dl:1200+rnd(0,200),e:E.in,f:'forwards'})});
  const fl=H.abs({inset:'0',background:'#fff',opacity:0});H.a(fl,[{opacity:.7},{opacity:0}],{d:150,dl:1200,f:'none'});
  H.shake(W,1200,12,300);
}});

/* ===== FLOW 11-20 ===== */
const track=(H,parent,unit,n,css)=>{const tr=H.el('div',Object.assign({display:'flex',whiteSpace:'nowrap',width:'max-content'},css||{}),parent);for(let i=0;i<n;i++)H.el('span',{paddingRight:'.4em'},tr,unit);return tr};

def({no:'11',cat:'FLOW',name:'無限マーキー',en:'Infinite Marquee',lead:'巨大な文字の帯が、斜めに・交互に流れ続ける。',
text:'NEW ARRIVAL 新作入荷',loop:6000,bg:'#f5c518',
use:'<b>ショップ告知・新商品・セール</b>の背景に。上に商品写真を重ねるだけで、ファッション広告のような画になります。',
tips:['塗り文字とフチだけの文字を交互にすると、単調にならずリズムが出ます','帯を −8° 傾けるのが今っぽさのポイント','速度は行ごとに倍・半分の関係にすると、継ぎ目なくループします'],
p:`画面いっぱいに「{T}」の巨大な文字の帯を5段並べ、段ごとに逆方向へ無限に流す演出を作ってください。
・背景：#F5C518。文字色：#111。フォント：Dela Gothic One、1段の高さ180px
・段の中身：「{T}」を4回くり返して横に並べ、もう1組を後ろにつなげて継ぎ目のないループにする
・段のスタイル：奇数段は塗りつぶし、偶数段は塗りなしで #111 の4pxフチだけ（-webkit-text-stroke）
・流れる方向：奇数段は左へ、偶数段は右へ。速度は 1段目・3段目・5段目が6秒で1組分、2段目・4段目が6秒で2組分（倍速）。等速（linear）
・5段まとめた全体を −8° 傾け、画面からはみ出すくらい大きく配置する
・尺：6秒で完全ループ`,
run(H,t){const G=H.abs({left:'-300px',top:'-260px',width:'2200px',transform:'rotate(-8deg)',display:'flex',flexDirection:'column',gap:'10px'});
  for(let i=0;i<6;i++){const row=H.el('div',{overflow:'visible'},G);const odd=i%2===0;
    const tr=track(H,row,t,8,{fontFamily:F.heavy,fontSize:'180px',lineHeight:'1.05',color:odd?'#111':'transparent',WebkitTextStroke:odd?'0':'4px #111'});
    const dist=odd?'-25%':'-50%';H.a(tr,odd?[{transform:'translateX(0)'},{transform:`translateX(${dist})`}]:[{transform:`translateX(${dist})`},{transform:'translateX(0)'}],{d:6000,e:E.lin,i:Infinity})}
}});

def({no:'12',cat:'FLOW',name:'クロステープ',en:'Caution Tape',lead:'警告テープ2本がX字に交差し、逆向きに流れる。',
text:'工事中 COMING SOON',loop:8000,bg:'#1a1a1a',
use:'<b>準備中・近日公開・注意喚起</b>に。チャンネルのリニューアル告知、「ここから先ネタバレ」の注意テロップにも。',
tips:['テープの角度は12°と−9°のように「わずかに非対称」にすると自然','テープの縁に黒黄のしま模様を入れると一気に工事現場らしくなります','テープ色を赤×白にすると「立入禁止（事件）」の雰囲気に'],
p:`黄色い警告テープ2本がX字に交差し、それぞれ逆方向に文字を流し続ける演出を作ってください。
・背景：#1A1A1A
・テープ：高さ130px、色 #F5C518。上下の縁に、黒と黄の45°のしま模様（幅24px）を高さ14pxで入れる
・テープの文字：「{T}」＋「 ／ 」を8回くり返す。#111、Dela Gothic One、高さ70px
・テープ1は +12°、テープ2は −9° に傾け、画面中央で交差させる（テープ2を手前に、影 0 10px 30px rgba(0,0,0,.5)）
・登場：0.0〜0.7秒でテープ1が左から、0.2〜0.9秒でテープ2が右から、画面外からスライドイン（イージング cubic-bezier(.16,1,.3,1)）
・流れ：テープ1の文字は左へ、テープ2の文字は右へ、4秒で1組分を等速で無限ループ
・尺：8秒でループ`,
run(H,t){const stripe='repeating-linear-gradient(45deg,#111 0 12px,#f5c518 12px 24px)';
  [[12,-1,0],[-9,1,200]].forEach(([deg,dir,dl],i)=>{const tape=H.abs({left:'-300px',top:'385px',width:'2200px',height:'130px',background:'#f5c518',transform:`rotate(${deg}deg)`,boxShadow:i?'0 10px 30px rgba(0,0,0,.5)':'none',overflow:'hidden',display:'flex',alignItems:'center'});
    H.abs({left:0,right:0,top:0,height:'14px',background:stripe},tape);H.abs({left:0,right:0,bottom:0,height:'14px',background:stripe},tape);
    const tr=track(H,tape,t+' ／',8,{fontFamily:F.heavy,fontSize:'70px',color:'#111'});
    H.a(tape,[{transform:`rotate(${deg}deg) translateX(${dir*2200}px)`},{transform:`rotate(${deg}deg) translateX(0)`}],{d:700,dl});
    H.a(tr,dir<0?[{transform:'translateX(0)'},{transform:'translateX(-25%)'}]:[{transform:'translateX(-25%)'},{transform:'translateX(0)'}],{d:4000,e:E.lin,i:Infinity})});
}});

def({no:'13',cat:'FLOW',name:'ウェーブ',en:'Sine Wave',lead:'文字がひとつずつ波打ち、ゆらゆら揺れ続ける。',
text:'ゆるっと夏休み',loop:4800,bg:'#11131c',
use:'<b>ゆるい・楽しい・リラックス</b>した雰囲気づくりに。Vlogのタイトル、夏・海・音楽系のテロップに。',
tips:['波の高さ60pxは大きめ。上品にしたいなら20〜30pxに','文字ごとに色相を少しずつずらすと、虹色の波になります','影も一緒に動かす代わりに、影だけ縮めると「跳ねている」感が出ます'],
p:`「{T}」の文字が1文字ずつ、波のように上下にゆらゆら揺れ続ける演出を作ってください。
・背景：#11131C。文字：#F5C518、Mochiy Pop One、画面幅の約70%
・各文字：translateY 0 → −60px → 0 を1.2秒で無限ループ。イージング ease-in-out
・文字ごとに0.1秒ずつ位相をずらす（animation-delay をマイナス値で指定して、最初から波の形にする）
・同時に、各文字の真下に楕円の影（幅は文字の80%、高さ16px、rgba(0,0,0,.5)、ぼかし6px）を置き、文字が上がるほど影を scale 0.6 まで小さく薄くする
・尺：4.8秒（1.2秒の4周）で継ぎ目なくループ`,
run(H,t){const B=H.box();const w=H.el('div',{fontFamily:F.pop,fontSize:fs(t,200,1150)+'px',color:'#f5c518',display:'flex'},B);
  [...t].forEach((ch,i)=>{const col=H.el('div',{display:'flex',flexDirection:'column',alignItems:'center'},w);const c=H.el('span',{display:'inline-block',whiteSpace:'pre'},col,ch);
    const sh=H.el('div',{width:'80%',height:'16px',borderRadius:'50%',background:'rgba(0,0,0,.6)',filter:'blur(6px)',marginTop:'10px'},col);
    const o={d:1200,e:'ease-in-out',i:Infinity,dl:-i*100};H.a(c,[{transform:'translateY(0)'},{transform:'translateY(-60px)'},{transform:'translateY(0)'}],o);
    H.a(sh,[{transform:'scale(1)',opacity:1},{transform:'scale(.6)',opacity:.4},{transform:'scale(1)',opacity:1}],o)});
}});

def({no:'14',cat:'FLOW',name:'うねるリボン',en:'Ribbon Path',lead:'波打つ帯の上を、文字が途切れず流れていく。',
text:'夜を越えて、また明日',loop:6000,bg:'#0f0f12',
use:'<b>MV・エンディング・エモい場面</b>に。歌詞や名言を1行で流すと、それだけで映像作品のような質感になります。',
tips:['帯の振幅（上下の幅）を大きくするほどダイナミックに','帯を2本にして色違い・逆方向にすると、より複雑で華やか','文字は明朝体にすると一気に叙情的になります'],
p:`画面を横切る1本の太いリボン（帯）が波のようにうねり、その上を「{T}」が途切れずに流れていく演出を作ってください。
・背景：#0F0F12
・リボン：SVGのパス。太さ130px、色 #F5C518、線端は丸く。y = 450 + 140·sin(x·0.005 + 時間·1.6) の波形を毎フレーム計算し直して、うねらせる
・文字：同じパスに沿って textPath で配置。「{T}」＋「　」をくり返して帯を埋める。色 #111、Shippori Mincho B1 の太字、大きさ64px、帯の中心に沿うよう dominant-baseline: middle
・文字の流れ：startOffset を毎秒140pxずつ減らして左へ流し、1組分ずれたら元に戻して継ぎ目なくループ
・尺：6秒でループ（うねりも文字も途切れず続く）`,
run(H,t){const svg=H.svg(1600,900);const id='rb'+Math.floor(Math.random()*1e6);
  const band=H.sv('path',{fill:'none',stroke:'#f5c518','stroke-width':130,'stroke-linecap':'round'},svg);
  const guide=H.sv('path',{id,fill:'none'},svg);
  const tx=H.sv('text',{fill:'#111','font-size':64,'font-family':"Shippori Mincho B1, serif",'font-weight':800,'dominant-baseline':'middle'},svg);
  const tp=H.sv('textPath',{href:'#'+id},tx);tp.textContent=(t+'　').repeat(12);
  const unit=H.sv('text',{'font-size':64,'font-family':"Shippori Mincho B1, serif",'font-weight':800,opacity:0},svg);unit.textContent=t+'　';let U=0;
  H.raf(s=>{if(!U)U=unit.getComputedTextLength()||600;let d='';for(let x=-100;x<=1700;x+=20){const y=450+140*Math.sin(x*.005+s*1.6);d+=(x===-100?'M':'L')+x+' '+y.toFixed(1)}
    band.setAttribute('d',d);guide.setAttribute('d',d);tp.setAttribute('startOffset',(-((s*140)%U)).toFixed(1))});
}});

def({no:'15',cat:'FLOW',name:'縦書き潮流',en:'Vertical Current',lead:'縦書きの列が、上へ下へと交互に流れる和の表現。',
text:'温故知新',loop:6000,bg:'#f3efe6',
use:'<b>和風・旅館・日本酒・伝統工芸</b>の紹介に。歴史解説や、京都・奈良などの旅動画のオープニングに。',
tips:['中央の1列だけ朱色にすると、視線がそこに集まります','流れる速さを列ごとに少しずつ変えると、川の流れのような揺らぎが出ます','背景に薄い和紙の繊維を足すと高級感が増します'],
p:`縦書きの文字列が7列並び、列ごとに上下交互に流れ続ける和風の演出を作ってください。
・背景：#F3EFE6（和紙色）。文字：#1A1A1A、Shippori Mincho B1（太さ800）、縦書き（writing-mode: vertical-rl）
・各列の中身：「{T}」＋「・」を8回くり返し、もう1組を後ろにつなげて継ぎ目のないループにする
・列の配置：画面幅いっぱいに等間隔で7列。中央の列だけ文字を1.6倍・色 #C8102E（朱）
・流れ：奇数列は上へ、偶数列は下へ。6秒で1組分（中央列だけ6秒で半組分＝ゆっくり）、等速で無限ループ
・画面の上下端に、背景色から透明へのグラデーション（高さ120px）をかけて、文字が霧の中から現れて消えるようにする
・尺：6秒で完全ループ`,
run(H,t){const R=H.abs({inset:'0',display:'flex',justifyContent:'space-evenly',alignItems:'flex-start',overflow:'hidden'});
  for(let i=0;i<7;i++){const mid=i===3;const col=H.el('div',{writingMode:'vertical-rl',fontFamily:F.min,fontWeight:'800',fontSize:(mid?110:68)+'px',color:mid?'#c8102e':'#1a1a1a',whiteSpace:'nowrap',lineHeight:'1'},R);
    col.textContent=(t+'・').repeat(16);const up=i%2===0;const dist=mid?'-25%':'-50%';
    H.a(col,up?[{transform:'translateY(0)'},{transform:`translateY(${dist})`}]:[{transform:`translateY(${dist})`},{transform:'translateY(0)'}],{d:6000,e:E.lin,i:Infinity})}
  H.abs({left:0,right:0,top:0,height:'120px',background:'linear-gradient(#f3efe6,rgba(243,239,230,0))'});H.abs({left:0,right:0,bottom:0,height:'120px',background:'linear-gradient(rgba(243,239,230,0),#f3efe6)'});
}});

def({no:'16',cat:'FLOW',name:'回転バッジ',en:'Spinning Badge',lead:'円に沿って文字が回り続ける、ステッカー風の丸ロゴ。',
text:'FOLLOW ME',loop:12000,bg:'#1b1b1f',
use:'<b>フォロー誘導・SALEシール・ロゴ演出</b>に。画面の隅に小さく置くだけで、ずっと動く「目印」になります。',
tips:['外側と内側を逆回転にすると、目が離せない立体感が出ます','文字の総量を円周にぴったり合わせる（textLength）と継ぎ目が消えます','中央にアイコンやロゴを置けば、そのままチャンネルの透かしに'],
p:`円に沿って「{T}」が回り続ける、ステッカーのような丸いバッジを作ってください。
・背景：#1B1B1F
・外側のリング：半径300pxの円周に沿って、「{T} ✦ 」を3回くり返した文字を textPath で配置。文字は #F5C518、Dela Gothic One、56px。textLength を円周に合わせて、継ぎ目なく1周させる
・内側のリング：半径190pxの円周に、同じ文字を2回。#FFFFFF、32px、文字間を広めに
・中央：直径240pxの #F5C518 の円。中に「{T}」の最初の1語を #111、Dela Gothic One で
・回転：外側は12秒で時計回りに1周、内側は12秒で反時計回りに1周（どちらも linear・無限）
・中央の円は 2秒周期で scale 1 → 1.06 → 1 と鼓動させる
・尺：12秒で完全ループ`,
run(H,t,w){const svg=H.svg(1600,900);const id='c'+Math.floor(Math.random()*1e6);
  const ring=(r,str,size,fill,dir,ls)=>{const g=H.sv('g',{},svg);g.style.transformOrigin='800px 450px';const pid=id+r;
    H.sv('path',{id:pid,d:`M ${800-r} 450 a ${r} ${r} 0 1 1 ${2*r} 0 a ${r} ${r} 0 1 1 ${-2*r} 0`,fill:'none'},g);
    const tx=H.sv('text',{fill,'font-size':size,'font-family':"Dela Gothic One, sans-serif",'letter-spacing':ls||0},g);const tp=H.sv('textPath',{href:'#'+pid,textLength:(2*Math.PI*r-6).toFixed(0),lengthAdjust:'spacing'},tx);tp.textContent=str;
    H.a(g,[{transform:'rotate(0deg)'},{transform:`rotate(${dir*360}deg)`}],{d:12000,e:E.lin,i:Infinity});};
  ring(300,(t+' ✦ ').repeat(3),56,'#f5c518',1);ring(190,(t+' ✦ ').repeat(2),32,'#fff',-1,4);
  const c=H.abs({left:'680px',top:'330px',width:'240px',height:'240px',borderRadius:'50%',background:'#f5c518',display:'flex',alignItems:'center',justifyContent:'center',color:'#111',fontFamily:F.heavy,fontSize:fs(w[0]||t,64,200)+'px'},null,w[0]||t);
  H.a(c,[{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{d:2000,e:'ease-in-out',i:Infinity});
}});

def({no:'17',cat:'FLOW',name:'スパイラル',en:'Spiral Drain',lead:'渦巻きに沿って、文字が中心へ吸い込まれていく。',
text:'沼にハマる',loop:8000,bg:'#050505',
use:'<b>「沼る」「ハマる」「抜け出せない」</b>系の言葉に。催眠・ミステリー・中毒性のある商品紹介にも。',
tips:['渦の巻き数を増やすほど「吸い込まれ感」が強くなります','文字色を外側から内側へグラデーションにすると奥行きが出ます','逆再生（外へ流す）にすると「広がる・拡散」の表現になります'],
p:`渦巻き（スパイラル）の線に沿って「{T}」がくり返し並び、ゆっくり中心へ吸い込まれていく演出を作ってください。
・背景：#050505
・渦巻き：中心(画面中央)から外へ、半径 r = 30 + 13·θ（θはラジアン、0〜6回転分）のアルキメデス螺旋をSVGパスで作る（外側が始点、中心が終点）
・文字：パスに沿って textPath で「{T}」＋「・」をパスの全長が埋まるまでくり返す（パスの長さ÷1組の長さ＋2回）。Dela Gothic One、44px
・文字色：外側 #F5C518 → 中心 #FF4B3E のグラデーション（SVGの radialGradient を fill に指定）
・流れ：startOffset を毎秒90pxずつ増やして中心へ流し、1組分で戻して継ぎ目なくループ
・全体を 8秒で1周、時計回りにゆっくり回転させる
・尺：8秒でループ`,
run(H,t){const svg=H.svg(1600,900);const id='sp'+Math.floor(Math.random()*1e6);
  const defs=H.sv('defs',{},svg);const g=H.sv('radialGradient',{id:id+'g',cx:800,cy:450,r:520,gradientUnits:'userSpaceOnUse'},defs);H.sv('stop',{offset:'0','stop-color':'#ff4b3e'},g);H.sv('stop',{offset:'1','stop-color':'#f5c518'},g);
  let d='';const TT=Math.PI*2*6;for(let th=TT;th>=0;th-=.05){const r=30+13*th;d+=(th===TT?'M':'L')+(800+r*Math.cos(th)).toFixed(1)+' '+(450+r*Math.sin(th)).toFixed(1)}
  const G=H.sv('g',{},svg);G.style.transformOrigin='800px 450px';H.sv('path',{id,d,fill:'none'},G);
  const tx=H.sv('text',{fill:`url(#${id}g)`,'font-size':44,'font-family':"Dela Gothic One, sans-serif"},G);const tp=H.sv('textPath',{href:'#'+id},tx);const u=H.sv('text',{'font-size':44,'font-family':"Dela Gothic One, sans-serif",opacity:0},svg);u.textContent=t+'・';let U=0;
  const PL=G.querySelector('path').getTotalLength();tp.textContent=(t+'・').repeat(Math.ceil(PL/Math.max(60,u.getComputedTextLength()||200))+2);
  H.raf(s=>{if(!U)U=u.getComputedTextLength()||300;tp.setAttribute('startOffset',(((s*90)%U)-U).toFixed(1))});
  H.a(G,[{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}],{d:8000,e:E.lin,i:Infinity});
}});

def({no:'18',cat:'FLOW',name:'はためく旗',en:'Waving Flag',lead:'布の旗に書かれた文字が、風を受けてはためく。',
text:'開幕',loop:4000,bg:'#2f6fc4',
use:'<b>開幕・大会・お祭り・選挙</b>など旗が似合う場面に。運動会や地域イベントの告知動画にも。',
tips:['ゆがみの強さ（displacement scale）30前後が布らしさの目安','風の速さはSVGアニメーションの周期で調整。4秒周期だと穏やかな風','旗の色を国旗や企業カラーにすれば、そのまま式典用に'],
p:`布の旗に「{T}」と書かれていて、風を受けてはためいているように見える演出を作ってください。
・背景：上 #2F6FC4 → 下 #8EC5FF の空のグラデーション
・旗：幅900px×高さ480pxの #C8102E の長方形。左端に灰色の旗竿（幅18px、高さ800px）
・旗の文字：「{T}」、白、Shippori Mincho B1（太さ800）、旗の高さの約55%
・はためき：旗と文字をまとめて1つのグループにし、SVGフィルター（feTurbulence type=turbulence＋feDisplacementMap scale=34）をかける。feTurbulence の baseFrequency を「0.004 0.012 → 0.008 0.02 → 0.004 0.012」と4秒周期で変化させ続ける（SVGの <animate> を使用）
・さらにグループ全体に skewY を 0 → −2° → 0 で4秒周期の揺れを足す
・光沢：旗の上に、白の半透明の帯（幅200px）が左から右へ4秒周期で通り過ぎ、布の陰影に見えるようにする
・尺：4秒でループ`,
run(H,t){const svg=H.svg(1600,900);const id='fl'+Math.floor(Math.random()*1e6);
  const defs=H.sv('defs',{},svg);const f=H.sv('filter',{id,x:'-10%',y:'-10%',width:'120%',height:'120%'},defs);
  const tb=H.sv('feTurbulence',{type:'turbulence',baseFrequency:'0.004 0.012',numOctaves:2,result:'n'},f);H.sv('animate',{attributeName:'baseFrequency',dur:'4s',values:'0.004 0.012;0.008 0.02;0.004 0.012',repeatCount:'indefinite'},tb);
  H.sv('feDisplacementMap',{in:'SourceGraphic',in2:'n',scale:34},f);
  const sky=H.sv('linearGradient',{id:id+'s',x1:0,y1:0,x2:0,y2:1},defs);H.sv('stop',{offset:0,'stop-color':'#2f6fc4'},sky);H.sv('stop',{offset:1,'stop-color':'#8ec5ff'},sky);
  H.sv('rect',{width:1600,height:900,fill:`url(#${id}s)`},svg);H.sv('rect',{x:322,y:80,width:18,height:800,fill:'#9aa0a8',rx:9},svg);
  const g=H.sv('g',{filter:`url(#${id})`},svg);g.style.transformOrigin='340px 450px';
  H.sv('rect',{x:340,y:150,width:900,height:480,fill:'#c8102e'},g);
  const tx=H.sv('text',{x:790,y:400,fill:'#fff','font-size':Math.min(264,820/Math.max(1,[...t].length)),'font-family':"Shippori Mincho B1, serif",'font-weight':800,'text-anchor':'middle','dominant-baseline':'middle'},g);tx.textContent=t;
  const sh=H.sv('rect',{x:340,y:150,width:200,height:480,fill:'#fff',opacity:.16},g);
  H.a(sh,[{transform:'translateX(-200px)'},{transform:'translateX(900px)'}],{d:4000,e:'ease-in-out',i:Infinity});
  H.a(g,[{transform:'skewY(0deg)'},{transform:'skewY(-2deg)'},{transform:'skewY(0deg)'}],{d:4000,e:'ease-in-out',i:Infinity});
}});

def({no:'19',cat:'FLOW',name:'エスカレーター',en:'Diagonal Cascade',lead:'階段状に並んだ文字の段が、斜め上へ流れ続ける。',
text:'まだまだ上がる',loop:5600,bg:'#141414',
use:'<b>上昇・成長・ランクアップ</b>の表現に。売上報告、レベルアップ、「右肩上がり」を視覚化したいときに。',
tips:['段ごとに右へずらす量（80px）を大きくすると急な階段に','流れを逆（下へ）にすると「下落」「転落」の表現に','左端と右端をフェードさせると、無限に続いて見えます'],
p:`「{T}」を階段状に何段も並べ、全体が斜め上へ流れ続ける演出を作ってください。
・背景：#141414。フォント：Dela Gothic One、1段の高さ110px（文字96px）
・段の並び：「{T}」を12段、縦に並べる。各段は1つ上の段より右へ80pxずらす（右下がりの階段）
・段の色を3種類でくり返す：#F5C518 の塗り → 白の塗り → 塗りなしの白フチ3px
・流れ：段の並び全体を、1.4秒で「上へ330px・左へ240px」（3段分）等速で動かし、無限にくり返す（3段ごとに色が一巡するので継ぎ目が出ない）
・画面の上下端に背景色へのグラデーション（高さ160px）をかけ、段が闇から現れて闇へ消えるようにする
・尺：5.6秒でループ`,
run(H,t){const G=H.abs({left:'120px',top:'-200px',display:'flex',flexDirection:'column'});
  const sty=[{color:'#f5c518'},{color:'#fff'},{color:'transparent',WebkitTextStroke:'3px #fff'}];
  for(let i=0;i<15;i++)H.el('div',Object.assign({height:'110px',fontFamily:F.heavy,fontSize:'96px',lineHeight:'110px',whiteSpace:'nowrap',marginLeft:i*80+'px'},sty[i%3]),G,t);
  H.a(G,[{transform:'translate(0,0)'},{transform:'translate(-240px,-330px)'}],{d:1400,e:E.lin,i:Infinity});
  H.abs({left:0,right:0,top:0,height:'160px',background:'linear-gradient(#141414,rgba(20,20,20,0))'});H.abs({left:0,right:0,bottom:0,height:'160px',background:'linear-gradient(rgba(20,20,20,0),#141414)'});
}});

def({no:'20',cat:'FLOW',name:'ニュースティッカー',en:'News Ticker',lead:'速報ラベル＋見出し＋流れる字幕。報道番組の画面下。',
text:'新サービスが本日スタート',loop:8000,bg:'#22262e',
use:'<b>お知らせ・速報風の告知・ニュース解説</b>に。真面目な内容を「ニュースっぽく」見せると信頼感が出ます。',
tips:['ラベルの「速報」を「LIVE」「NEWS」「独占」に変えるだけで性格が変わります','見出しは止め、下段だけ流すのが読みやすさのコツ','時計を右上に置くと一気に生放送っぽくなります'],
p:`報道番組の画面下にあるような「速報テロップ」を作ってください。
・背景：#22262E（映像の代わり）。右上に白い時計の表示「LIVE 20:00」（JetBrains Mono、赤い●が1秒ごとに点滅）
・下段の構成（画面下から）：
　① 流れる帯：高さ64px、#0B1F44（紺）。白文字で「{T}」＋「　◆　」をくり返し、左へ等速で流す（6秒で1組分）
　② 見出しの帯：高さ120px、白。左端に #C8102E の四角いラベル「速報」（白文字・Noto Sans JP 900）、右に「{T}」を #111・Noto Sans JP 900・64pxで表示
・登場：0.0〜0.5秒で見出しの帯が左から伸びる（scaleX 0→1、左基準）。0.3秒後にラベル、0.5秒後に見出し文字が下から0.4秒でせり上がる
・退場：7.3秒で帯全体を下へ0.5秒でスライドアウト
・尺：8秒でループ`,
run(H,t){const clk=H.abs({right:'60px',top:'50px',fontFamily:F.mono,fontSize:'34px',color:'#fff',display:'flex',alignItems:'center',gap:'14px'});const dot=H.el('span',{width:'18px',height:'18px',borderRadius:'50%',background:'#ff3b30'},clk);H.el('span',{},clk,'LIVE 20:00');
  H.a(dot,[{opacity:1},{opacity:.15}],{d:1000,e:'steps(2)',i:Infinity});
  const W=H.abs({left:'60px',right:'60px',bottom:'60px'});
  const head=H.el('div',{height:'120px',background:'#fff',display:'flex',alignItems:'center',gap:'28px',overflow:'hidden'},W);
  const lab=H.el('div',{background:'#c8102e',color:'#fff',fontFamily:F.sans,fontWeight:'900',fontSize:'52px',height:'120px',display:'flex',alignItems:'center',padding:'0 34px'},head,'速報');
  const hm=H.el('div',{overflow:'hidden',height:'90px'},head);const ht=H.el('div',{color:'#111',fontFamily:F.sans,fontWeight:'900',fontSize:'64px',lineHeight:'90px',whiteSpace:'nowrap'},hm,t);
  const tk=H.el('div',{height:'64px',background:'#0b1f44',overflow:'hidden',display:'flex',alignItems:'center'},W);
  const tr=track(H,tk,t+'　◆　',8,{color:'#fff',fontFamily:F.sans,fontWeight:'700',fontSize:'34px'});
  H.a(head,[{transform:'scaleX(0)',transformOrigin:'0 50%'},{transform:'scaleX(1)',transformOrigin:'0 50%'}],{d:500});
  H.a(lab,[{opacity:0},{opacity:1}],{d:200,dl:300});H.a(ht,[{transform:'translateY(100%)'},{transform:'translateY(0)'}],{d:400,dl:500});
  H.a(tk,[{opacity:0},{opacity:1}],{d:300,dl:600});H.a(tr,[{transform:'translateX(0)'},{transform:'translateX(-25%)'}],{d:6000,e:E.lin,i:Infinity});
  H.a(W,[{transform:'translateY(0)'},{transform:'translateY(320px)'}],{d:500,dl:7300,e:E.in,f:'forwards'});
}});

/* ===== DEPTH 21-30 ===== */
const TEAL='#2ee6c9';

def({no:'21',cat:'DEPTH',name:'テキストトンネル',en:'Text Tunnel',lead:'奥から次々に文字が飛んでくる、終わらないトンネル。',
text:'未来へ',loop:4000,bg:'#031413',
use:'<b>オープニング・タイトルコール・ワープ</b>の表現に。「〇〇の世界へ」「次のステージへ」など、入り込む系の言葉に。',
tips:['層の数を8→14に増やすと密度が上がって吸い込まれ感が強くなります','奥ほど暗く、手前ほど明るくするのが遠近感のコツ','中心を少し上にずらすと「上り坂を進む」感覚になります'],
p:`画面の奥から「{T}」と四角い枠が次々に飛んできて、カメラの横を通り過ぎていく「文字のトンネル」を作ってください。
・背景：#031413
・1つの層：幅1400px×高さ780pxの四角い枠（線幅6px）と、その中央の「{T}」（Dela Gothic One、180px）のセット
・層の色は交互に #2EE6C9 と #FFFFFF。文字は #2EE6C9 の層にだけ入れ、白の層は枠だけにする（重なっても読みやすくするため）
・各層の動き（4秒・無限ループ・等速）：scale 0.05／透明 → scale 0.3 で不透明 → scale 1.6・不透明度0.8 → scale 5／透明（キーフレーム 0 / 15 / 60 / 100%）。イージングは cubic-bezier(.55,0,1,.45)（奥はゆっくり、手前で一気に）
・層は8枚。それぞれ 0.5秒ずつ再生開始をずらし、最初から途切れずに奥から湧いてくるようにする（animation-delay をマイナス値に）
・尺：4秒で完全ループ`,
run(H,t){for(let i=0;i<8;i++){const c=i%2?'#fff':TEAL;const L=H.abs({left:'100px',top:'60px',width:'1400px',height:'780px',border:`6px solid ${c}`,display:'flex',alignItems:'center',justifyContent:'center',boxSizing:'border-box'});
    if(i%2===0)BIG(H,t,{color:c,fontSize:fs(t,180,1000)+'px'},L);
    H.a(L,[{transform:'scale(.05)',opacity:0,offset:0},{transform:'scale(.3)',opacity:1,offset:.15},{transform:'scale(1.6)',opacity:.8,offset:.6},{transform:'scale(5)',opacity:0,offset:1}],{d:4000,e:'cubic-bezier(.55,0,1,.45)',i:Infinity,dl:-i*500,f:'none'})}
}});

def({no:'22',cat:'DEPTH',name:'回転シリンダー',en:'Cylinder Spin',lead:'円柱の表面に貼った文字が、3段で逆回転する。',
text:'回る世界',loop:8000,bg:'#081a1c',
use:'<b>ループ素材・場面のつなぎ・音楽系の背景</b>に。グルグル回ることで「繰り返し」「循環」「時間」を表現できます。',
tips:['段ごとに回転方向を変えるのが単調にしないコツ','裏側を見せない（backface-visibility: hidden）とスッキリ、見せると透明な筒のように','傾き（rotateX）を−12°にすると、上から覗き込む構図になります'],
p:`「{T}」の文字を円柱の表面にぐるりと貼り付け、その円柱を3段重ねて段ごとに逆方向へ回転させる演出を作ってください。
・背景：#081A1C。CSS 3D（perspective: 1600px、transform-style: preserve-3d）を使う
・1段の作り方：「{T}」を1文字ずつに分け、円周を12等分した位置に置く（文字が12個に満たなければくり返す）。各文字は rotateY(30°×番号) translateZ(520px)。文字は Dela Gothic One、140px
・裏側に回った文字は見えないようにする（backface-visibility: hidden）
・3段を縦に並べ（段の間隔170px）、色を上から #2EE6C9 → 白 → #2EE6C9
・回転：1段目と3段目は8秒で rotateY 0→−360°、2段目は8秒で 0→+360°（linear・無限）
・円柱全体を rotateX(−12°) で少し上から見下ろす角度にする
・尺：8秒で完全ループ`,
run(H,t){const P=H.box({perspective:'1600px'});const R=H.el('div',{position:'relative',width:'0',height:'0',transformStyle:'preserve-3d',transform:'rotateX(-12deg)'},P);
  let s=[...t];while(s.length<12)s=s.concat([...t]);s=s.slice(0,12);
  [-170,0,170].forEach((y,ri)=>{const ring=H.el('div',{position:'absolute',left:'0',top:y+'px',transformStyle:'preserve-3d'},R);
    s.forEach((ch,i)=>H.abs({left:'-70px',top:'-70px',width:'140px',height:'140px',textAlign:'center',lineHeight:'140px',fontFamily:F.heavy,fontSize:'130px',color:ri===1?'#fff':TEAL,transform:`rotateY(${i*30}deg) translateZ(520px)`,backfaceVisibility:'hidden'},ring,ch));
    const d=ri===1?360:-360;H.a(ring,[{transform:'rotateY(0deg)'},{transform:`rotateY(${d}deg)`}],{d:8000,e:E.lin,i:Infinity})});
}});

def({no:'23',cat:'DEPTH',name:'キューブローテート',en:'Cube Rotate',lead:'立方体がカチッと回るたびに、面の言葉が切り替わる。',
text:'見る 知る 試す 続ける',multi:true,loop:4000,bg:'#0a0d10',
use:'<b>手順・ステップ・4つのポイント</b>の紹介に。「〇〇の4ステップ」の章扉や、サービスの特徴紹介に。',
tips:['回転0.4秒＋静止0.6秒のリズムが「カチッ」と気持ちいい比率','面ごとに色を変えると、どの面か一目で分かります','縦回転（rotateX）にするとスロットのような印象に'],
p:`立方体が90°ずつ「カチッ」と回転し、そのたびに正面の言葉が切り替わる演出を作ってください。
・背景：#0A0D10。CSS 3D（perspective: 2000px、transform-style: preserve-3d）
・立方体：1辺500px。前・右・後・左の4面に「{T}」をスペースで区切った語を1語ずつ配置
・面のデザイン：1・3面目は背景 #2EE6C9・文字 #0A0D10、2・4面目は背景 #10282A・文字 #2EE6C9。文字は Dela Gothic One、面に収まる最大サイズ
・回転：0.6秒止まる → 0.4秒で rotateY −90°（イージング cubic-bezier(.87,0,.13,1)）をくり返し、4回で1周
・回転中だけ立方体を scale 0.9 に縮めて、止まると1に戻す（重さが出る）
・立方体全体を rotateX(−18°) で少し上から見る角度に
・尺：4秒で完全ループ`,
run(H,t,w){w=w.slice(0,4);while(w.length<4)w.push(w[w.length-1]||t);const P=H.box({perspective:'2000px'});
  const C=H.el('div',{position:'relative',width:'500px',height:'500px',transformStyle:'preserve-3d'},P);
  w.forEach((s,i)=>{const alt=i%2;H.abs({inset:'0',display:'flex',alignItems:'center',justifyContent:'center',background:alt?'#10282a':TEAL,color:alt?TEAL:'#0a0d10',fontFamily:F.heavy,fontSize:fs(s,200,430)+'px',transform:`rotateY(${i*90}deg) translateZ(250px)`,backfaceVisibility:'hidden'},C,s)});
  const k=[];for(let i=0;i<4;i++){k.push({transform:`rotateX(-18deg) rotateY(${-90*i}deg) scale(1)`,offset:i/4},{transform:`rotateX(-18deg) rotateY(${-90*i}deg) scale(1)`,offset:i/4+.15},{transform:`rotateX(-18deg) rotateY(${-90*i-45}deg) scale(.9)`,offset:i/4+.2})}
  k.push({transform:'rotateX(-18deg) rotateY(-360deg) scale(1)',offset:1});
  H.a(C,k,{d:4000,e:E.lin,i:Infinity});
}});

def({no:'24',cat:'DEPTH',name:'押し出し3D',en:'Extrude Swing',lead:'厚みのある立体文字が、首振りして側面を見せる。',
text:'立体感',loop:4000,bg:'#0c1a1b',
use:'<b>ロゴ・タイトル・チャンネル名</b>に。ゲーム、おもちゃ、ポップな商品紹介。「厚み」があるだけで高級感と存在感が出ます。',
tips:['層の数24で厚み約30px。増やすほど分厚い看板に','側面の色は正面の色を暗くしたものにすると自然な立体に','振れ幅±25°以上にすると、文字の厚みが不自然に見えるので注意'],
p:`厚み（奥行き）のある立体文字「{T}」が、左右にゆっくり首を振って側面を見せる演出を作ってください。
・背景：#0C1A1B
・文字：Dela Gothic One、画面幅の約60%、正面の色 #2EE6C9
・厚み：text-shadow を24層重ねて押し出す。n層目は x方向 −sin(角度)×1.3×n px、y方向 1.2×n px の位置に、#0F6E63 から #06302B へ徐々に暗くなる色で置く（ぼかし0）
・首振り：角度 = 25° × sin(時間×2π/4秒)。毎フレーム、文字に perspective(1200px) rotateY(角度) をかけ、同時に上の text-shadow の x方向も角度に合わせて計算し直す（側面が回転方向に見える）
・最後の層の下に、ぼかし30pxの黒い影を落とす
・尺：4秒でループ`,
run(H,t){const B=H.box({perspective:'1200px'});const el=BIG(H,t,{color:TEAL,fontSize:fs(t,240,1000)+'px'},B);
  const cols=[];for(let i=1;i<=24;i++){const k=i/24;const r=Math.round(15-9*k),g=Math.round(110-62*k),b=Math.round(99-56*k);cols.push(`rgb(${r},${g},${b})`)}
  H.raf(s=>{const a=25*Math.sin(s*Math.PI*2/4);const dx=-Math.sin(a*Math.PI/180)*1.3*3;const sh=cols.map((c,i)=>`${(dx*(i+1)/3).toFixed(1)}px ${(1.2*(i+1)).toFixed(1)}px 0 ${c}`);sh.push(`${(dx*8).toFixed(1)}px 40px 30px rgba(0,0,0,.7)`);
    el.style.textShadow=sh.join(',');el.style.transform=`rotateY(${a.toFixed(2)}deg)`});
}});

def({no:'25',cat:'DEPTH',name:'遠近クロール',en:'Perspective Crawl',lead:'床に書かれた文章が、遠くの地平線へ流れていく。',
text:'第一章 すべては ここから 始まった',multi:true,loop:12000,bg:'#020608',
use:'<b>あらすじ・前回までのあらすじ・プロローグ</b>に。シリーズ動画の冒頭や、プロジェクトの経緯説明に。',
tips:['傾き（rotateX）58°が「床」に見える目安。大きくするほど寝かせた感じに','行間を広くとると、遠くでも読みやすさが保てます','奥へのフェードを強めると、宇宙空間のような余韻が出ます'],
p:`床に書かれた文章が、画面の手前から奥の地平線へ向かって流れていく「遠近クロール」を作ってください。
・背景：#020608。星（白い点、直径1〜3px）を200個ランダムに散らし、ゆっくり瞬かせる
・文章：「{T}」をスペースで区切り、1語＝1行として中央揃えで並べる。1行目だけ見出しとして大きく（120px）、残りは84px。Noto Sans JP 900、色 #2EE6C9、行間1.6
・遠近：文章のブロックを幅1100pxにし、親要素に perspective: 500px、ブロックに rotateX(58°)（下端を手前に倒す）
・流れ：ブロックを translateY 900px → −1600px へ12秒で等速移動させ、手前から奥へ流す
・奥へ行くほど消えるよう、画面上部40%に背景色へのグラデーションのマスクをかける
・尺：12秒でループ`,
run(H,t,w){if(!w.length)w=[t];const c=H.canvas();const x=c.getContext('2d');const st=[...Array(200)].map(()=>[rnd(0,1600),rnd(0,900),rnd(.5,1.5),rnd(0,6)]);
  H.raf(s=>{x.clearRect(0,0,1600,900);st.forEach(p=>{x.globalAlpha=.4+.6*Math.abs(Math.sin(s+p[3]));x.fillStyle='#fff';x.beginPath();x.arc(p[0],p[1],p[2],0,7);x.fill()})});
  const P=H.abs({inset:'0',perspective:'500px',overflow:'hidden',WebkitMaskImage:'linear-gradient(transparent 0%,#000 42%)',maskImage:'linear-gradient(transparent 0%,#000 42%)'});
  const blk=H.abs({left:'250px',width:'1100px',top:'0',textAlign:'center',fontFamily:F.sans,fontWeight:'900',color:TEAL,lineHeight:'1.6',transformOrigin:'50% 100%'},P);
  w.forEach((s,i)=>H.el('div',{fontSize:(i?84:120)+'px'},blk,s));
  H.a(blk,[{transform:'rotateX(58deg) translateY(900px)'},{transform:'rotateX(58deg) translateY(-1600px)'}],{d:12000,e:E.lin});
}});

def({no:'26',cat:'DEPTH',name:'リングオービット',en:'Orbit Ring',lead:'中央の言葉のまわりを、文字の輪が衛星のように公転。',
text:'GLOBAL',loop:6000,bg:'#05121a',
use:'<b>グローバル・宇宙・テクノロジー</b>系のタイトルに。会社紹介、カンファレンス、IT系のオープニングに。',
tips:['手前の文字は大きく明るく、奥の文字は小さく暗くするのが立体感の正体','輪の傾き（縦のつぶれ率0.28）を大きくすると真横から見た土星のように','2本の輪を逆回転させると原子モデルのような表現に'],
p:`中央の「{T}」のまわりを、文字の輪が斜めに傾いた軌道で公転する演出を作ってください。
・背景：#05121A。中央に「{T}」（Dela Gothic One、画面幅の45%、白）
・輪の文字：「{T} ・ 」を3回くり返した文字列を1文字ずつ分け、円周上に均等に並べる
・軌道の計算（毎フレーム）：角度θの文字は x = 中心 + 620·cos θ、y = 中心 + 620·0.28·sin θ（横長の楕円）。θは6秒で1周増やす
・奥行き：sin θ が正（手前側）のときは scale 1.25・不透明度1・z-index を中央の文字より上、負（奥側）のときは scale 0.6・不透明度0.35・z-index を下にする（sin θ に応じて連続的に変化）
・輪の文字色 #2EE6C9、Dela Gothic One、48px
・中央の文字には、ぼかし40pxの #2EE6C9 の光を不透明度0.35でにじませる
・尺：6秒で完全ループ`,
run(H,t){const ch=[...(t+' ・ ').repeat(3)];const n=ch.length;const ctr=H.box({zIndex:'50'});BIG(H,t,{color:'#fff',fontSize:fs(t,240,720)+'px',textShadow:'0 0 40px rgba(46,230,201,.35)'},ctr);
  const els=ch.map(c=>H.abs({left:'0',top:'0',fontFamily:F.heavy,fontSize:'48px',color:TEAL,whiteSpace:'pre'},null,c));
  H.raf(s=>{const b=s/6*Math.PI*2;els.forEach((e,i)=>{const th=b+i/n*Math.PI*2;const z=Math.sin(th);const x=800+620*Math.cos(th),y=450+620*.28*z;const sc=.6+(z+1)/2*.65;
    e.style.transform=`translate(${x-20}px,${y-30}px) scale(${sc.toFixed(3)})`;e.style.opacity=(.35+(z+1)/2*.65).toFixed(2);e.style.zIndex=z>0?100:1})});
}});

def({no:'27',cat:'DEPTH',name:'Zフライスルー',en:'Z Fly-through',lead:'奥に並んだ言葉の間を、カメラが前進して突き抜ける。',
text:'過去 現在 未来',multi:true,loop:6000,bg:'#020a0b',
use:'<b>時系列・ストーリー・ロードマップ</b>に。「昔→今→これから」のように、順番に進む話の導入に。',
tips:['言葉の間隔（1200px）を詰めると速く、広げるとゆったり進みます','各言葉に枠を付けると「ゲートをくぐる」感覚が強まります','最後の言葉の手前でカメラを止めると、そこが結論として残ります'],
p:`奥行き方向に並んだ言葉の間を、カメラがまっすぐ前進して1語ずつ突き抜けていく演出を作ってください。
・背景：#020A0B。CSS 3D（perspective: 1000px、transform-style: preserve-3d）
・言葉：「{T}」をスペースで区切り、1語目を translateZ(−800px)、2語目を −2000px、3語目を −3200px…と1200pxずつ奥に置く
・各語のデザイン：Dela Gothic One、260px。色は #2EE6C9 と白を交互に。それぞれ幅1300px×高さ620pxの細い枠（線幅4px、同じ色、不透明度0.5）で囲む
・カメラ移動：すべての語を入れた親要素を translateZ 0 → (語数×1200 + 400)px へ、6秒かけて前進させる。イージング cubic-bezier(.65,0,.35,1)
・語がカメラを通り過ぎる直前（距離300px以内）で不透明度を0にして、ちらつきを防ぐ
・尺：6秒でループ`,
run(H,t,w){if(!w.length)w=[t];const P=H.box({perspective:'1000px'});const G=H.el('div',{position:'relative',width:'0',height:'0',transformStyle:'preserve-3d'},P);
  const items=w.map((s,i)=>{const c=i%2?'#fff':TEAL;const z=-800-i*1200;const it=H.abs({left:'-650px',top:'-310px',width:'1300px',height:'620px',display:'flex',alignItems:'center',justifyContent:'center',transform:`translateZ(${z}px)`,border:`4px solid ${c}80`,boxSizing:'border-box'},G);
    BIG(H,s,{color:c,fontSize:fs(s,260,1150)+'px'},it);return [it,z]});
  const total=w.length*1200+400;
  H.raf(s=>{const p=Math.min(1,s/6);const e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;const cz=e*total;G.style.transform=`translateZ(${cz}px)`;
    items.forEach(([it,z])=>{const dist=-(z+cz);it.style.opacity=dist<300?Math.max(0,dist/300):1})});
}});

def({no:'28',cat:'DEPTH',name:'三つ折りパンフ',en:'Tri-fold Open',lead:'折りたたまれた紙がパタン、パタンと開いて文字が現れる。',
text:'OPEN 新装開店',loop:4200,bg:'#0d1416',
use:'<b>オープン告知・招待状・中身の公開</b>に。「開ける」動きなので、新商品のお披露目やプレゼント企画に合います。',
tips:['開く途中のパネルを暗くする（brightness 0.6）と紙の陰影が出ます','開く順番を左→右→下と増やせば地図のような折り方に','開き切った瞬間に小さく scale 1.03 で弾ませると気持ちいい'],
p:`3枚に折りたたまれたパンフレットが左右に開き、1枚の横長パネルに書かれた「{T}」が現れる演出を作ってください。
・背景：#0D1416。CSS 3D（perspective: 1800px）
・パネル全体：幅1350px×高さ380px、背景 #2EE6C9、文字「{T}」#0A0D10、Dela Gothic One、パネル内で最大サイズ
・パネルを横に3等分（各450px）。各パートは overflow: hidden で、中の文字はパネル全体の位置からずらして表示し、並べると1枚の絵としてつながるようにする
・開き方：最初は左右のパートが中央パートの上に折り重なった状態（左は rotateY(180°)・回転軸は右端、右は rotateY(−180°)・回転軸は左端）
・0.3〜0.9秒：左パートが rotateY 180°→0° で開く。0.7〜1.3秒：右パートが −180°→0° で開く。イージング cubic-bezier(.65,0,.35,1)
・開いている途中は brightness 0.55 → 1 で陰影をつける。裏側は #10282A で塗る
・開き切ったら scale 1 → 1.03 → 1 で軽く弾ませ、2.9秒から逆の順番で閉じる
・尺：4.2秒でループ`,
run(H,t){const P=H.box({perspective:'1800px'});const W=H.el('div',{position:'relative',width:'1350px',height:'380px',transformStyle:'preserve-3d'},P);
  const mk=(i)=>{const p=H.abs({left:i*450+'px',top:'0',width:'450px',height:'380px',transformStyle:'preserve-3d'},W);
    const f=H.abs({inset:'0',overflow:'hidden',background:TEAL,backfaceVisibility:'hidden'},p);
    H.abs({left:-i*450+'px',top:'0',width:'1350px',height:'380px',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:F.heavy,fontSize:fs(t,250,1250)+'px',color:'#0a0d10',whiteSpace:'nowrap'},f,t);
    H.abs({inset:'0',background:'#10282a',transform:'rotateY(180deg)',backfaceVisibility:'hidden'},p);return p};
  mk(1);const L=mk(0),R=mk(2);L.style.transformOrigin='100% 50%';R.style.transformOrigin='0 50%';
  const ease=E.io;const open=(el,from,dl)=>{H.a(el,[{transform:`rotateY(${from}deg)`,filter:'brightness(.55)'},{transform:'rotateY(0deg)',filter:'brightness(1)'}],{d:600,dl,e:'cubic-bezier(.65,0,.35,1)'});
    H.a(el,[{transform:'rotateY(0deg)',filter:'brightness(1)'},{transform:`rotateY(${from}deg)`,filter:'brightness(.55)'}],{d:600,dl:dl===300?3500:2900,e:'cubic-bezier(.65,0,.35,1)',f:'forwards'})};
  open(L,180,300);open(R,-180,700);
  H.a(W,[{transform:'scale(1)'},{transform:'scale(1.03)'},{transform:'scale(1)'}],{d:400,dl:1300,f:'none'});
}});

def({no:'29',cat:'DEPTH',name:'パララックス',en:'Parallax Layers',lead:'遠・中・近の3層が違う速さで流れ、空間が生まれる。',
text:'旅に出よう',loop:6000,bg:'#071416',
use:'<b>旅・移動・ドライブ・電車</b>の動画に。車窓のように流れるので、移動中のVlogや旅行記のタイトルにぴったり。',
tips:['奥の層ほど「小さく・遅く・ぼかす・暗く」の4点セットで距離が出ます','手前の層をフチ文字にすると、奥が透けて見えて奥行きが増します','流れを止めて手前の層だけ止める、という緩急も効果的'],
p:`「{T}」の文字で作った3つの層（遠景・中景・近景）が、それぞれ違う速さで横に流れて奥行きが生まれる演出を作ってください。
・背景：#071416
・遠景：「{T}」を小さく（60px）、#2EE6C9・不透明度0.35・ぼかし3px で画面上部に3行。6秒で文字2個分、左へ等速
・中景：中サイズ（150px）、白、ぼかしなし。画面中央に1行。6秒で文字2個分、左へ等速（文字が大きい分、遠景より速く見える）
・近景：巨大（380px）、塗りなし・#2EE6C9の5pxフチ。画面下部にはみ出すように1行。6秒で文字2個分、左へ等速（最も速く見える）
・各層は「{T}」＋全角スペースを8回くり返し、継ぎ目のないループにする。フォントはすべて Dela Gothic One
・尺：6秒で完全ループ`,
run(H,t){const lay=(top,size,css,n)=>{const r=H.abs({left:'0',top:top+'px',whiteSpace:'nowrap'});const tr=track(H,r,t+'　',8,Object.assign({fontFamily:F.heavy,fontSize:size+'px',lineHeight:'1.1'},css));H.a(tr,[{transform:'translateX(0)'},{transform:'translateX(-25%)'}],{d:6000,e:E.lin,i:Infinity})};
  [40,120,200].forEach((y,i)=>{const r=H.abs({left:-i*140+'px',top:y+'px'});const tr=track(H,r,t+'　',8,{fontFamily:F.heavy,fontSize:'60px',color:TEAL,opacity:'.35',filter:'blur(3px)'});H.a(tr,[{transform:'translateX(0)'},{transform:'translateX(-25%)'}],{d:6000,e:E.lin,i:Infinity})});
  lay(330,150,{color:'#fff'});lay(560,380,{color:'transparent',WebkitTextStroke:'5px '+TEAL});
}});

def({no:'30',cat:'DEPTH',name:'フリップカード',en:'Flip Card',lead:'カードがくるっと裏返り、表と裏で言葉が変わる。',
text:'Before After',multi:true,loop:3600,bg:'#0a1112',
use:'<b>ビフォーアフター・問題と答え・表と裏</b>に。クイズの正解発表、「実は…」の種明かしにも使えます。',
tips:['回転に少し行き過ぎ（overshoot）を入れると、カードの重さが出ます','裏返る瞬間にカードを少し持ち上げる（scale 1.1）と立体感アップ','横回転（rotateY）は「切り替え」、縦回転（rotateX）は「めくる」印象'],
p:`1枚のカードがくるっと裏返り、表面と裏面で違う言葉が見える演出を作ってください。
・背景：#0A1112。CSS 3D（perspective: 1800px）
・カード：幅1000px×高さ540px、角丸28px、影 0 40px 80px rgba(0,0,0,.6)
・表面：背景 #18282A、文字は「{T}」の1語目（白、Dela Gothic One）。左上に小さく「FRONT」（JetBrains Mono、#2EE6C9）
・裏面：背景 #2EE6C9、文字は2語目（#0A1112、Dela Gothic One）。左上に小さく「BACK」。rotateY(180°) で配置し、backface-visibility: hidden
・0.8秒：0.9秒かけて rotateY 0 → 180°。キーフレームで 0% → 60%:190° → 80%:175° → 100%:180° と行き過ぎて戻る。回転の中盤だけ scale 1.1 に持ち上げる
・2.6秒：0.9秒かけて 180° → 360° で表に戻る（同じく行き過ぎあり）
・尺：3.6秒でループ`,
run(H,t,w){const a=w[0]||t,b=w[1]||t;const P=H.box({perspective:'1800px'});const C=H.el('div',{position:'relative',width:'1000px',height:'540px',transformStyle:'preserve-3d'},P);
  const face=(s,bg,fg,lab,back)=>{const f=H.abs({inset:'0',borderRadius:'28px',background:bg,display:'flex',alignItems:'center',justifyContent:'center',backfaceVisibility:'hidden',boxShadow:'0 40px 80px rgba(0,0,0,.6)',transform:back?'rotateY(180deg)':'none'},C);
    H.abs({left:'36px',top:'28px',fontFamily:F.mono,fontSize:'26px',color:back?'#0a1112':TEAL,letterSpacing:'.2em'},f,lab);BIG(H,s,{color:fg,fontSize:fs(s,220,880)+'px'},f)};
  face(a,'#18282a','#fff','FRONT',0);face(b,TEAL,'#0a1112','BACK',1);
  const fl=(f,to,dl)=>H.a(C,[{transform:`rotateY(${f}deg) scale(1)`},{transform:`rotateY(${f+95}deg) scale(1.1)`,offset:.35},{transform:`rotateY(${to+10}deg) scale(1.02)`,offset:.6},{transform:`rotateY(${to-5}deg) scale(1)`,offset:.8},{transform:`rotateY(${to}deg) scale(1)`}],{d:900,dl,e:E.soft,f:'forwards'});
  fl(0,180,800);H.wait(2600,()=>fl(180,360,0));
}});

/* ===== SWITCH 31-40 ===== */
const VIO='#a78bfa';

def({no:'31',cat:'SWITCH',name:'フラップボード',en:'Split-flap Board',lead:'駅の発車標のように、パタパタと文字がめくれて揃う。',
text:'東京行き',loop:4200,bg:'#121016',
use:'<b>行き先・目的地・発表</b>に。旅行動画のタイトル、「次の目的地は…」、空港・駅が舞台の動画に。',
tips:['めくれる回数を文字ごとに増やす（左から順に揃う）のが本物らしさのコツ','パタパタ音の効果音を1枚ごとに鳴らすと臨場感が段違い','板の上下で色を少し変える（上が明るい）と立体に見えます'],
p:`駅や空港の「パタパタ式発車標」のように、各文字の板がめくれながらランダムな文字を経て「{T}」に揃う演出を作ってください。
・背景：#121016
・文字板：1文字ごとに幅180px×高さ240pxの板。背景は上半分 #2A2632、下半分 #221F29、中央に横一本の黒い切れ目（2px）。角丸10px。板どうしの間隔14px
・文字：白、Noto Sans JP 900、170px
・めくれ方：板の上半分がパタンと下へ倒れる動き（rotateX 0 → −90°、回転軸は板の中央、0.08秒）を1回とし、そのたびに文字を「アイウエオ…0〜9」からランダムに入れ替える
・左から n 番目の板は 8 + n×3 回めくれてから正しい文字で止まる（左から順に揃っていく）
・全部揃ったら、板全体の下に #A78BFA の細い線（高さ6px）が左から右へ0.4秒で伸びる
・3.6秒で全体をフェードアウト、尺4.2秒でループ`,
run(H,t){const B=H.box({gap:'14px'});const cs=[...t];const n=cs.length;const W=Math.min(180,1400/n-14),Hh=W*4/3;
  const boards=cs.map(()=>{const b=H.el('div',{position:'relative',width:W+'px',height:Hh+'px',borderRadius:'10px',overflow:'hidden',background:'linear-gradient(#2a2632 50%,#221f29 50%)',perspective:'600px'},B);
    const ch=H.abs({inset:'0',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:F.sans,fontWeight:'900',fontSize:W*.94+'px',color:'#fff'},b,' ');
    const flap=H.abs({left:0,right:0,top:0,height:'50%',background:'#2a2632',transformOrigin:'50% 100%',opacity:0},b);
    H.abs({left:0,right:0,top:'calc(50% - 1px)',height:'2px',background:'#000'},b);return{ch,flap}});
  boards.forEach((b,i)=>{const flips=8+i*3;for(let k=0;k<=flips;k++)H.wait(k*80,()=>{b.ch.textContent=k===flips?cs[i]:pick([...POOL]);if(k<flips)H.a(b.flap,[{transform:'rotateX(0)',opacity:1},{transform:'rotateX(-90deg)',opacity:1}],{d:80,e:E.in,f:'none'})})});
  const done=(8+(n-1)*3)*80+100;const ln=H.abs({left:'50%',top:`calc(50% + ${Hh/2+30}px)`,width:Math.min(1400,n*(W+14))+'px',height:'6px',background:VIO,transform:'translateX(-50%) scaleX(0)'});
  H.a(ln,[{transform:'translateX(-50%) scaleX(0)'},{transform:'translateX(-50%) scaleX(1)'}],{d:400,dl:done});
  H.a(B,[{opacity:1},{opacity:0}],{d:500,dl:3600,f:'forwards'});H.a(ln,[{opacity:1},{opacity:0}],{d:500,dl:3600,f:'forwards'});
}});

def({no:'32',cat:'SWITCH',name:'スロットリール',en:'Slot Reel',lead:'リールが高速回転し、左から順にガシャンと止まる。',
text:'大当たり',loop:4000,bg:'#17121f',
use:'<b>抽選・ガチャ・運試し・結果発表</b>に。プレゼント企画の当選発表、「今日の運勢」、ランダム企画の決定に。',
tips:['止まる瞬間に少し行き過ぎて戻る（back）と「ガシャン」感が出ます','回転中は縦方向にモーションブラー（blur）をかけるとスピード感が増します','最後に全リールが揃ったら、背景をフラッシュさせると当たり感が出ます'],
p:`スロットマシンのリールのように、各文字が縦に高速回転して、左から順に止まって「{T}」が揃う演出を作ってください。
・背景：#17121F。リール枠：1文字ごとに幅200px×高さ260px、背景 #FFFFFF、角丸16px、内側に上下から影（inset 0 30px 30px −20px rgba(0,0,0,.35)）
・リールの中身：ランダムな文字を20個縦に並べ、最後に正解の文字を置いた縦長の帯。文字は #17121F、Dela Gothic One、180px
・回転：帯を translateY で上から下へ流し、最後の正解文字が枠の中央に来た位置で止める
・止まるタイミング：1つ目のリールは1.2秒、以降0.3秒ずつ遅らせる。イージング cubic-bezier(.34,1.3,.64,1)（少し行き過ぎて戻る）
・回転中は帯に filter: blur(縦方向に強く見えるよう 4px)、止まったら blur 0
・全リールが止まった瞬間：枠の外側に #A78BFA の光（box-shadow 0 0 60px）を0.6秒点滅させる
・尺：4秒でループ`,
run(H,t){const B=H.box({gap:'18px'});const cs=[...t];const n=cs.length;const W=Math.min(200,1400/n-18),Hh=W*1.3;
  cs.forEach((c,i)=>{const fr=H.el('div',{position:'relative',width:W+'px',height:Hh+'px',background:'#fff',borderRadius:'16px',overflow:'hidden'},B);
    const strip=H.abs({left:0,top:0,width:'100%'},fr);const N=20;for(let k=0;k<=N;k++)H.el('div',{height:Hh+'px',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:F.heavy,fontSize:W*.88+'px',color:'#17121f'},strip,k===N?c:pick([...POOL]));
    H.abs({inset:'0',boxShadow:'inset 0 30px 30px -20px rgba(0,0,0,.35),inset 0 -30px 30px -20px rgba(0,0,0,.35)',pointerEvents:'none'},fr);
    const d=1200+i*300;H.a(strip,[{transform:'translateY(0)',filter:'blur(4px)'},{transform:`translateY(${-N*Hh}px)`,filter:'blur(0)'}],{d,e:'cubic-bezier(.34,1.3,.64,1)'});
    H.a(fr,[{boxShadow:'0 0 0 rgba(167,139,250,0)'},{boxShadow:'0 0 60px '+VIO},{boxShadow:'0 0 0 rgba(167,139,250,0)'}],{d:600,dl:1200+(n-1)*300,f:'none'})});
}});

def({no:'33',cat:'SWITCH',name:'タイプ＆修正',en:'Type & Correct',lead:'打って、消して、打ち直す。本音と建前のタイプライター。',
text:'がんばります 休みたい',multi:true,loop:6000,bg:'#f2f0f7',
use:'<b>本音と建前・言い直し・ツッコミ</b>に。1語目を消して2語目に打ち直すだけで、笑いや共感が生まれます。',
tips:['消す速さは打つ速さの2倍にすると「慌てて消した」感じに','打ち直す前に0.5秒ためると、本音が強調されます','1語目と2語目の色を変えると、言い直しが一目で分かります'],
p:`タイプライターのように文字を1文字ずつ打ち、一度消してから別の言葉に打ち直す演出を作ってください。
・背景：#F2F0F7。文字：#1A1625、Noto Sans JP 900、96px。中央左寄せ
・文字の後ろに、点滅するカーソル（幅8px×高さ100px、#A78BFA、0.5秒ごとに表示・非表示）
・流れ：
　① 0.4秒から：「{T}」の1語目を1文字0.12秒で打つ
　② 打ち終わって0.7秒待つ
　③ 1文字0.06秒で後ろから全部消す（バックスペース）
　④ 0.5秒ためる
　⑤ 2語目を1文字0.12秒で打つ。2語目の文字色は #7C3AED
　⑥ 打ち終わったら、2語目の下に #A78BFA の下線（高さ10px）を左から0.3秒で引く
・打つたびに、その文字を translateY 6px → 0 で小さく弾ませる
・尺：6秒でループ`,
run(H,t,w){const a=w[0]||t,b=w[1]||t;const B=H.box();const line=H.el('div',{position:'relative',display:'flex',alignItems:'center',fontFamily:F.sans,fontWeight:'900',fontSize:fs(a.length>b.length?a:b,96,1300)+'px',color:'#1a1625',minHeight:'130px'},B);
  const txt=H.el('span',{display:'inline-flex'},line);const cur=H.el('span',{width:'8px',height:'100px',background:VIO,marginLeft:'8px'},line);H.a(cur,[{opacity:1},{opacity:0}],{d:1000,e:'steps(2,jump-none)',i:Infinity});
  let tm=400;const type=(s,col)=>{[...s].forEach(ch=>{H.wait(tm,()=>{const c=H.el('span',{display:'inline-block',color:col,whiteSpace:'pre'},txt,ch);H.a(c,[{transform:'translateY(6px)'},{transform:'translateY(0)'}],{d:120})});tm+=120})};
  type(a,'#1a1625');tm+=700;[...a].forEach(()=>{H.wait(tm,()=>{txt.lastChild&&txt.lastChild.remove()});tm+=60});tm+=500;type(b,'#7c3aed');
  H.wait(tm,()=>{const u=H.abs({left:'0',bottom:'-6px',height:'10px',background:VIO,width:txt.offsetWidth+'px',transformOrigin:'0 50%'},line);H.a(u,[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{d:300})});
}});

def({no:'34',cat:'SWITCH',name:'オドメーター',en:'Odometer Count',lead:'数字の各桁がくるくる回り、目標の数字でピタッと止まる。',
text:'1,000,000',loop:4400,bg:'#100d17',
use:'<b>実績・登録者数・売上・記録</b>の発表に。「〇万人突破」「累計〇件」など数字で語る場面の定番。',
tips:['下の桁ほど多く回るようにすると、本物のメーターのように見えます','止まった瞬間に単位（人・円・件）をポンと出すと伝わりやすい','カンマは回さず固定するのが読みやすさのコツ'],
p:`車の走行距離メーターのように、数字の各桁が縦に回転して「{T}」でピタッと止まる演出を作ってください。
・背景：#100D17。数字：白、JetBrains Mono の太字、220px、等幅
・各桁：0〜9を縦に並べた帯を、高さ1桁分の窓（overflow: hidden）からのぞかせる。カンマや記号は回さずに固定表示
・回転量：右端（一の位）ほど多く回す。左から n 番目の桁は「(全桁数 − n) + 1」周してから目標の数字で止まる
・止まり方：2.2秒、イージング cubic-bezier(.16,1,.3,1)（最初速く、最後はゆっくり）。各桁の開始を左から0.06秒ずつ遅らせる
・窓の上下に背景色へのグラデーション（高さ40px）をかけて、回る数字が上下で溶けるように
・止まった直後：数字全体の下に #A78BFA の文字で「達成」を、translateY 30px → 0 でフェードイン
・尺：4.4秒でループ`,
run(H,t){const B=H.box({flexDirection:'column',gap:'30px'});const row=H.el('div',{display:'flex',fontFamily:F.mono,fontWeight:'700',fontSize:fs(t,220,1400/0.62)+'px',color:'#fff',lineHeight:'1'},B);
  const sz=parseFloat(row.style.fontSize);const cs=[...t];const digs=cs.filter(c=>/\d/.test(c)).length;let di=0;
  cs.forEach((c,i)=>{if(!/\d/.test(c)){H.el('span',{},row,c);return}const n=di++;const win=H.el('div',{height:sz+'px',overflow:'hidden',position:'relative'},row);
    const strip=H.el('div',{},win);const loops=digs-n+1;const total=loops*10+ +c;for(let k=0;k<=total;k++)H.el('div',{height:sz+'px'},strip,String(k%10));
    H.abs({left:0,right:0,top:0,height:'40px',background:'linear-gradient(#100d17,rgba(16,13,23,0))'},win);H.abs({left:0,right:0,bottom:0,height:'40px',background:'linear-gradient(rgba(16,13,23,0),#100d17)'},win);
    H.a(strip,[{transform:'translateY(0)'},{transform:`translateY(${-total*sz}px)`}],{d:2200,dl:n*60,e:E.out})});
  const lab=H.el('div',{fontFamily:F.heavy,fontSize:'72px',color:VIO},B,'達成');H.a(lab,[{transform:'translateY(30px)',opacity:0},{transform:'translateY(0)',opacity:1}],{d:500,dl:2200+digs*60});
}});

def({no:'35',cat:'SWITCH',name:'デコード',en:'Scramble Decode',lead:'ランダムな記号が左から順に解読され、言葉になる。',
text:'ACCESS GRANTED',loop:4200,bg:'#07060b',
use:'<b>ハッカー・暗号・謎解き・テクノロジー</b>系に。「正体は…」の種明かしや、新機能の発表にも。',
tips:['解読された文字と未解読の文字で色を変えると、進み具合が見えて気持ちいい','記号のプールを「01」だけにすると2進数風、カタカナにするとマトリックス風','1文字あたりの揺らぎ時間を長くすると、より「解読してる感」が出ます'],
p:`ランダムな記号がめまぐるしく変わりながら、左から順に正しい文字に確定して「{T}」になる「デコード（解読）」演出を作ってください。
・背景：#07060B。文字：JetBrains Mono の太字、画面幅いっぱいの大きさ
・確定前の文字：「!<>-_\\/[]{}=+*^?#ｱｲｳｴｵ」からランダムに選んだ記号を、0.04秒ごとに入れ替え続ける。色 #5B4B8A
・確定した文字：白。確定の瞬間だけ #A78BFA に光って（text-shadow 0 0 20px）0.2秒で白に戻る
・タイミング：0.3秒から開始。左から n 番目の文字は 0.3 + n×0.08 秒で確定（最初の0.3秒は全部が記号で揺れている）
・全部確定したら、文字の下に「[ OK ]」を #A78BFA で小さく点滅させる（0.25秒ごと、3回）
・3.6秒で全体を0.4秒フェードアウト、尺4.2秒でループ`,
run(H,t){const B=H.box({flexDirection:'column',gap:'40px'});const row=H.el('div',{fontFamily:F.mono,fontWeight:'700',fontSize:fs(t,170,1450/0.62)+'px',whiteSpace:'pre',display:'flex'},B);
  const sym=[...'!<>-_\\/[]{}=+*^?#ｱｲｳｴｵ'];const cs=[...t];const spans=cs.map(c=>H.el('span',{color:'#5b4b8a'},row,c===' '?' ':pick(sym)));
  const fix=cs.map((c,i)=>300+300+i*80);const ok=H.el('div',{fontFamily:F.mono,fontSize:'40px',color:VIO,opacity:0},B,'[ OK ]');
  H.raf(s=>{const ms=s*1000;spans.forEach((sp,i)=>{if(cs[i]===' ')return;if(ms<fix[i]){if(Math.floor(ms/40)!==sp._k){sp._k=Math.floor(ms/40);sp.textContent=pick(sym)}}else if(!sp._d){sp._d=1;sp.textContent=cs[i];sp.style.color='#fff';H.a(sp,[{color:VIO,textShadow:'0 0 20px '+VIO},{color:'#fff',textShadow:'0 0 0 transparent'}],{d:200})}})});
  const end=fix[fix.length-1];H.a(ok,[{opacity:0},{opacity:1},{opacity:0}],{d:500,dl:end+100,i:3,e:'steps(2,jump-none)',f:'none'});
  H.a(B,[{opacity:1},{opacity:0}],{d:400,dl:3600,f:'forwards'});
}});

def({no:'36',cat:'SWITCH',name:'上下スプリット',en:'Split Reveal',lead:'言葉が上下に割れて開き、裏から次の言葉が現れる。',
text:'昨日まで 今日から',multi:true,loop:4000,bg:'#14111b',
use:'<b>転換・決意・Before→After</b>に。「〇〇は終わり。これからは〇〇」のように、気持ちを切り替える瞬間に。',
tips:['割れる幅（±120px）を大きくすると、裏の言葉がドンと現れます','上下で色を変えたまま割ると、ポスターのようなグラフィックに','割れた半分を画面外まで飛ばすと、より劇的な場面転換に'],
p:`1つ目の言葉が上下半分に割れて開き、その隙間から2つ目の言葉が現れる演出を作ってください。
・背景：#14111B。フォント：Dela Gothic One、画面幅の約65%
・1つ目の言葉：「{T}」の1語目、白。同じものを2枚重ね、上半分（clip-path: inset(0 0 50% 0)）と下半分（inset(50% 0 0 0)）に分ける
・2つ目の言葉：2語目、#A78BFA。1つ目の後ろに、scale 0.85・不透明度0で待機
・0.0〜0.4秒：1つ目の言葉をフェードイン
・1.2秒：上半分を translateY −120px、下半分を +120px へ0.5秒で開く（イージング cubic-bezier(.87,0,.13,1)）。同時に上下とも不透明度を0.25に
・1.3秒：2つ目の言葉を scale 0.85→1・不透明度0→1 で0.5秒、cubic-bezier(.34,1.56,.64,1)
・割れ目に沿って #A78BFA の細い光の線（高さ3px）を0.3秒だけ横に走らせる
・3.4秒で全体をフェードアウト、尺4秒でループ`,
run(H,t,w){const a=w[0]||t,b=w[1]||t;const B=H.box();const sz=fs(a.length>b.length?a:b,250,1100);
  const back=BIG(H,b,{position:'absolute',color:VIO,fontSize:sz+'px'},B);
